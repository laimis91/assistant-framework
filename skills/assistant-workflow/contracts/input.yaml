# Applicability: canonical plans/task packets, persisted state, delegated handoffs,
# and executable admission/evaluation use this existing protocol. Ordinary human
# updates summarize decisions/evidence without serializing every internal field.
# This boundary does not waive approval, verification, review, or active TDD.

# Workflow Input Contract
# Resolve these fields when the canonical workflow protocol is consumed.
# Fields are extracted from the user's request. If a required field cannot be inferred,
# follow the on_missing action.

schema_version: "16.0"
contract: input
skill: assistant-workflow

fields:
  - name: task_description
    type: string
    required: true
    description: "Outcome."
    validation: "Non-empty concrete action or outcome."
    on_missing: ask
    ask_prompt: "What would you like me to build, fix, or change?"

  - name: task_type
    type: enum
    required: true
    enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
    description: "Type."
    validation: "Must be one of the enum values"
    on_missing: infer
    infer_from: "fix/bug/broken -> bugfix; rewrite/port -> rewrite; migrate/migration -> migration; refactor/clean/reorganize -> refactor; config/setting/env -> config; infra/deploy/lifecycle/install -> infra; security/auth/PII/payment/input validation -> security; docs/readme/document/changelog -> docs; spike/explore/investigate -> spike; else feature. Select the corresponding Task Category Gate Pack."

  - name: execution_intent
    type: enum
    required: false
    enum_values: [prepare_only, implement_only, end_to_end]
    description: "Intent."
    validation: "prepare_only ends at readiness without Build/changed-files; implement_only consumes approved evidence; end_to_end is phased."
    default: end_to_end
    on_missing: infer
    infer_from: "Preparation only -> prepare_only. When a request combines preparation/planning with an affirmative implementation request, use end_to_end unless the user explicitly prohibits implementation. implement_only needs approved packet."

  - name: risk_tier
    type: enum
    required: false
    enum_values: [low, moderate, high, critical]
    description: "Triage risk tier."
    validation: "Must be one of the enum values when present"
    default: null
    on_missing: skip
    infer_from: "Use references/triage-rubric.md during Triage. Escalate for public contracts, data, auth, PII, payments, irreversible changes, weak tests, or behavior-preserving legacy work."

  - name: required_gates
    type: string[]
    required: false
    description: "Triage-selected gates."
    validation: "For execution_intent == prepare_only, required_gates is exactly [feature-preparation evidence] and excludes execution common and task-category gates. Otherwise each entry is a short gate label from references/triage-rubric.md or a clearly justified project-specific gate."
    default: []
    on_missing: skip

  - name: required_agents
    type: string[]
    required: false
    description: "Routing-required roles."
    validation: "Entries are known workflow roles, installed skills, or a justified project role. For execution_intent=prepare_only, required_agents contains only concrete Discover/preparation roles, including requested/required fresh plan review and selected research lenses/peer; excludes post-Build code/QA acceptance and implementation roles; retain explicit QA or harness requests only in feature_preparation_result.future_qa_acceptance_obligation or future_harness_obligation. For execution_intent != prepare_only, bounded_executor requires one implementation and selected-verification owner plus independent Code Reviewer responsibility; separated_workers requires Code Writer, Builder/Tester, and independent Code Reviewer responsibilities. Code Mapper, Explorer, and Architect need concrete mapping, lifecycle, or Pack uncertainty; Reviewer may satisfy only compatibility routing. Light low-risk work may keep required_agents empty with selected verification and fresh review."
    default: []
    on_missing: skip

  - name: subagent_policy_state
    type: enum
    required: false
    enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
    description: "Delegation trigger/fallback status."
    validation: "Must describe the current trigger, opt-out, availability, or exact policy-block state before any subagent dispatch occurs"
    default: not_required
    on_missing: infer
    infer_from: "Use not_required when no role is required. When required_agents is non-empty, use delegation_triggered when a direct user request or applicable AGENTS.md or active skill instruction covers the roles; infer scope without asking. Use delegation_opted_out when the user explicitly declines; use subagents_unavailable only after a real spawn failure or supported configuration proof; use policy_disallowed only when an exact active rule blocks spawning with no applicable trigger exception."

  - name: subagent_execution_mode
    type: enum
    required: false
    enum_values: [delegated, direct_fallback, not_applicable]
    description: "Role execution mode."
    validation: "delegated requires subagent_policy_state=delegation_triggered; direct_fallback requires delegation_opted_out, subagents_unavailable, or policy_disallowed and equivalent evidence; policy_disallowed direct_fallback also requires policy_blocking_source; not_applicable describes direct_main Build at every size/risk without worker-only records; required fresh review remains separate"
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable/not_required for direct_main Build at any size/risk. Choose actual optional delegation for concrete execution benefit. Formal review/lens isolation remains mandatory and cannot fall back to authors."

  - name: subagent_trigger_scope
    type: string[]
    required: false
    description: "Delegation trigger provenance."
    validation: "Non-empty when delegation is relevant; records provenance and covered roles/phases/actions, inferred without asking. Empty only when subagent_policy_state=not_required."
    default: []
    on_missing: infer

  - name: policy_blocking_source
    type: string
    required: conditional
    condition: "subagent_policy_state == policy_disallowed"
    description: "Policy preventing delegation."
    validation: "Non-empty; names the blocking rule and confirms why no applicable exception permits delegation. A conditional rule that defers spawning unless the user or applicable AGENTS/skill asks does not make policy_disallowed when the active skill requires subagents."
    on_missing: fail

  - name: scope_hint
    type: enum
    required: false
    enum_values: [small, medium, large, mega]
    description: "Size."
    default: null
    on_missing: skip

  - name: target_files
    type: string[]
    required: false
    description: "Files."
    validation: "Valid relative paths"
    default: []
    on_missing: skip

  - name: constraints
    type: string[]
    required: false
    description: "Constraints."
    validation: "Plain-language constraints only accumulate unless the user explicitly changes them"
    default: []
    on_missing: skip

  - name: change_impact_applicability
    type: object
    required: conditional
    condition: "a behavior, cosmetic, or locality/shared/unresolved impact decision affects verification"
    description: "Applicability."
    validation: "not_applicable is cosmetic; local needs causal evidence; shared/unresolved/expanded_artifact_carried need artifact."
    object_fields:
      - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
      - {name: applicability_reason, type: string, required: true}
      - {name: causal_evidence_ref, type: string, required: conditional, condition: "impact_scope == local"}
      - {name: expanded_artifact_carried, type: boolean, required: true}
    on_missing: fail

  - name: change_impact_context
    type: object
    required: false
    description: "Refs."
    validation: "Valid carries identity, refs, validator result; pre-build/completion assessment; completion resolves review projection."
    object_fields:
      - {name: artifact_identity, type: string, required: true}
      - {name: status, type: enum, required: true, enum_values: [valid, gaps_reported, blocked, invalid]}
      - {name: phase, type: enum, required: conditional, condition: "status == valid", enum_values: [discovery, pre_build, completion]}
      - {name: capture_ref, type: string, required: conditional, condition: "status == valid"}
      - {name: expected_context_ref, type: string, required: conditional, condition: "status == valid"}
      - {name: assessment_ref, type: string, required: conditional, condition: "status == valid and phase in [pre_build, completion]"}
      - {name: review_projection_ref, type: string, required: conditional, condition: "status == valid and phase == completion"}
      - {name: validator_result_ref, type: string, required: conditional, condition: "status == valid"}
      - {name: gap_or_blocker_ref, type: string, required: conditional, condition: "status in [gaps_reported, blocked, invalid]"}
    default: null
    on_missing: infer

  - name: tdd_mode
    type: boolean
    required: false
    description: "Task-global projection of verification_decision.tdd_choice.mode; each current increment derives local tdd_applies from selected_check_ids intersected with applicable_check_ids."
    default: false
    on_missing: infer
    infer_from: "Copy verification_decision.tdd_choice.mode unchanged as the task-global choice. For each current slice/packet, derive local tdd_applies from the intersection of its selected_check_ids and verification_decision.tdd_choice.applicable_check_ids. Selection is required before Plan fixes checks or before Build when plan_mode=none; if no decision is available, invoke assistant-verification rather than infer TDD from task type."
    validation: "Must equal the canonical task-global mode. A packet requires meaningful RED only when its local tdd_applies intersection is non-empty; task-global mode never forces RED for an unrelated packet. When false, do not fabricate RED. Unknown-cause bugfixes use assistant-debugging first."

  - name: debugging_mode
    type: enum
    required: false
    enum_values: [not_applicable, root_cause_unknown, root_cause_known, completed, blocked]
    description: "Bugfix debugging state."
    default: not_applicable
    on_missing: infer
    infer_from: "task_type == bugfix and cause is not already evidenced -> root_cause_unknown; task_type == bugfix with clear reproduction/root-cause evidence -> root_cause_known; non-bugfix -> not_applicable"
    validation: "Unknown-cause bugfixes must not proceed to implementation until debugging_mode is completed or blocked with evidence"

  - name: acceptance_criteria
    type: string[]
    required: false
    description: "Atomic acceptance criteria."
    validation: "Each criterion is atomic, binary (pass/fail), and testable (8-12 words)"
    default: []
    on_missing: skip
    notes: "Do not create criteria independently when requirement_acceptance_map exists. Vague requests are clarified or safely defaulted, then mapped through references/requirement-acceptance-map.md."

  - name: requirement_acceptance_map
    type: object
    required: conditional
    condition: "size in [medium, large, mega] or (progressive_artifact_retention_state != terminally_archived and progressive_route_clear_consumption_state != pending and (architecture_design_mode in [required, review_intensive] or progressive_route_clear_consumption_state == consumed))"
    description: "Accepted requirement traceability."
    validation: "Every accepted requirement has one stable requirement_id, atomic acceptance criterion, verification method, manual scenario or explicit N/A, and a status; exclusions require explicit approval and reason. entries is empty only for a consumed legitimate all-excluded route with route_clear_handoff.decisions=[] and acceptance_seed=[], no accepted requirement, and every source excluded or retired item traced exactly once to a concrete non_goals or approved-exclusion target; never fabricate an acceptance entry. Every consumed route_clear_handoff retired_or_excluded_deferred_uncertainty_refs entry is traced exactly once as a non-goal or approved exclusion."
    on_missing: fail
    object_fields:
      - name: intended_outcome
        type: string
        required: true
        description: "One concise accepted outcome"
        on_missing: fail
      - name: assumptions_and_defaults
        type: string[]
        required: true
        description: "Explicit inferred choices; may be empty"
        on_missing: fail
      - name: open_material_questions
        type: string[]
        required: true
        description: "Empty before Plan unless unresolved questions block progress"
        on_missing: fail
      - name: non_goals
        type: string[]
        required: true
        description: "Explicit exclusions; may be empty"
        on_missing: fail
      - name: source_route_clear_handoff_ref
        type: string
        required: conditional
        condition: "progressive_route_clear_consumption_state == consumed and progressive_artifact_retention_state != terminally_archived"
        description: "Durable source reference to the consumed progressive route-clear handoff"
        validation: "Resolves to the source route_clear_handoff, whose consumed_by_requirement_acceptance_map_ref resolves to this consuming Requirement Acceptance Map; together they validate the reciprocal back-reference rather than equal values. The handoff decisions and constraints are traced into applicable accepted map state; exclusions appear in non_goals or entries with status=approved_exclusion; every retired_or_excluded_deferred_uncertainty_refs entry is bound exactly once by retired_or_excluded_deferred_uncertainty_traces to a concrete non_goals element or entries element with status=approved_exclusion; and each acceptance_seed becomes an entries[].acceptance_criterion with binary acceptance."
        on_missing: fail
      - name: retired_or_excluded_deferred_uncertainty_traces
        type: object[]
        required: conditional
        condition: "progressive_route_clear_consumption_state == consumed and progressive_artifact_retention_state != terminally_archived"
        min_items: 0
        validation: "Binds every source route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs ref exactly once to a concrete consuming target. Empty only when the source collection is empty; no unknown, duplicate, or wrong-disposition source ref is allowed."
        object_fields:
          - name: source_retired_or_excluded_deferred_uncertainty_ref
            type: string
            required: true
            validation: "Resolves exactly once to one source route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs entry"
          - name: target_disposition
            type: enum
            required: true
            enum_values: [non_goal, approved_exclusion]
          - name: target_ref
            type: string
            required: true
            validation: "Resolves to the concrete non_goals element for non_goal or entries element with status=approved_exclusion for approved_exclusion"
      - name: entries
        type: object[]
        required: true
        min_items: 0
        validation: "Non-empty when any accepted requirement, source route_clear_handoff decision, or acceptance_seed exists. Empty only for the exact all-excluded route whose source decisions and acceptance_seed are empty and whose excluded or retired lineage is traced exactly once to concrete non_goals or approved-exclusion targets."
        on_missing: fail
        object_fields:
          - name: requirement_id
            type: string
            required: true
            description: "Stable identifier unique within the task"
            on_missing: fail
          - name: source
            type: string
            required: true
            description: "User request, accepted default, policy, or local contract source"
            on_missing: fail
          - name: requirement
            type: string
            required: true
            description: "Atomic accepted requirement"
            on_missing: fail
          - name: acceptance_criterion
            type: string
            required: true
            description: "Binary pass/fail criterion proving the requirement"
            on_missing: fail
          - name: verification_method
            type: string
            required: true
            description: "Test, command, inspection, review, or manual verification method"
            on_missing: fail
          - name: evidence_ref
            type: string
            required: true
            description: "Pending marker or stable verification evidence reference"
            on_missing: fail
          - name: manual_scenario_or_na
            type: string
            required: true
            description: "Developer test scenario or explicit N/A with reason"
            on_missing: fail
          - name: status
            type: enum
            required: true
            enum_values: [pending, passed, failed, approved_exclusion]
            description: "Current traceability status"
            on_missing: fail
          - name: exclusion_reason
            type: string
            required: conditional
            condition: "status == approved_exclusion"
            description: "User-approved reason the requirement is excluded"
            on_missing: fail

  - name: harness_capable
    type: boolean
    required: false
    description: "Whether task uses harness; ordinary medium+ workflow tasks default to false, including source-changing workflow tasks."
    validation: "For execution_intent == prepare_only, always false; preserve an explicit harness request or accepted independent harness evidence only in feature_preparation_result.future_harness_obligation, without activating harness artifacts or execution routing. For execution_intent != prepare_only, true only for explicitly requested harness work; an accepted approved_feature_preparation_harness_obligation; long-running or trace/replay-ready multi-slice; high-risk harness; domain-scored work or UI/visual/product/UX/docs/DX-facing work; or accepted Done Contract/Harness Recipe. Do not infer true from size=medium+, delegation alone, ordinary source-changing work, or preparation-only QA/harness requests."
    default: false
    on_missing: infer
    infer_from: "prepare_only -> false plus feature_preparation_result.future_harness_obligation when explicit harness work or independent harness evidence is supplied; implement_only plus accepted approved_feature_preparation_harness_obligation -> true before Build; otherwise listed execution harness evidence -> true, else false. Never infer true from size, delegation, ordinary source changes, or preparation-only QA/harness requests."

  - name: build_execution_lane
    type: enum
    required: false
    enum_values: [none, direct_main, bounded_executor, separated_workers]
    description: "Build lane."
    default: direct_main
    on_missing: infer
    infer_from: "For execution_intent == prepare_only, use none for Build only; otherwise direct_main is permitted at every size/risk. Choose bounded_executor or separated_workers for concrete optional execution benefit."
    validation: "For execution_intent == prepare_only, Build is inactive; requested/required fresh plan review and selected research isolation still apply. All lanes retain approval, exact verification, meaningful RED, dependencies, workspace isolation and shared guard. direct_main has actual main identity and no child worker projections; fresh independent review is required separately."

  - name: plan_mode
    type: enum
    required: false
    enum_values: [none, inline, approval_required]
    description: "requires explicit plan approval before implementation work; prepare_only readiness never waits for implementation approval."
    validation: "prepare_only at any size uses none unless an explicit readiness plan, which uses inline and never waits. For execution_intent != prepare_only, approval_required applies to medium+/risk/policy/scope/explicit; none trivial-safe, inline bounded-small."
    on_fail: "For execution_intent == prepare_only, set none unless the user explicitly requested a readiness Plan, then set inline and continue without waiting. For execution_intent != prepare_only, re-triage and use approval_required only when its execution triggers apply."
    default: none
    on_missing: infer
    infer_from: "prepare_only -> none; inline only for explicit readiness. For execution_intent != prepare_only, approval_required applies to medium+/triggers; inline bounded-small."

  - name: controller_intensity
    type: enum
    required: false
    enum_values: [light, standard, strict]
    description: "Controller intensity."
    validation: "light small/low-risk; standard ordinary medium+ with harness_capable == false and qa_evaluation_mode == not_required. For execution_intent != prepare_only, strict only for high/critical, harness_capable == true, qa_evaluation_mode == required, explicit harness/QA acceptance work, or trace/replay. For prepare_only, strict requires risk/project criteria; QA or harness requests alone remain typed future obligations. Never infer strict from generic acceptance."
    default: standard
    on_missing: infer
    infer_from: "light small/low-risk; standard ordinary medium+ with harness_capable == false and qa_evaluation_mode == not_required. For execution_intent != prepare_only, strict only high/critical, harness_capable == true, qa_evaluation_mode == required, explicit harness/QA acceptance work, or trace/replay. Do not infer strict from size=medium+, delegation alone, or generic acceptance. In prepare_only, risk/project criteria may still select strict preparation; QA or harness requests alone never promote strict and remain typed future obligations."

  - name: workflow_state_mode
    type: enum
    required: false
    enum_values: [inline, journal]
    description: "State storage mode."
    validation: "For uncertainty_shape == progressive, journal only when local state artifacts are configured and policy allows them; unavailable/policy-disallowed progressive state uses equivalent carried-state fallback inline, including prepare_only. Ordinary inline requires uncertainty_shape == bounded absent clarification wait, delegated workflow roles during execution, cross-session/compaction continuation, explicit persisted state, controller_intensity == strict, harness_capable == true, or execution_intent != prepare_only and qa_evaluation_mode == required; those require journal. Size alone never requires journal."
    default: inline
    on_missing: infer
    infer_from: "For uncertainty_shape == progressive, journal only when local state artifacts are configured and policy allows them; unavailable/policy-disallowed progressive state uses equivalent carried-state fallback inline, including prepare_only. Otherwise inline requires uncertainty_shape == bounded absent clarification wait, delegated workflow roles during execution, cross-session/compaction continuation, explicit persisted state, controller_intensity == strict, harness_capable == true, or execution_intent != prepare_only and qa_evaluation_mode == required; those require journal. Size alone never requires journal."

  - name: manual_verification_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "Manual verification."
    validation: "required only for explicit manual, subjective/UI, unprovable external, destructive/migration, or inadequate automation; never size/intensity/ritual."
    default: not_required
    on_missing: infer
    infer_from: "required for explicit manual, subjective/UI, unprovable external, destructive or migration-related, or inadequate automation; optional when helpful; else not_required."

  - name: qa_evaluation_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "QA mode."
    validation: "prepare_only -> not_required plus feature_preparation_result.future_qa_acceptance_obligation. For implement_only, a present approved_feature_preparation_qa_acceptance_obligation is an additional required positive trigger. Use required when the user explicitly requests QA/acceptance evaluation or harness_capable == true and acceptance evaluation is in scope. QA required positive triggers: explicit QA/acceptance evaluation request, accepted Done Contract, harness-capable acceptance scope, domain-scored scope, or scoped UI/visual/product/UX/docs/DX acceptance. QA non-triggers: template labels/placeholders, generic acceptance criteria labels, optional/not_required reasons, delegation/source-changing work alone, and ordinary medium+ code-review-only/source-changing work. Use not_required for ordinary medium+ code-review-only/source-changing work."
    default: not_required
    on_missing: infer
    infer_from: "For implement_only, approved_feature_preparation_qa_acceptance_obligation -> required; preserve prepare_only as not_required. Otherwise validation triggers -> required, helpful -> optional, else not_required."

  - name: search_mode
    type: enum
    required: false
    enum_values: [none, lightweight, candidate_search]
    description: "Candidate-search mode."
    validation: "Must be one of: none, lightweight, candidate_search. candidate_search triggers only for explicit alternatives, open-ended architecture/design, optimization, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots."
    default: none
    on_missing: infer
    infer_from: "Use candidate_search for explicit alternatives, open-ended architecture/design, optimization-heavy work, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots; use lightweight for ordinary tasks with 1-3 obvious options; otherwise none."

  - name: architecture_design_mode
    type: enum
    required: false
    enum_values: [not_applicable, lightweight, required, review_intensive]
    description: "Architecture mode."
    validation: "not_applicable needs concrete one-path reason and is invalid for extension seam/material extensibility. lightweight records bounded decision. required covers new/cross-boundary/public/persistent/material-quality-extensibility/extension-seam/viable-design work; review_intensive adds challenge. Size never triggers it."
    default: not_applicable
    on_missing: infer
    infer_from: "required for new/cross-boundary/public/persistent/material quality-extensibility/extension-seam/viable-design work; lightweight bounded decision; review_intensive high-risk/conflict; else not_applicable with reason."

  - name: architecture_design_trigger_reasons
    type: string[]
    required: true
    min_items: 1
    description: "Architecture trigger rationale."
    validation: "Non-empty. Observed trigger/rationale: cross-boundary contract, data lifecycle, resource/quality target, extension seam, material extensibility, viable alternative, or conflicting driver; when architecture_design_mode=not_applicable, record the concrete evidenced local-path reason."
    on_missing: infer
    infer_from: "Derive from the request and candidate scope scan; record only triggers supported by local or user evidence. Concrete reason required even when architecture_design_mode=not_applicable."

  - name: candidate_search_goal
    type: string
    required: false
    description: "Candidate-search objective."
    validation: "Derived from acceptance criteria and slice acceptance/verification criteria; must not create a second source of truth."
    default: null
    on_missing: skip

  - name: candidate_search_constraints
    type: string[]
    required: false
    description: "Candidate constraints/non-goals."
    validation: "Each entry must come from user constraints, approved plan boundaries, policy constraints, or discovered project constraints."
    default: []
    on_missing: skip

  - name: uncertainty_shape
    type: enum
    required: false
    enum_values: [bounded, progressive]
    description: "Outcome uncertainty shape."
    validation: "bounded is the default. Use progressive only when a not-yet-precise outcome-shaping unknown is unlocked by a predecessor; fully specified tasks remain bounded, and size alone is not a trigger."
    default: bounded
    on_missing: infer
    infer_from: "Use bounded unless an outcome-shaping unknown cannot yet be stated precisely and a predecessor decision will unlock it."

  - name: progressive_discovery_state
    type: enum
    required: false
    enum_values: [not_applicable, mapping, resolving, route_clear, blocked]
    description: "Current typed state for progressive Discover decision work"
    validation: "not_applicable requires uncertainty_shape=bounded. mapping, resolving, route_clear, and blocked require uncertainty_shape=progressive."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable for bounded uncertainty. For progressive uncertainty, use mapping until a decision map exists, resolving while the frontier has work, route_clear when the route can return to bounded Discover, or blocked when the next required decision cannot proceed."

  - name: progressive_route_clear_consumption_state
    type: enum
    required: false
    enum_values: [not_applicable, pending, consumed]
    description: "Durable state for Requirement Acceptance Map consumption of a progressive route-clear handoff"
    validation: "not_applicable applies to ordinary bounded work with no route_clear_handoff. pending mirrors route_clear_handoff.consumption_state=pending while progressive route_clear prepares the map. consumed requires reciprocal map consumption and remains consumed after the bounded/not_applicable transition. While progressive_artifact_retention_state=retained, the consumed marker keeps requirement_acceptance_map and its reciprocal refs required; terminally_archived may release those progressive artifacts without rewriting consumed history."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable for ordinary bounded/no-handoff work. Use pending when route_clear_handoff.consumption_state=pending. Use consumed only after requirement_acceptance_map.source_route_clear_handoff_ref and route_clear_handoff.consumed_by_requirement_acceptance_map_ref form reciprocal map consumption; retain consumed as historical lifecycle state after the atomic bounded/not_applicable transition and terminal archival."

  - name: progressive_sequence_readiness_state
    type: enum
    required: false
    enum_values: [not_applicable, active, closed]
    description: "External lifecycle applicability for one progressive decision-map sequence readiness record"
    validation: "not_applicable applies before a second progressive activation and to ordinary bounded or generic loops. Set active atomically with loop_readiness_assessment before the second activation; while active, retain the same readiness_assessment_id, progressive_decision_map_ref, immutable cap, and cumulative activation/resolution history through pause, blocked state, compaction, continuation, route-clear preparation, third+ activation proposals, and durable route-clear consumption. Only then set closed. After progressive_sequence_readiness_state becomes closed, progressive_artifact_retention_state=retained keeps the same record while the task remains active/resumable or compacts; only terminally_archived after explicit final archival/termination permits omission. Closed is terminal for the same decision map and cannot reopen or reset its record."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable unless a progressive decision sequence has reached its second activation. Set active atomically with the existing readiness assessment before that activation and retain it through durable route-clear consumption. Then set closed; after it becomes closed, retain the same record while progressive_artifact_retention_state=retained. terminally_archived permits omission only after explicit final archival/termination makes continuation impossible. Never reopen or reset closed for the same decision map."

  - name: progressive_artifact_retention_state
    type: enum
    required: false
    enum_values: [not_applicable, retained, terminally_archived]
    description: "Typed lifecycle for durable progressive artifacts carried after live progressive Discover ends"
    validation: "not_applicable applies when no durable progressive artifact chain exists. retained is required while durable markers are pending/consumed or active/closed and continuation or reference resolution remains possible, and keeps every durable reference resolvable during active/resumable work. terminally_archived requires explicit final archival/termination evidence that continuation and reference resolution are impossible; progressive_terminal_archival must be present before terminally_archived state is persisted or resumed, with exact current_task_identity and final_progressive_decision_map_ref plus a typed basis and resolvable evidence_refs; dangling or unresolved evidence_refs fail closed. It requires one atomic transition with uncertainty_shape=bounded and progressive_discovery_state=not_applicable. Task state: completed does not qualify by itself. terminally_archived is invalid while route-clear consumption is pending or sequence readiness is active, is terminal, and cannot revert to retained for the same task and decision map."
    default: not_applicable
    on_missing: infer
    infer_from: "Use retained whenever either durable progressive marker requires resumable artifacts and no final archival evidence applies. Use terminally_archived only as one atomic transition with uncertainty_shape=bounded and progressive_discovery_state=not_applicable when progressive_terminal_archival is already present and its task identity, final map identity, typed basis, and every evidence_ref resolve exactly. Never infer terminally_archived from Task state: completed or generic archival evidence."

  - name: clarification_status
    type: enum
    required: true
    enum_values: [ready, needs_clarification]
    description: "Whether Discover is clear to continue or is waiting on explicit clarification about implementation-shaping fields"
    validation: "ready requires no unresolved topics and every implementation-shaping field explicit, governed by applicable authority, or covered by a source-backed technical default or explicit acceptance of a displayed recommendation. needs_clarification requires an unresolved topic."
    on_missing: infer
    infer_from: "Set needs_clarification for unresolved implementation-shaping fields or material product choices. Set ready only on explicit answers, applicable authority, or source-backed technical defaults; explicit acceptance of a displayed recommendation is an answer. Convention or reversibility alone cannot settle product intent."

  - name: clarification_confidence
    type: enum
    required: false
    enum_values: [low, medium, high]
    description: "Confidence that prompt plus discovered code/context is sufficient to plan safely"
    validation: "high means no blocking implementation-shaping ambiguity remains. low requires needs_clarification unless the task is explicitly read-only."
    default: medium
    on_missing: skip

  - name: clarification_questions_asked
    type: int
    required: false
    description: "Number of clarification questions asked during Discover"
    validation: "Must be zero or greater. May be zero for any task size when prompt plus code/context are sufficiently clear."
    default: 0
    on_missing: skip

  - name: clarification_admissibility
    type: enum
    required: false
    enum_values: [satisfied, needs_clarification, not_applicable]
    description: "Whether any asked clarification questions pass the admissibility test"
    validation: "satisfied means every asked question affects correctness/scope/behavior/security/verification, is not discoverable from code/context, lacks an applicable source-backed technical default, and states risk if guessed."
    default: not_applicable
    on_missing: skip

  - name: unresolved_clarification_topics
    type: string[]
    required: true
    description: "Deterministic short labels for unanswered topics that block planning"
    validation: "List every unresolved implementation-shaping field with one deterministic short label. Empty when clarification_status=ready. Non-empty when clarification_status=needs_clarification."
    default: []
    on_missing: skip
    examples:
      - "target subsystem"
      - "default behavior"
      - "migration strategy"

  - name: clarification_defaults_applied
    type: boolean
    required: true
    description: "Whether Discover automatically applied a source-backed technical default and recorded its source and rationale without asking"
    validation: "True only when clarification_defaults records an automatic source-backed technical default; false when empty. Explicit answers, including `defaults` acceptance, are not automatic defaults. Convention, reversibility, recommendation, or missing plumbing alone cannot settle a product choice."
    default: false
    on_missing: skip
    notes: "Do not set true merely because a user replied `defaults`; tie it to clarification_defaults evidence."

  - name: clarification_defaults
    type: object[]
    required: true
    description: "Source-backed technical implementation defaults applied automatically during Discover"
    validation: "Each entry records one technical implementation detail, value, applicable source, and concrete rationale. Product choices need explicit user answers; convention or reversibility alone cannot settle them. Empty only when no automatic default was applied."
    default: []
    on_missing: skip
    object_fields:
      - name: topic
        type: string
        required: true
      - name: value
        type: string
        required: true
      - name: source
        type: string
        required: true
        description: "Applicable repository evidence or policy supporting this technical default"
      - name: rationale
        type: string
        required: true
        description: "Why that source supports this technical value; convention or reversibility alone cannot settle a material product choice"

  - name: feature_preparation_scope
    type: enum
    required: false
    enum_values: [not_applicable, existing_system]
    description: "Whether the task prepares a feature against behavior already implemented in the repository"
    validation: "existing_system is required for prepare_only or end_to_end feature/spike work that can affect an existing user-visible route, scope, selection, highlight, focus, side effect, or compatibility behavior. For implement_only, carry existing_system when the approved packet was prepared against such behavior."
    default: not_applicable
    on_missing: infer
    infer_from: "Use existing_system when technical preparation concerns an existing repository behavior or route. Otherwise use not_applicable."

  - name: approved_feature_preparation_evidence_ref
    type: string
    required: conditional
    condition: "execution_intent == implement_only and feature_preparation_scope == existing_system"
    description: "Approved canonical evidence reference consumed by implementation-only work against existing behavior"
    validation: "Must resolve to the stable identity of a complete feature_preparation_evidence artifact whose current revision and scope cover the implementation packet; carry that identity unchanged, do not reconstruct missing evidence or downgrade it to a Product question."
    on_missing: fail

  - name: approved_feature_preparation_result
    type: object
    required: conditional
    condition: "execution_intent == implement_only"
    description: "Exact approved prepare_only result"
    validation: "Carry unchanged through triage, Plan, task packets, and Build; existing_system ref equals approved_feature_preparation_evidence_ref, otherwise it is absent."
    on_missing: fail
    object_fields:
      - name: execution_status
        type: enum
        required: true
        enum_values: [not_started]
      - name: scope
        type: string
        required: true
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        validation: "Equals approved_feature_preparation_evidence_ref unchanged."
      - name: evidence_gaps
        type: string[]
        required: true
      - name: open_decisions
        type: string[]
        required: true
      - name: implementation_implications
        type: string[]
        required: true
        min_items: 1
      - name: readiness_plan
        type: object
        required: false
        object_fields:
          - name: evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
          - name: preparation_basis
            type: enum
            required: conditional
            condition: "feature_preparation_scope == not_applicable"
            enum_values: [not_applicable]
          - name: implementation_implications
            type: string[]
            required: true
            min_items: 1
          - name: open_decisions
            type: string[]
            required: true
          - name: recommended_next_state
            type: string
            required: true
          - name: execution_status
            type: enum
            required: true
            enum_values: [not_started]
      - name: future_qa_acceptance_obligation
        type: object
        required: false
        object_fields:
          - name: requested_scope
            type: string
            required: true
          - name: execution_prerequisite
            type: string
            required: true
      - name: future_harness_obligation
        type: object
        required: false
        object_fields:
          - name: requested_scope
            type: string
            required: true
          - name: evidence_basis
            type: string[]
            required: true
            min_items: 1
          - name: execution_prerequisite
            type: string
            required: true
      - name: recommended_next_step
        type: string
        required: true

  - name: approved_feature_preparation_harness_obligation
    type: object
    required: conditional
    condition: "execution_intent == implement_only and the approved feature_preparation_result contains future_harness_obligation"
    description: "Accepted deferred harness scope for implementation-only work"
    validation: "Its three approved payload fields (requested_scope, evidence_basis, and execution_prerequisite) exactly match feature_preparation_result.future_harness_obligation. Triage adds exactly one preparation-source binding: existing_system requires source_feature_preparation_evidence_ref equal to approved_feature_preparation_evidence_ref and forbids source_preparation_basis; not_applicable requires source_preparation_basis=not_applicable and forbids source_feature_preparation_evidence_ref. The resulting enriched consumer object activates harness_capable, strict control, and the pre-Build Done Contract/Harness Recipe gate; if the requested implementation was initially small, Triage promotes size to at least medium so the trace/replay harness and runtime-ref gates cannot be bypassed. Carry that enriched object unchanged downstream. Absent when no future_harness_obligation was approved."
    on_missing: fail
    object_fields:
      - name: requested_scope
        type: string
        required: true
      - name: evidence_basis
        type: string[]
        required: true
        min_items: 1
      - name: execution_prerequisite
        type: string
        required: true
      - name: source_feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        validation: "Equals the approved evidence ref."
      - name: source_preparation_basis
        type: enum
        required: conditional
        condition: "feature_preparation_scope == not_applicable"
        enum_values: [not_applicable]
        validation: "Records the exact non-existing-system preparation basis without fabricating an evidence ref."

  - name: approved_feature_preparation_qa_acceptance_obligation
    type: object
    required: conditional
    condition: "execution_intent == implement_only and the approved feature_preparation_result contains future_qa_acceptance_obligation"
    description: "Accepted deferred QA/acceptance scope for implementation-only work"
    validation: "Its two approved payload fields (requested_scope and execution_prerequisite) exactly match feature_preparation_result.future_qa_acceptance_obligation. Triage adds exactly one preparation-source binding: existing_system requires source_feature_preparation_evidence_ref equal to approved_feature_preparation_evidence_ref and forbids source_preparation_basis; not_applicable requires source_preparation_basis=not_applicable and forbids source_feature_preparation_evidence_ref. The enriched consumer object sets qa_evaluation_mode=required and routes the existing post-Build, post-Code-Reviewer QA Evaluator lane; it never activates QA during prepare_only. Carry that enriched object unchanged through plan, task packet, Build, verification, review, and assistant-review acceptance context. Absent when no future_qa_acceptance_obligation was approved."
    on_missing: fail
    object_fields:
      - name: requested_scope
        type: string
        required: true
      - name: execution_prerequisite
        type: string
        required: true
      - name: source_feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        validation: "Equals the approved evidence ref."
      - name: source_preparation_basis
        type: enum
        required: conditional
        condition: "feature_preparation_scope == not_applicable"
        enum_values: [not_applicable]
        validation: "Records the exact non-existing-system preparation basis without fabricating an evidence ref."

# Validation behavior:
# 1. Resolve all required fields before entering Triage. Exact phase markers are conditional on strict intensity, explicit project policy, or user request.
# 2. If on_missing=ask: group and present every material, non-discoverable question, then wait for the answers
# 3. If on_missing=infer: state the inference ("I'm treating this as a feature task")
# 4. If on_missing=skip: proceed with default value
# 5. Clarification has no numeric cap or quota. Ask every admissible material question, grouped by topic; never ask a ritual question because of task size.
# 6. Auto-apply only source-backed technical defaults; record topic/value/source/rationale; derive flag from entries. Convention/reversibility cannot settle product choices. Carry unanswered topics; `defaults` explicitly accepts displayed recommendations as an answer.
# 7. Log resolved input as: >> Input: {task_type} | scope: {scope_hint or "auto"} | constraints: {count}

  - name: decomposition_required
    type: boolean
    required: false
    default: false
    description: "True only for a concrete acceptance, ownership/context, prerequisite, recovery/rollout or binding protocol boundary; size alone does not select it. Coherent implementation defaults to one canonical packet."
    validation: "prepare_only and unresolved progressive discovery have no executable packets; eligible light work stays direct."
    on_missing: infer

# v16 direct execution is actor-bound at persisted/executable boundaries only.
# context.execution_actor_bindings[packet_id] resolves the independently retained
# ExecutionActorBinding {kind: main|delegated, actor_id, runtime_evidence_ref}.
# direct_main uses execution_stage, execution_actor_id, canonical plan/context;
# worker-only current_task_packet/worker_role/worker_stage/builder fields are absent.
# Ordinary direct single-pass work does not acquire packet serialization.

  - name: execution_actor_bindings
    type: object
    required: conditional
    condition: "build_execution_lane == direct_main and a persisted or executable consumer is used"
    description: "Packet ID to independently retained ExecutionActorBinding with kind main or delegated, actual actor_id and native runtime_evidence_ref; parsed by task-packet-admission.py"
    validation: "Actual native main identity, never a pretend child. Optional delegated bindings must match existing writer ownership when resolved; absence remains compatible and creation/session refs retain their own semantics. Single-pass direct work without a consumer does not acquire this object."
    on_missing: fail
  - name: execution_stage
    type: enum
    required: conditional
    condition: "build_execution_lane == direct_main and a persisted or executable consumer is used"
    enum_values: [implementation, test_authoring, pre_production_red, production, green, refactor, refactor_verification, final_verification]
    description: "Actor-neutral direct execution stage, with existing TDD and verification gates; direct_main only (delegated lanes use worker_stage and reject this key)"
    validation: "Selected-TDD packets use test_authoring, pre_production_red, production, green, refactor or refactor_verification. Non-TDD packets use implementation, test_authoring, production or final_verification. Advancing a RUNNING direct_main packet requires this key explicitly."
    on_missing: infer
    infer_from: "For a PENDING non-TDD packet, infer implementation. A selected-TDD packet has no default: block with worker_stage and request the concrete stage. A RUNNING packet without the key is blocked with invalid_state."

# Executable admission readiness and review authority (task-packet-admission.py).
# Review facts are workflow projections of the canonical Review v10 aggregate.
# Only request_plan_reconciliation keeps the producer's names
# (assistant-review/scripts/review-tools.py); fresh_dispatch_evidence_ref is the
# ref to Review's retained fresh_dispatch / fresh_context_evidence.

  - name: readiness
    type: object
    required: conditional
    condition: "An executable packet admission boundary is evaluated"
    description: "Current readiness and plan-review applicability consumed at packet dispatch, verification and completion"
    validation: "execution_intent is implement_only or end_to_end, ready and route_clear are true. At dispatch, verification and completion, plan review is required unless plan_review_required is false with a resolved applicability exception, or the plan is an attested unchanged migrated approval."
    on_missing: fail
    object_fields:
      - name: execution_intent
        type: enum
        required: true
        on_missing: fail
        enum_values: [prepare_only, implement_only, end_to_end]
        validation: "prepare_only produces no executable work and blocks with no_execution."
      - name: ready
        type: boolean
        required: true
        on_missing: fail
      - name: route_clear
        type: boolean
        required: true
        on_missing: fail
      - name: plan_review_required
        type: boolean
        required: false
        validation: "When absent, review is required unless the plan is an attested unchanged migrated approval. Non-boolean values block with review_authority."
      - name: plan_review_ref
        type: string
        required: conditional
        condition: "Plan review is required at dispatch, verification or completion"
        validation: "Resolves exactly one review_authorities entry with review_subject plan."
        on_missing: fail
        on_fail: "Missing blocks with review_authority (plan_review_missing) at plan.review_ref; an unresolved or invalid review blocks with review_authority. Obtain a completed validated fresh delegated plan review of the current definition, record the approval that references it, then rerun admission."
      - name: plan_review_applicability_ref
        type: string
        required: conditional
        condition: "plan_review_required == false and the plan is not an attested unchanged migrated approval"
        validation: "Resolves one plan_review_applicability_authority entry."
        on_missing: fail
        on_fail: "Missing or unresolved blocks with malformed; a mismatched exception blocks with review_authority. Resolve an exception bound to the current approved_plan_identity, or set plan_review_required true and supply plan_review_ref."

  - name: plan_review_applicability_authority
    type: object
    required: conditional
    condition: "readiness.plan_review_applicability_ref is consumed"
    description: "Reference to an independently resolved plan-review applicability exception"
    validation: "The referenced entry binds the current approved_plan_identity exactly and its reason is no_plan_required or unchanged_already_running_approved_plan. unchanged_already_running_approved_plan also needs a retained previous_plan with the same approved_plan_identity and at least one packet whose state is not PENDING; otherwise it blocks with review_authority."
    on_missing: fail
    object_fields:
      - name: approved_plan_identity
        type: object
        required: true
        on_missing: fail
      - name: reason
        type: enum
        required: true
        on_missing: fail
        enum_values: [no_plan_required, unchanged_already_running_approved_plan]

  - name: historical_plan_attestation
    type: object
    required: conditional
    condition: "A plan_schema_version 14.0 or 15.0 plan claims its original approval without a current plan review"
    description: "Independently retained attestation that a verified historical Workflow producer created this approved v14/v15 definition; a version label alone is not provenance"
    validation: "Exactly schema_version equal to the plan's label, verified true, nonblank producer_ref and definition_sha256 equal to the approved definition_digest and the recomputed definition digest. Absent leaves provenance unknown: plan review stays due and historical 9.0 direct_fallback cannot close completion. A supplied contradicting attestation blocks with legacy_provenance. Verified v12/v13 legacy producer provenance attests its own normalized plan. A retained 16.0 migration grandfathers only when every migration row and this attestation re-derive from the current definition and identity. Caller-trust boundary: caller-resolved attestation, current digests and actor ids are trusted inputs; admission checks consistency, not truth, and independence comes from fresh reviewers. A caller that attests a migrated plan and relabels a current-snapshot acceptance as a v9 direct_fallback is outside this boundary."
    on_missing: skip
    object_fields:
      - name: schema_version
        type: enum
        required: true
        enum_values: ["14.0", "15.0"]
        on_missing: fail
      - name: verified
        type: boolean
        required: true
        on_missing: fail
      - name: producer_ref
        type: string
        required: true
        on_missing: fail
      - name: definition_sha256
        type: string
        required: true
        on_missing: fail

  - name: writer_actor_ids
    type: object
    required: conditional
    condition: "build_execution_lane is bounded_executor or separated_workers and a persisted or executable consumer is used"
    description: "Packet ID to the independently resolved native writer actor of delegated work"
    validation: "Each value is a nonblank actual native actor, never a configured role name. Verification requires it; direct_main context carries none. Review actors must differ from every writer."
    on_missing: fail
  - name: builder_actor_ids
    type: object
    required: conditional
    condition: "build_execution_lane == separated_workers and packet evidence carries builder_evidence_ref"
    description: "Packet ID to the independently resolved native Builder/Tester actor, or a nonempty list of actors"
    validation: "Every packet with Builder evidence resolves to nonblank actors; a missing entry blocks current completion with review_authority instead of failing open. Review actors must differ from every Builder. direct_main context carries none."
    on_missing: fail

  - name: review_authorities
    type: object
    required: conditional
    condition: "A plan review is required at dispatch, verification or completion, or completion resolves an independent_review or qa terminal gate"
    description: "Canonical review ref to the retained Review v10 (or historical v9 acceptance) projection"
    validation: "Each entry has the same canonical_review_ref as its key. Current entries have producer_version 10.0, result CLEAN or ISSUES_FIXED, coverage_complete true and a fresh_dispatch_evidence_ref. A plan entry binds reviewed_plan_identity (never approved_plan_identity), is delegated, validated and completed, and its actor_id is not a writer, Builder or execution actor (including the main binding). An acceptance entry binds the current approved_plan_identity; its actor_id is likewise outside the reviewed work unless it is a completed historical 9.0 direct_fallback source under an attested unchanged approval. Each current 10.0 entry consumed at completion differs from every other consumed review authority (plan review, final review, QA) in actor_id, native_invocation_id and fresh_dispatch_evidence_ref. Plan and final acceptance entries carry request_plan_reconciliation whose required and observed requirement IDs both equal the accepted requirement IDs, with explicit empty unresolved_requirement_ids and unresolved_finding_ids; a missing unresolved list is unknown and blocks. Only acceptance also requires explicit empty unfinished_task_wide_work; a pre-Build plan review does not gate it. QA entries use covered_acceptance_criteria instead."
    on_missing: fail
    object_fields:
      - name: review_subject
        type: enum
        required: true
        enum_values: [plan, acceptance]
        on_missing: fail
      - name: producer_version
        type: enum
        required: true
        enum_values: ["10.0", "9.0"]
        validation: "9.0 is readable only for completed historical acceptance under its attested original approval."
        on_missing: fail
      - name: result
        type: enum
        required: true
        enum_values: [CLEAN, ISSUES_FIXED, HAS_REMAINING_ITEMS]
        validation: "HAS_REMAINING_ITEMS blocks admission with review_authority."
        on_missing: fail
      - name: coverage_complete
        type: boolean
        required: true
        on_missing: fail
      - name: approved_plan_identity
        type: object
        required: conditional
        condition: "review_subject == acceptance"
        validation: "Equals the current approved_plan_identity (historical 9.0: an authenticated original approval). A plan entry carrying it blocks with review_authority: plan review precedes approval."
        on_missing: fail
      - name: reviewed_plan_identity
        type: object
        required: conditional
        condition: "review_subject == plan"
        description: "Reviewed plan definition, recorded before approval exists"
        validation: "Exactly task_identity, plan_version and definition_digest, each equal to the current approved_plan_identity; an approval_ref key blocks with review_authority."
        on_missing: fail
        object_fields:
          - name: task_identity
            type: string
            required: true
            on_missing: fail
          - name: plan_version
            type: string
            required: true
            on_missing: fail
          - name: definition_digest
            type: string
            required: true
            on_missing: fail
      - name: canonical_review_ref
        type: string
        required: true
        on_missing: fail
      - name: fresh_dispatch_evidence_ref
        type: string
        required: conditional
        condition: "producer_version == 10.0"
        description: "Ref to Review's retained fresh_dispatch / fresh_context_evidence"
        validation: "A current 10.0 entry consumed at completion differs from every other consumed review authority."
        on_missing: fail
      - name: subagent_execution_mode
        type: enum
        required: conditional
        condition: "review_subject == plan, or the entry is a completion terminal-gate source"
        enum_values: [delegated, direct_fallback]
        validation: "Plan and current 10.0 acceptance require delegated. direct_fallback is readable only as the original label of a completed historical 9.0 acceptance source."
        on_missing: fail
      - name: validation_status
        type: enum
        required: conditional
        condition: "review_subject == plan, or producer_version == 10.0 and the entry is a completion terminal-gate source"
        enum_values: [validated, invalid]
        validation: "Must be validated; invalid blocks with review_authority."
        on_missing: fail
      - name: terminal_state
        type: enum
        required: conditional
        condition: "review_subject == plan, or the entry is a completion terminal-gate source"
        enum_values: [completed, needs_context, blocked, timed_out, failed, invalidated]
        validation: "Must be completed; any other state blocks with review_authority."
        on_missing: fail
      - name: actor_id
        type: string
        required: conditional
        condition: "review_subject == plan, or the entry is a completion terminal-gate source"
        description: "Actual native reviewer actor"
        validation: "Nonblank, exact and not in writer_actor_ids, builder_actor_ids or any execution_actor_bindings actor_id, except a completed historical 9.0 direct_fallback acceptance source under an attested unchanged approval. A current 10.0 acceptance actor differs from the plan reviewer and every other consumed review authority. Ids compare exactly: surrounding whitespace on this id or a reviewed-work actor id blocks with review_authority."
        on_missing: fail
      - name: role
        type: enum
        required: conditional
        condition: "The entry is a completion terminal-gate source"
        enum_values: [CodeReviewer, Reviewer, QAEvaluator]
        validation: "independent_review uses CodeReviewer or Reviewer; qa uses QAEvaluator."
        on_missing: fail
      - name: canonical_contract
        type: enum
        required: conditional
        condition: "The entry is a completion terminal-gate source"
        enum_values: ["assistant-review/contracts/output.yaml#final_summary", "assistant-review/contracts/output.yaml#qa_evaluation_result"]
        validation: "final_summary for independent_review; qa_evaluation_result for qa."
        on_missing: fail
      - name: canonical_result_ref
        type: string
        required: conditional
        condition: "The entry is a completion terminal-gate source"
        validation: "Equals canonical_review_ref; required QA uses a different ref from the final review."
        on_missing: fail
      - name: native_invocation_id
        type: string
        required: conditional
        condition: "The entry is a completion terminal-gate source"
        validation: "Nonblank actual native invocation; a current 10.0 entry differs from every other consumed review authority."
        on_missing: fail
      - name: native_evidence_ref
        type: string
        required: conditional
        condition: "The entry is a completion terminal-gate source"
        on_missing: fail
      - name: final_verdict
        type: enum
        required: conditional
        condition: "role == QAEvaluator"
        enum_values: [accepted, accepted_with_concerns, rejected, blocked]
        validation: "accepted or accepted_with_concerns; rejected or blocked blocks with review_authority."
        on_missing: fail
      - name: covered_acceptance_criteria
        type: string[]
        required: conditional
        condition: "role == QAEvaluator"
        min_items: 1
        validation: "Unique and exactly equal to qa_acceptance_context.acceptance_criteria."
        on_missing: fail
      - name: acceptance_source_ref
        type: string
        required: conditional
        condition: "role == QAEvaluator"
        validation: "Equals qa_acceptance_context.source_ref."
        on_missing: fail
      - name: snapshot_identity
        type: string
        required: conditional
        condition: "review_subject == acceptance"
        on_missing: fail
      - name: request_plan_reconciliation
        type: object
        required: conditional
        condition: "producer_version == 10.0 and the entry is a plan review or the final independent_review gate"
        on_missing: fail
        object_fields:
          - name: original_request_ref
            type: string
            required: true
            on_missing: fail
          - name: approved_plan_ref
            type: string
            required: true
            validation: "For review_subject plan, the reviewed plan-definition ref bound to reviewed_plan_identity; it never equals the approval_ref recorded afterwards (blocks with review_authority). For acceptance, the approved plan."
            on_missing: fail
          - name: required_requirement_ids
            type: string[]
            required: true
            min_items: 1
            on_missing: fail
          - name: observed_requirement_ids
            type: string[]
            required: true
            on_missing: fail
          - name: unresolved_requirement_ids
            type: string[]
            required: true
            validation: "Missing is unknown, never empty; it blocks with review_authority."
            on_missing: fail
          - name: unresolved_finding_ids
            type: string[]
            required: true
            validation: "Missing is unknown, never empty; it blocks with review_authority."
            on_missing: fail
          - name: unfinished_task_wide_work
            type: string[]
            required: conditional
            condition: "review_subject == acceptance"
            validation: "Must be explicitly empty for final acceptance. Optional for a pre-Build plan review; when present every item is a nonblank string, it may be non-empty and it is not gated."
            on_missing: fail

  - name: plan_approval_authorities
    type: object
    required: conditional
    condition: "A plan review is required at dispatch, verification or completion"
    description: "approval_ref to the independently retained approval record, recorded after the plan review it references"
    validation: "The entry for the current approved_plan_identity.approval_ref has approval_ref equal to its key, approved_plan_identity equal to the current identity, and plan_review_ref equal to the validated readiness.plan_review_ref. A missing or different plan_review_ref is approval before review and blocks with review_authority."
    on_missing: fail
    object_fields:
      - name: approval_ref
        type: string
        required: true
        on_missing: fail
      - name: approved_plan_identity
        type: object
        required: true
        on_missing: fail
      - name: plan_review_ref
        type: string
        required: true
        on_missing: fail

  - name: qa_acceptance_context
    type: object
    required: conditional
    condition: "required_terminal_gates includes qa at completion"
    description: "Accepted QA scope from the QA handoff or Done Contract, never a result's own narrower self-declaration"
    validation: "acceptance_criteria are unique and nonempty; the QA source's covered_acceptance_criteria and acceptance_source_ref must match exactly."
    on_missing: fail
    object_fields:
      - name: source_ref
        type: string
        required: true
        on_missing: fail
      - name: acceptance_criteria
        type: string[]
        required: true
        min_items: 1
        on_missing: fail

  - name: current_input_identities
    type: object
    required: conditional
    condition: "An executable packet admission boundary is evaluated"
    description: "Packet ID to the independently resolved current relevant-input identity"
    validation: "Nonempty per packet; evidence, applicability and execution bind it exactly. Digest GREEN reuse additionally requires reuse_digest; detailed GREEN reuse requires relevant_input_identity."
    on_missing: fail
    object_fields:
      - name: reuse_digest
        type: string
        required: conditional
        condition: "The packet's REFACTOR verification_disposition is reuse_green and reuse_identity_mode is digest or absent"
        description: "Caller-resolved digest of the current snapshot, never copied from the TDD log; the caller computes it with the canonical recipe of assistant-tdd contracts/output.yaml green.reuse_digest (referenced, not restated)"
        validation: "Digest-shaped: lowercase sha256: followed by 64 lowercase hex characters. Equals the TDD v3 green.reuse_digest computed by that same recipe. Missing, blank, a sentinel such as unknown, n/a or none in any case, another format, or a different value blocks reuse with tdd_reuse; run the affected checks."
        on_missing: fail
      - name: relevant_input_identity
        type: object
        required: conditional
        condition: "The packet's REFACTOR verification_disposition is reuse_green and reuse_identity_mode == detailed"
        validation: "Exactly source, tests, configuration, dependencies, toolchain, environment and external_inputs, each with identity and freshness current. Missing blocks reuse with tdd_reuse."
        on_missing: fail

  - name: previous_plan
    type: object
    required: conditional
    condition: "Resume; or dispatch that would replace an existing stamp; or dispatch, verification or completion of a plan with a dispatched, started or VERIFIED packet lacking its own dispatch stamps; or an unchanged_already_running_approved_plan exception"
    description: "The canonical_plan of the last accepted admission (returned as canonical_context.previous_plan), retained independently by the caller"
    validation: "Binds the same approved_plan_identity. The current plan retains its VERIFIED states, progress guard, dispatch stamps, spent recovery counters, history prefix and evidence_refs. Only a newly admitted dispatch replaces a stamp (including a lane-only stamp gaining execution_actor_id), before start and old-actor stage evidence, with this snapshot retaining the packet; a same-stamp re-dispatch needs no snapshot. With this snapshot, a same-lane RUNNING worker_stage fills a lane-only actor once, matching evidence actors, appending {state, filled_stamps, reason: actor resolved for lane-only stamp}. Writing the first stamp or replacing one appends the history row {state, stamp_baseline: {evidence_refs, tdd_cycle_log_ref when present}, reason}, plus replaced_stamps when replacing. A move from a retained started state to any non-started state appends once the row {state: the retained started state, input_identity, evidence_refs, reason}; reason is started packet returned to PENDING for a move to PENDING and started packet left started state for any other move. Observing a stamped RUNNING packet appends once per stamp {state: RUNNING, input_identity, evidence_refs, reason: started under current stamp}; the lock covers only starts committed through admission, so coordinators commit PENDING->RUNNING through an admission call before the worker starts. Only admission writes stamps and stamp_baseline, fill or started-marker rows; a caller row carrying either beyond the retained history prefix is recovery_mismatch. A stamp_baseline is an object with evidence_refs strings and optional string tdd_cycle_log_ref; execution tdd_cycle_log_ref, when present, is a nonblank string; retained states are known states; otherwise malformed. Started means current RUNNING, retained RUNNING, BLOCKED or VERIFIED, or such a history row appended after the latest stamp_baseline row (any row for a stamp without one); earlier rows, including carried legacy history, never lock a newly written stamp. History rows cannot be dropped, so a later PENDING never unlocks the stamp. Old-actor evidence is packet evidence bound to the stamped actor or lane, or evidence_refs or a tdd_cycle_log_ref beyond the latest stamp_baseline; without a baseline row compare against this snapshot, and without either every ref counts. Dispatch never admits BLOCKED: a retry is an admitted dispatch of the packet reset to PENDING."
    on_missing: fail
    on_fail: "Resume blocks with resume_identity; unstamped started or VERIFIED work blocks with lane_evidence; replacing the stamp of started or old-actor work, or replacing any stamp without this snapshot, blocks with lane_evidence when the lane differs, otherwise execution_actor; the already-running exception blocks with review_authority. Supply the retained snapshot, or rerun from an admitted dispatch."

  - name: verification_reuse_authority
    type: object
    required: conditional
    condition: "A TDD v3 REFACTOR record has verification_disposition reuse_green and the cycle opts into reuse_identity_mode detailed"
    description: "Detailed mode only: reuse_assessment_ref to the current canonical no-change GREEN reuse assessment"
    validation: "The referenced entry has result sufficient, evidence_ref equal to its key, the same packet_id, green_invocation_refs equal to REFACTOR green_invocation_refs, the unchanged verification_decision_ref, the packet's red check_id/command/cwd/oracle, empty post_green_changes and fresh_run_obligations, and green_input_identity and current_input_identity both equal GREEN relevant_input_identity and current_input_identities[packet_id].relevant_input_identity. The assessment's current identity is never trusted alone."
    on_missing: fail
    object_fields:
      - name: result
        type: enum
        required: true
        on_missing: fail
        enum_values: [sufficient, insufficient]
      - name: evidence_ref
        type: string
        required: true
        on_missing: fail
      - name: packet_id
        type: string
        required: true
        on_missing: fail
      - name: green_invocation_refs
        type: string[]
        required: true
        on_missing: fail
        min_items: 1
      - name: verification_decision_ref
        type: object
        required: true
        on_missing: fail
      - name: check_id
        type: string
        required: true
        on_missing: fail
      - name: command
        type: string[]
        required: true
        on_missing: fail
      - name: cwd
        type: string
        required: true
        on_missing: fail
      - name: oracle
        type: string
        required: true
        on_missing: fail
      - name: green_input_identity
        type: object
        required: true
        on_missing: fail
      - name: current_input_identity
        type: object
        required: true
        on_missing: fail
      - name: post_green_changes
        type: object[]
        required: true
        on_missing: fail
      - name: fresh_run_obligations
        type: object[]
        required: true
        on_missing: fail

# Current completion resolves each independent_review/required qa terminal gate's
# canonical_review_ref through existing context.review_authorities. Completed
# source facts bind canonical_result_ref/contract, review_subject=acceptance,
# role CodeReviewer|Reviewer|QAEvaluator, actual actor_id/native_invocation_id/native_evidence_ref,
# producer_version, terminal_state=completed, approval and snapshot. Current v10
# has validation_status=validated, delegated mode and fresh_dispatch_evidence_ref.
# Required QA retains actual final_verdict/result and covered_acceptance_criteria
# matching context.qa_acceptance_context.acceptance_criteria plus its source_ref
# through acceptance_source_ref. This context comes from the accepted QA handoff/
# Done Contract, never a result's narrower self-declaration. Final review separately
# reconciles the whole original request. QA ref, actor, invocation and fresh dispatch
# cannot substitute final-review authority. Pure check execution stays discretionary.
# Explicit completed historical v9 sources retain original actor/fallback/verdict,
# original ref/snapshot and authenticated original approval chain. Plan migration
# alone cannot waive due current authority; missing historical facts stay unknown.
