            required: true
            validation: "File must exist in the project"
          - name: change_description
            type: string
            required: true
      - name: interfaces
        type: object[]
        required: false
        description: "New interfaces or contracts to define"
        object_fields:
          - name: name
            type: string
            required: true
          - name: file
            type: string
            required: true
          - name: methods
            type: string[]
            required: true
      - name: test_plan
        type: object[]
        required: conditional
        condition: "at least one packet's selected CheckSpec in the canonical verification_decision has method == automated_test"
        description: "Automated test plans are required only for packets with selected automated_test CheckSpecs; omit them for packets whose selected methods are non-test."
        min_items: 1
        object_fields:
          - name: packet_id
            type: string
            required: true
          - name: test_type
            type: enum
            required: true
            enum_values: [unit, integration, e2e]
          - name: description
            type: string
            required: true
      - name: risks
        type: object[]
        required: true
        min_items: 1
        object_fields:
