          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
