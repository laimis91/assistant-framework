# Handoff Contracts
# Defines the data shape that flows between subagents.
# Think of these as API contracts between microservices — the producer must
# include all required fields, and the consumer must validate before using.
#
# Any agent dispatching a subagent MUST include the required context fields.
# Any subagent returning results MUST include the required output fields.
# If a required field is missing from the return, follow the on_missing action.

schema_version: "16.0"
contract: handoffs
skill: assistant-workflow

# ─────────────────────────────────────────────
# Worker Status Protocol
# ─────────────────────────────────────────────
worker_status_protocol:
  description: "CodeMapper, Explorer, Architect, CodeWriter, and BuilderTester returns include a compact status packet so the orchestrator can route Build-role results deterministically. Bounded CodeWriter and BuilderTester verification failures use FAILED_VERIFICATION, which takes precedence over completion or deviation statuses; BuilderTester DONE for exact matching authorizing RED or passing GREEN with pending REFACTOR is stage completion only, never final Build completion. Reviewer and QAEvaluator packet schemas are owned by assistant-review."
  statuses:
    - value: DONE
      meaning: "No known concerns; requested work or an explicitly dispatched stage completed within scope. Stage-specific DONE does not claim final Build completion."
    - value: DONE_WITH_CONCERNS
      meaning: "Usable result, but follow-up risk or trade-off exists and is recorded."
    - value: NEEDS_CONTEXT
      meaning: "Orchestration must clarify missing information before the worker can proceed."
    - value: BLOCKED
      meaning: "Cannot proceed because an environment, dependency, permission, or tool issue prevents progress."
    - value: DEVIATED
      meaning: "The worker had to depart from the approved plan or requested scope; deviation evidence is required."
    - value: FAILED_VERIFICATION
      meaning: "A bounded CodeWriter or BuilderTester ran a due required check and it failed; retain per-check failure evidence. This takes precedence over completion and deviation statuses. A BuilderTester pre_production_red stage may return DONE only for its exact matching authorizing RED; that status does not mean final verification or Build completion."
  packet_rules:
    - "status is required on CodeMapper, Explorer, Architect, CodeWriter, and BuilderTester returns."
    - "evidence is required for CodeMapper, Explorer, Architect, and CodeWriter returns with DONE, DONE_WITH_CONCERNS, or DEVIATED."
    - "evidence is required for CodeWriter returns with FAILED_VERIFICATION."
    - "verification.evidence is required for BuilderTester returns."
    - "open_questions is required for NEEDS_CONTEXT and BLOCKED."
    - "blocker_type and blocker_evidence are required for CodeWriter returns with NEEDS_CONTEXT, BLOCKED, or DEVIATED when implementation hits an unexpected blocker."
    - "deviation_details is required for Architect and CodeWriter returns with DEVIATED."
    - "CodeMapper and Explorer status values are limited to DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, and BLOCKED."
    - "Architect status values also include DEVIATED."
    - "CodeWriter status values also include DEVIATED and FAILED_VERIFICATION; CodeWriter uses FAILED_VERIFICATION only for a failed bounded_executor check."
    - "BuilderTester status values also include DEVIATED and FAILED_VERIFICATION."
    - "changed_files and files_changed require at least one item whenever the worker actually created, modified, or deleted implementation or test files regardless of terminal status. A refactor assessment of none needed may return empty changes; never invent mutations for stage-only DONE. They may be omitted or empty only when no file changed; never invent entries for pre-action returns, and retain actual worker changes across retries."
    - "Bounded CodeWriter validation_results are required for DONE, DONE_WITH_CONCERNS, or FAILED_VERIFICATION and whenever verification was attempted; an unattempted DEVIATED return may omit them. A meaningful expected RED is stage evidence, not an ordinary failed verification result."
    - "verification is required for BuilderTester returns; if status is NEEDS_CONTEXT or BLOCKED before verification runs, return result not_run with concise blocker evidence. During active-TDD pre_production_red, exact matching authorizing RED may return DONE with aggregate partial and explicit pending GREEN rows; actual failed counts remain failed, and this stage cannot satisfy final Build or Review gates."
    - "During active-TDD first final_verification, passing current GREEN may return stage-only DONE only with aggregate partial and explicit pending REFACTOR rows; this stage cannot satisfy final Build or Review gates."

# Writer stages are semantic selectors on the existing CodeWriter handoff.
worker_stage_protocol:
  description: "One selected writer owns tests and implementation; BuilderTester executes already authored checks. Stage completion never closes Build. Canonical v16 stored implementation_steps are stage-neutral. The caller overlay materializes worker_stage/verification_stage and matching inline aliases; changing stage never changes definition or packet_definition. Native actor and authored/reused test proofs are caller-resolved, not a second plan or execution attestation."
  stages:
    - value: test_authoring
      mutation_scope: tests_only
      active_tdd_prerequisite: none
      completes_build: false
    - value: production
      mutation_scope: tests_and_production
      active_tdd_prerequisite: current_matching_red
      completes_build: false
    - value: refactor
      mutation_scope: behavior_neutral
      active_tdd_prerequisite: current_passing_green
      completes_build: false
  rules:
    - "test_authoring permits selected tests, fixtures, snapshots, helpers and test/build configuration only, with no incoming RED. No production edits."
    - "Separated active TDD: selected writer test_authoring -> BuilderTester pre_production_red -> SAME writer production -> BuilderTester GREEN -> SAME writer refactor -> BuilderTester executed REFACTOR verification or validated unchanged GREEN reuse."
    - "Dispatch admission during active TDD: only separated_workers production requires incoming observed RED and its canonical cycle ref before dispatch; bounded_executor initial dispatch may carry the exact planned RED tuple without observed RED or a started cycle. That SAME executor records current meaningful RED and its canonical cycle ref before its FIRST production edit."
    - "The production active-TDD prerequisite gates production edits in every lane: current exact seven-field RED and its canonical cycle ref are required; refactor requires current green.all_tests_pass. Wrong/missing/stale identity, argv/cwd, target or oracle blocks dependent edits; preserve history and observe fresh RED after an authorizing-input change."
    - "Inactive TDD uses writer tests plus code then verifier; bounded/direct lanes preserve selected checks and phase order. Reuse/run/inspect checks do not force new tests or a test_authoring stage."
    - "BuilderTester may execute selected checks, diagnose and return evidence, and write only designated generated outputs/evidence logs. Authored source/tests/fixtures/snapshots/helpers/build configuration belong to the writer. A prohibited mutation is DEVIATED with real changed_files; another due failed check retains FAILED_VERIFICATION precedence. Do not hide or silently restore mutations."

# ─────────────────────────────────────────────
# Typed Artifact Reference Protocol
# ─────────────────────────────────────────────
artifact_reference_protocol:
  description: "Typed Artifact Reference entries are the compact producer/consumer ledger for harness task packets and worker returns; use them instead of ad hoc string refs when passing artifacts between agents."
  required_fields: [artifact_id, artifact_type, producer, consumer, location_ref, schema_or_contract, validation_status, summary]
  artifact_types: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
  validation_statuses: [pending, valid, invalid, stale, not_applicable]
  packet_rules:
    - "Artifact Reference entries must include artifact_id, artifact_type, producer, consumer, location_ref, schema_or_contract, validation_status, and summary."
    - "location_ref is the typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable external artifact ref."
    - "Producer responsibility: create or update the artifact, assign artifact_id, set artifact_type, location_ref, schema_or_contract, validation_status, and summary."
    - "Consumer responsibility: validate schema_or_contract and validation_status before relying on location_ref; stale, invalid, or missing refs block phase advancement or trigger re-dispatch."
    - "CodeWriter and BuilderTester task packets receive artifact_refs for the Architecture Decision Pack, Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, Pivot/Restart Decision, changed files, verification evidence, and plan deviation refs when applicable."
    - "CodeWriter returns produced artifact_refs for changed files and plan deviation refs when applicable."
    - "BuilderTester returns validated artifact_refs for verification evidence and runtime-artifact validation."

# ─────────────────────────────────────────────
# Orchestrator → CodeMapper
# ─────────────────────────────────────────────
handoffs:

  - name: orchestrator_to_code_mapper
    from: Orchestrator
    to: CodeMapper
    phase: DISCOVER
    context_fields:
      - name: task_description
        type: string
        required: true
        description: "What the task is about — scopes the mapping"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Preparation basis discriminator retained during implementation discovery"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining implementation discovery"
        validation: "Equals the approved input result unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: task_type
        type: enum
        required: true
        enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
        description: "Triage task category used to focus mapping"
      - name: risk_tier
        type: enum
        required: true
        enum_values: [low, moderate, high, critical]
        description: "Triage risk tier used to scale discovery depth"
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Triage architecture mode; not_applicable keeps the mapper to ordinary structural mapping"
      - name: architecture_design_trigger_reasons
        type: string[]
        required: true
        min_items: 1
        description: "Concrete observed architecture triggers or not-applicable rationale that bound the mapper's evidence collection"
      - name: required_gates
        type: string[]
        required: true
        description: "Gate packs selected during Triage"
      - name: target_area
        type: string
        required: false
        description: "Specific module/directory to focus on, if known"
      - name: candidate_scope_scan
        type: object
        required: true
        description: "Triage's quick scope scan; focuses mapping but does not replace CodeMapper discovery"
        object_fields:
          - name: likely_touched_paths
            type: string[]
            required: true
          - name: symbols_or_terms_searched
            type: string[]
            required: true
          - name: adjacent_surfaces
            type: string[]
            required: true
          - name: confidence
            type: enum
            required: true
            enum_values: [low, medium, high]
          - name: unknowns
            type: string[]
            required: true
      - name: constraints
        type: string[]
        required: false
        description: "Boundaries the mapper should note (e.g., 'ignore tests/')"
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "File paths or searches that support the map"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before discovery can continue"
      - name: project_type
        type: string
        required: true
        description: "Detected project type (e.g., 'ASP.NET Core Web API', 'Blazor WASM', 'Console app')"
        validation: "Non-empty, specific enough to inform architecture decisions"
      - name: entry_points
        type: object[]
        required: true
        description: "Main entry points relevant to the task"
        min_items: 1
        object_fields:
          - name: file
            type: string
            required: true
          - name: description
            type: string
            required: true
      - name: key_interfaces
        type: object[]
        required: true
        description: "Interfaces and contracts relevant to the task"
        object_fields:
          - name: name
            type: string
            required: true
          - name: file
            type: string
            required: true
          - name: purpose
            type: string
            required: true
      - name: conventions
        type: object[]
        required: true
        description: "Coding conventions observed in the codebase"
        min_items: 1
        object_fields:
          - name: pattern
            type: string
            required: true
          - name: example
            type: string
            required: true
      - name: dependencies
        type: string[]
        required: true
        description: "External packages and frameworks in use"
      - name: file_map
        type: object[]
        required: true
        description: "Files relevant to the task with their roles"
        min_items: 1
        object_fields:
          - name: path
            type: string
            required: true
          - name: role
            type: string
            required: true
      - name: test_locations
        type: object[]
        required: true
        description: "Where tests live for the relevant areas"
        object_fields:
          - name: area
            type: string
            required: true
          - name: test_file
            type: string
            required: true
          - name: type
            type: enum
            required: true
            enum_values: [unit, integration, e2e]
      - name: references_checked
        type: object[]
        required: true
        description: "Behaviorally relevant references checked for the likely modified areas"
        min_items: 1
        object_fields:
          - name: path_or_query
            type: string
            required: true
            description: "File path, directory, symbol search, or explicit not-applicable surface"
          - name: relationship
            type: enum
            required: true
            enum_values: [caller, consumer, test, docs, contract, config, mirror, runtime, not_applicable, deferred]
          - name: outcome
            type: string
            required: true
            description: "What was found, why it matters, or why it is not applicable/deferred"
      - name: reuse_search
        type: object
        required: true
        description: "Bounded existing-capability search for rule-like changes; not_applicable records a concrete reason without search ceremony"
        object_fields:
          - name: applicability
            type: enum
            required: true
            enum_values: [applicable, not_applicable]
          - name: applicability_reason
            type: string
            required: true
          - name: searches
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            min_items: 1
            object_fields:
              - name: query_or_path
                type: string
                required: true
              - name: scope
                type: string
                required: true
              - name: outcome
                type: string
                required: true
          - name: candidates
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            object_fields:
              - name: name
                type: string
                required: true
              - name: location
                type: string
                required: true
              - name: disposition
                type: enum
                required: true
                enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
              - name: rationale
                type: string
                required: true
          - name: no_candidate_reason
            type: string
            required: conditional
            condition: "applicability == applicable and candidates is empty"
          - name: decision
            type: enum
            required: conditional
            condition: "applicability == applicable"
            enum_values: [reuse, extend, new, intentional_duplicate]
          - name: decision_rationale
            type: string
            required: conditional
            condition: "applicability == applicable"
          - name: divergence_control
            type: string
            required: conditional
            condition: "decision == intentional_duplicate"
      - name: context_map_markdown
        type: string
        required: true
        description: "Compact context map markdown for the orchestrator to persist to {agent_state_dir}/context-map.md when local state artifacts are configured and policy-allowed, or carry forward inline when file writes are unavailable"
      - name: architecture_mapping_evidence
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Evidence-only Architecture Decision Pack mapping; the mapper maps evidence, never designs. Omit this field when architecture_design_mode=not_applicable."
        validation: "Contains source-backed mapping evidence only. design_pressure_checks has exactly one entry per five concerns. semantic_type_inspection independently records candidates_found, inspected_empty, or unresolved with its own evidence or gap refs. representative_paths remains a separate producer-consumer mapping."
        on_missing: re-dispatch
        object_fields:
          - name: source_revision_or_context_ref
            type: string
            required: true
          - name: ownership_lifecycle_boundaries
            type: object[]
            required: true
            object_fields:
              - name: boundary
                type: string
                required: true
              - name: owner_or_unknown
                type: string
                required: true
              - name: lifecycle_or_data_flow
                type: string
                required: true
              - name: dependency_direction
                type: string
                required: true
              - name: status
                type: enum
                required: true
                enum_values: [observed, not_applicable, unresolved]
              - name: evidence_ref
                type: string
                required: true
          - name: design_pressure_checks
            type: object[]
            required: true
            min_items: 5
            max_items: 5
            validation: "Contains exactly one per five concerns: control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, and representative_path; every entry has status/evidence_or_gap/source_ref."
            object_fields:
              - name: concern
                type: enum
                required: true
                enum_values: [control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, representative_path]
              - name: status
                type: enum
                required: true
                enum_values: [observed, not_applicable, unresolved]
              - name: evidence_or_gap
                type: string
                required: true
              - name: source_ref
                type: string
                required: true
          - name: semantic_type_inspection
            type: object
            required: true
            validation: "Records one cohesive semantic inspection outcome. candidates_found requires non-empty candidates; inspected_empty records the inspected scope and evidence; unresolved records the gap and follow-up without borrowing a design-pressure status."
            object_fields:
              - name: outcome
                type: enum
                required: true
                enum_values: [candidates_found, inspected_empty, unresolved]
              - name: evidence_or_gap
                type: string
                required: true
              - name: source_refs
                type: string[]
                required: true
                min_items: 1
              - name: candidates
                type: object[]
                required: conditional
                condition: "outcome == candidates_found"
                min_items: 1
                validation: "Present only when outcome=candidates_found; each candidate is evidence-backed and does not select the design."
                object_fields:
                  - name: concept
                    type: string
                    required: true
                  - name: current_representation
                    type: string
                    required: true
                  - name: boundary
                    type: enum
                    required: true
                    enum_values: [domain_or_public_semantic_type, local_temporary, wire_or_storage, foreign_or_framework, no_domain_semantics]
                  - name: finding_kind
                    type: enum
                    required: true
                    enum_values: [semantic_type_candidate, primitive_exception]
                  - name: evidence_ref
                    type: string
                    required: true
          - name: representative_paths
            type: object[]
            required: true
            min_items: 0
            validation: "For the exactly one design_pressure_checks entry with concern=representative_path, status=observed requires at least one detailed producer-consumer path. status in [not_applicable, unresolved] requires an empty array and retains the reason in that pressure entry's evidence_or_gap/source_ref."
            object_fields:
              - name: producer
                type: string
                required: true
                validation: "Non-empty."
              - name: consumer
                type: string
                required: true
                validation: "Non-empty."
              - name: failure_or_cancellation
                type: string
                required: true
                validation: "Non-empty."
              - name: source_ref
                type: string
                required: true
                validation: "Non-empty."
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: unresolved_questions
            type: string[]
            required: true
    on_missing_field: "Re-dispatch CodeMapper with explicit request for the missing field"

  # ─────────────────────────────────────────────
  # Orchestrator → Explorer
  # ─────────────────────────────────────────────
  - name: orchestrator_to_explorer
    from: Orchestrator
    to: Explorer
    phase: DISCOVER
    context_fields:
      - name: task_description
        type: string
        required: true
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining implementation discovery"
        validation: "Equals the approved input result unchanged."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: focus_areas
        type: string[]
        required: true
        description: "Specific execution paths or behaviors to trace"
      - name: context_map
        type: string
        required: false
        description: "Output from CodeMapper if available — avoids re-exploring structure"
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, searches, or traces that support the findings"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before discovery can continue"
      - name: execution_paths
        type: object[]
        required: true
        description: "Traced paths through the code relevant to the task"
        object_fields:
          - name: trigger
            type: string
            required: true
            description: "What initiates this path (HTTP request, event, command, etc.)"
          - name: steps
            type: string[]
            required: true
            description: "Ordered list of method calls / service interactions"
          - name: side_effects
            type: string[]
            required: false
            description: "Database writes, API calls, events emitted"
      - name: design_decisions
        type: object[]
        required: true
        description: "Architectural choices and their rationale"
        object_fields:
          - name: decision
            type: string
            required: true
          - name: rationale
            type: string
            required: true
          - name: location
            type: string
            required: true
      - name: hidden_dependencies
        type: object[]
        required: false
        description: "Non-obvious coupling or dependencies"
        object_fields:
          - name: from
            type: string
            required: true
          - name: to
            type: string
            required: true
          - name: nature
            type: string
            required: true
            description: "What kind of dependency (runtime, config, convention, implicit)"
    on_missing_field: "Re-dispatch Explorer with specific questions about the missing area"

  # ─────────────────────────────────────────────
  # Orchestrator → Architect (DECOMPOSE)
  # ─────────────────────────────────────────────
  - name: orchestrator_to_architect_decompose
    from: Orchestrator
    to: Architect
    phase: DECOMPOSE
    context_fields:
      - name: task_description
        type: string
        required: true
        description: "What the task is about — scopes the decomposition"
      - name: requirements_summary
        type: string
        required: true
        description: "Restated requirements from Discover phase"
      - name: requirement_acceptance_map
        type: string
        required: true
        description: "Stable requirement ids, criteria, verification methods, assumptions, non-goals, and sufficiency basis across requested intent, applicable authority, justified defaults, product assumptions, and unresolved choices; confirmed answers are in existing acceptance criteria before dependent implementation."
      - name: verification_decision
        type: object
        required: true
        description: "Canonical assistant-verification decision supplied before Decompose so DC2 does not defer selection to Plan."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; Retain explicit reduced-testing scope/source, rationale, exclusions, omissions and stop rule through workers, verifier, review and resume; when an explicit reduced-testing instruction applies, carry the canonical assessment in its declared sibling; otherwise the sibling is optional and any supplied assessment remains canonical unchanged; when an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row through planned packets/result updates and reconcile missing/stale applicable provenance against newest intent. Without an applicable instruction, ordinary assessments including empty scope_and_evidence_refs require no instruction row. The row claims no execution/check closure; expansion requires a distinct important uncovered failure and existing selection/approval. preserve its CheckSpecs and TddChoice unchanged in each slice."
      - name: evidence_assessment
        type: object
        required: conditional
        condition: "an explicit reduced-testing instruction applies"
        description: "Current canonical assistant-verification assessment carried unchanged from selection/task state."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment. Resolve applicability from newest authoritative instructions/task constraints, not surviving rows; preserve the exact source-bearing instruction row even when planned and reconcile missing/stale provenance before dependent work without reconstructing it from scope prose. Without an applicable instruction, omission is valid; any supplied assessment remains canonical unchanged, including empty scope_and_evidence_refs. Instruction rows claim no execution/check closure; planned is not verification sufficiency."
        on_missing: fail
      - name: tdd_mode
        type: boolean
        required: true
        description: "Task-global projection of the canonical TddChoice."
        validation: "Equals verification_decision.tdd_choice.mode."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether the Architect must consume a typed Architecture Decision Pack"
      - name: architecture_decision_pack_ref
        type: string
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Current Architecture Decision Pack reference; Architect consumes it rather than rediscovering its facts"
        validation: "Resolves to a fresh pack with boundaries, design-pressure checks, Type Ledger, quality scenarios, verification, and invalidation conditions"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether decomposition must preserve classifications from existing-system feature preparation"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining decomposition"
        validation: "Equals the approved_feature_preparation_result input unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref constraining decomposition"
        validation: "Resolves to the current two-axis behavior/work classifications and their implementation/test evidence"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation constraining decomposition"
        validation: "Its three approved payload fields match feature_preparation_result.future_harness_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, then carries that enriched consumer object unchanged"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation constraining decomposition"
        validation: "Its two approved payload fields match feature_preparation_result.future_qa_acceptance_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and carries that enriched consumer object unchanged through the post-Build Code Reviewer then QA Evaluator lane"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: context_map
        type: string
        required: true
        description: "CodeMapper output — Architect uses this to understand codebase boundaries"
      - name: explorer_findings
        type: string
        required: false
        description: "Explorer output if available (large/mega tasks)"
      - name: constraints
        type: string[]
        required: true
        description: "All accumulated constraints"
      - name: risk_tier
        type: enum
        required: true
        enum_values: [low, moderate, high, critical]
        description: "Triage risk tier used to choose smallest iterable slice boundaries and verification depth"
      - name: required_gates
        type: string[]
        required: true
        description: "Gate packs selected during Triage and carried into slice criteria"
      - name: task_size
        type: enum
        required: true
        enum_values: [medium, large, mega]
        description: "Context for effort and approval; size alone does not require decomposition or Architect"
      - name: search_mode
        type: enum
        required: false
        enum_values: [none, lightweight, candidate_search]
        description: "Whether decomposition should prepare for one path, lightweight options, or a Candidate Search archive"
      - name: candidate_search_summary
        type: string
        required: false
        condition: "search_mode == candidate_search"
        description: "Selected candidate, archive location, and constraints from references/candidate-search.md if Candidate Search already ran"
    return_fields:
      - name: architecture_decision_pack_update
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive] and refreshed source evidence changes the Pack"
        description: "Mergeable canonical Architecture Decision Pack update/ref returned when DECOMPOSE refreshes source evidence"
        validation: "References the complete refreshed canonical Pack and records its source Pack, freshness basis, changed source-backed sections, evidence refs, and independent challenge evidence when mode=review_intensive"
        on_missing: re-dispatch
        object_fields:
          - name: source_pack_ref
            type: string
            required: true
          - name: updated_pack_ref
            type: string
            required: true
            description: "Reference to the complete refreshed canonical Pack"
          - name: freshness_basis
            type: string
            required: true
          - name: changed_sections
            type: string[]
            required: true
            min_items: 1
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: merge_action
            type: enum
            required: true
            enum_values: [replace_current_pack]
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, patterns, or searches that support the decomposition"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before decomposition can continue"
      - name: deviation_details
        type: string
        required: false
        condition: "status is DEVIATED"
        description: "What the decomposition had to change from the requested scope or approved direction"
      - name: implementation_steps
        type: object[]
        required: true
        description: "Canonical ordered packets; one coherent increment defaults to one packet. Stored Plan keeps specialist references; worker projections materialize unchanged decisions. Optional display summaries may exist only for human readability and cannot replace exact packet and files_to_* fields."
        min_items: 1
        object_fields:
          - name: writer_selection
            type: object
            required: conditional
            condition: "new Claude or Codex writer dispatch; legacy packets and Gemini native fallback may omit"
            description: "Orchestrator-owned concrete Claude or Codex writer choice; Architect proposals require Orchestrator validation."
            validation: "Packet selection is authoritative when supplied; conflicting inline selection blocks dispatch. Old packets omitting this object remain valid with intelligent compatibility semantics. Before dispatch, the Orchestrator resolves actual current evidence, not merely nonempty strings or self-asserted labels. Never select by edit size, file type/count, or simple labels."
            on_missing: fail
            object_fields:
              - name: agent
                type: enum
                required: true
                enum_values: [intelligent-writer, mechanical-writer]
                description: "Normal new Claude or Codex dispatch identity; explicit legacy code-writer and bootstrap identities are recorded separately."
                on_missing: fail
              - name: rationale
                type: string
                required: true
                description: "Reason tied to remaining judgment and consequences; intelligent-writer is the default."
                on_missing: fail
              - name: mechanical_eligibility
                type: object
                required: conditional
                condition: "agent == mechanical-writer"
                description: "All four evidence-backed eligibility conditions; unresolved semantic, grader, oracle or compatibility judgment cannot qualify."
                validation: "Each ref resolves to actual applicable current packet, approved preparation, source or selected-check evidence. Independently fixed expectations cannot be chosen by the mechanical writer. Evidence covers BOTH tests and implementation: fully specified cases, expected values/oracles, negative cases, assertion/fixture patterns and implementation recipe; unresolved test judgment requires intelligent-writer. Stale or missing evidence stops dependent mutations and returns truthful status, blocker evidence and all actual partial changes."
                on_missing: fail
                object_fields:
                  - {name: recipe_or_example_ref, type: string, required: true, description: "Concrete approved applicable recipe, exact wording or transformation example", on_missing: fail}
                  - {name: resolved_decisions_ref, type: string, required: true, description: "Resolved semantic, edge-case and compatibility decisions", on_missing: fail}
                  - {name: scope_and_dependencies_ref, type: string, required: true, description: "Understood ownership, scope, dependencies and baseline assumptions", on_missing: fail}
                  - {name: correctness_expectations_ref, type: string, required: true, description: "Independently fixed expectations checking actual correctness", on_missing: fail}
          - name: packet_id
            type: string
            required: true
            description: "Unique descriptive path-safe canonical packet identity; never ordinal-only. All consumers resolve implementation_steps exactly once."
          - name: name
            type: string
            required: true
            description: "Human-readable task packet name passed directly as current_task_packet.name"
          - name: description
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
            description: "Observable increment owned by this packet"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "Deliverable owned by this packet"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Requirement Acceptance Map ids implemented by this packet"
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Fresh Architecture Decision Pack reference carried into this executable packet"
            validation: "Resolves to the selected design's owned boundary, design-pressure checks, Type Ledger, quality verification, and deviation conditions"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref carried unchanged into this executable packet"
            validation: "Resolves to the classifications and implementation implications this packet implements"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan handoff unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, then activates the existing pre-Build harness entry gate"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: red_check_id
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals the sole ID in selected_check_ids intersect applicable_check_ids; multiple IDs require packet splitting. Resolve its exact command.argv and command.cwd in the unchanged CheckSpec."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact literal command.argv for red_check_id; never shell reconstruction."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact explicit CheckSpec command.cwd."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals meaningful_failure for red_check_id in the unchanged CheckSpec; planned oracle only, never actual RED evidence."
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files CodeWriter is expected to create for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files CodeWriter is expected to modify for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets for execution only: BuilderTester executes and diagnoses selected checks; CodeWriter owns test authoring listed in files_to_create and files_to_modify. Use an empty array only when no test file applies"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this packet"
          - name: depends_on
            type: string[]
            required: true
            description: "Approved slice dependencies"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Observable behavior this task packet must deliver"
          - name: reuse_search
            type: object
            required: true
            description: "CodeMapper reuse-search result carried unchanged into the executable task packet"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries that the task packet passes to CodeWriter and BuilderTester; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: test_criteria
            type: string[]
            required: true
            description: "Selected test or verification criteria for this step; describe a discriminating behavior oracle only when an automated_test CheckSpec is selected."
            min_items: 1
          - name: verification_decision_ref
            type: object
            required: true
            description: "Stable reference and SHA-256 of the full unchanged task-level specialist decision; no mutable stored copy."
            object_fields:
              - {name: artifact_ref, type: string, required: true}
              - {name: sha256, type: string, required: true}
          - name: selected_check_ids
            type: string[]
            required: true
            description: "Selected CheckSpec IDs due for this task packet"
            validation: "An ordered unique subset resolving exactly once in the unchanged decision and covering the packet acceptance criteria and risks."
          - name: binding_obligation_refs
            type: object[]
            required: true
            description: "Exact applicable binding tuples due for this task packet"
            validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple; task-wide obligations remain due at their existing completion boundary."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether meaningful RED is active for this task packet."
            validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; otherwise false. Preserve the decision unchanged."
          - name: implementation_notes
            type: string[]
            required: true
            description: "Existing patterns, constraints, non-goals, or boundaries CodeWriter must follow"
          - name: verification_command
            type: string[]
            required: conditional
            condition: "selected_check_ids resolves exactly one matching command-based CheckSpec in the unchanged verification_decision"
            min_items: 1
            description: "Legacy singular projection of the sole matching CheckSpec.command.argv; its explicit cwd remains in the canonical CheckSpec. Omit for zero or multiple matching commands; non-command checks use their concrete procedure."
            validation: "When present, resolve exactly one selected CheckSpec by ID in the unchanged verification_decision and require exact equality with its literal command.argv. Execute item 0 directly and each remaining item as one literal argument; never flatten, misattribute, reconstruct shell text, or use a default cwd. Missing or ambiguous command context requires refresh or a blocked packet."
          - name: expected_success_signal
            type: string
            required: true
            description: "Observable pass signal for the selected command or non-command check"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence that must be recorded before the slice is VERIFIED"
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this step exactly"
          - name: boundary_reason
            type: object
            required: conditional
            condition: "implementation_steps has more than one item"
            description: "Concrete execution purpose; size or file/layer counts alone are insufficient."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [acceptance, ownership_context, prerequisite, recovery_rollout, binding_protocol]}
              - {name: reason, type: string, required: true}
          - name: execution
            type: object
            required: true
            description: "Only coordinator-owned progress on this same packet; worker DONE does not imply VERIFIED. Preserve historical evidence and spent repair counters across resume. Lane/actor execution stamps are immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline: the history row carrying stamp_baseline {evidence_refs, tdd_cycle_log_ref when present}, appended once with each first stamp (reason dispatch stamp baseline) or replacement (which also keeps replaced_stamps, reason stamp replaced by a newly admitted dispatch before start or old-actor evidence). A relabelled or stripped stamp blocks. Before then, only a newly admitted dispatch may replace a stamp."
            object_fields:
              - {name: state, type: enum, required: true, enum_values: [PENDING, RUNNING, VERIFIED, BLOCKED, INVALIDATED]}
              - {name: evidence_refs, type: "string[]", required: true}
              - {name: input_identity, type: object, required: true, description: "Separately resolved relevant-input identities; changes invalidate affected evidence and result-consuming dependents."}
              - name: tdd_cycle_log_ref
                type: string
                required: conditional
                condition: "tdd_applies is true and the actual canonical cycle_log has started"
                validation: "Actual retained assistant-tdd cycle identity; omit unstarted work. Starting RED updates execution without changing approved definition."
              - {name: history, type: "object[]", required: true}
              - {name: progress_guard_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Stable outcome guard identity; never derived from legacy recovery counters."}
              - {name: action_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Exact admitted semantic action identity."}
              - {name: action_admission_ref, type: string, required: conditional, condition: "A semantic action admission has been committed", description: "Retained admission reused by later stages of the same RUNNING action."}
              - {name: build_execution_lane, type: enum, required: conditional, enum_values: [direct_main, bounded_executor, separated_workers], condition: "The packet has been dispatched", description: "Admitted dispatch lane stamp written by admission; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - {name: execution_actor_id, type: string, required: conditional, condition: "The packet has been dispatched and its lane resolves an actual execution actor", description: "Admitted direct_main execution actor or writer actor stamp; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - name: recovery
                type: object
                required: false
                description: "Historical v14 observations only; preserve supplied facts without using them as continuation authority."
                object_fields:
                  - {name: attempt_count, type: int, required: true}
                  - {name: no_progress_count, type: int, required: true}


      - name: broad_split_rejection
        type: string
        required: true
        description: "Explicit proof that layer-only, module-only, folder-only, feature-only, setup-only, contract-only, and broad component-style splits were rejected unless they are verified deliverable artifact slices"
      - name: risks
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - name: description
            type: string
            required: true
          - name: mitigation
            type: string
            required: true
    on_missing_field: "Repair canonical packet boundaries; use Architect only for concrete design uncertainty"

  # ─────────────────────────────────────────────
  # Orchestrator → Architect (PLAN)
  # ─────────────────────────────────────────────
  - name: orchestrator_to_architect
    from: Orchestrator
    to: Architect
    phase: PLAN
    context_fields:
      - name: task_description
        type: string
        required: true
      - name: requirements_summary
        type: string
        required: true
        description: "Restated requirements from Discover phase"
      - name: verification_decision
        type: object
        required: true
        description: "Canonical assistant-verification producer artifact selected before Plan fixes verification obligations."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; Retain explicit reduced-testing scope/source, rationale, exclusions, omissions and stop rule through workers, verifier, review and resume; carry the canonical assessment alongside this decision; when an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row through planned packets/result updates and reconcile missing/stale applicable provenance against newest intent. Without an applicable instruction, ordinary assessments including empty scope_and_evidence_refs require no instruction row. The row claims no execution/check closure; expansion requires a distinct important uncovered failure and existing selection/approval. preserve its CheckSpec and TddChoice unchanged in the plan and every executable packet."
      - name: evidence_assessment
        type: object
        required: true
        description: "Canonical assistant-verification assessment carried from selection; it is planned until actual check results exist."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment. For an applicable explicit reduced-testing instruction, preserve its exact source-bearing row even when planned and in materialized packets/result updates; reconcile missing/stale applicable provenance against the newest instruction on resume. Without an applicable instruction, ordinary assessments including empty scope_and_evidence_refs require no row. The instruction row closes no check. A planned assessment is not result evidence and must be reassessed before Review."
      - name: tdd_mode
        type: boolean
        required: true
        description: "Workflow projection of the selected TddChoice."
        validation: "Equals verification_decision.tdd_choice.mode."
      - name: change_impact_evidence
        type: object
        required: conditional
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        description: "Current expanded common impact artifact for Architect planning."
        validation: "Preserves artifact_identity, phase, capture_ref, expected_context_ref, validator_result_ref, impact_scope, and status unchanged through task-packet planning; assessment_ref is carried only for pre-build or completion. Completion carries the actual review document pointer for rerun or receipt reuse."
        on_missing: re-dispatch
        object_fields:
          - {name: artifact_identity, type: string, required: true}
          - {name: phase, type: enum, required: true, enum_values: [discovery, pre_build, completion]}
          - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
          - {name: status, type: enum, required: true, enum_values: [valid]}
          - {name: capture_ref, type: string, required: true}
          - {name: expected_context_ref, type: string, required: true}
          - {name: assessment_ref, type: string, required: conditional, condition: "phase in [pre_build, completion]"}
          - {name: validator_result_ref, type: string, required: true}
          - name: review_projection_ref
            type: string
            required: conditional
            condition: "phase == completion"
            validation: "Completion carries the actual review document pointer for rerun or receipt reuse."
      - name: requirement_acceptance_map
        type: string
        required: true
        description: "Approved traceability spine with a sufficiency basis across requested intent, applicable authority, justified defaults, product assumptions, and unresolved choices; confirmed answers are in existing acceptance criteria before dependent implementation. Task packets and slices reference these requirement ids."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether task packets must carry Architecture Decision Pack commitments"
      - name: architecture_decision_pack_ref
        type: string
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Fresh typed Architecture Decision Pack reference"
        validation: "Resolves to the pack that owns the current selected design, design-pressure conclusions, semantic type decisions, quality scenarios, and review scope"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether executable task packets must carry existing-system behavior classifications"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome used to produce task packets"
        validation: "Equals the approved_feature_preparation_result input unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref used to produce task packets"
        validation: "Resolves to the current two-axis behavior/work classifications and their implementation/test evidence"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation used to produce task packets"
        validation: "Its three approved payload fields match feature_preparation_result.future_harness_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, then carries that enriched consumer object unchanged"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation used to produce task packets"
        validation: "Its two approved payload fields match feature_preparation_result.future_qa_acceptance_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and carries that enriched consumer object unchanged through the post-Build Code Reviewer then QA Evaluator lane"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: context_map
        type: string
        required: true
        description: "CodeMapper output — the Architect builds on this, not from scratch"
      - name: reuse_search
        type: object
        required: true
        description: "CodeMapper reuse-search result carried into task-packet planning"
        object_fields:
          - name: applicability
            type: enum
            required: true
            enum_values: [applicable, not_applicable]
          - name: applicability_reason
            type: string
            required: true
          - name: searches
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            min_items: 1
            object_fields:
              - name: query_or_path
                type: string
                required: true
              - name: scope
                type: string
                required: true
              - name: outcome
                type: string
                required: true
          - name: candidates
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            object_fields:
              - name: name
                type: string
                required: true
              - name: location
                type: string
                required: true
              - name: disposition
                type: enum
                required: true
                enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
              - name: rationale
                type: string
                required: true
          - name: no_candidate_reason
            type: string
            required: conditional
            condition: "applicability == applicable and candidates is empty"
          - name: decision
            type: enum
            required: conditional
            condition: "applicability == applicable"
            enum_values: [reuse, extend, new, intentional_duplicate]
          - name: decision_rationale
            type: string
            required: conditional
            condition: "applicability == applicable"
          - name: divergence_control
            type: string
            required: conditional
            condition: "decision == intentional_duplicate"
      - name: explorer_findings
        type: string
        required: false
        description: "Explorer output if available (large/mega tasks)"
      - name: constraints
        type: string[]
        required: true
        description: "All accumulated constraints"
      - name: search_mode
        type: enum
        required: false
        enum_values: [none, lightweight, candidate_search]
        description: "Whether planning should use one path, lightweight options, or Candidate Search"
      - name: candidate_search_summary
        type: string
        required: false
        condition: "search_mode == candidate_search"
        description: "Goal tree summary, selected candidate, scoring rationale, archive location, and any plan_deviation status"
      - name: implementation_steps
        type: object[]
        required: true
        description: "Canonical ordered packets; one coherent increment defaults to one packet. Stored Plan keeps specialist references; worker projections materialize unchanged decisions. Optional display summaries may exist only for human readability and cannot replace exact packet and files_to_* fields."
        min_items: 1
        object_fields:
          - name: writer_selection
            type: object
            required: conditional
            condition: "new Claude or Codex writer dispatch; legacy packets and Gemini native fallback may omit"
            description: "Orchestrator-owned concrete Claude or Codex writer choice; Architect proposals require Orchestrator validation."
            validation: "Packet selection is authoritative when supplied; conflicting inline selection blocks dispatch. Old packets omitting this object remain valid with intelligent compatibility semantics. Before dispatch, the Orchestrator resolves actual current evidence, not merely nonempty strings or self-asserted labels. Never select by edit size, file type/count, or simple labels."
            on_missing: fail
            object_fields:
              - name: agent
                type: enum
                required: true
                enum_values: [intelligent-writer, mechanical-writer]
                description: "Normal new Claude or Codex dispatch identity; explicit legacy code-writer and bootstrap identities are recorded separately."
                on_missing: fail
              - name: rationale
                type: string
                required: true
                description: "Reason tied to remaining judgment and consequences; intelligent-writer is the default."
                on_missing: fail
              - name: mechanical_eligibility
                type: object
                required: conditional
                condition: "agent == mechanical-writer"
                description: "All four evidence-backed eligibility conditions; unresolved semantic, grader, oracle or compatibility judgment cannot qualify."
                validation: "Each ref resolves to actual applicable current packet, approved preparation, source or selected-check evidence. Independently fixed expectations cannot be chosen by the mechanical writer. Evidence covers BOTH tests and implementation: fully specified cases, expected values/oracles, negative cases, assertion/fixture patterns and implementation recipe; unresolved test judgment requires intelligent-writer. Stale or missing evidence stops dependent mutations and returns truthful status, blocker evidence and all actual partial changes."
                on_missing: fail
                object_fields:
                  - {name: recipe_or_example_ref, type: string, required: true, description: "Concrete approved applicable recipe, exact wording or transformation example", on_missing: fail}
                  - {name: resolved_decisions_ref, type: string, required: true, description: "Resolved semantic, edge-case and compatibility decisions", on_missing: fail}
                  - {name: scope_and_dependencies_ref, type: string, required: true, description: "Understood ownership, scope, dependencies and baseline assumptions", on_missing: fail}
                  - {name: correctness_expectations_ref, type: string, required: true, description: "Independently fixed expectations checking actual correctness", on_missing: fail}
          - name: packet_id
            type: string
            required: true
            description: "Unique descriptive path-safe canonical packet identity; never ordinal-only. All consumers resolve implementation_steps exactly once."
          - name: name
            type: string
            required: true
            description: "Human-readable task packet name passed directly as current_task_packet.name"
          - name: description
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
            description: "Observable increment owned by this packet"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "Deliverable owned by this packet"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Requirement Acceptance Map ids implemented by this packet"
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Fresh Architecture Decision Pack reference carried into this executable packet"
            validation: "Resolves to the selected design's owned boundary, design-pressure checks, Type Ledger, quality verification, and deviation conditions"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref carried unchanged into this executable packet"
            validation: "Resolves to the classifications and implementation implications this packet implements"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan handoff unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, then activates the existing pre-Build harness entry gate"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: red_check_id
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals the sole ID in selected_check_ids intersect applicable_check_ids; multiple IDs require packet splitting. Resolve its exact command.argv and command.cwd in the unchanged CheckSpec."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact literal command.argv for red_check_id; never shell reconstruction."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact explicit CheckSpec command.cwd."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals meaningful_failure for red_check_id in the unchanged CheckSpec; planned oracle only, never actual RED evidence."
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files CodeWriter is expected to create for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files CodeWriter is expected to modify for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets for execution only: BuilderTester executes and diagnoses selected checks; CodeWriter owns test authoring listed in files_to_create and files_to_modify. Use an empty array only when no test file applies"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this packet"
          - name: depends_on
            type: string[]
            required: true
            description: "Approved slice dependencies"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Observable behavior this task packet must deliver"
          - name: reuse_search
            type: object
            required: true
            description: "CodeMapper reuse-search result carried unchanged into the executable task packet"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries that the task packet passes to CodeWriter and BuilderTester; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: test_criteria
            type: string[]
            required: true
            description: "Selected test or verification criteria for this step; describe a discriminating behavior oracle only when an automated_test CheckSpec is selected."
            min_items: 1
          - name: verification_decision_ref
            type: object
            required: true
            description: "Stable reference and SHA-256 of the full unchanged task-level specialist decision; no mutable stored copy."
            object_fields:
              - {name: artifact_ref, type: string, required: true}
              - {name: sha256, type: string, required: true}
          - name: selected_check_ids
            type: string[]
            required: true
            description: "Selected CheckSpec IDs due for this task packet"
            validation: "An ordered unique subset resolving exactly once in the unchanged decision and covering the packet acceptance criteria and risks."
          - name: binding_obligation_refs
            type: object[]
            required: true
            description: "Exact applicable binding tuples due for this task packet"
            validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple; task-wide obligations remain due at their existing completion boundary."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether meaningful RED is active for this task packet."
            validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; otherwise false. Preserve the decision unchanged."
          - name: implementation_notes
            type: string[]
            required: true
            description: "Existing patterns, constraints, non-goals, or boundaries CodeWriter must follow"
          - name: verification_command
            type: string[]
            required: conditional
            condition: "selected_check_ids resolves exactly one matching command-based CheckSpec in the unchanged verification_decision"
            min_items: 1
            description: "Legacy singular projection of the sole matching CheckSpec.command.argv; its explicit cwd remains in the canonical CheckSpec. Omit for zero or multiple matching commands; non-command checks use their concrete procedure."
            validation: "When present, resolve exactly one selected CheckSpec by ID in the unchanged verification_decision and require exact equality with its literal command.argv. Execute item 0 directly and each remaining item as one literal argument; never flatten, misattribute, reconstruct shell text, or use a default cwd. Missing or ambiguous command context requires refresh or a blocked packet."
          - name: expected_success_signal
            type: string
            required: true
            description: "Observable pass signal for the selected command or non-command check"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence that must be recorded before the slice is VERIFIED"
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this step exactly"
          - name: boundary_reason
            type: object
            required: conditional
            condition: "implementation_steps has more than one item"
            description: "Concrete execution purpose; size or file/layer counts alone are insufficient."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [acceptance, ownership_context, prerequisite, recovery_rollout, binding_protocol]}
              - {name: reason, type: string, required: true}
          - name: execution
            type: object
            required: true
            description: "Only coordinator-owned progress on this same packet; worker DONE does not imply VERIFIED. Preserve historical evidence and spent repair counters across resume. Lane/actor execution stamps are immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline: the history row carrying stamp_baseline {evidence_refs, tdd_cycle_log_ref when present}, appended once with each first stamp (reason dispatch stamp baseline) or replacement (which also keeps replaced_stamps, reason stamp replaced by a newly admitted dispatch before start or old-actor evidence). A relabelled or stripped stamp blocks. Before then, only a newly admitted dispatch may replace a stamp."
            object_fields:
              - {name: state, type: enum, required: true, enum_values: [PENDING, RUNNING, VERIFIED, BLOCKED, INVALIDATED]}
              - {name: evidence_refs, type: "string[]", required: true}
              - {name: input_identity, type: object, required: true, description: "Separately resolved relevant-input identities; changes invalidate affected evidence and result-consuming dependents."}
              - name: tdd_cycle_log_ref
                type: string
                required: conditional
                condition: "tdd_applies is true and the actual canonical cycle_log has started"
                validation: "Actual retained assistant-tdd cycle identity; omit unstarted work. Starting RED updates execution without changing approved definition."
              - {name: history, type: "object[]", required: true}
              - {name: progress_guard_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Stable outcome guard identity; never derived from legacy recovery counters."}
              - {name: action_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Exact admitted semantic action identity."}
              - {name: action_admission_ref, type: string, required: conditional, condition: "A semantic action admission has been committed", description: "Retained admission reused by later stages of the same RUNNING action."}
              - {name: build_execution_lane, type: enum, required: conditional, enum_values: [direct_main, bounded_executor, separated_workers], condition: "The packet has been dispatched", description: "Admitted dispatch lane stamp written by admission; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - {name: execution_actor_id, type: string, required: conditional, condition: "The packet has been dispatched and its lane resolves an actual execution actor", description: "Admitted direct_main execution actor or writer actor stamp; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - name: recovery
                type: object
                required: false
                description: "Historical v14 observations only; preserve supplied facts without using them as continuation authority."
                object_fields:
                  - {name: attempt_count, type: int, required: true}
                  - {name: no_progress_count, type: int, required: true}


    return_fields:
      - name: architecture_decision_pack_update
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive] and refreshed source evidence changes the Pack"
        description: "Mergeable canonical Architecture Decision Pack update/ref returned when PLAN refreshes source evidence"
        validation: "References the complete refreshed canonical Pack and records its source Pack, freshness basis, changed source-backed sections, evidence refs, and independent challenge evidence when mode=review_intensive"
        on_missing: re-dispatch
        object_fields:
          - name: source_pack_ref
            type: string
            required: true
          - name: updated_pack_ref
            type: string
            required: true
            description: "Reference to the complete refreshed canonical Pack"
          - name: freshness_basis
            type: string
            required: true
          - name: changed_sections
            type: string[]
            required: true
            min_items: 1
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: merge_action
            type: enum
            required: true
            enum_values: [replace_current_pack]
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, patterns, or searches that support the blueprint"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before planning can continue"
      - name: deviation_details
        type: string
        required: false
        condition: "status is DEVIATED"
        description: "What the blueprint had to change from the requested scope or approved direction"
      - name: candidate_search_result
        type: object
        required: false
        condition: "search_mode == candidate_search"
        description: "Pre-code candidate selection result matching workflow output contract fields: goal_tree, candidate_archive, scoring_rubric, selected_candidate, selection_reason, archive_location, and plan_deviation when applicable"
      - name: implementation_steps
        type: object[]
        required: true
        description: "Canonical ordered packets; one coherent increment defaults to one packet. Stored Plan keeps specialist references; worker projections materialize unchanged decisions. Optional display summaries may exist only for human readability and cannot replace exact packet and files_to_* fields."
        min_items: 1
        object_fields:
          - name: writer_selection
            type: object
            required: conditional
            condition: "new Claude or Codex writer dispatch; legacy packets and Gemini native fallback may omit"
            description: "Orchestrator-owned concrete Claude or Codex writer choice; Architect proposals require Orchestrator validation."
            validation: "Packet selection is authoritative when supplied; conflicting inline selection blocks dispatch. Old packets omitting this object remain valid with intelligent compatibility semantics. Before dispatch, the Orchestrator resolves actual current evidence, not merely nonempty strings or self-asserted labels. Never select by edit size, file type/count, or simple labels."
            on_missing: fail
            object_fields:
              - name: agent
                type: enum
                required: true
                enum_values: [intelligent-writer, mechanical-writer]
                description: "Normal new Claude or Codex dispatch identity; explicit legacy code-writer and bootstrap identities are recorded separately."
                on_missing: fail
              - name: rationale
                type: string
                required: true
                description: "Reason tied to remaining judgment and consequences; intelligent-writer is the default."
                on_missing: fail
              - name: mechanical_eligibility
                type: object
                required: conditional
                condition: "agent == mechanical-writer"
                description: "All four evidence-backed eligibility conditions; unresolved semantic, grader, oracle or compatibility judgment cannot qualify."
                validation: "Each ref resolves to actual applicable current packet, approved preparation, source or selected-check evidence. Independently fixed expectations cannot be chosen by the mechanical writer. Evidence covers BOTH tests and implementation: fully specified cases, expected values/oracles, negative cases, assertion/fixture patterns and implementation recipe; unresolved test judgment requires intelligent-writer. Stale or missing evidence stops dependent mutations and returns truthful status, blocker evidence and all actual partial changes."
                on_missing: fail
                object_fields:
                  - {name: recipe_or_example_ref, type: string, required: true, description: "Concrete approved applicable recipe, exact wording or transformation example", on_missing: fail}
                  - {name: resolved_decisions_ref, type: string, required: true, description: "Resolved semantic, edge-case and compatibility decisions", on_missing: fail}
                  - {name: scope_and_dependencies_ref, type: string, required: true, description: "Understood ownership, scope, dependencies and baseline assumptions", on_missing: fail}
                  - {name: correctness_expectations_ref, type: string, required: true, description: "Independently fixed expectations checking actual correctness", on_missing: fail}
          - name: packet_id
            type: string
            required: true
            description: "Unique descriptive path-safe canonical packet identity; never ordinal-only. All consumers resolve implementation_steps exactly once."
          - name: name
            type: string
            required: true
            description: "Human-readable task packet name passed directly as current_task_packet.name"
          - name: description
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
            description: "Observable increment owned by this packet"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "Deliverable owned by this packet"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Requirement Acceptance Map ids implemented by this packet"
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Fresh Architecture Decision Pack reference carried into this executable packet"
            validation: "Resolves to the selected design's owned boundary, design-pressure checks, Type Ledger, quality verification, and deviation conditions"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref carried unchanged into this executable packet"
            validation: "Resolves to the classifications and implementation implications this packet implements"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan handoff unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, then activates the existing pre-Build harness entry gate"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: red_check_id
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals the sole ID in selected_check_ids intersect applicable_check_ids; multiple IDs require packet splitting. Resolve its exact command.argv and command.cwd in the unchanged CheckSpec."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact literal command.argv for red_check_id; never shell reconstruction."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact explicit CheckSpec command.cwd."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals meaningful_failure for red_check_id in the unchanged CheckSpec; planned oracle only, never actual RED evidence."
          - name: files_to_create
