# Handoff Contracts
# Defines the data shape that flows between subagents.
# Think of these as API contracts between microservices — the producer must
# include all required fields, and the consumer must validate before using.
#
# Any agent dispatching a subagent MUST include the required context fields.
# Any subagent returning results MUST include the required output fields.
# If a required field is missing from the return, follow the on_missing action.

schema_version: "12.0"
contract: handoffs
skill: assistant-workflow

# ─────────────────────────────────────────────
# Worker Status Protocol
# ─────────────────────────────────────────────
worker_status_protocol:
  description: "CodeMapper, Explorer, Architect, CodeWriter, and BuilderTester returns include a compact status packet so the orchestrator can route Build-role results deterministically. Reviewer and QAEvaluator packet schemas are owned by assistant-review."
  statuses:
    - value: DONE
      meaning: "No known concerns; requested work completed within scope."
    - value: DONE_WITH_CONCERNS
      meaning: "Usable result, but follow-up risk or trade-off exists and is recorded."
    - value: NEEDS_CONTEXT
      meaning: "Orchestration must clarify missing information before the worker can proceed."
    - value: BLOCKED
      meaning: "Cannot proceed because an environment, dependency, permission, or tool issue prevents progress."
    - value: DEVIATED
      meaning: "The worker had to depart from the approved plan or requested scope; deviation evidence is required."
    - value: FAILED_VERIFICATION
      meaning: "Verification ran and failed; failure evidence is required."
  packet_rules:
    - "status is required on CodeMapper, Explorer, Architect, CodeWriter, and BuilderTester returns."
    - "evidence is required for CodeMapper, Explorer, Architect, and CodeWriter returns with DONE, DONE_WITH_CONCERNS, DEVIATED, or FAILED_VERIFICATION."
    - "verification.evidence is required for BuilderTester returns."
    - "open_questions is required for NEEDS_CONTEXT and BLOCKED."
    - "blocker_type and blocker_evidence are required for CodeWriter returns with NEEDS_CONTEXT, BLOCKED, or DEVIATED when implementation hits an unexpected blocker."
    - "deviation_details is required for Architect and CodeWriter returns with DEVIATED."
    - "CodeMapper and Explorer status values are limited to DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, and BLOCKED."
    - "Architect and CodeWriter status values also include DEVIATED."
    - "BuilderTester status values also include DEVIATED and FAILED_VERIFICATION."
    - "changed_files and files_changed are required with at least one item for CodeWriter returns with DONE, DONE_WITH_CONCERNS, or DEVIATED; they may be omitted or empty for NEEDS_CONTEXT/BLOCKED returns before file changes occur."
    - "verification is required for BuilderTester returns; if status is NEEDS_CONTEXT or BLOCKED before verification runs, return result not_run with concise blocker evidence."

# ─────────────────────────────────────────────
# Typed Artifact Reference Protocol
# ─────────────────────────────────────────────
artifact_reference_protocol:
  description: "Typed Artifact Reference entries are the compact producer/consumer ledger for harness task packets and worker returns; use them instead of ad hoc string refs when passing artifacts between agents."
  required_fields: [artifact_id, artifact_type, producer, consumer, location_ref, schema_or_contract, validation_status, summary]
  artifact_types: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
  validation_statuses: [pending, valid, invalid, stale, not_applicable]
  packet_rules:
    - "Artifact Reference entries must include artifact_id, artifact_type, producer, consumer, location_ref, schema_or_contract, validation_status, and summary."
    - "location_ref is the typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable external artifact ref."
    - "Producer responsibility: create or update the artifact, assign artifact_id, set artifact_type, location_ref, schema_or_contract, validation_status, and summary."
    - "Consumer responsibility: validate schema_or_contract and validation_status before relying on location_ref; stale, invalid, or missing refs block phase advancement or trigger re-dispatch."
    - "CodeWriter and BuilderTester task packets receive artifact_refs for the Architecture Decision Pack, Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, Pivot/Restart Decision, changed files, verification evidence, and plan deviation refs when applicable."
    - "CodeWriter returns produced artifact_refs for changed files and plan deviation refs when applicable."
    - "BuilderTester returns validated artifact_refs for verification evidence and runtime-artifact validation."

# ─────────────────────────────────────────────
# Orchestrator → CodeMapper
# ─────────────────────────────────────────────
handoffs:

  - name: orchestrator_to_code_mapper
    from: Orchestrator
    to: CodeMapper
    phase: DISCOVER
    context_fields:
      - name: task_description
        type: string
        required: true
        description: "What the task is about — scopes the mapping"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Preparation basis discriminator retained during implementation discovery"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining implementation discovery"
        validation: "Equals the approved input result unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: task_type
        type: enum
        required: true
        enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
        description: "Triage task category used to focus mapping"
      - name: risk_tier
        type: enum
        required: true
        enum_values: [low, moderate, high, critical]
        description: "Triage risk tier used to scale discovery depth"
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Triage architecture mode; not_applicable keeps the mapper to ordinary structural mapping"
      - name: architecture_design_trigger_reasons
        type: string[]
        required: true
        min_items: 1
        description: "Concrete observed architecture triggers or not-applicable rationale that bound the mapper's evidence collection"
      - name: required_gates
        type: string[]
        required: true
        description: "Gate packs selected during Triage"
      - name: target_area
        type: string
        required: false
        description: "Specific module/directory to focus on, if known"
      - name: candidate_scope_scan
        type: object
        required: true
        description: "Triage's quick scope scan; focuses mapping but does not replace CodeMapper discovery"
        object_fields:
          - name: likely_touched_paths
            type: string[]
            required: true
          - name: symbols_or_terms_searched
            type: string[]
            required: true
          - name: adjacent_surfaces
            type: string[]
            required: true
          - name: confidence
            type: enum
            required: true
            enum_values: [low, medium, high]
          - name: unknowns
            type: string[]
            required: true
      - name: constraints
        type: string[]
        required: false
        description: "Boundaries the mapper should note (e.g., 'ignore tests/')"
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "File paths or searches that support the map"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before discovery can continue"
      - name: project_type
        type: string
        required: true
        description: "Detected project type (e.g., 'ASP.NET Core Web API', 'Blazor WASM', 'Console app')"
        validation: "Non-empty, specific enough to inform architecture decisions"
      - name: entry_points
        type: object[]
        required: true
        description: "Main entry points relevant to the task"
        min_items: 1
        object_fields:
          - name: file
            type: string
            required: true
          - name: description
            type: string
            required: true
      - name: key_interfaces
        type: object[]
        required: true
        description: "Interfaces and contracts relevant to the task"
        object_fields:
          - name: name
            type: string
            required: true
          - name: file
            type: string
            required: true
          - name: purpose
            type: string
            required: true
      - name: conventions
        type: object[]
        required: true
        description: "Coding conventions observed in the codebase"
        min_items: 1
        object_fields:
          - name: pattern
            type: string
            required: true
          - name: example
            type: string
            required: true
      - name: dependencies
        type: string[]
        required: true
        description: "External packages and frameworks in use"
      - name: file_map
        type: object[]
        required: true
        description: "Files relevant to the task with their roles"
        min_items: 1
        object_fields:
          - name: path
            type: string
            required: true
          - name: role
            type: string
            required: true
      - name: test_locations
        type: object[]
        required: true
        description: "Where tests live for the relevant areas"
        object_fields:
          - name: area
            type: string
            required: true
          - name: test_file
            type: string
            required: true
          - name: type
            type: enum
            required: true
            enum_values: [unit, integration, e2e]
      - name: references_checked
        type: object[]
        required: true
        description: "Behaviorally relevant references checked for the likely modified areas"
        min_items: 1
        object_fields:
          - name: path_or_query
            type: string
            required: true
            description: "File path, directory, symbol search, or explicit not-applicable surface"
          - name: relationship
            type: enum
            required: true
            enum_values: [caller, consumer, test, docs, contract, config, mirror, runtime, not_applicable, deferred]
          - name: outcome
            type: string
            required: true
            description: "What was found, why it matters, or why it is not applicable/deferred"
      - name: reuse_search
        type: object
        required: true
        description: "Bounded existing-capability search for rule-like changes; not_applicable records a concrete reason without search ceremony"
        object_fields:
          - name: applicability
            type: enum
            required: true
            enum_values: [applicable, not_applicable]
          - name: applicability_reason
            type: string
            required: true
          - name: searches
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            min_items: 1
            object_fields:
              - name: query_or_path
                type: string
                required: true
              - name: scope
                type: string
                required: true
              - name: outcome
                type: string
                required: true
          - name: candidates
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            object_fields:
              - name: name
                type: string
                required: true
              - name: location
                type: string
                required: true
              - name: disposition
                type: enum
                required: true
                enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
              - name: rationale
                type: string
                required: true
          - name: no_candidate_reason
            type: string
            required: conditional
            condition: "applicability == applicable and candidates is empty"
          - name: decision
            type: enum
            required: conditional
            condition: "applicability == applicable"
            enum_values: [reuse, extend, new, intentional_duplicate]
          - name: decision_rationale
            type: string
            required: conditional
            condition: "applicability == applicable"
          - name: divergence_control
            type: string
            required: conditional
            condition: "decision == intentional_duplicate"
      - name: context_map_markdown
        type: string
        required: true
        description: "Compact context map markdown for the orchestrator to persist to {agent_state_dir}/context-map.md when local state artifacts are configured and policy-allowed, or carry forward inline when file writes are unavailable"
      - name: architecture_mapping_evidence
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Evidence-only Architecture Decision Pack mapping; the mapper maps evidence, never designs. Omit this field when architecture_design_mode=not_applicable."
        validation: "Contains source-backed mapping evidence only. design_pressure_checks has exactly one entry per five concerns. semantic_type_inspection independently records candidates_found, inspected_empty, or unresolved with its own evidence or gap refs. representative_paths remains a separate producer-consumer mapping."
        on_missing: re-dispatch
        object_fields:
          - name: source_revision_or_context_ref
            type: string
            required: true
          - name: ownership_lifecycle_boundaries
            type: object[]
            required: true
            object_fields:
              - name: boundary
                type: string
                required: true
              - name: owner_or_unknown
                type: string
                required: true
              - name: lifecycle_or_data_flow
                type: string
                required: true
              - name: dependency_direction
                type: string
                required: true
              - name: status
                type: enum
                required: true
                enum_values: [observed, not_applicable, unresolved]
              - name: evidence_ref
                type: string
                required: true
          - name: design_pressure_checks
            type: object[]
            required: true
            min_items: 5
            max_items: 5
            validation: "Contains exactly one per five concerns: control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, and representative_path; every entry has status/evidence_or_gap/source_ref."
            object_fields:
              - name: concern
                type: enum
                required: true
                enum_values: [control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, representative_path]
              - name: status
                type: enum
                required: true
                enum_values: [observed, not_applicable, unresolved]
              - name: evidence_or_gap
                type: string
                required: true
              - name: source_ref
                type: string
                required: true
          - name: semantic_type_inspection
            type: object
            required: true
            validation: "Records one cohesive semantic inspection outcome. candidates_found requires non-empty candidates; inspected_empty records the inspected scope and evidence; unresolved records the gap and follow-up without borrowing a design-pressure status."
            object_fields:
              - name: outcome
                type: enum
                required: true
                enum_values: [candidates_found, inspected_empty, unresolved]
              - name: evidence_or_gap
                type: string
                required: true
              - name: source_refs
                type: string[]
                required: true
                min_items: 1
              - name: candidates
                type: object[]
                required: conditional
                condition: "outcome == candidates_found"
                min_items: 1
                validation: "Present only when outcome=candidates_found; each candidate is evidence-backed and does not select the design."
                object_fields:
                  - name: concept
                    type: string
                    required: true
                  - name: current_representation
                    type: string
                    required: true
                  - name: boundary
                    type: enum
                    required: true
                    enum_values: [domain_or_public_semantic_type, local_temporary, wire_or_storage, foreign_or_framework, no_domain_semantics]
                  - name: finding_kind
                    type: enum
                    required: true
                    enum_values: [semantic_type_candidate, primitive_exception]
                  - name: evidence_ref
                    type: string
                    required: true
          - name: representative_paths
            type: object[]
            required: true
            min_items: 0
            validation: "For the exactly one design_pressure_checks entry with concern=representative_path, status=observed requires at least one detailed producer-consumer path. status in [not_applicable, unresolved] requires an empty array and retains the reason in that pressure entry's evidence_or_gap/source_ref."
            object_fields:
              - name: producer
                type: string
                required: true
                validation: "Non-empty."
              - name: consumer
                type: string
                required: true
                validation: "Non-empty."
              - name: failure_or_cancellation
                type: string
                required: true
                validation: "Non-empty."
              - name: source_ref
                type: string
                required: true
                validation: "Non-empty."
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: unresolved_questions
            type: string[]
            required: true
    on_missing_field: "Re-dispatch CodeMapper with explicit request for the missing field"

  # ─────────────────────────────────────────────
  # Orchestrator → Explorer
  # ─────────────────────────────────────────────
  - name: orchestrator_to_explorer
    from: Orchestrator
    to: Explorer
    phase: DISCOVER
    context_fields:
      - name: task_description
        type: string
        required: true
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining implementation discovery"
        validation: "Equals the approved input result unchanged."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: focus_areas
        type: string[]
        required: true
        description: "Specific execution paths or behaviors to trace"
      - name: context_map
        type: string
        required: false
        description: "Output from CodeMapper if available — avoids re-exploring structure"
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, searches, or traces that support the findings"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before discovery can continue"
      - name: execution_paths
        type: object[]
        required: true
        description: "Traced paths through the code relevant to the task"
        object_fields:
          - name: trigger
            type: string
            required: true
            description: "What initiates this path (HTTP request, event, command, etc.)"
          - name: steps
            type: string[]
            required: true
            description: "Ordered list of method calls / service interactions"
          - name: side_effects
            type: string[]
            required: false
            description: "Database writes, API calls, events emitted"
      - name: design_decisions
        type: object[]
        required: true
        description: "Architectural choices and their rationale"
        object_fields:
          - name: decision
            type: string
            required: true
          - name: rationale
            type: string
            required: true
          - name: location
            type: string
            required: true
      - name: hidden_dependencies
        type: object[]
        required: false
        description: "Non-obvious coupling or dependencies"
        object_fields:
          - name: from
            type: string
            required: true
          - name: to
            type: string
            required: true
          - name: nature
            type: string
            required: true
            description: "What kind of dependency (runtime, config, convention, implicit)"
    on_missing_field: "Re-dispatch Explorer with specific questions about the missing area"

  # ─────────────────────────────────────────────
  # Orchestrator → Architect (DECOMPOSE)
  # ─────────────────────────────────────────────
  - name: orchestrator_to_architect_decompose
    from: Orchestrator
    to: Architect
    phase: DECOMPOSE
    context_fields:
      - name: task_description
        type: string
        required: true
        description: "What the task is about — scopes the decomposition"
      - name: requirements_summary
        type: string
        required: true
        description: "Restated requirements from Discover phase"
      - name: requirement_acceptance_map
        type: string
        required: true
        description: "Stable requirement ids, criteria, verification methods, assumptions, non-goals, and sufficiency basis across requested intent, applicable authority, justified defaults, product assumptions, and unresolved choices; confirmed answers are in existing acceptance criteria before dependent implementation."
      - name: verification_decision
        type: object
        required: true
        description: "Canonical assistant-verification decision supplied before Decompose so DC2 does not defer selection to Plan."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; preserve its CheckSpecs and TddChoice unchanged in each slice."
      - name: tdd_applies
        type: boolean
        required: true
        description: "Projection of the canonical task verification decision."
        validation: "Equals verification_decision.tdd_choice.mode."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether the Architect must consume a typed Architecture Decision Pack"
      - name: architecture_decision_pack_ref
        type: string
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Current Architecture Decision Pack reference; Architect consumes it rather than rediscovering its facts"
        validation: "Resolves to a fresh pack with boundaries, design-pressure checks, Type Ledger, quality scenarios, verification, and invalidation conditions"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether decomposition must preserve classifications from existing-system feature preparation"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining decomposition"
        validation: "Equals the approved_feature_preparation_result input unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref constraining decomposition"
        validation: "Resolves to the current two-axis behavior/work classifications and their implementation/test evidence"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation constraining decomposition"
        validation: "Its three approved payload fields match feature_preparation_result.future_harness_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, then carries that enriched consumer object unchanged"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation constraining decomposition"
        validation: "Its two approved payload fields match feature_preparation_result.future_qa_acceptance_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and carries that enriched consumer object unchanged through the post-Build Code Reviewer then QA Evaluator lane"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: context_map
        type: string
        required: true
        description: "CodeMapper output — Architect uses this to understand codebase boundaries"
      - name: explorer_findings
        type: string
        required: false
        description: "Explorer output if available (large/mega tasks)"
      - name: constraints
        type: string[]
        required: true
        description: "All accumulated constraints"
      - name: risk_tier
        type: enum
        required: true
        enum_values: [low, moderate, high, critical]
        description: "Triage risk tier used to choose smallest iterable slice boundaries and verification depth"
      - name: required_gates
        type: string[]
        required: true
        description: "Gate packs selected during Triage and carried into slice criteria"
      - name: task_size
        type: enum
        required: true
        enum_values: [medium, large, mega]
        description: "Determines slice depth; produce one or more smallest iterable slices and justify a single-slice manifest when correct"
      - name: search_mode
        type: enum
        required: false
        enum_values: [none, lightweight, candidate_search]
        description: "Whether decomposition should prepare for one path, lightweight options, or a Candidate Search archive"
      - name: candidate_search_summary
        type: string
        required: false
        condition: "search_mode == candidate_search"
        description: "Selected candidate, archive location, and constraints from references/candidate-search.md if Candidate Search already ran"
    return_fields:
      - name: architecture_decision_pack_update
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive] and refreshed source evidence changes the Pack"
        description: "Mergeable canonical Architecture Decision Pack update/ref returned when DECOMPOSE refreshes source evidence"
        validation: "References the complete refreshed canonical Pack and records its source Pack, freshness basis, changed source-backed sections, evidence refs, and independent challenge evidence when mode=review_intensive"
        on_missing: re-dispatch
        object_fields:
          - name: source_pack_ref
            type: string
            required: true
          - name: updated_pack_ref
            type: string
            required: true
            description: "Reference to the complete refreshed canonical Pack"
          - name: freshness_basis
            type: string
            required: true
          - name: changed_sections
            type: string[]
            required: true
            min_items: 1
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: merge_action
            type: enum
            required: true
            enum_values: [replace_current_pack]
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, patterns, or searches that support the decomposition"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before decomposition can continue"
      - name: deviation_details
        type: string
        required: false
        condition: "status is DEVIATED"
        description: "What the decomposition had to change from the requested scope or approved direction"
      - name: slice_manifest
        type: object[]
        required: true
        description: "Ordered list of smallest iterable slices. Layer-only, module-only, folder-only, feature-only, setup-only, contract-only, and broad component-style splits are invalid unless the slice itself produces a verified deliverable artifact."
        min_items: 1
        object_fields:
          - name: slice_id
            type: string
            required: true
            description: "Stable slice identifier used by Plan, Build, Review, and Document"
          - name: name
            type: string
            required: true
            description: "Short descriptive slice name"
          - name: observable_increment
            type: string
            required: true
            description: "The user-visible, tool-visible, or artifact-visible increment this slice delivers"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "The kind of deliverable produced by this slice"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Accepted requirement ids advanced by this slice"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Binary pass/fail statements for the slice"
            min_items: 1
          - name: verification_decision
            type: object
            required: true
            description: "Canonical decision supplied by the existing assistant-verification Analysis owner and carried into this slice before DC2."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision and equals context_fields.verification_decision; carry unchanged and do not select or rewrite it in Architect."
          - name: tdd_applies
            type: boolean
            required: true
            description: "Slice projection of the canonical TDD choice."
            validation: "Equals verification_decision.tdd_choice.mode and context_fields.tdd_applies."
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files to create; empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files to modify; empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets for this slice; empty array only with a stated non-test verification path"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this slice so no unverified setup-only slice is needed"
          - name: depends_on
            type: string[]
            required: true
            description: "Slice ids that must be VERIFIED first, or empty array if independent"
          - name: verification_command
            type: string[]
            required: false
            min_items: 1
            description: "Optional direct-execution argv when a command is already selected; Plan binds the final decision and non-command procedure."
            validation: "When present, item 0 is the executable and each remaining item is one literal argument; no shell-form command string, redirection, pipe, or implicit shell parsing."
          - name: expected_success_signal
            type: string
            required: true
            description: "Specific pass signal for verification"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence fields or artifacts to record before marking the slice VERIFIED"
            min_items: 1
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this slice exactly"
      - name: single_slice_rationale
        type: string
        required: conditional
        condition: "required when slice_manifest has exactly one slice"
        description: "Why one slice is the smallest correct iterable decomposition"
      - name: broad_split_rejection
        type: string
        required: true
        description: "Explicit proof that layer-only, module-only, folder-only, feature-only, setup-only, contract-only, and broad component-style splits were rejected unless they are verified deliverable artifact slices"
      - name: risks
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - name: description
            type: string
            required: true
          - name: mitigation
            type: string
            required: true
    on_missing_field: "Re-dispatch Architect requesting the missing strict slice decomposition field"

  # ─────────────────────────────────────────────
  # Orchestrator → Architect (PLAN)
  # ─────────────────────────────────────────────
  - name: orchestrator_to_architect
    from: Orchestrator
    to: Architect
    phase: PLAN
    context_fields:
      - name: task_description
        type: string
        required: true
      - name: requirements_summary
        type: string
        required: true
        description: "Restated requirements from Discover phase"
      - name: verification_decision
        type: object
        required: true
        description: "Canonical assistant-verification producer artifact selected before Plan fixes verification obligations."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; preserve its CheckSpec and TddChoice unchanged in the plan and every executable packet."
      - name: evidence_assessment
        type: object
        required: true
        description: "Canonical assistant-verification assessment carried from selection; it is planned until actual check results exist."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment. A planned assessment is not result evidence and must be reassessed before Review."
      - name: tdd_mode
        type: boolean
        required: true
        description: "Workflow projection of the selected TddChoice."
        validation: "Equals verification_decision.tdd_choice.mode."
      - name: change_impact_evidence
        type: object
        required: conditional
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        description: "Current expanded common impact artifact for Architect planning."
        validation: "Preserves artifact_identity, phase, capture_ref, expected_context_ref, validator_result_ref, impact_scope, and status unchanged through task-packet planning; assessment_ref is carried only for pre-build or completion. Completion carries the actual review document pointer for rerun or receipt reuse."
        on_missing: re-dispatch
        object_fields:
          - {name: artifact_identity, type: string, required: true}
          - {name: phase, type: enum, required: true, enum_values: [discovery, pre_build, completion]}
          - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
          - {name: status, type: enum, required: true, enum_values: [valid]}
          - {name: capture_ref, type: string, required: true}
          - {name: expected_context_ref, type: string, required: true}
          - {name: assessment_ref, type: string, required: conditional, condition: "phase in [pre_build, completion]"}
          - {name: validator_result_ref, type: string, required: true}
          - name: review_projection_ref
            type: string
            required: conditional
            condition: "phase == completion"
            validation: "Completion carries the actual review document pointer for rerun or receipt reuse."
      - name: requirement_acceptance_map
        type: string
        required: true
        description: "Approved traceability spine with a sufficiency basis across requested intent, applicable authority, justified defaults, product assumptions, and unresolved choices; confirmed answers are in existing acceptance criteria before dependent implementation. Task packets and slices reference these requirement ids."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether task packets must carry Architecture Decision Pack commitments"
      - name: architecture_decision_pack_ref
        type: string
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        description: "Fresh typed Architecture Decision Pack reference"
        validation: "Resolves to the pack that owns the current selected design, design-pressure conclusions, semantic type decisions, quality scenarios, and review scope"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether executable task packets must carry existing-system behavior classifications"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome used to produce task packets"
        validation: "Equals the approved_feature_preparation_result input unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref used to produce task packets"
        validation: "Resolves to the current two-axis behavior/work classifications and their implementation/test evidence"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation used to produce task packets"
        validation: "Its three approved payload fields match feature_preparation_result.future_harness_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, then carries that enriched consumer object unchanged"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation used to produce task packets"
        validation: "Its two approved payload fields match feature_preparation_result.future_qa_acceptance_obligation exactly; it adds exactly one feature_preparation_evidence_ref binding for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and carries that enriched consumer object unchanged through the post-Build Code Reviewer then QA Evaluator lane"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: context_map
        type: string
        required: true
        description: "CodeMapper output — the Architect builds on this, not from scratch"
      - name: reuse_search
        type: object
        required: true
        description: "CodeMapper reuse-search result carried into task-packet planning"
        object_fields:
          - name: applicability
            type: enum
            required: true
            enum_values: [applicable, not_applicable]
          - name: applicability_reason
            type: string
            required: true
          - name: searches
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            min_items: 1
            object_fields:
              - name: query_or_path
                type: string
                required: true
              - name: scope
                type: string
                required: true
              - name: outcome
                type: string
                required: true
          - name: candidates
            type: object[]
            required: conditional
            condition: "applicability == applicable"
            object_fields:
              - name: name
                type: string
                required: true
              - name: location
                type: string
                required: true
              - name: disposition
                type: enum
                required: true
                enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
              - name: rationale
                type: string
                required: true
          - name: no_candidate_reason
            type: string
            required: conditional
            condition: "applicability == applicable and candidates is empty"
          - name: decision
            type: enum
            required: conditional
            condition: "applicability == applicable"
            enum_values: [reuse, extend, new, intentional_duplicate]
          - name: decision_rationale
            type: string
            required: conditional
            condition: "applicability == applicable"
          - name: divergence_control
            type: string
            required: conditional
            condition: "decision == intentional_duplicate"
      - name: explorer_findings
        type: string
        required: false
        description: "Explorer output if available (large/mega tasks)"
      - name: constraints
        type: string[]
        required: true
        description: "All accumulated constraints"
      - name: search_mode
        type: enum
        required: false
        enum_values: [none, lightweight, candidate_search]
        description: "Whether planning should use one path, lightweight options, or Candidate Search"
      - name: candidate_search_summary
        type: string
        required: false
        condition: "search_mode == candidate_search"
        description: "Goal tree summary, selected candidate, scoring rationale, archive location, and any plan_deviation status"
      - name: slice_manifest
        type: object[]
        required: conditional
        condition: "size in [medium, large, mega] or the approved plan will use executable task packets"
        description: "Strict slice manifest from DECOMPOSE phase — Architect consumes these boundaries directly and must not rediscover or broaden them"
        on_missing: re-dispatch
        notes: "Block Architect dispatch; Orchestrator must supply the approved DECOMPOSE slice_manifest or re-run DECOMPOSE before Plan."
        object_fields:
          - name: slice_id
            type: string
            required: true
            description: "Build sequence key — plan packets must use this id"
          - name: name
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
          - name: acceptance_criteria
            type: string[]
            required: true
          - name: verification_decision
            type: object
            required: true
            description: "The unchanged canonical assistant-verification producer artifact for this approved slice."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision and equals the top-level Plan decision."
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether this slice participates in the active TDD choice."
            validation: "Equals verification_decision.tdd_choice.mode; false never creates RED duties."
          - name: files_to_create
            type: string[]
            required: true
          - name: files_to_modify
            type: string[]
            required: true
          - name: files_to_test
            type: string[]
            required: true
          - name: enabling_changes_included
            type: string[]
            required: true
          - name: depends_on
            type: string[]
            required: true
            description: "Slice ids that must be VERIFIED first"
          - name: verification_command
            type: string[]
            required: false
            min_items: 1
            description: "Optional direct-execution argv; the selected decision supplies a concrete procedure when no command applies."
            validation: "When present, item 0 is the executable and each remaining item is one literal argument; no shell-form command string, redirection, pipe, or implicit shell parsing."
          - name: expected_success_signal
            type: string
            required: true
          - name: evidence_to_record
            type: string[]
            required: true
          - name: deviation_rollback_rule
            type: string
            required: true
    return_fields:
      - name: architecture_decision_pack_update
        type: object
        required: conditional
        condition: "architecture_design_mode in [lightweight, required, review_intensive] and refreshed source evidence changes the Pack"
        description: "Mergeable canonical Architecture Decision Pack update/ref returned when PLAN refreshes source evidence"
        validation: "References the complete refreshed canonical Pack and records its source Pack, freshness basis, changed source-backed sections, evidence refs, and independent challenge evidence when mode=review_intensive"
        on_missing: re-dispatch
        object_fields:
          - name: source_pack_ref
            type: string
            required: true
          - name: updated_pack_ref
            type: string
            required: true
            description: "Reference to the complete refreshed canonical Pack"
          - name: freshness_basis
            type: string
            required: true
          - name: changed_sections
            type: string[]
            required: true
            min_items: 1
          - name: evidence_refs
            type: string[]
            required: true
            min_items: 1
          - name: merge_action
            type: enum
            required: true
            enum_values: [replace_current_pack]
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED]
        description: "Worker status packet result"
      - name: evidence
        type: object[]
        required: true
        description: "Files, patterns, or searches that support the blueprint"
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before planning can continue"
      - name: deviation_details
        type: string
        required: false
        condition: "status is DEVIATED"
        description: "What the blueprint had to change from the requested scope or approved direction"
      - name: candidate_search_result
        type: object
        required: false
        condition: "search_mode == candidate_search"
        description: "Pre-code candidate selection result matching workflow output contract fields: goal_tree, candidate_archive, scoring_rubric, selected_candidate, selection_reason, archive_location, and plan_deviation when applicable"
      - name: implementation_steps
        type: object[]
        required: true
        description: "Ordered executable task packets with exact slice_id, create/modify/test file lists, acceptance criteria, the unchanged verification_decision and conditional TDD choice, and exact command argv or concrete selected-check procedures. Optional display summaries may exist only for human readability; they cannot satisfy or replace exact slice and files_to_* fields."
        min_items: 1
        object_fields:
          - name: order
            type: int
            required: true
          - name: slice_id
            type: string
            required: true
            description: "The approved Decompose slice id this packet implements"
          - name: slice_name
            type: string
            required: true
            description: "The approved Decompose slice name this packet implements"
          - name: name
            type: string
            required: true
            description: "Human-readable task packet name passed directly as current_task_packet.name"
          - name: task_id
            type: string
            required: false
            description: "Optional provider-local packet id; slice_id remains the execution boundary for medium+ work"
          - name: description
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
            description: "The approved slice observable increment"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "The approved slice deliverable type"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Requirement Acceptance Map ids implemented by this packet"
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Fresh Architecture Decision Pack reference carried into this executable packet"
            validation: "Resolves to the selected design's owned boundary, design-pressure checks, Type Ledger, quality verification, and deviation conditions"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref carried unchanged into this executable packet"
            validation: "Resolves to the classifications and implementation implications this packet implements"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan handoff unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, then activates the existing pre-Build harness entry gate"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files CodeWriter is expected to create for this task packet; use an empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files CodeWriter is expected to modify for this task packet; use an empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets BuilderTester is expected to create, modify, or run for this task packet; use an empty array only when no test file applies"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this slice"
          - name: depends_on
            type: string[]
            required: true
            description: "Approved slice dependencies"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Observable behavior this task packet must deliver"
          - name: reuse_search
            type: object
            required: true
            description: "CodeMapper reuse-search result carried unchanged into the executable task packet"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries that the task packet passes to CodeWriter and BuilderTester; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: test_criteria
            type: string[]
            required: true
            description: "Selected test or verification criteria for this step; describe a discriminating behavior oracle only when an automated_test CheckSpec is selected."
            min_items: 1
          - name: verification_decision
            type: object
            required: true
            description: "Canonical assistant-verification decision consumed by this task packet."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision and preserves its selected scope and CheckSpec entries unchanged."
          - name: evidence_assessment
            type: object
            required: true
            description: "Current canonical assessment carried into both Build lanes; planned evidence is not execution evidence."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment; refresh from actual selected-check results before Review."
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether meaningful RED is active for this task packet."
            validation: "Equals verification_decision.tdd_choice.mode."
          - name: implementation_notes
            type: string[]
            required: true
            description: "Existing patterns, constraints, non-goals, or boundaries CodeWriter must follow"
          - name: verification_command
            type: string[]
            required: conditional
            condition: "the selected CheckSpec has a command to execute"
            min_items: 1
            description: "Exact direct-execution argv when the selected check uses a command; non-command checks use the concrete procedure in CheckSpec.check_ref_or_method."
            validation: "When present, item 0 is the executable and remaining items are literal arguments; no shell-form command string."
          - name: expected_success_signal
            type: string
            required: true
            description: "Observable pass signal for the selected command or non-command check"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence that must be recorded before the slice is VERIFIED"
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this step exactly"
      - name: files_to_create
        type: object[]
        required: false
        object_fields:
          - name: path
            type: string
            required: true
          - name: purpose
            type: string
            required: true
          - name: template
            type: string
            required: false
            description: "Existing file to use as structural reference"
      - name: files_to_modify
        type: object[]
        required: true
        object_fields:
          - name: path
            type: string
            required: true
            validation: "File must exist in the project"
          - name: change_description
            type: string
            required: true
      - name: interfaces
        type: object[]
        required: false
        description: "New interfaces or contracts to define"
        object_fields:
          - name: name
            type: string
            required: true
          - name: file
            type: string
            required: true
          - name: methods
            type: string[]
            required: true
      - name: test_plan
        type: object[]
        required: conditional
        condition: "at least one slice's canonical verification_decision selects method == automated_test"
        description: "Automated test plans are required only for slices with selected automated_test CheckSpecs; omit them for slices whose selected methods are non-test."
        min_items: 1
        object_fields:
          - name: slice_id
            type: string
            required: true
          - name: test_type
            type: enum
            required: true
            enum_values: [unit, integration, e2e]
          - name: description
            type: string
            required: true
      - name: risks
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - name: description
            type: string
            required: true
          - name: mitigation
            type: string
            required: true
    on_missing_field: "Re-dispatch Architect requesting the specific missing section"

  # ─────────────────────────────────────────────
  # Orchestrator → CodeWriter
  # ─────────────────────────────────────────────
  - name: orchestrator_to_code_writer
    from: Orchestrator
    to: CodeWriter
    phase: BUILD
    context_fields:
      - name: change_impact_applicability
        type: object
        required: conditional
        condition: "the current slice has a behavior-bearing change or locality/shared/unresolved impact decision"
        validation: "impact_scope and applicability_reason are carried unchanged. local carries causal evidence and does not require expanded checker refs; shared/unresolved or explicit expansion carries the matching expanded artifact envelope."
      - name: change_impact_evidence
        type: object
        required: conditional
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        description: "Current resolved pre-build artifact envelope that authorizes this CodeWriter mutation dispatch."
        validation: "The common checker was freshly run, or was rerun with --receipt validator_result_ref against the referenced capture_ref, independent expected_context_ref, and assessment_ref for a current valid pre_build result that resolves artifact_identity against the current task packet; impact_scope and status remain bound unchanged. A status or result ref alone is insufficient. The CodeWriter may not use discovery or completion evidence as mutation authorization."
        object_fields:
          - {name: artifact_identity, type: string, required: true}
          - {name: phase, type: enum, required: true, enum_values: [pre_build]}
          - {name: capture_ref, type: string, required: true}
          - {name: expected_context_ref, type: string, required: true}
          - {name: assessment_ref, type: string, required: true}
          - {name: validator_result_ref, type: string, required: true}
          - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
          - {name: status, type: enum, required: true, enum_values: [valid]}
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [bounded_executor, separated_workers]
        description: "bounded_executor owns focused RED/GREEN/edit/test; separated_workers consumes BuilderTester RED evidence and returns GREEN for independent verification"
      - name: plan
        type: string
        required: true
        description: "Approved plan or compact inline execution scope — the CodeWriter follows this exactly"
        validation: "Carries the fresh sufficiency basis and accepted criteria; confirmed answers appear in existing acceptance criteria before dependent implementation, and unresolved material product choices or controlling-source gaps/conflicts are not guessed."
      - name: current_step
        type: int
        required: true
        description: "Which step(s) to implement"
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether the current task packet is constrained by an Architecture Decision Pack"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether the Build packet is constrained by existing-system feature-preparation evidence"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining this Build handoff"
        validation: "Equals the approved_feature_preparation_result input and current task packet unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref constraining this Build handoff"
        validation: "Resolves to the same evidence ref carried by the applicable inline or executable task packet"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation constraining this Build handoff"
        validation: "Matches the enriched approved input and task packet unchanged: the three original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; harness_capable=true and the pre-Build Done Contract/Harness Recipe gate are already satisfied"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation constraining this Build handoff"
        validation: "Matches the enriched approved input and task packet unchanged: the two original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; qa_evaluation_mode=required and the existing post-Build Code Reviewer then QA Evaluator lane is required"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: current_task_packet
        type: object
        required: conditional
        condition: "current build step executes a slice or the approved plan uses executable task packets"
        description: "Executable task packet for the current build step; overrides any ambiguous prose in the plan"
        on_missing: fail
        notes: "Block CodeWriter dispatch; Orchestrator must select the matching implementation_steps packet or re-dispatch Architect to produce executable task packets before Build."
        object_fields:
          - name: slice_id
            type: string
            required: true
          - name: slice_name
            type: string
            required: true
          - name: name
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Current Architecture Decision Pack reference that constrains this Build step"
            validation: "Resolves to the current design, including design-pressure checks, and must be refreshed before deviation"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved feature-preparation evidence ref constraining this Build step"
            validation: "Resolves to the preserved behavior, explicit changes, conflicts, gaps, and implementation implications for this packet"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan projection unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried by this Build task packet"
            validation: "Matches the enriched Build handoff unchanged: the three original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried by this Build task packet"
            validation: "Matches the enriched Build handoff unchanged: requested_scope and execution_prerequisite remain exact and exactly one applicable preparation-source binding is present; this task retains qa_evaluation_mode=required and the post-Build QA route"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: acceptance_criteria
            type: string[]
            required: true
          - name: reuse_search
            type: object
            required: true
            description: "Task-packet reuse-search result; implement its reuse, extend, new, or intentional_duplicate decision"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries CodeWriter receives before implementation; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: files_to_create
            type: string[]
            required: true
          - name: files_to_modify
            type: string[]
            required: true
          - name: files_to_test
            type: string[]
            required: true
          - name: enabling_changes_included
            type: string[]
            required: true
          - name: depends_on
            type: string[]
            required: true
          - name: tdd_applies
            type: boolean
            required: true
            validation: "Equals verification_decision.tdd_choice.mode."
          - name: verification_decision
            type: object
            required: true
            description: "Canonical assistant-verification decision carried unchanged from Plan."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision."
          - name: evidence_assessment
            type: object
            required: true
            description: "Current canonical evidence assessment; planned before execution and refreshed from actual results before Review."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment; preserve gaps and freshness limitations."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            min_items: 1
            description: "Planned RED argv; bounded_executor runs it after dispatch and before production edits, while separated_workers assigns RED to BuilderTester. This field is not RED evidence."
            validation: "When present, argv[0] is the executable and each remaining item is one literal argument."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            description: "Working directory for the planned RED argv."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            description: "Expected meaningful RED behavior for the selected lane; not RED evidence and not sufficient to pass the implementation gate"
          - name: red_evidence
            type: object
            required: conditional
            condition: "tdd_applies is true and build_execution_lane == separated_workers"
            description: "Incoming BuilderTester RED evidence required before production edits only in separated_workers. In bounded_executor, CodeWriter must run the planned meaningful RED after dispatch and before production edits. No active TDD lane may proceed without valid RED evidence."
            object_fields:
              - name: test_file
                type: string
                required: true
                description: "Test file written or modified by BuilderTester for the RED step"
              - name: test_name
                type: string
                required: true
                description: "Specific failing test that proves the desired behavior is not implemented yet"
              - name: command
                type: string[]
                required: true
                description: "Exact argv BuilderTester ran to produce the RED failure"
                validation: "argv[0] is the executable and each remaining item is one literal argument."
              - name: cwd
                type: string
                required: true
                description: "Working directory used for the RED argv."
              - name: failure_summary
                type: string
                required: true
                description: "Concise failure evidence from the RED run, not raw logs"
              - name: right_reason
                type: string
                required: true
                description: "Why the failure demonstrates the intended missing behavior instead of a syntax, setup, or unrelated error"
          - name: implementation_notes
            type: string[]
            required: true
          - name: verification_command
            type: string[]
            required: conditional
            condition: "the selected CheckSpec has a command to execute"
            min_items: 1
            description: "Canonical verification argv when the selected CheckSpec uses a command; otherwise follow its concrete procedure."
            validation: "When present, item 0 is the executable and each remaining item is one literal argument; never reconstruct a shell command."
          - name: expected_success_signal
            type: string
            required: true
          - name: evidence_to_record
            type: string[]
            required: true
          - name: deviation_rollback_rule
            type: string
            required: true
      - name: context_map
        type: string
        required: true
        description: "CodeMapper output for codebase orientation"
      - name: conventions
        type: object[]
        required: true
        description: "Coding conventions to follow (from context map)"
      - name: constraints
        type: string[]
        required: true
        description: "Boundaries that must not be crossed"
      - name: tdd_mode
        type: boolean
        required: true
        description: "Exact projection of current_task_packet.verification_decision.tdd_choice.mode; RED is required only when true."
        validation: "Equals current_task_packet.verification_decision.tdd_choice.mode and every affected current_task_packet.tdd_applies."
      - name: build_repair_state
        type: object
        required: conditional
        condition: "this dispatch is an ordinary same-scope Build repair attempt"
        description: "Bounded repair state that the worker must preserve; redispatch does not reset its counters"
        object_fields:
          - name: attempt
            type: int
            required: true
          - name: max_attempts
            type: int
            required: true
            validation: "Exactly 3"
          - name: no_progress_count
            type: int
            required: true
          - name: no_progress_limit
            type: int
            required: true
            validation: "Exactly 2"
          - name: failure_signatures
            type: string[]
            required: true
            min_items: 1
          - name: progress_evidence
            type: string[]
            required: true
            min_items: 1
          - name: plan_version
            type: string
            required: true
          - name: cumulative_attempt_count
            type: int
            required: true
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED]
        description: "Worker status packet result"
      - name: changed_files
        type: object[]
        required: false
        condition: "required with min_items: 1 when status in [DONE, DONE_WITH_CONCERNS, DEVIATED]; optional and may be empty or omitted when status in [NEEDS_CONTEXT, BLOCKED]"
        min_items: 0
        description: "Files created, modified, or deleted by this worker. Do not invent entries when the worker returns NEEDS_CONTEXT or BLOCKED before changing files."
        object_fields:
          - name: path
            type: string
            required: true
          - name: change_type
            type: enum
            required: true
            enum_values: [created, modified, deleted]
          - name: description
            type: string
            required: true
      - name: evidence
        type: object[]
        required: false
        condition: "required with min_items: 1 when status in [DONE, DONE_WITH_CONCERNS, DEVIATED]; optional and may be empty or omitted when status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Specific implementation evidence, such as file paths and important changed behavior. Do not invent implementation evidence when the worker returns NEEDS_CONTEXT or BLOCKED before changing files."
        min_items: 0
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: architecture_obligation_coverage
        type: object[]
        required: conditional
        condition: "build_execution_lane == bounded_executor and current_task_packet.architecture_test_obligations is present"
        min_items: 1
        description: "Exact-once Architecture Decision Pack obligation coverage produced by the selected Build owner"
        validation: "Each carried architecture_test_obligations obligation is represented exactly once by obligation_id; no coverage entry has an unknown or duplicate id."
        object_fields:
          - name: obligation_id
            type: string
            required: true
          - name: architecture_decision_pack_ref
            type: string
            required: true
          - name: obligation_kind
            type: enum
            required: true
            enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
          - name: evidence
            type: string
            required: true
          - name: outcome
            type: enum
            required: true
            enum_values: [covered, blocked, explicit_unknown]
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before implementation can continue"
      - name: blocker_type
        type: enum
        required: conditional
        condition: "status in [NEEDS_CONTEXT, BLOCKED, DEVIATED] because implementation hit an unexpected blocker, missing contract, stale plan, scope conflict, or required RED evidence gap"
        enum_values: [legacy_code_bug, broken_baseline, hidden_dependency, missing_contract, stale_plan, scope_conflict, tool_environment, permission_policy, tdd_red_missing, other]
        description: "Classifies the implementation blocker so the orchestrator can route recovery instead of asking CodeWriter to improvise through it."
        validation: "Use the most specific blocker type. DEVIATED is required when continuing would change approved scope, files, behavior, risk, or verification expectations."
        on_missing: fail
      - name: blocker_evidence
        type: object[]
        required: conditional
        condition: "blocker_type is present"
        min_items: 1
        description: "Evidence for the blocker: file paths, baseline failures, missing contract fields, stale task-packet assumptions, tool/environment errors, or scope conflict details."
        on_missing: fail
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: recovery_hint
        type: enum
        required: false
        condition: "blocker_type is present"
        enum_values: [debugging, explorer, architect, candidate_search, replan, restart, user_clarification, environment_fix, permission_request]
        description: "Optional non-binding recovery hint; the orchestrator owns the final pivot_restart_decision."
      - name: files_changed
        type: object[]
        required: false
        condition: "required with min_items: 1 when status in [DONE, DONE_WITH_CONCERNS, DEVIATED]; optional and may be empty or omitted when status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Legacy alias for changed_files; keep populated for implementation statuses until downstream consumers migrate. Do not invent entries for NEEDS_CONTEXT or BLOCKED before file changes."
        min_items: 0
        object_fields:
          - name: path
            type: string
            required: true
          - name: change_type
            type: enum
            required: true
            enum_values: [created, modified, deleted]
          - name: description
            type: string
            required: true
      - name: artifact_refs
        type: object[]
        required: false
        condition: "required with min_items: 1 when status in [DONE, DONE_WITH_CONCERNS, DEVIATED] and current_task_packet.artifact_refs is present or harness_capable == true; optional and may be empty or omitted when status in [NEEDS_CONTEXT, BLOCKED]"
        min_items: 0
        description: "Typed Artifact Reference entries produced or updated by CodeWriter; include changed_files refs for modified files and plan_deviation refs when implementation departs from the approved task packet."
        object_fields:
          - name: artifact_id
            type: string
            required: true
          - name: artifact_type
            type: enum
            required: true
            enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
          - name: producer
            type: string
            required: true
          - name: consumer
            type: string
            required: true
          - name: location_ref
            type: string
            required: true
            description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
          - name: schema_or_contract
            type: string
            required: true
          - name: validation_status
            type: enum
            required: true
            enum_values: [pending, valid, invalid, stale, not_applicable]
          - name: summary
            type: string
            required: true
      - name: tests_written
        type: object[]
        required: true
        description: "Tests created or modified in this step"
        min_items: 0
        object_fields:
          - name: file
            type: string
            required: true
          - name: test_names
            type: string[]
            required: true
      - name: deviation_detected
        type: boolean
        required: true
        description: "True if the plan didn't match reality"
      - name: deviation_details
        type: string
        required: false
        description: "What the plan assumed vs. what was found"
        condition: "when deviation_detected is true or status is DEVIATED"
    on_missing_field: "CodeWriter must always return status and deviation_detected at minimum. For DONE, DONE_WITH_CONCERNS, or DEVIATED, it must also return changed_files, evidence, files_changed, and typed artifact_refs when the task packet carried artifact_refs or harness_capable == true; for NEEDS_CONTEXT/BLOCKED, require open_questions and do not require fabricated changed-file or artifact-ref entries. When implementation hit an unexpected blocker, require blocker_type and blocker_evidence before the orchestrator routes recovery."

  # ─────────────────────────────────────────────
  # Orchestrator → BuilderTester
  # ─────────────────────────────────────────────
  - name: orchestrator_to_builder_tester
    from: Orchestrator
    to: BuilderTester
    phase: BUILD
    context_fields:
      - name: change_impact_applicability
        type: object
        required: conditional
        condition: "the current slice has a behavior-bearing change or locality/shared/unresolved impact decision"
        validation: "impact_scope and applicability_reason are carried unchanged. local carries causal evidence and does not require expanded checker refs; shared/unresolved or explicit expansion carries the matching expanded artifact envelope."
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [separated_workers]
        description: "BuilderTester is dispatched only for the separated verification lane"
      - name: tdd_mode
        type: boolean
        required: true
        description: "Exact projection of the selected task packet TddChoice."
        validation: "Equals current_task_packet.verification_decision.tdd_choice.mode."
      - name: changed_files
        type: string[]
        required: true
        description: "Files that were just modified (from CodeWriter return)"
      - name: files_changed
        type: string[]
        required: false
        description: "Legacy alias for changed_files"
      - name: change_impact_evidence
        type: object
        required: conditional
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        description: "Current resolved pre-build artifact envelope that authorizes this BuilderTester mutation dispatch."
        validation: "The common checker was freshly run, or was rerun with --receipt validator_result_ref against the referenced capture_ref, independent expected_context_ref, and assessment_ref for a current valid pre_build result that resolves artifact_identity against the current task packet; impact_scope and status remain bound unchanged. A status or result ref alone is insufficient, and BuilderTester must not reuse CodeWriter's pre-build result after earlier mutations."
        object_fields:
          - {name: artifact_identity, type: string, required: true}
          - {name: phase, type: enum, required: true, enum_values: [pre_build]}
          - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
          - {name: status, type: enum, required: true, enum_values: [valid]}
          - {name: capture_ref, type: string, required: true}
          - {name: expected_context_ref, type: string, required: true}
          - {name: assessment_ref, type: string, required: true}
          - {name: validator_result_ref, type: string, required: true}
      - name: build_command
        type: string
        required: false
        description: "Custom build command if non-standard"
      - name: test_targets
        type: string[]
        required: conditional
        condition: "a resolved due selected CheckSpec's claim, oracle, or procedure, or a binding constraint, requires automated tests"
        description: "Test projects or files for selected automated checks; omit for non-test procedures."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether verification must consume Architecture Decision Pack commitments"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether verification must check existing-system feature-preparation classifications"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining verification"
        validation: "Equals the approved_feature_preparation_result input and current task packet unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref constraining verification"
        validation: "Resolves to the same evidence ref consumed by the Build handoff"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation constraining verification"
        validation: "Matches the enriched Build handoff unchanged: the three original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; requires verification of the accepted Done Contract/Harness Recipe scope"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation constraining verification"
        validation: "Matches the enriched Build handoff unchanged: the two original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; verification retains qa_evaluation_mode=required and the post-Build Code Reviewer then QA Evaluator route"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: current_task_packet
        type: object
        required: conditional
        condition: "current verification step executes a slice or the approved plan uses executable task packets"
        description: "Executable task packet being verified, including command and success signal"
        on_missing: fail
        notes: "Block BuilderTester dispatch; Orchestrator must pass the slice task packet being verified or re-dispatch Architect to produce executable task packets before verification."
        object_fields:
          - name: slice_id
            type: string
            required: true
          - name: slice_name
            type: string
            required: true
          - name: name
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
          - name: verification_decision
            type: object
            required: true
            description: "Canonical assistant-verification decision carried unchanged from the approved Plan/task packet."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision."
          - name: evidence_assessment
            type: object
            required: true
            description: "Current canonical evidence assessment; planned before execution and refreshed from actual results before Review."
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment; preserve gaps and freshness limitations."
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Architecture Decision Pack reference whose design-pressure, quality, and type commitments this verification checks"
            validation: "Resolves to the fresh selected-design pack"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref whose preservation and gap classifications verification must check"
            validation: "Resolves to the same feature-preparation evidence ref consumed by CodeWriter"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and CodeWriter task packet unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried by the verification task packet"
            validation: "Matches the enriched CodeWriter packet unchanged: the three original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried by the verification task packet"
            validation: "Matches the enriched CodeWriter packet unchanged: requested_scope and execution_prerequisite remain exact and exactly one applicable preparation-source binding is present; this task retains qa_evaluation_mode=required and the post-Build QA route"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: acceptance_criteria
            type: string[]
            required: true
          - name: reuse_search
            type: object
            required: true
            description: "Task-packet reuse-search result validated alongside the verified increment"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries BuilderTester receives before verification; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: files_to_test
            type: string[]
            required: true
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether this verification packet is in an active TDD cycle"
            validation: "Equals verification_decision.tdd_choice.mode."
          - name: evidence_to_record
            type: string[]
            required: true
          - name: verification_command
            type: string[]
            required: conditional
            condition: "the selected CheckSpec has a command to execute"
            min_items: 1
            description: "Canonical verification argv when the selected CheckSpec uses a command; otherwise follow its concrete procedure."
            validation: "When present, item 0 is the executable and each remaining item is one literal argument; never reconstruct a shell command."
          - name: expected_success_signal
            type: string
            required: true
          - name: expected_red_failure
            type: string
            required: false
            condition: "tdd_applies is true"
      - name: build_repair_state
        type: object
        required: conditional
        condition: "this dispatch is an ordinary same-scope Build repair attempt"
        description: "Bounded repair state that BuilderTester must preserve; redispatch does not reset its counters"
        object_fields:
          - name: attempt
            type: int
            required: true
          - name: max_attempts
            type: int
            required: true
            validation: "Exactly 3"
          - name: no_progress_count
            type: int
            required: true
          - name: no_progress_limit
            type: int
            required: true
            validation: "Exactly 2"
          - name: failure_signatures
            type: string[]
            required: true
            min_items: 1
          - name: progress_evidence
            type: string[]
            required: true
            min_items: 1
          - name: plan_version
            type: string
            required: true
          - name: cumulative_attempt_count
            type: int
            required: true
    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED, FAILED_VERIFICATION]
        description: "Worker status packet result"
      - name: verification
        type: object
        required: true
        description: "Commands/checks run and concise pass/fail evidence"
        object_fields:
          - name: commands
            type: string[]
            required: true
            min_items: 0
            description: "Commands actually run; may be empty for selected checks whose concrete procedure has no command, or when a required check could not run. Empty commands do not waive a selected or binding check."
          - name: result
            type: enum
            required: true
            enum_values: [passed, failed, not_run]
            validation: "passed requires current observed or admissibly reused passing results for every due selected and binding check; failed records an executed failure; not_run means a due required check could not run and requires NEEDS_CONTEXT or BLOCKED."
          - name: evidence
            type: string[]
            required: true
            min_items: 1
            description: "Concise result evidence, not raw logs. When commands is empty for a no-command check, identify the concrete procedure performed and its observed result; an empty command list alone is not evidence."
      - name: architecture_obligation_coverage
        type: object[]
        required: conditional
        condition: "build_execution_lane == separated_workers and current_task_packet.architecture_test_obligations is present"
        min_items: 1
        description: "Exact-once Architecture Decision Pack obligation coverage produced by the selected Build owner"
        validation: "Each carried architecture_test_obligations obligation is represented exactly once by obligation_id; no coverage entry has an unknown or duplicate id."
        object_fields:
          - name: obligation_id
            type: string
            required: true
          - name: architecture_decision_pack_ref
            type: string
            required: true
          - name: obligation_kind
            type: enum
            required: true
            enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
          - name: evidence
            type: string
            required: true
          - name: outcome
            type: enum
            required: true
            enum_values: [covered, blocked, explicit_unknown]
      - name: artifact_refs
        type: object[]
        required: false
        condition: "required with min_items: 1 when current_task_packet.artifact_refs is present or harness_capable == true; optional and may be empty or omitted when verification.result is not_run for NEEDS_CONTEXT or BLOCKED"
        min_items: 0
        description: "Typed Artifact Reference entries validated or produced by BuilderTester; include verification_evidence refs and validation_status updates for Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, and plan deviation refs."
        object_fields:
          - name: artifact_id
            type: string
            required: true
          - name: artifact_type
            type: enum
            required: true
            enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
          - name: producer
            type: string
            required: true
          - name: consumer
            type: string
            required: true
          - name: location_ref
            type: string
            required: true
            description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
          - name: schema_or_contract
            type: string
            required: true
          - name: validation_status
            type: enum
            required: true
            enum_values: [pending, valid, invalid, stale, not_applicable]
          - name: summary
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve"
      - name: build_result
        type: enum
        required: true
        enum_values: [passed, failed, not_run, not_applicable]
        description: "Derive build applicability from the concrete due selected CheckSpecs and resolved binding constraints, using each check's claim, oracle, and procedure; do not infer it from file type, command presence, method, or technique alone. Unresolved applicability is a gap. Use passed only for current observed or admissibly reused successful build evidence; an executed build failure is failed and blocks completion. Use not_run only when a required build could not run and status is NEEDS_CONTEXT or BLOCKED. Use not_applicable only when no due selected or binding build check applies and no build was executed."
      - name: build_errors
        type: string[]
        required: false
        condition: "when build_result is failed"
        description: "Concise error descriptions — not raw logs"
      - name: test_summary
        type: object
        required: true
        description: "Actual test counts for selected or binding automated-test checks. Zero counts mean no tests were executed; they do not mean required tests passed. Applicability comes from due selected CheckSpecs and resolved binding constraints, not file type, command presence, method, or technique alone."
        object_fields:
          - name: passed
            type: int
            required: true
            description: "Number of tests observed passing; zero means none passed, including when no tests ran."
          - name: failed
            type: int
            required: true
            description: "Number of tests observed failing; required test checks without results remain gaps."
          - name: skipped
            type: int
            required: true
            description: "Number of tests observed skipped; skipped required checks remain gaps."
      - name: test_failures
        type: object[]
        required: false
        condition: "test_summary.failed > 0"
        object_fields:
          - name: test_name
            type: string
            required: true
          - name: error
            type: string
            required: true
            description: "Concise error — assertion message + expected/actual, not stack trace"
    on_missing_field: "Re-dispatch BuilderTester. status, verification, build_result, and test_summary are never optional; typed artifact_refs are required when the task packet carried artifact_refs or harness_capable == true."

  # ─────────────────────────────────────────────
# Reviewer and QAEvaluator worker packet schemas are owned by assistant-review.
# Workflow routes the Review phase and consumes only validated canonical results.
delegated_skill_contract_owners:
  - skill: assistant-review
    contract_ref: assistant-review/contracts/handoffs.yaml
    owns: [orchestrator_to_reviewer, orchestrator_to_qa_evaluator]
    workflow_consumes: [final_summary, qa_evaluation_result]

# Validation behavior for all handoffs:
#
# 1. Before dispatching: verify all required context_fields are populated
# 2. After return: verify all required return_fields are present, including the worker status packet
# 3. If on_missing_field action is "re-dispatch": retry once with explicit request
# 4. If second dispatch also misses required fields: log the gap and route to direct fallback, BLOCKED, or a degraded result with explicit evidence; do not fabricate required fields
# 5. When CodeWriter returns blocker_type, the orchestrator records the blocker evidence and routes to debugging, explorer, architect, candidate_search, replan, restart, user clarification, environment fix, or permission request. Do not ask CodeWriter to widen scope or patch blindly through a legacy blocker.
# 6. Never silently proceed with missing required fields — always log what was missing and how the missing evidence was resolved, deferred, or blocked
# ─────────────────────────────────────────────
