                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
