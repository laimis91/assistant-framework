            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: red_check_id
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals the sole ID in selected_check_ids intersect applicable_check_ids; multiple IDs require packet splitting. Resolve its exact command.argv and command.cwd in the unchanged CheckSpec."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact literal command.argv for red_check_id; never shell reconstruction."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact explicit CheckSpec command.cwd."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals meaningful_failure for red_check_id in the unchanged CheckSpec; planned oracle only, never actual RED evidence."
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files CodeWriter is expected to create for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files CodeWriter is expected to modify for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets for execution only: BuilderTester executes and diagnoses selected checks; CodeWriter owns test authoring listed in files_to_create and files_to_modify. Use an empty array only when no test file applies"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this packet"
          - name: depends_on
            type: string[]
            required: true
            description: "Approved slice dependencies"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Observable behavior this task packet must deliver"
          - name: reuse_search
            type: object
            required: true
            description: "CodeMapper reuse-search result carried unchanged into the executable task packet"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries that the task packet passes to CodeWriter and BuilderTester; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: test_criteria
            type: string[]
            required: true
            description: "Selected test or verification criteria for this step; describe a discriminating behavior oracle only when an automated_test CheckSpec is selected."
            min_items: 1
          - name: verification_decision_ref
            type: object
            required: true
            description: "Stable reference and SHA-256 of the full unchanged task-level specialist decision; no mutable stored copy."
            object_fields:
              - {name: artifact_ref, type: string, required: true}
              - {name: sha256, type: string, required: true}
          - name: selected_check_ids
            type: string[]
            required: true
            description: "Selected CheckSpec IDs due for this task packet"
            validation: "An ordered unique subset resolving exactly once in the unchanged decision and covering the packet acceptance criteria and risks."
          - name: binding_obligation_refs
            type: object[]
            required: true
            description: "Exact applicable binding tuples due for this task packet"
            validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple; task-wide obligations remain due at their existing completion boundary."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether meaningful RED is active for this task packet."
            validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; otherwise false. Preserve the decision unchanged."
          - name: implementation_notes
            type: string[]
            required: true
            description: "Existing patterns, constraints, non-goals, or boundaries CodeWriter must follow"
          - name: verification_command
            type: string[]
            required: conditional
            condition: "selected_check_ids resolves exactly one matching command-based CheckSpec in the unchanged verification_decision"
            min_items: 1
            description: "Legacy singular projection of the sole matching CheckSpec.command.argv; its explicit cwd remains in the canonical CheckSpec. Omit for zero or multiple matching commands; non-command checks use their concrete procedure."
            validation: "When present, resolve exactly one selected CheckSpec by ID in the unchanged verification_decision and require exact equality with its literal command.argv. Execute item 0 directly and each remaining item as one literal argument; never flatten, misattribute, reconstruct shell text, or use a default cwd. Missing or ambiguous command context requires refresh or a blocked packet."
          - name: expected_success_signal
            type: string
            required: true
            description: "Observable pass signal for the selected command or non-command check"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence that must be recorded before the slice is VERIFIED"
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this step exactly"
          - name: boundary_reason
            type: object
            required: conditional
            condition: "implementation_steps has more than one item"
            description: "Concrete execution purpose; size or file/layer counts alone are insufficient."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [acceptance, ownership_context, prerequisite, recovery_rollout, binding_protocol]}
              - {name: reason, type: string, required: true}
          - name: execution
            type: object
            required: true
            description: "Only coordinator-owned progress on this same packet; worker DONE does not imply VERIFIED. Preserve historical evidence and spent repair counters across resume. Lane/actor execution stamps are immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline: the history row carrying stamp_baseline {evidence_refs, tdd_cycle_log_ref when present}, appended once with each first stamp (reason dispatch stamp baseline) or replacement (which also keeps replaced_stamps, reason stamp replaced by a newly admitted dispatch before start or old-actor evidence). A relabelled or stripped stamp blocks. Before then, only a newly admitted dispatch may replace a stamp."
            object_fields:
              - {name: state, type: enum, required: true, enum_values: [PENDING, RUNNING, VERIFIED, BLOCKED, INVALIDATED]}
              - {name: evidence_refs, type: "string[]", required: true}
              - {name: input_identity, type: object, required: true, description: "Separately resolved relevant-input identities; changes invalidate affected evidence and result-consuming dependents."}
              - name: tdd_cycle_log_ref
                type: string
                required: conditional
                condition: "tdd_applies is true and the actual canonical cycle_log has started"
                validation: "Actual retained assistant-tdd cycle identity; omit unstarted work. Starting RED updates execution without changing approved definition."
              - {name: history, type: "object[]", required: true}
              - {name: progress_guard_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Stable outcome guard identity; never derived from legacy recovery counters."}
              - {name: action_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Exact admitted semantic action identity."}
              - {name: action_admission_ref, type: string, required: conditional, condition: "A semantic action admission has been committed", description: "Retained admission reused by later stages of the same RUNNING action."}
              - {name: build_execution_lane, type: enum, required: conditional, enum_values: [direct_main, bounded_executor, separated_workers], condition: "The packet has been dispatched", description: "Admitted dispatch lane stamp written by admission; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - {name: execution_actor_id, type: string, required: conditional, condition: "The packet has been dispatched and its lane resolves an actual execution actor", description: "Admitted direct_main execution actor or writer actor stamp; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - name: recovery
                type: object
                required: false
                description: "Historical v14 observations only; preserve supplied facts without using them as continuation authority."
                object_fields:
                  - {name: attempt_count, type: int, required: true}
                  - {name: no_progress_count, type: int, required: true}

          - name: progress_state
            type: object
            required: conditional
            condition: "context.progress is carried for repeated or persisted semantic work"
            description: "Read-only materialized ProgressState v1; independently retained context owns policy history, counts/frontier, closed actions and pending/consumed action admission. Never store this mutable copy in the approved Plan definition."
          - name: verification_decision
            type: object
            required: true
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision. Full unchanged object resolved by verification_decision_ref; projection cannot redefine approved work."
          - name: evidence_assessment
            type: object
            required: true
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment; current canonical assessment. When an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row alongside the decision even when planned and through results; reconcile missing/stale applicable provenance against newest intent before resumed work. Otherwise ordinary assessments including empty scope_and_evidence_refs require no row. Instruction rows claim no execution/check closure."
          - name: tdd_cycle_log_ref
            type: string
            required: conditional
            condition: "tdd_applies is true and execution.tdd_cycle_log_ref exists"
            validation: "Equals execution.tdd_cycle_log_ref and resolves assistant-tdd/contracts/output.yaml#artifacts/cycle_log; the first RED owner creates the in-progress entry only upon an actual invocation. Projection only, never an approved definition field."
          - name: red_evidence
            type: object
            required: conditional
            condition: "tdd_applies is true and build_execution_lane == separated_workers and worker_stage == production"
            description: "Incoming BuilderTester RED evidence required before production edits only in separated_workers. An admitted separated_workers refactor projection retains the unchanged actual RED as metadata after current GREEN; refactor requires the same canonical cycle. In bounded_executor, CodeWriter must run the planned meaningful RED after dispatch and before production edits. No active TDD lane may proceed with production without valid RED evidence."
            validation: "Deep-copy the unchanged observed authorizing BuilderTester cycle.red only after current identity, lane and actual-RED admission. Runtime projection only; omit before actual RED and from stored definitions."
            object_fields:
              - {name: check_id, type: string, required: true, validation: "Exactly equals red_check_id."}
              - {name: test_file, type: string, required: true}
              - {name: test_name, type: string, required: true}
              - {name: command, type: "string[]", required: true, validation: "Exactly equals the planned red_command argv."}
              - {name: cwd, type: string, required: true, validation: "Exactly equals red_cwd."}
              - {name: failure_summary, type: string, required: true}
              - {name: right_reason, type: string, required: true, description: "Why the observed failure is the authorizing assertion.", validation: "Explains the observed failure matching expected_red_failure; setup failures cannot authorize edits."}
          - name: approved_plan_identity
            type: object
            required: true
            validation: "Exact task identity, plan_version, approval_ref and definition_digest."

      - name: context_map
        type: string
        required: true
        description: "CodeMapper output for codebase orientation"
      - name: conventions
        type: object[]
        required: true
        description: "Coding conventions to follow (from context map)"
      - name: constraints
        type: string[]
        required: true
        description: "Boundaries that must not be crossed"
      - name: verification_decision
        type: object
        required: conditional
        condition: "current_task_packet is absent"
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; Retain explicit reduced-testing scope/source, rationale, exclusions, omissions and stop rule through workers, verifier, review and resume; carry the canonical assessment via the existing required packet field, or the declared sibling when packetless and an explicit reduced-testing instruction applies; otherwise the packetless sibling is optional and any supplied assessment remains canonical unchanged; when an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row through planned packets/result updates and reconcile missing/stale applicable provenance against newest intent. Without an applicable instruction, ordinary assessments including empty scope_and_evidence_refs require no instruction row. The row claims no execution/check closure; expansion requires a distinct important uncovered failure and existing selection/approval. preserve unchanged; when current_task_packet is present, equals its verification_decision."
        on_missing: fail
      - name: evidence_assessment
        type: object
        required: conditional
        condition: "current_task_packet is absent and an explicit reduced-testing instruction applies"
        description: "Current canonical assistant-verification assessment carried unchanged from selection/task state."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment. Resolve applicability from newest authoritative instructions/task constraints, not surviving rows; preserve the exact source-bearing instruction row even when planned and reconcile missing/stale provenance before dependent work without reconstructing it from scope prose. Without an applicable instruction, omission is valid; any supplied assessment remains canonical unchanged, including empty scope_and_evidence_refs. Instruction rows claim no execution/check closure; planned is not verification sufficiency. When current_task_packet is present, consume its required assessment without a duplicate inline copy; if both are supplied, exact equality is required and conflicts block."
        on_missing: fail
      - name: selected_check_ids
        type: string[]
        required: conditional
        condition: "current_task_packet is absent"
        validation: "An ordered unique subset resolving exactly once in verification_decision and covering this step's acceptance criteria and risks; when current_task_packet is present, equals its selected_check_ids."
        on_missing: fail
      - name: binding_obligation_refs
        type: object[]
        required: conditional
        condition: "current_task_packet is absent"
        validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple due for this step; task-wide obligations retain their completion boundary; when current_task_packet is present, equals its binding_obligation_refs."
        on_missing: fail
        object_fields:
          - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
          - {name: value, type: string, required: true}
          - {name: source_ref, type: string, required: true}
      - name: tdd_applies
        type: boolean
        required: conditional
        condition: "current_task_packet is absent"
        validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; for an active workflow packet that intersection must contain exactly one ID, otherwise split the packet before dispatch. when current_task_packet is present, equals its tdd_applies."
        on_missing: fail
      - name: red_check_id
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Equals the sole ID in selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; multiple IDs require packet splitting, and the ID resolves once in each set and the unchanged decision."
        on_missing: fail
      - name: red_command
        type: string[]
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        min_items: 1
        validation: "Exactly equals the literal command.argv for red_check_id in the unchanged decision."
        on_missing: fail
      - name: red_cwd
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Exactly equals the explicit command.cwd for red_check_id in the unchanged decision."
        on_missing: fail
      - name: expected_red_failure
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Exactly equals meaningful_failure for red_check_id in the unchanged decision; this is an oracle expectation, not RED evidence."
        on_missing: fail
      - name: tdd_cycle_log_ref
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true and the canonical cycle_log has started"
        description: "Current canonical assistant-tdd cycle_log reference carried across CodeWriter dispatches and retries."
        validation: "Resolves to the same current cycle_log conforming to assistant-tdd/contracts/output.yaml#artifacts/cycle_log. In bounded_executor, create its in-progress entry if absent when recording the actual authorizing RED. Record actual production_file; on the post-GREEN redispatch, record actual refactor.changes_made or none needed without earlier refactor edits. Preserve history and omit unstarted invocations."
      - name: red_evidence
        type: object
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true and build_execution_lane == separated_workers and worker_stage == production"
        description: "Unchanged typed BuilderTester authorizing RED for inline handoff context."
        validation: "Matches the top-level red_check_id, red_command, red_cwd, and expected_red_failure exactly; standalone/no-decision and bounded_executor contexts do not require this field."
        object_fields:
          - {name: check_id, type: string, required: true, validation: "Exactly equals top-level red_check_id and resolves in both selected and applicable IDs."}
          - {name: test_file, type: string, required: true}
          - {name: test_name, type: string, required: true}
          - {name: command, type: "string[]", required: true, min_items: 1, validation: "Exactly equals top-level red_command."}
          - {name: cwd, type: string, required: true, validation: "Exactly equals top-level red_cwd."}
          - {name: failure_summary, type: string, required: true}
          - {name: right_reason, type: string, required: true, validation: "Explains the matching expected_red_failure oracle; syntax, setup, or unrelated failures do not qualify."}
      - name: tdd_mode
        type: boolean
        required: true
        description: "Task-global TddChoice projection; local RED follows the carried tdd_applies."
        validation: "Equals current_task_packet.verification_decision.tdd_choice.mode when current_task_packet is present; otherwise equals verification_decision.tdd_choice.mode. Never infer local RED from task-wide mode."
      - name: build_repair_state
        type: object
        required: false
        description: "Legacy repair observations only; retain original counts and evidence, never use as continuation authority. The canonical progress_state owns the shared guard."

      - name: progress_state
        type: object
        required: conditional
        condition: "repeated or persisted semantic work has a progress consumer"
        description: "Canonical ProgressState v1 in the existing task/journal context; see tools/progress/operating-guidance.md and ProgressState.parse in stagnation.py."
        validation: "Independent outcome/guard, policy source, assessed history, evidence and current action admission are retained; derive counts, reject replay, preserve completed-cycle-before-blocker ordering; optional fixed coordinator members share one admission and complete terminal-cycle barrier under the common helper; no phase-local allowance."

    return_fields:
      - name: worker_stage
        type: enum
        required: true
        enum_values: [test_authoring, production, refactor]
        description: "Semantic stage of the same selected writer; test_authoring is tests-only without incoming RED, production requires current RED when TDD applies, refactor requires current passing GREEN."
        validation: "Conforms to worker_stage_protocol. Packet and inline values must agree. Stage-only DONE never completes Build or permits Review. Legacy inactive/bounded packets may infer production; active separated packets must refresh the explicit stage before mutation. Reused checks need no test_authoring. Refactor redispatch preserves writer identity and canonical cycle ref."
        on_missing: fail
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED, FAILED_VERIFICATION]
        description: "Worker status packet result"
        validation: "test_authoring DONE/DONE_WITH_CONCERNS is stage-only and requires no incoming RED; active separated TDD requires at least one actual permitted test-scope mutation from this stage in both change aliases. With no authoring needed, skip that stage; never invent edits or report empty authoring success. It may never complete Build or enter Review. refactor requires current passing GREEN. For active bounded_executor production TDD, DONE and DONE_WITH_CONCERNS require this return's matching typed red_evidence before production edits. Preserve an observed valid RED and actual file changes when another due check makes the final status FAILED_VERIFICATION; without valid RED, keep the honest blocker or failure status."
      - name: red_evidence
        type: object
        required: conditional
        condition: "tdd_applies is true and build_execution_lane == bounded_executor and valid matching authorizing RED was observed"
        description: "The exact current failed invocation that authorized bounded-executor production edits. It remains separate from final validation_results, even if another due failure determines status."
        validation: "When present, preserve the observed check_id, test_file, test_name, exact red_command argv and red_cwd, failure summary, and right_reason matching expected_red_failure. Omit when RED was not started, passed unexpectedly, failed for setup or another reason, or is otherwise invalid; never invent evidence."
        object_fields:
          - {name: check_id, type: string, required: true, validation: "Exactly equals current_task_packet.red_check_id or inline red_check_id and resolves in the selected/applicable intersection."}
          - {name: test_file, type: string, required: true}
          - {name: test_name, type: string, required: true}
          - {name: command, type: "string[]", required: true, min_items: 1, validation: "Exactly equals the carried red_command argv."}
          - {name: cwd, type: string, required: true, validation: "Exactly equals the carried red_cwd."}
          - {name: failure_summary, type: string, required: true, description: "Concise observed failed-test evidence, not raw logs."}
          - {name: right_reason, type: string, required: true, validation: "Explains why this exact failed test demonstrates expected_red_failure; syntax, setup, and unrelated failures do not qualify."}
      - name: tdd_cycle_log_ref
        type: string
        required: conditional
        condition: "tdd_applies is true and the canonical cycle_log has started"
        description: "Actual reference to the current canonical assistant-tdd cycle_log."
        validation: "When the authorizing RED invocation starts, create the current task-journal or workflow-output cycle_log entry conforming to assistant-tdd/contracts/output.yaml#artifacts/cycle_log if no ref exists and return its actual resolvable location. Return the same ref on later partial or failed stages; omit only when no cycle_log was started. Preserve history and never reconstruct or invent phase evidence."
      - name: changed_files
        type: object[]
        required: conditional
        condition: "implementation or test files were actually changed or (tdd_applies is true and build_execution_lane == separated_workers and worker_stage == test_authoring and status in [DONE, DONE_WITH_CONCERNS])"
        min_items: 0
        validation: "When required, contains at least one actual mutation. Successful active separated test_authoring requires at least one actual permitted test-scope mutation from this stage; prior-stage evidence alone cannot satisfy it. Keep changed_files and files_changed equal. Never fabricate edits; if tests need no creation or repair, skip test_authoring and reuse the selected tests."
        on_missing: fail
        description: "Files actually created, modified, or deleted by this worker. Preserve all actual changes, including test edits before a later NEEDS_CONTEXT, BLOCKED, DEVIATED, or FAILED_VERIFICATION return and across retries. Omit only when no file changed; never invent entries."
        object_fields:
          - name: path
            type: string
            required: true
          - name: change_type
            type: enum
            required: true
            enum_values: [created, modified, deleted]
          - name: description
            type: string
            required: true
      - name: evidence
        type: object[]
        required: false
        condition: "required with min_items: 1 when status in [DONE, DONE_WITH_CONCERNS, DEVIATED, FAILED_VERIFICATION]; optional and may be empty or omitted when status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Concrete implementation, deviation, or verification-failure evidence. For pre-action DEVIATED, cite the actual mismatch without inventing changed-file evidence."
        min_items: 0
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: validation_results
        type: object[]
        required: conditional
        condition: "build_execution_lane == bounded_executor and (status in [DONE, DONE_WITH_CONCERNS, FAILED_VERIFICATION] or verification was attempted)"
        min_items: 1
        description: "Per-check outcomes retained whenever bounded-executor verification was attempted, including NEEDS_CONTEXT/BLOCKED returns. DONE, DONE_WITH_CONCERNS, and FAILED_VERIFICATION require results; an unattempted DEVIATED return may omit them."
        validation: "Each row binds exact selected CheckSpec IDs and applicable policy tuples to the actual current procedure/oracle observed; a shared claim or ID alone does not support another check. For a started command-based check, executed_command is required and resolves exactly one selected ID to the unchanged canonical CheckSpec's exact argv and explicit cwd; missing or ambiguous context requires refresh or blocks the result. Any failed due required check makes bounded CodeWriter status FAILED_VERIFICATION, which takes precedence over DONE, DONE_WITH_CONCERNS, or DEVIATED; preserve all started outcomes and actual file changes. A meaningful RED whose observed failure matches expected_red_failure is retained in red_evidence as TDD stage evidence, not as a failed validation_results row. Partial and unavailable are explicit gaps and never close a due check or establish sufficiency. Blocked is a distinct explicit gap and never closes a due check or establishes sufficiency."
        object_fields:
          - {name: command_or_check, type: string, required: true}
          - {name: result, type: enum, required: true, enum_values: [passed, failed, partial, unavailable, skipped, not_applicable, blocked]}
          - {name: evidence, type: string, required: true}
          - {name: selected_check_ids, type: "string[]", required: true}
          - name: executed_command
            type: object
            required: conditional
            condition: "a command-based selected CheckSpec was started, regardless of outcome"
            validation: "check_id is the sole selected_check_ids value and resolves exactly once in the unchanged verification_decision; argv and cwd exactly equal that CheckSpec.command.argv and CheckSpec.command.cwd."
            object_fields:
              - {name: check_id, type: string, required: true}
              - {name: argv, type: "string[]", required: true, min_items: 1}
              - {name: cwd, type: string, required: true}
          - name: binding_obligation_refs
            type: object[]
            required: true
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
      - name: architecture_obligation_coverage
        type: object[]
        required: conditional
        condition: "build_execution_lane == bounded_executor and current_task_packet.architecture_test_obligations is present"
        min_items: 1
        description: "Exact-once Architecture Decision Pack obligation coverage produced by the selected Build owner"
        validation: "Each carried architecture_test_obligations obligation is represented exactly once by obligation_id; no coverage entry has an unknown or duplicate id."
        object_fields:
          - name: obligation_id
            type: string
            required: true
          - name: architecture_decision_pack_ref
            type: string
            required: true
          - name: obligation_kind
            type: enum
            required: true
            enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
          - name: evidence
            type: string
            required: true
          - name: outcome
            type: enum
            required: true
            enum_values: [covered, blocked, explicit_unknown]
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve before implementation can continue"
      - name: blocker_type
        type: enum
        required: conditional
        condition: "status in [NEEDS_CONTEXT, BLOCKED, DEVIATED] because implementation hit an unexpected blocker, missing contract, stale plan, scope conflict, or required RED evidence gap"
        enum_values: [legacy_code_bug, broken_baseline, hidden_dependency, missing_contract, stale_plan, scope_conflict, tool_environment, permission_policy, tdd_red_missing, other]
        description: "Classifies the implementation blocker so the orchestrator can route recovery instead of asking CodeWriter to improvise through it."
        validation: "Use the most specific blocker type. DEVIATED is required when continuing would change approved scope, files, behavior, risk, or verification expectations."
        on_missing: fail
      - name: blocker_evidence
        type: object[]
        required: conditional
        condition: "blocker_type is present"
        min_items: 1
        description: "Evidence for the blocker: file paths, baseline failures, missing contract fields, stale task-packet assumptions, tool/environment errors, or scope conflict details."
        on_missing: fail
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: recovery_hint
        type: enum
        required: false
        condition: "blocker_type is present"
        enum_values: [debugging, explorer, architect, candidate_search, replan, restart, user_clarification, environment_fix, permission_request]
        description: "Optional non-binding recovery hint; the orchestrator owns the final pivot_restart_decision."
      - name: files_changed
        type: object[]
        required: conditional
        condition: "implementation or test files were actually changed or (tdd_applies is true and build_execution_lane == separated_workers and worker_stage == test_authoring and status in [DONE, DONE_WITH_CONCERNS])"
        description: "Legacy alias for changed_files; keep it equal to actual worker changes, including changes retained after NEEDS_CONTEXT, BLOCKED, DEVIATED, or FAILED_VERIFICATION and across retries. Omit only when no file changed; never invent entries."
        min_items: 0
        validation: "When required, contains at least one actual mutation. Successful active separated test_authoring requires at least one actual permitted test-scope mutation from this stage; prior-stage evidence alone cannot satisfy it. Keep changed_files and files_changed equal. Never fabricate edits; if tests need no creation or repair, skip test_authoring and reuse the selected tests."
        on_missing: fail
        object_fields:
          - name: path
            type: string
            required: true
          - name: change_type
            type: enum
            required: true
            enum_values: [created, modified, deleted]
          - name: description
            type: string
            required: true
      - name: artifact_refs
        type: object[]
        required: false
        condition: "required with min_items: 1 when (status in [DONE, DONE_WITH_CONCERNS] or (status in [DEVIATED, FAILED_VERIFICATION] and implementation files were actually changed)) and (current_task_packet.artifact_refs is present or harness_capable == true); optional and may be empty or omitted for pre-action DEVIATED and other returns before implementation outputs exist"
        min_items: 0
        description: "Typed Artifact Reference entries actually produced or updated by CodeWriter; include changed_files refs only for real modified files and plan_deviation refs only when a real deviation artifact was produced. Do not fabricate refs for pre-action DEVIATED."
        object_fields:
          - name: artifact_id
            type: string
            required: true
          - name: artifact_type
            type: enum
            required: true
            enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
          - name: producer
            type: string
            required: true
          - name: consumer
            type: string
            required: true
          - name: location_ref
            type: string
            required: true
            description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
          - name: schema_or_contract
            type: string
            required: true
          - name: validation_status
            type: enum
            required: true
            enum_values: [pending, valid, invalid, stale, not_applicable]
          - name: summary
            type: string
            required: true
      - name: tests_written
        type: object[]
        required: true
        description: "Tests created or modified in this step"
        min_items: 0
        object_fields:
          - name: file
            type: string
            required: true
          - name: test_names
            type: string[]
            required: true
      - name: deviation_detected
        type: boolean
        required: true
        description: "True if the plan didn't match reality"
      - name: deviation_details
        type: string
        required: false
        description: "What the plan assumed vs. what was found"
        condition: "when deviation_detected is true or status is DEVIATED"
    on_missing_field: "CodeWriter must always return status and deviation_detected. DONE and DONE_WITH_CONCERNS require evidence and every real changed_files/files_changed entry; nonmutating returns may omit changes except active separated test_authoring DONE/DONE_WITH_CONCERNS, which requires nonempty actual test-scope changes in both aliases; refactor none needed may remain empty; active bounded_executor TDD production additionally requires matching typed red_evidence. For every terminal status, retain every actual implementation or test file across retries; omit changed_files only when none changed. Return tdd_cycle_log_ref on every active-TDD return after its cycle_log starts, including partial or failed work; omit it only when RED never started. Bounded FAILED_VERIFICATION requires validation_results and actual failure evidence. DEVIATED requires deviation_details and concrete evidence; never fabricate artifacts or changes. NEEDS_CONTEXT/BLOCKED require open_questions, actual changes, and blocker evidence when unexpected."

  # ─────────────────────────────────────────────
  # Orchestrator → BuilderTester
  # ─────────────────────────────────────────────
  - name: orchestrator_to_builder_tester
    from: Orchestrator
    to: BuilderTester
    phase: BUILD
    context_fields:
      - name: change_impact_applicability
        type: object
        required: conditional
        condition: "the current slice has a behavior-bearing change or locality/shared/unresolved impact decision"
        validation: "impact_scope and applicability_reason are carried unchanged. local carries causal evidence and does not require expanded checker refs; shared/unresolved or explicit expansion carries the matching expanded artifact envelope."
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [separated_workers]
        description: "BuilderTester is dispatched only for the separated verification lane"
      - name: verification_decision
        type: object
        required: conditional
        condition: "current_task_packet is absent"
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision; Retain explicit reduced-testing scope/source, rationale, exclusions, omissions and stop rule through workers, verifier, review and resume; carry the canonical assessment via the existing required packet field, or the declared sibling when packetless and an explicit reduced-testing instruction applies; otherwise the packetless sibling is optional and any supplied assessment remains canonical unchanged; when an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row through planned packets/result updates and reconcile missing/stale applicable provenance against newest intent. Without an applicable instruction, ordinary assessments including empty scope_and_evidence_refs require no instruction row. The row claims no execution/check closure; expansion requires a distinct important uncovered failure and existing selection/approval. preserve unchanged; when current_task_packet is present, equals its verification_decision."
        on_missing: fail
      - name: evidence_assessment
        type: object
        required: conditional
        condition: "current_task_packet is absent and an explicit reduced-testing instruction applies"
        description: "Current canonical assistant-verification assessment carried unchanged from selection/task state."
        validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment. Resolve applicability from newest authoritative instructions/task constraints, not surviving rows; preserve the exact source-bearing instruction row even when planned and reconcile missing/stale provenance before dependent work without reconstructing it from scope prose. Without an applicable instruction, omission is valid; any supplied assessment remains canonical unchanged, including empty scope_and_evidence_refs. Instruction rows claim no execution/check closure; planned is not verification sufficiency. When current_task_packet is present, consume its required assessment without a duplicate inline copy; if both are supplied, exact equality is required and conflicts block."
        on_missing: fail
      - name: selected_check_ids
        type: string[]
        required: conditional
        condition: "current_task_packet is absent"
        validation: "An ordered unique subset resolving exactly once in verification_decision and covering this step's acceptance criteria and risks; when current_task_packet is present, equals its selected_check_ids."
        on_missing: fail
      - name: binding_obligation_refs
        type: object[]
        required: conditional
        condition: "current_task_packet is absent"
        validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple due for this step; task-wide obligations retain their completion boundary; when current_task_packet is present, equals its binding_obligation_refs."
        on_missing: fail
        object_fields:
          - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
          - {name: value, type: string, required: true}
          - {name: source_ref, type: string, required: true}
      - name: tdd_applies
        type: boolean
        required: conditional
        condition: "current_task_packet is absent"
        validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; for an active workflow packet that intersection must contain exactly one ID, otherwise split the packet before dispatch. when current_task_packet is present, equals its tdd_applies."
        on_missing: fail
      - name: verification_stage
        type: enum
        required: conditional
        condition: "tdd_applies is true"
        enum_values: [pre_production_red, final_verification]
        description: "Active-TDD BuilderTester stage; inactive-TDD dispatches and returns are final_verification."
        validation: "Dispatch pre_production_red after CodeWriter test_authoring when selected tests need creation or repair, and before the SAME CodeWriter worker_stage=production. Reused selected assertions proceed directly to pre_production_red without a forced authoring stage. Reuse final_verification after production for GREEN and again after the post-GREEN CodeWriter refactor for REFACTOR; cycle_log progress distinguishes them. The first stage-only result cannot close Build. Omit only when tdd_applies is false."
      - name: red_check_id
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Equals the sole ID in selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; multiple IDs require packet splitting, and the ID resolves once in each set and the unchanged decision."
        on_missing: fail
      - name: red_command
        type: string[]
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        min_items: 1
        validation: "Exactly equals the literal command.argv for red_check_id in the unchanged decision."
        on_missing: fail
      - name: red_cwd
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Exactly equals the explicit command.cwd for red_check_id in the unchanged decision."
        on_missing: fail
      - name: expected_red_failure
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true"
        validation: "Exactly equals meaningful_failure for red_check_id in the unchanged decision; this is an oracle expectation, not RED evidence."
        on_missing: fail
      - name: tdd_cycle_log_ref
        type: string
        required: conditional
        condition: "current_task_packet is absent and tdd_applies is true and the canonical cycle_log has started"
        description: "Current canonical assistant-tdd cycle_log reference carried across BuilderTester dispatches and retries."
        validation: "On the first observed RED invocation, create the current task-journal or workflow-output cycle_log entry conforming to assistant-tdd/contracts/output.yaml#artifacts/cycle_log if no ref exists and return its actual resolvable location. Later dispatches resolve that same entry: the first final_verification appends separate current GREEN invocations, and the post-REFACTOR final_verification appends executed current REFACTOR invocations or validated unchanged GREEN reuse. Preserve history and omit unstarted work."
      - name: tdd_mode
        type: boolean
        required: true
        description: "Task-global TddChoice projection; local RED follows the carried tdd_applies."
        validation: "Equals current_task_packet.verification_decision.tdd_choice.mode when current_task_packet is present; otherwise equals verification_decision.tdd_choice.mode. Never infer local RED from task-wide mode."
      - name: changed_files
        type: string[]
        required: conditional
        condition: "verification_stage == final_verification or tdd_applies is false or (verification_stage == pre_production_red and prior CodeWriter test_authoring edits occurred)"
        description: "Files actually modified by CodeWriter; pre_production_red consumes actual CodeWriter test_authoring test/fixture outputs when creation or repair occurred. It may omit this field or carry an empty list only when no prior authoring edits occurred."
      - name: files_changed
        type: string[]
        required: false
        description: "Legacy alias for changed_files"
      - name: change_impact_evidence
        type: object
        required: conditional
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        description: "Current resolved pre-build artifact envelope that authorizes this BuilderTester mutation dispatch."
        validation: "The common checker was freshly run, or was rerun with --receipt validator_result_ref against the referenced capture_ref, independent expected_context_ref, and assessment_ref for a current valid pre_build result that resolves artifact_identity against the current task packet; impact_scope and status remain bound unchanged. A status or result ref alone is insufficient, and BuilderTester must not reuse CodeWriter's pre-build result after earlier mutations."
        object_fields:
          - {name: artifact_identity, type: string, required: true}
          - {name: phase, type: enum, required: true, enum_values: [pre_build]}
          - {name: impact_scope, type: enum, required: true, enum_values: [not_applicable, local, shared, unresolved]}
          - {name: status, type: enum, required: true, enum_values: [valid]}
          - {name: capture_ref, type: string, required: true}
          - {name: expected_context_ref, type: string, required: true}
          - {name: assessment_ref, type: string, required: true}
          - {name: validator_result_ref, type: string, required: true}
      - name: build_command
        type: string
        required: false
        description: "Custom build command if non-standard"
      - name: test_targets
        type: string[]
        required: conditional
        condition: "a resolved due selected CheckSpec's claim, oracle, or procedure, or a binding constraint, requires automated tests"
        description: "Test projects or files for selected automated checks; omit for non-test procedures."
      - name: architecture_design_mode
        type: enum
        required: true
        enum_values: [not_applicable, lightweight, required, review_intensive]
        description: "Whether verification must consume Architecture Decision Pack commitments"
      - name: execution_intent
        type: enum
        required: true
        enum_values: [prepare_only, implement_only, end_to_end]
        description: "Execution discriminator required to evaluate preparation-result applicability locally"
      - name: feature_preparation_scope
        type: enum
        required: true
        enum_values: [not_applicable, existing_system]
        description: "Whether verification must check existing-system feature-preparation classifications"
      - name: approved_feature_preparation_result
        type: object
        required: conditional
        condition: "execution_intent == implement_only"
        description: "Approved typed preparation outcome constraining verification"
        validation: "Equals the approved_feature_preparation_result input and current task packet unchanged, including scope, gaps, decisions, implementation implications, optional readiness plan/future obligations, and recommended next step."
        object_fields:
          - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - {name: scope, type: string, required: true}
          - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
          - {name: evidence_gaps, type: "string[]", required: true}
          - {name: open_decisions, type: "string[]", required: true}
          - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
          - name: readiness_plan
            type: object
            required: false
            object_fields:
              - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: recommended_next_state, type: string, required: true}
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
          - name: future_qa_acceptance_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
          - name: future_harness_obligation
            type: object
            required: false
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
          - {name: recommended_next_step, type: string, required: true}
      - name: feature_preparation_evidence_ref
        type: string
        required: conditional
        condition: "feature_preparation_scope == existing_system"
        description: "Completed or approved evidence ref constraining verification"
        validation: "Resolves to the same evidence ref consumed by the Build handoff"
      - name: feature_preparation_harness_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_harness_obligation"
        description: "Accepted future harness obligation constraining verification"
        validation: "Matches the enriched Build handoff unchanged: the three original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; requires verification of the accepted Done Contract/Harness Recipe scope"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: feature_preparation_qa_acceptance_obligation
        type: object
        required: conditional
        condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
        description: "Accepted future QA/acceptance obligation constraining verification"
        validation: "Matches the enriched Build handoff unchanged: the two original payload fields remain exact and exactly one evidence-ref or not_applicable source binding is present; verification retains qa_evaluation_mode=required and the post-Build Code Reviewer then QA Evaluator route"
        object_fields:
          - {name: requested_scope, type: string, required: true}
          - {name: execution_prerequisite, type: string, required: true}
          - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
          - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
      - name: current_task_packet
        type: object
        required: conditional
        condition: "execution_intent != prepare_only and approved Plan uses executable packets"
        description: "Canonical ordered packets; one coherent increment defaults to one packet. Stored Plan keeps specialist references; worker projections materialize unchanged decisions. Optional display summaries may exist only for human readability and cannot replace exact packet and files_to_* fields."
        object_fields:
          - name: verification_stage
            type: enum
            required: conditional
            condition: "tdd_applies is true"
            enum_values: [pre_production_red, final_verification]
            description: "Caller materialized verifier stage; GREEN and executed REFACTOR or validated unchanged GREEN reuse follow current cycle evidence, never a CodeWriter stage."
          - name: writer_selection
            type: object
            required: conditional
            condition: "new Claude or Codex writer dispatch; legacy packets and Gemini native fallback may omit"
            description: "Orchestrator-owned concrete Claude or Codex writer choice; Architect proposals require Orchestrator validation."
            validation: "Packet selection is authoritative when supplied; conflicting inline selection blocks dispatch. Old packets omitting this object remain valid with intelligent compatibility semantics. Before dispatch, the Orchestrator resolves actual current evidence, not merely nonempty strings or self-asserted labels. Never select by edit size, file type/count, or simple labels."
            on_missing: fail
            object_fields:
              - name: agent
                type: enum
                required: true
                enum_values: [intelligent-writer, mechanical-writer]
                description: "Normal new Claude or Codex dispatch identity; explicit legacy code-writer and bootstrap identities are recorded separately."
                on_missing: fail
              - name: rationale
                type: string
                required: true
                description: "Reason tied to remaining judgment and consequences; intelligent-writer is the default."
                on_missing: fail
              - name: mechanical_eligibility
                type: object
                required: conditional
                condition: "agent == mechanical-writer"
                description: "All four evidence-backed eligibility conditions; unresolved semantic, grader, oracle or compatibility judgment cannot qualify."
                validation: "Each ref resolves to actual applicable current packet, approved preparation, source or selected-check evidence. Independently fixed expectations cannot be chosen by the mechanical writer. Evidence covers BOTH tests and implementation: fully specified cases, expected values/oracles, negative cases, assertion/fixture patterns and implementation recipe; unresolved test judgment requires intelligent-writer. Stale or missing evidence stops dependent mutations and returns truthful status, blocker evidence and all actual partial changes."
                on_missing: fail
                object_fields:
                  - {name: recipe_or_example_ref, type: string, required: true, description: "Concrete approved applicable recipe, exact wording or transformation example", on_missing: fail}
                  - {name: resolved_decisions_ref, type: string, required: true, description: "Resolved semantic, edge-case and compatibility decisions", on_missing: fail}
                  - {name: scope_and_dependencies_ref, type: string, required: true, description: "Understood ownership, scope, dependencies and baseline assumptions", on_missing: fail}
                  - {name: correctness_expectations_ref, type: string, required: true, description: "Independently fixed expectations checking actual correctness", on_missing: fail}
          - name: packet_id
            type: string
            required: true
            description: "Unique descriptive path-safe canonical packet identity; never ordinal-only. All consumers resolve implementation_steps exactly once."
          - name: name
            type: string
            required: true
            description: "Human-readable task packet name passed directly as current_task_packet.name"
          - name: description
            type: string
            required: true
          - name: observable_increment
            type: string
            required: true
            description: "Observable increment owned by this packet"
          - name: deliverable_type
            type: enum
            required: true
            enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
            description: "Deliverable owned by this packet"
          - name: requirement_ids
            type: string[]
            required: true
            min_items: 1
            description: "Requirement Acceptance Map ids implemented by this packet"
          - name: architecture_decision_pack_ref
            type: string
            required: conditional
            condition: "architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Fresh Architecture Decision Pack reference carried into this executable packet"
            validation: "Resolves to the selected design's owned boundary, design-pressure checks, Type Ledger, quality verification, and deviation conditions"
          - name: feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            description: "Completed or approved evidence ref carried unchanged into this executable packet"
            validation: "Resolves to the classifications and implementation implications this packet implements"
          - name: approved_feature_preparation_result
            type: object
            required: conditional
            condition: "execution_intent == implement_only"
            validation: "Equals the approved input result and Plan handoff unchanged."
            object_fields:
              - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - {name: scope, type: string, required: true}
              - {name: feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
              - {name: evidence_gaps, type: "string[]", required: true}
              - {name: open_decisions, type: "string[]", required: true}
              - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
              - name: readiness_plan
                type: object
                required: false
                object_fields:
                  - {name: evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system"}
                  - {name: preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable]}
                  - {name: implementation_implications, type: "string[]", required: true, min_items: 1}
                  - {name: open_decisions, type: "string[]", required: true}
                  - {name: recommended_next_state, type: string, required: true}
                  - {name: execution_status, type: enum, required: true, enum_values: [not_started]}
              - name: future_qa_acceptance_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: execution_prerequisite, type: string, required: true}
              - name: future_harness_obligation
                type: object
                required: false
                object_fields:
                  - {name: requested_scope, type: string, required: true}
                  - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
                  - {name: execution_prerequisite, type: string, required: true}
              - {name: recommended_next_step, type: string, required: true}
          - name: feature_preparation_harness_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_harness_obligation"
            description: "Accepted future harness obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, then activates the existing pre-Build harness entry gate"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: evidence_basis, type: "string[]", required: true, min_items: 1}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: feature_preparation_qa_acceptance_obligation
            type: object
            required: conditional
            condition: "the approved feature-preparation result contains future_qa_acceptance_obligation"
            description: "Accepted future QA/acceptance obligation carried unchanged into this executable packet"
            validation: "Binds to feature_preparation_evidence_ref for existing_system or source_preparation_basis=not_applicable without an evidence ref, sets qa_evaluation_mode=required, and requires the existing post-Build Code Reviewer then QA Evaluator lane"
            object_fields:
              - {name: requested_scope, type: string, required: true}
              - {name: execution_prerequisite, type: string, required: true}
              - {name: source_feature_preparation_evidence_ref, type: string, required: conditional, condition: "feature_preparation_scope == existing_system", validation: "Equals feature_preparation_evidence_ref unchanged."}
              - {name: source_preparation_basis, type: enum, required: conditional, condition: "feature_preparation_scope == not_applicable", enum_values: [not_applicable], validation: "Equals not_applicable and source_feature_preparation_evidence_ref is absent."}
          - name: architecture_test_obligations
            type: object[]
            required: conditional
            condition: "tdd_applies is true and architecture_design_mode in [lightweight, required, review_intensive]"
            description: "Testable Architecture Decision Pack obligations carried unchanged into the TDD Build handoff"
            validation: "Ordered unique obligation_id values carry every applicable Pack obligation exactly once; do not invent obligations not present in the Pack."
            min_items: 1
            object_fields:
              - name: obligation_id
                type: string
                required: true
                description: "Stable identifier used to bind this input obligation to exactly one coverage entry"
              - name: architecture_decision_pack_ref
                type: string
                required: true
              - name: obligation_kind
                type: enum
                required: true
                enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
              - name: behavior
                type: string
                required: true
              - name: verification
                type: string
                required: true
          - name: files
            type: string[]
            required: false
            description: "Optional display summary of file paths this step touches; cannot satisfy or replace executable files_to_* contract"
          - name: red_check_id
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals the sole ID in selected_check_ids intersect applicable_check_ids; multiple IDs require packet splitting. Resolve its exact command.argv and command.cwd in the unchanged CheckSpec."
          - name: red_command
            type: string[]
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact literal command.argv for red_check_id; never shell reconstruction."
          - name: red_cwd
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Exact explicit CheckSpec command.cwd."
          - name: expected_red_failure
            type: string
            required: conditional
            condition: "tdd_applies is true"
            validation: "Equals meaningful_failure for red_check_id in the unchanged CheckSpec; planned oracle only, never actual RED evidence."
          - name: files_to_create
            type: string[]
            required: true
            description: "Exact files CodeWriter is expected to create for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_modify
            type: string[]
            required: true
            description: "Exact existing files CodeWriter is expected to modify for this task packet, including authored tests, fixtures, helpers and test/build configuration when needed; use an empty array when none"
          - name: files_to_test
            type: string[]
            required: true
            description: "Exact test files or verification targets for execution only: BuilderTester executes and diagnoses selected checks; CodeWriter owns test authoring listed in files_to_create and files_to_modify. Use an empty array only when no test file applies"
          - name: enabling_changes_included
            type: string[]
            required: true
            description: "Setup, contracts, wiring, or config included inside this packet"
          - name: depends_on
            type: string[]
            required: true
            description: "Approved slice dependencies"
          - name: acceptance_criteria
            type: string[]
            required: true
            description: "Observable behavior this task packet must deliver"
          - name: reuse_search
            type: object
            required: true
            description: "CodeMapper reuse-search result carried unchanged into the executable task packet"
            object_fields:
              - name: applicability
                type: enum
                required: true
                enum_values: [applicable, not_applicable]
              - name: applicability_reason
                type: string
                required: true
              - name: searches
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                min_items: 1
                object_fields:
                  - name: query_or_path
                    type: string
                    required: true
                  - name: scope
                    type: string
                    required: true
                  - name: outcome
                    type: string
                    required: true
              - name: candidates
                type: object[]
                required: conditional
                condition: "applicability == applicable"
                object_fields:
                  - name: name
                    type: string
                    required: true
                  - name: location
                    type: string
                    required: true
                  - name: disposition
                    type: enum
                    required: true
                    enum_values: [reuse, extend, intentional_duplicate, reject_coincidental, reject_independent]
                  - name: rationale
                    type: string
                    required: true
              - name: no_candidate_reason
                type: string
                required: conditional
                condition: "applicability == applicable and candidates is empty"
              - name: decision
                type: enum
                required: conditional
                condition: "applicability == applicable"
                enum_values: [reuse, extend, new, intentional_duplicate]
              - name: decision_rationale
                type: string
                required: conditional
                condition: "applicability == applicable"
              - name: divergence_control
                type: string
                required: conditional
                condition: "decision == intentional_duplicate"
          - name: done_contract_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the accepted Done Contract containing done_when, not_done_when, verification, owner_consumer, acceptance_criteria, and debate_record"
          - name: harness_recipe_ref
            type: string
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            description: "Pointer to the selected Harness Recipe based on task/model/risk/context profile"
          - name: artifact_refs
            type: object[]
            required: conditional
            condition: "required when size in [medium, large, mega] and harness_capable == true"
            min_items: 5
            description: "Typed Artifact Reference entries that the task packet passes to CodeWriter and BuilderTester; include Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, verification evidence, and plan deviation refs when applicable."
            object_fields:
              - name: artifact_id
                type: string
                required: true
              - name: artifact_type
                type: enum
                required: true
                enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
              - name: producer
                type: string
                required: true
              - name: consumer
                type: string
                required: true
              - name: location_ref
                type: string
                required: true
                description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
              - name: schema_or_contract
                type: string
                required: true
              - name: validation_status
                type: enum
                required: true
                enum_values: [pending, valid, invalid, stale, not_applicable]
              - name: summary
                type: string
                required: true
          - name: test_criteria
            type: string[]
            required: true
            description: "Selected test or verification criteria for this step; describe a discriminating behavior oracle only when an automated_test CheckSpec is selected."
            min_items: 1
          - name: verification_decision_ref
            type: object
            required: true
            description: "Stable reference and SHA-256 of the full unchanged task-level specialist decision; no mutable stored copy."
            object_fields:
              - {name: artifact_ref, type: string, required: true}
              - {name: sha256, type: string, required: true}
          - name: selected_check_ids
            type: string[]
            required: true
            description: "Selected CheckSpec IDs due for this task packet"
            validation: "An ordered unique subset resolving exactly once in the unchanged decision and covering the packet acceptance criteria and risks."
          - name: binding_obligation_refs
            type: object[]
            required: true
            description: "Exact applicable binding tuples due for this task packet"
            validation: "Each {kind,value,source_ref} exactly equals a canonical policy tuple; task-wide obligations remain due at their existing completion boundary."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
          - name: tdd_applies
            type: boolean
            required: true
            description: "Whether meaningful RED is active for this task packet."
            validation: "True exactly when selected_check_ids intersect verification_decision.tdd_choice.applicable_check_ids; otherwise false. Preserve the decision unchanged."
          - name: implementation_notes
            type: string[]
            required: true
            description: "Existing patterns, constraints, non-goals, or boundaries CodeWriter must follow"
          - name: verification_command
            type: string[]
            required: conditional
            condition: "selected_check_ids resolves exactly one matching command-based CheckSpec in the unchanged verification_decision"
            min_items: 1
            description: "Legacy singular projection of the sole matching CheckSpec.command.argv; its explicit cwd remains in the canonical CheckSpec. Omit for zero or multiple matching commands; non-command checks use their concrete procedure."
            validation: "When present, resolve exactly one selected CheckSpec by ID in the unchanged verification_decision and require exact equality with its literal command.argv. Execute item 0 directly and each remaining item as one literal argument; never flatten, misattribute, reconstruct shell text, or use a default cwd. Missing or ambiguous command context requires refresh or a blocked packet."
          - name: expected_success_signal
            type: string
            required: true
            description: "Observable pass signal for the selected command or non-command check"
          - name: evidence_to_record
            type: string[]
            required: true
            description: "Evidence that must be recorded before the slice is VERIFIED"
          - name: deviation_rollback_rule
            type: string
            required: true
            description: "What to do if the implementation cannot follow this step exactly"
          - name: boundary_reason
            type: object
            required: conditional
            condition: "implementation_steps has more than one item"
            description: "Concrete execution purpose; size or file/layer counts alone are insufficient."
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [acceptance, ownership_context, prerequisite, recovery_rollout, binding_protocol]}
              - {name: reason, type: string, required: true}
          - name: execution
            type: object
            required: true
            description: "Only coordinator-owned progress on this same packet; worker DONE does not imply VERIFIED. Preserve historical evidence and spent repair counters across resume. Lane/actor execution stamps are immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline: the history row carrying stamp_baseline {evidence_refs, tdd_cycle_log_ref when present}, appended once with each first stamp (reason dispatch stamp baseline) or replacement (which also keeps replaced_stamps, reason stamp replaced by a newly admitted dispatch before start or old-actor evidence). A relabelled or stripped stamp blocks. Before then, only a newly admitted dispatch may replace a stamp."
            object_fields:
              - {name: state, type: enum, required: true, enum_values: [PENDING, RUNNING, VERIFIED, BLOCKED, INVALIDATED]}
              - {name: evidence_refs, type: "string[]", required: true}
              - {name: input_identity, type: object, required: true, description: "Separately resolved relevant-input identities; changes invalidate affected evidence and result-consuming dependents."}
              - name: tdd_cycle_log_ref
                type: string
                required: conditional
                condition: "tdd_applies is true and the actual canonical cycle_log has started"
                validation: "Actual retained assistant-tdd cycle identity; omit unstarted work. Starting RED updates execution without changing approved definition."
              - {name: history, type: "object[]", required: true}
              - {name: progress_guard_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Stable outcome guard identity; never derived from legacy recovery counters."}
              - {name: action_ref, type: string, required: conditional, condition: "Shared semantic continuation uses context.progress", description: "Exact admitted semantic action identity."}
              - {name: action_admission_ref, type: string, required: conditional, condition: "A semantic action admission has been committed", description: "Retained admission reused by later stages of the same RUNNING action."}
              - {name: build_execution_lane, type: enum, required: conditional, enum_values: [direct_main, bounded_executor, separated_workers], condition: "The packet has been dispatched", description: "Admitted dispatch lane stamp written by admission; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - {name: execution_actor_id, type: string, required: conditional, condition: "The packet has been dispatched and its lane resolves an actual execution actor", description: "Admitted direct_main execution actor or writer actor stamp; immutable once the packet is RUNNING, BLOCKED or VERIFIED (or INVALIDATED from those) under the current stamp, or has old-actor evidence beyond the latest stamp_baseline, otherwise replaceable only by a newly admitted dispatch with the old stamp kept in history."}
              - name: recovery
                type: object
                required: false
                description: "Historical v14 observations only; preserve supplied facts without using them as continuation authority."
                object_fields:
                  - {name: attempt_count, type: int, required: true}
                  - {name: no_progress_count, type: int, required: true}

          - name: progress_state
            type: object
            required: conditional
            condition: "context.progress is carried for repeated or persisted semantic work"
            description: "Read-only materialized ProgressState v1; independently retained context owns policy history, counts/frontier, closed actions and pending/consumed action admission. Never store this mutable copy in the approved Plan definition."
          - name: verification_decision
            type: object
            required: true
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#verification_decision. Full unchanged object resolved by verification_decision_ref; projection cannot redefine approved work."
          - name: evidence_assessment
            type: object
            required: true
            validation: "Conforms exactly to assistant-verification/contracts/output.yaml#evidence_assessment; current canonical assessment. When an explicit reduced-testing instruction applies, preserve its exact scope_and_evidence_refs instruction row alongside the decision even when planned and through results; reconcile missing/stale applicable provenance against newest intent before resumed work. Otherwise ordinary assessments including empty scope_and_evidence_refs require no row. Instruction rows claim no execution/check closure."
          - name: tdd_cycle_log_ref
            type: string
            required: conditional
            condition: "tdd_applies is true and execution.tdd_cycle_log_ref exists"
            validation: "Equals execution.tdd_cycle_log_ref and resolves assistant-tdd/contracts/output.yaml#artifacts/cycle_log; the first RED owner creates its in-progress entry only upon an actual invocation. Projection only, never an approved definition field."
          - name: approved_plan_identity
            type: object
            required: true
            validation: "Exact task identity, plan_version, approval_ref and definition_digest."

      - name: build_repair_state
        type: object
        required: false
        description: "Legacy repair observations only; retain original counts and evidence, never use as continuation authority. The canonical progress_state owns the shared guard."

      - name: progress_state
        type: object
        required: conditional
        condition: "repeated or persisted semantic work has a progress consumer"
        description: "Canonical ProgressState v1 in the existing task/journal context; see tools/progress/operating-guidance.md and ProgressState.parse in stagnation.py."
        validation: "Independent outcome/guard, policy source, assessed history, evidence and current action admission are retained; derive counts, reject replay, preserve completed-cycle-before-blocker ordering; optional fixed coordinator members share one admission and complete terminal-cycle barrier under the common helper; no phase-local allowance."

    return_fields:
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED, DEVIATED, FAILED_VERIFICATION]
        description: "Worker status packet result; pre_production_red and the first GREEN final_verification may complete only their stage, never final Build."
        validation: "With active TDD, first final_verification may return stage-only DONE for passing current GREEN only with verification.result=partial and explicit pending REFACTOR rows; it cannot close Build. Final DONE/DONE_WITH_CONCERNS requires the full current cycle including passing REFACTOR. pre_production_red DONE requires exact authorizing RED, partial, and pending GREEN. Inactive TDD DONE/DONE_WITH_CONCERNS requires all due checks passing. Ordinary failures yield FAILED_VERIFICATION; no stage-only DONE closes Build or Review."
      - name: verification_stage
        type: enum
        required: conditional
        condition: "tdd_applies is true"
        enum_values: [pre_production_red, final_verification]
        description: "Active-TDD stage returned by BuilderTester; inactive-TDD returns are final_verification."
        validation: "Equals the dispatch stage. Both GREEN and REFACTOR use final_verification; the GREEN pass with REFACTOR pending is stage completion only. Build/Review requires the same ref to contain the full current canonical cycle."
      - name: red_evidence
        type: object
        required: conditional
        condition: "verification_stage == pre_production_red and tdd_applies is true and valid matching authorizing RED was observed"
        description: "When a valid matching authorizing RED was observed, return its exact current failed invocation for CodeWriter unchanged, even if another due failure keeps status FAILED_VERIFICATION. When no valid matching authorizing RED was observed, omit this field and preserve the honest BLOCKED, NEEDS_CONTEXT, or FAILED_VERIFICATION evidence."
        validation: "Required only when the exact authorizing RED was observed with the planned check, argv, cwd, target test file/name, and expected_red_failure oracle. A blocked/unstarted, unexpectedly passing, setup-failed, or wrong-reason invocation does not qualify and must omit red_evidence; no other failure authorizes production edits."
        object_fields:
          - {name: check_id, type: string, required: true, validation: "Exactly equals current_task_packet.red_check_id or inline red_check_id and resolves in both selected and applicable IDs."}
          - {name: test_file, type: string, required: true}
          - {name: test_name, type: string, required: true}
          - {name: command, type: "string[]", required: true, min_items: 1, validation: "Exactly equals the carried red_command argv."}
          - {name: cwd, type: string, required: true, validation: "Exactly equals the carried red_cwd."}
          - {name: failure_summary, type: string, required: true, description: "Concise observed failed-test evidence, not raw logs."}
          - {name: right_reason, type: string, required: true, validation: "Explains why this exact failed test demonstrates expected_red_failure; syntax, setup, and unrelated failures do not qualify."}
      - name: tdd_cycle_log_ref
        type: string
        required: conditional
        condition: "tdd_applies is true and the canonical cycle_log has started"
        description: "Actual reference to the current canonical assistant-tdd cycle_log."
        validation: "When the authorizing RED invocation starts, create the current task-journal or workflow-output cycle_log entry conforming to assistant-tdd/contracts/output.yaml#artifacts/cycle_log if no ref exists and return its actual resolvable location. Return the same ref on later partial or failed stages; omit only when no cycle_log was started. Preserve history and never reconstruct or invent phase evidence."
      - name: changed_files
        type: object[]
        required: false
        condition: "required with min_items: 1 whenever BuilderTester actually created, modified, or deleted files, including designated generated outputs or prohibited authored mutations, regardless of status; optional and may be empty or omitted only when no files were actually changed"
        min_items: 0
        description: "Actual BuilderTester file mutations: designated generated outputs/evidence logs, or any prohibited authored source/test/fixture/snapshot/helper/build configuration mutation reported as DEVIATED. Preserve every real mutation after later verification failures; never invent, suppress or silently restore changes."
        object_fields:
          - {name: path, type: string, required: true}
          - {name: change_type, type: enum, required: true, enum_values: [created, modified, deleted]}
          - {name: description, type: string, required: true}
      - name: verification
        type: object
        required: true
        description: "Commands/checks run and concise pass/fail evidence"
        object_fields:
          - name: commands
            type: string[]
            required: true
            min_items: 0
            description: "Commands actually run; may be empty for selected checks whose concrete procedure has no command, or when a required check could not run. Empty commands do not waive a selected or binding check."
          - name: result
            type: enum
            required: true
            enum_values: [passed, failed, partial, unavailable, not_run, not_applicable]
            validation: "For active TDD, first final_verification records current GREEN but aggregates partial with explicit pending REFACTOR even when checks pass; after actual refactor.changes_made and executed current REFACTOR invocations or validated unchanged GREEN reuse, passing due checks may aggregate passed. Inactive TDD uses ordinary final verification. Passed requires current observed or admissibly reused passing results for every due selected and binding check. Ordinary failure takes precedence. pre_production_red retains actual failed RED counts and pending GREEN. Partial, unavailable, and blocked per-check results remain gaps and never close a due selected or binding check; not_run means a due required check could not run and requires NEEDS_CONTEXT or BLOCKED; not_applicable requires no due selected or binding check applies."
          - name: evidence
            type: string[]
            required: true
            min_items: 1
            description: "Concise result evidence, not raw logs. When commands is empty for a no-command check, identify the concrete procedure performed and its observed result; an empty command list alone is not evidence."
      - name: validation_results
        type: object[]
        required: true
        min_items: 1
        description: "Per-check results preserving selected CheckSpec and applicable binding identity for the separated-workers lane"
        validation: "Each row binds exact IDs/tuples to actual current procedure/oracle; started commands require exact selected CheckSpec argv/cwd. In active TDD, pre_production_red retains matching failed RED and pending GREEN; first final_verification retains current GREEN but aggregates partial with REFACTOR pending; second final_verification after CodeWriter refactor records REFACTOR and closes the cycle for actual refactor edits; a no-change REFACTOR closes through validated unchanged GREEN reuse (verification_disposition=reuse_green, zero new invocations) without another dispatch. Inactive TDD uses ordinary final verification. Ordinary failure yields FAILED_VERIFICATION; blocked per-check results remain gaps. Partial and unavailable are explicit gaps and never close a due check or establish sufficiency. Blocked is a distinct explicit gap and never closes a due check or establishes sufficiency."
        object_fields:
          - {name: command_or_check, type: string, required: true}
          - {name: result, type: enum, required: true, enum_values: [passed, failed, partial, unavailable, skipped, not_applicable, blocked]}
          - {name: evidence, type: string, required: true}
          - {name: selected_check_ids, type: "string[]", required: true}
          - name: executed_command
            type: object
            required: conditional
            condition: "a command-based selected CheckSpec was started, regardless of outcome"
            validation: "check_id is the sole selected_check_ids value and resolves exactly once in the unchanged verification_decision; argv and cwd exactly equal that CheckSpec.command.argv and CheckSpec.command.cwd."
            object_fields:
              - {name: check_id, type: string, required: true}
              - {name: argv, type: "string[]", required: true, min_items: 1}
              - {name: cwd, type: string, required: true}
          - name: binding_obligation_refs
            type: object[]
            required: true
            object_fields:
              - {name: kind, type: enum, required: true, enum_values: [required_scope, prohibited_scope, required_tdd, required_check, resource_constraint]}
              - {name: value, type: string, required: true}
              - {name: source_ref, type: string, required: true}
      - name: architecture_obligation_coverage
        type: object[]
        required: conditional
        condition: "build_execution_lane == separated_workers and current_task_packet.architecture_test_obligations is present"
        min_items: 1
        description: "Exact-once Architecture Decision Pack obligation coverage produced by the selected Build owner"
        validation: "Each carried architecture_test_obligations obligation is represented exactly once by obligation_id; no coverage entry has an unknown or duplicate id."
        object_fields:
          - name: obligation_id
            type: string
            required: true
          - name: architecture_decision_pack_ref
            type: string
            required: true
          - name: obligation_kind
            type: enum
            required: true
            enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
          - name: evidence
            type: string
            required: true
          - name: outcome
            type: enum
            required: true
            enum_values: [covered, blocked, explicit_unknown]
      - name: artifact_refs
        type: object[]
        required: false
        condition: "required with min_items: 1 when current_task_packet.artifact_refs is present or harness_capable == true; optional and may be empty or omitted when verification.result is not_run for NEEDS_CONTEXT or BLOCKED"
        min_items: 0
        description: "Typed Artifact Reference entries validated or produced by BuilderTester; include verification_evidence refs and validation_status updates for Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, changed files, and plan deviation refs."
        object_fields:
          - name: artifact_id
            type: string
            required: true
          - name: artifact_type
            type: enum
            required: true
            enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, verification_decision, evidence_assessment, plan_deviation, task_packet, context_map, architecture_decision_pack, change_impact_evidence, test_result, review_result, qa_evaluation_result]
          - name: producer
            type: string
            required: true
          - name: consumer
            type: string
            required: true
          - name: location_ref
            type: string
            required: true
            description: "Typed location/ref pointer: file path, section heading, dispatch id, command ref, or stable artifact ref"
          - name: schema_or_contract
            type: string
            required: true
          - name: validation_status
            type: enum
            required: true
            enum_values: [pending, valid, invalid, stale, not_applicable]
          - name: summary
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "status in [NEEDS_CONTEXT, BLOCKED]"
        description: "Questions or blocker details the orchestrator must resolve"
      - name: build_result
        type: enum
        required: true
        enum_values: [passed, failed, not_run, not_applicable]
        description: "Derive build applicability from the concrete due selected CheckSpecs and resolved binding constraints; do not infer it from file type, command presence, method, or technique alone. Use passed only for current successful evidence; executed failure blocks completion. Use not_run for a blocked/unstarted required build, another executed failure, pending GREEN during a valid pre_production_red stage, or pending GREEN/REFACTOR in an active-TDD stage-only return with verification.result=partial; this never establishes final Build sufficiency. Retain actual outcomes and pending rows; never label unstarted work failed. Use not_applicable only when no due selected or binding build check applies and no build was executed."
      - name: build_errors
        type: string[]
        required: false
        condition: "when build_result is failed"
        description: "Concise error descriptions — not raw logs"
      - name: test_summary
        type: object
        required: true
        description: "Actual test counts for selected or binding automated-test checks. In pre_production_red, include the expected failed RED in failed; never normalize it to passed. Zero counts mean no tests were executed; they do not mean required tests passed. Applicability comes from due selected CheckSpecs and resolved binding constraints, not file type, command presence, method, or technique alone."
        object_fields:
          - name: passed
            type: int
            required: true
            description: "Number of tests observed passing; zero means none passed, including when no tests ran."
          - name: failed
            type: int
            required: true
            description: "Number of tests observed failing; required test checks without results remain gaps."
          - name: skipped
            type: int
            required: true
            description: "Number of tests observed skipped; skipped required checks remain gaps."
      - name: test_failures
        type: object[]
        required: false
        condition: "test_summary.failed > 0"
        object_fields:
          - name: test_name
            type: string
            required: true
          - name: error
            type: string
            required: true
            description: "Concise error — assertion message + expected/actual, not stack trace"
    on_missing_field: "Re-dispatch BuilderTester. status, verification, build_result, and test_summary are never optional; return tdd_cycle_log_ref after any active-TDD cycle starts, even for partial or failed work. A passing GREEN-only final_verification must retain partial plus pending REFACTOR and cannot close Build; typed artifact_refs remain required when the task packet carried them or harness_capable == true."

  # ─────────────────────────────────────────────
# Reviewer and QAEvaluator worker packet schemas are owned by assistant-review.
# Workflow routes the Review phase and consumes only validated canonical results.
delegated_skill_contract_owners:
  - skill: assistant-review
    contract_ref: assistant-review/contracts/handoffs.yaml
    owns: [orchestrator_to_reviewer, orchestrator_to_qa_evaluator]
    workflow_consumes: [final_summary, qa_evaluation_result]

# Validation behavior for all handoffs:
#
# 1. Before dispatching: verify all required context_fields are populated
# 2. After return: verify all required return_fields are present, including the worker status packet
# 3. If on_missing_field action is "re-dispatch": use the same shared task guard with the exact missing-field request
# 4. Continue authorized missing-field correction under the shared task guard; on an actual blocker or stall, log the gap and use policy-allowed Build/execution direct fallback (never for formal review, QA acceptance or research-lens isolation), BLOCKED, or an honest degraded result with explicit gaps/evidence; never fabricate required fields
# 5. When CodeWriter returns blocker_type, the orchestrator records the blocker evidence and routes to debugging, explorer, architect, candidate_search, replan, restart, user clarification, environment fix, or permission request. Do not ask CodeWriter to widen scope or patch blindly through a legacy blocker.
# 6. Never silently proceed with missing required fields — always log what was missing and how the missing evidence was resolved, deferred, or blocked
# ─────────────────────────────────────────────
