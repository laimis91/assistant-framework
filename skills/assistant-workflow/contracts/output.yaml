# Workflow Output Contract
# Defines what a completed workflow MUST produce.
# Any agent executing this skill MUST verify all required artifacts exist
# before printing --- WORKFLOW COMPLETE ---.

schema_version: "4.0"
contract: output
skill: assistant-workflow

# Completion evidence is tiered so small/low-risk work does not inherit the
# full medium+ harness. Artifact definitions below remain the source of truth;
# these tiers define which artifacts are required by default for each class.
# controller_intensity maps onto these tiers and gate_tiers: light -> small,
# standard -> ordinary medium+ non-harness, strict -> large/critical or
# explicit strict/harness/QA criteria.
completion_tiers:
  small:
    controller_intensity: light
    required_artifacts: [completion_policy, changed_files, validation_results, fresh_review_result]
    conditional_artifacts: [triage_result, subagent_evidence, build_repair_state, test_results, debugging_result, artifact_contract, task_state_reconciliation, requirement_acceptance_map, final_handoff, plan_document, manual_test_steps, manual_verification_result, learning_controller, workflow_experiment_ledger, loop_readiness_assessment]
    review_gate: "fresh review after relevant validation; full independent review only when risk or another trigger promotes the work"
    checkpoint_policy: "an inline scope/check summary is enough; include an inline plan only when plan_mode=inline. Exact phase markers are required only by strict intensity, explicit project policy, or user request"
  medium:
    controller_intensity: standard
    intensity_policy: "ordinary medium+ non-harness work keeps harness_capable=false and qa_evaluation_mode=not_required by default; standard does not require Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation."
    required_artifacts: [completion_policy, triage_result, changed_files, validation_results, subagent_evidence, spec_review_result, review_result, requirement_acceptance_map, final_handoff]
    conditional_artifacts: [test_results, build_repair_state, plan_document, task_state_reconciliation, task_journal, context_map, slice_manifest, single_slice_rationale, slice_verification_summary, slice_review_evidence, metrics_entry, manual_test_steps, manual_verification_result, learning_controller, candidate_search_result, workflow_experiment_ledger, loop_readiness_assessment, done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, artifact_reference_ledger, qa_evaluation_result]
    review_gate: "spec review plus code quality review, with independent QA evaluation when required and evidence matched to the approved plan"
    checkpoint_policy: "task journal or carried-forward state records phase transitions; visible updates use concise natural language unless exact markers were explicitly triggered"
  large_critical:
    controller_intensity: strict
    required_artifacts: [completion_policy, triage_result, phase_checkpoints, changed_files, test_results, validation_results, subagent_evidence, spec_review_result, review_result, requirement_acceptance_map, final_handoff, task_journal, context_map, context_budget_note, slice_manifest, slice_verification_summary]
    conditional_artifacts: [debugging_result, build_repair_state, plan_document, artifact_contract, task_state_reconciliation, pattern_retrieval_note, decomposition_plan_review, single_slice_rationale, slice_review_evidence, metrics_entry, manual_test_steps, manual_verification_result, learning_controller, candidate_search_result, workflow_experiment_ledger, loop_readiness_assessment, done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, artifact_reference_ledger, qa_evaluation_result, verified_skill_distillation]
    review_gate: "full strict evidence, security/operability review when applicable, QA evaluation when required, and all slice criteria verified"
    checkpoint_policy: "explicit phase checkpoints are required"

artifacts:
  - name: triage_result
    type: object
    required: conditional
    condition: "size in [medium, large, mega] or risk_tier in [high, critical]"
    validation: "Contains task_type, risk_tier, size, controller_intensity, plan_mode, required_gates, required_agents, subagent policy state, execution mode, trigger scope, search_mode, and candidate_scope_scan selected during Triage"
    on_fail: "Return to TRIAGE and populate task_type, risk_tier, size, controller_intensity, plan_mode, required_gates, required_agents or fallback roles, subagent policy state, execution mode, trigger scope, search_mode, and candidate_scope_scan"
    object_fields:
      - name: task_type
        type: enum
        required: true
        enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
      - name: risk_tier
        type: enum
        required: true
        enum_values: [low, moderate, high, critical]
      - name: size
        type: enum
        required: true
        enum_values: [small, medium, large, mega]
      - name: controller_intensity
        type: enum
        required: true
        enum_values: [light, standard, strict]
        validation: "Maps to completion_tiers and gate_tiers. standard is used for ordinary medium+ non-harness work and does not require Done Contract, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation by default; strict requires independent strict, harness, or QA criteria. Do not infer strict from size=medium+ or delegation alone."
      - name: plan_mode
        type: enum
        required: true
        enum_values: [none, inline, approval_required]
        validation: "Matches task size, risk, uncertainty, reversibility, approval policy, and the input contract eligibility rules"
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [inline_direct, bounded_executor, separated_workers]
        validation: "Ordinary medium standard-risk work defaults to bounded_executor; separated_workers requires high/critical risk, broad/noisy/environment-heavy verification, independent TDD evidence, or explicit separation"
      - name: workflow_state_mode
        type: enum
        required: true
        enum_values: [inline, journal]
        validation: "journal is selected only when persistence, delegation, cross-session continuation, clarification wait, strict, harness, required QA, or explicit durable-state criteria apply; size alone does not require it"
      - name: manual_verification_mode
        type: enum
        required: true
        enum_values: [not_required, optional, required]
        validation: "required only for explicit, subjective/UI, external-effect, destructive/migration, or inadequate-automation triggers"
      - name: learning_capture_mode
        type: enum
        required: true
        enum_values: [auto, not_required, required]
        validation: "normal work uses auto; auto activates only for concrete review findings, build/test failures, user corrections, or memory trend signals; journal mode records those triggers in Learning evidence signals as none or review_finding, build_test_failure, user_correction, and memory_trend; not_required requires a policy_disallowed: or explicit_exclusion: reason"
      - name: required_gates
        type: string[]
        required: true
        validation: "At least the common gates plus every applicable task-category gate pack"
      - name: required_agents
        type: string[]
        required: true
        validation: "Required workflow roles and skills selected from size, task type, and risk tier"
      - name: subagent_policy_state
        type: enum
        required: true
        enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
        validation: "Resolved before any subagent dispatch. When required_agents is non-empty, applicable direct-user, AGENTS.md, or active-skill instructions set delegation_triggered; explicit user opt-out, real unavailability, or evidenced policy_disallowed select fallback."
      - name: subagent_execution_mode
        type: enum
        required: true
        enum_values: [delegated, direct_fallback, not_applicable]
        validation: "delegated requires delegation_triggered; direct_fallback preserves equivalent role evidence and requires delegation_opted_out, subagents_unavailable, or policy_disallowed evidence; not_applicable means no subagent role is needed."
      - name: subagent_trigger_scope
        type: string[]
        required: true
        validation: "Non-empty when delegation is relevant; records direct-user, applicable-AGENTS.md, or active-skill provenance and covered roles, phases, and actions."
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "subagent_policy_state == policy_disallowed"
        validation: "Non-empty exact active blocking rule that confirms no applicable user, AGENTS, or skill exception permits delegation"
      - name: search_mode
        type: enum
        required: true
        enum_values: [none, lightweight, candidate_search]
        validation: "Selected during Triage from uncertainty, alternatives, optimization pressure, repeated failures, unclear bugs, and reviewer-requested pivots"
      - name: candidate_scope_scan
        type: object
        required: true
        description: "Quick read-only scan used during Triage to avoid prompt-only size/risk classification"
        validation: "Summarizes likely touched paths, symbols/search terms checked, adjacent verification/reference surfaces, confidence, and unknowns"
        object_fields:
          - name: likely_touched_paths
            type: string[]
            required: true
            validation: "Exact paths when known; otherwise directories/modules or unknown with reason"
          - name: symbols_or_terms_searched
            type: string[]
            required: true
            validation: "Search terms, symbols, or commands checked; use an explicit none-with-reason entry only when no local scan is useful"
          - name: adjacent_surfaces
            type: string[]
            required: true
            validation: "Tests, docs, contracts, config, generated mirrors, APIs, or runtime surfaces that Discover should inspect or mark not applicable"
          - name: confidence
            type: enum
            required: true
            enum_values: [low, medium, high]
          - name: unknowns
            type: string[]
            required: true
            validation: "Remaining scope/risk unknowns for Discover, or empty when confidence is high"

  - name: completion_policy
    type: object
    required: true
    condition: "always"
    description: "Compact adaptive-completion selection carried in the inline packet or task journal."
    validation: "Records controller intensity, plan mode, and all three execution/completion modes with concrete trigger reasons; mode selection does not infer ceremony from task size alone."
    on_fail: "Resolve and record controller_intensity, plan_mode, workflow_state_mode, manual_verification_mode, and learning_capture_mode before completion."
    object_fields:
      - name: controller_intensity
        type: enum
        required: true
        enum_values: [light, standard, strict]
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [inline_direct, bounded_executor, separated_workers]
      - name: plan_mode
        type: enum
        required: true
        enum_values: [none, inline, approval_required]
      - name: workflow_state_mode
        type: enum
        required: true
        enum_values: [inline, journal]
      - name: manual_verification_mode
        type: enum
        required: true
        enum_values: [not_required, optional, required]
      - name: learning_capture_mode
        type: enum
        required: true
        enum_values: [auto, not_required, required]
      - name: selection_reason
        type: string
        required: true
        validation: "Names the concrete plan, state, manual-verification, and learning triggers or states that none apply. The learning reason uses normal_default:, explicit_request:, approved_plan:, policy_disallowed:, or explicit_exclusion:; not_required accepts only the last two."

  - name: phase_checkpoints
    type: string[]
    required: conditional
    condition: "controller_intensity == strict or explicit project policy requires exact phase markers or user requested exact phase markers"
    validation: >
      When required, must contain paired entries for every phase that ran:
      '--- PHASE: {name} ---' at start and '--- PHASE: {name} COMPLETE ---' at end.
      Light/standard work without an exact-marker trigger records concise natural progress instead.
    on_fail: "When exact markers were required, reconstruct phase_checkpoints from executed phases or re-run missing phase gates before completion"
    minimum_entries_rule: >
      Require the TRIAGE start marker plus paired start/complete markers for
      every phase that actually ran. PLAN contributes no markers when
      plan_mode=none; DECOMPOSE and DESIGN contribute only when selected.
      Slice-local Build checkpoints are additional for mega work.

  - name: changed_files
    type: object[]
    required: true
    condition: always
    validation: "At least 1 entry unless task was determined unnecessary during Discovery"
    on_fail: "List changed files or record that Discovery determined no change was necessary"
    object_fields:
      - name: path
        type: string
        required: true
        validation: "Relative file path that exists in the project"
      - name: change_type
        type: enum
        required: true
        enum_values: [created, modified, deleted]
      - name: description
        type: string
        required: true
        validation: "1 sentence explaining what changed and why"

  - name: debugging_result
    type: object
    required: conditional
    condition: "task_type == bugfix and debugging_mode in [root_cause_unknown, completed, blocked] or assistant-debugging was used"
    description: "Evidence-first debugging summary for bugfixes whose cause was unknown or needed confirmation"
    validation: "Must summarize reproduction, hypotheses, root cause status, confidence, residual risks, and whether/why the task transitioned into assistant-tdd"
    on_fail: "Load assistant-debugging, reproduce or record the blocker, evaluate competing hypotheses, and populate debugging evidence before implementation or TDD handoff"
    object_fields:
      - name: status
        type: enum
        required: true
        enum_values: [fixed, root_cause_found, mitigated, not_reproduced, blocked, inconclusive]
      - name: reproduction_status
        type: enum
        required: true
        enum_values: [yes, no, blocked, partial]
      - name: hypotheses_count
        type: int
        required: true
        validation: ">= 3 unless fewer_hypotheses_reason is populated in assistant-debugging output"
      - name: root_cause
        type: string
        required: true
        validation: "Confirmed cause, mitigation target, or explicit unknown/inconclusive status"
      - name: confidence
        type: enum
        required: true
        enum_values: [high, medium, low]
      - name: transition_to_tdd
        type: enum
        required: true
        enum_values: [ready, not_applicable, blocked]
        validation: "ready only when a meaningful regression test can be written from debugging evidence"
      - name: residual_risks
        type: string[]
        required: true

  - name: test_results
    type: object
    required: true
    condition: "runnable tests exist or task changes behavior"
    validation: "passed + failed + skipped must equal total tests run. failed must be 0 at workflow completion. Use validation_results when tests are not applicable."
    on_fail: "Re-run tests or move non-test verification to validation_results with explicit not-applicable reason for tests"
    object_fields:
      - name: passed
        type: int
        required: true
        validation: ">= 0 (may be 0 only when tests were not applicable and validation_results is populated)"
      - name: failed
        type: int
        required: true
        validation: "Must be 0 at workflow completion"
      - name: skipped
        type: int
        required: true

  - name: validation_results
    type: object[]
    required: true
    condition: "always"
    validation: "At least one test, build, lint, typecheck, inspection, dry-run, or manual validation entry with result=passed must be recorded for completed implementation workflows. Docs-only/no-op/discovery tasks may complete without passed validation only when the reason is explicitly recorded. Skipped/not_applicable entries do not satisfy completion evidence."
    on_fail: "Run an appropriate verification and record passed evidence, or record an explicit docs-only/no-op/discovery exception reason"
    object_fields:
      - name: command_or_check
        type: string
        required: true
      - name: result
        type: enum
        required: true
        enum_values: [passed, failed, skipped, not_applicable]
      - name: evidence
        type: string
        required: true

  - name: fresh_review_result
    type: object
    required: conditional
    condition: "controller_intensity == light"
    description: "Compact review performed after relevant validation with fresh attention to carried Discover scope/criteria, any applicable inline plan, changed files, and acceptance criteria."
    validation: "Result is PASS, reviewed_scope names the changed surface, findings are empty or resolved, and evidence identifies the diff/validation inspected."
    on_fail: "Run a fresh post-validation review, fix findings, rerun relevant validation, and record PASS evidence before completing light work."
    object_fields:
      - name: result
        type: enum
        required: true
        enum_values: [PASS]
      - name: reviewed_scope
        type: string
        required: true
      - name: findings
        type: string[]
        required: true
        validation: "Empty or contains only explicitly resolved findings."
      - name: evidence
        type: string
        required: true

  - name: review_result
    type: object
    required: conditional
    condition: "controller_intensity in [standard, strict] or risk_tier in [high, critical]"
    description: "Stage 2 assistant-review quality result only. Spec compliance is recorded in spec_review_result. Workflow consumes validated references to canonical assistant-review artifacts and does not restate their schemas."
    validation: "canonical_result_ref resolves to a validated assistant-review final_summary; delegation_path_ref resolves to its review_delegation_path; both declare their exact canonical contracts. QA evaluation does not replace review_result, and final_handoff remains Document-owned."
    on_fail: "Load and follow assistant-review, validate its final_summary and review_delegation_path, and record stable refs plus exact canonical contracts before Review completes."
    object_fields:
      - name: canonical_result_ref
        type: string
        required: true
        description: "Stable task-journal, dispatch, or artifact ref to the validated assistant-review final_summary"
      - name: canonical_contract
        type: string
        required: true
        validation: "Must equal assistant-review/contracts/output.yaml#final_summary"
      - name: delegation_path_ref
        type: string
        required: true
        description: "Stable ref to the validated assistant-review review_delegation_path"
      - name: delegation_contract
        type: string
        required: true
        validation: "Must equal assistant-review/contracts/output.yaml#review_delegation_path"
      - name: validation_status
        type: enum
        required: true
        enum_values: [validated]

  - name: qa_evaluation_result
    type: object
    required: conditional
    condition: "qa_evaluation_mode == required"
    description: "Workflow reference wrapper for canonical assistant-review QA artifacts. QA evaluation does not replace review_result."
    validation: "canonical_result_ref resolves to a validated assistant-review qa_evaluation_result; delegation_path_ref resolves to its qa_evaluation_delegation_path; both declare their exact canonical contracts."
    on_fail: "Load and follow the assistant-review QA loop, validate its canonical QA result and delegation path, and record stable refs. Do not substitute Code Reviewer findings for QA evaluation."
    object_fields:
      - name: canonical_result_ref
        type: string
        required: true
        description: "Stable task-journal, dispatch, or artifact ref to the validated assistant-review qa_evaluation_result"
      - name: canonical_contract
        type: string
        required: true
        validation: "Must equal assistant-review/contracts/output.yaml#qa_evaluation_result"
      - name: delegation_path_ref
        type: string
        required: true
        description: "Stable ref to the validated assistant-review qa_evaluation_delegation_path"
      - name: delegation_contract
        type: string
        required: true
        validation: "Must equal assistant-review/contracts/output.yaml#qa_evaluation_delegation_path"
      - name: validation_status
        type: enum
        required: true
        enum_values: [validated]

  - name: spec_review_result
    type: object
    required: conditional
    condition: "size in [medium, large, mega] or risk_tier in [high, critical]"
    validation: >
      Dedicated Stage 1 spec compliance result from references/prompts/spec-review.md.
      Must be distinct from assistant-review quality findings. At completion, status must
      be PASS and required_fixes must be empty or fully resolved.
    on_fail: "Run dedicated spec compliance review until status is PASS and required fixes are empty or resolved"
    object_fields:
      - name: status
        type: enum
        required: true
        enum_values: [PASS]
      - name: scope_reviewed
        type: string
        required: true
        validation: "Plan step(s), task packet(s), or slice(s) reviewed"
      - name: missing_acceptance_criteria
        type: string[]
        required: true
        validation: "Empty only when none are missing"
      - name: extra_scope
        type: string[]
        required: true
        validation: "Empty only when no unapproved extra scope remains"
      - name: changed_files_mismatch
        type: string[]
        required: true
        validation: "Empty only when actual changed files match approved scope or approved deviations"
      - name: verification_evidence_mismatch
        type: string[]
        required: true
        validation: "Empty only when recorded evidence matches required commands, success signals, and criteria"
      - name: required_fixes
        type: string[]
        required: true
        validation: "Must be empty or explicitly resolved before workflow completion"

  - name: learning_controller
    type: object
    required: conditional
    condition: "learning_capture_mode == required or (learning_capture_mode == auto and concrete lesson-bearing review finding, build/test failure, user correction, or memory trend evidence exists)"
    description: "Document-phase learning decision that reviews review/build/user-correction evidence and either persists durable lessons or records why nothing was saved"
    validation: "Task journal or equivalent workflow output contains a canonical '### Learning Controller' block with memory trend status, evidence reviewed, review findings considered, build/test failures considered, user corrections considered, durable lesson decision, and persistence evidence or no-save rationale"
    on_fail: "During Document, add the Learning Controller block by checking memory trends when available, reviewing Review Log findings, build/test failures, and user corrections, then recording a durable-save/no-save decision. Do not save random task progress as a lesson."
    object_fields:
      - name: memory_trend_checked
        type: enum
        required: true
        enum_values: [checked, backend_unavailable, policy_disallowed, not_configured]
        validation: "checked only when a configured local memory trend/backend check actually ran; otherwise use the explicit unavailable or policy outcome"
        on_missing: fail
      - name: learning_evidence_reviewed
        type: object[]
        required: true
        validation: "At least one entry summarizing the review/build/user-correction evidence considered, or one none entry explaining that no lesson-bearing evidence existed"
        min_items: 1
        on_missing: fail
        object_fields:
          - name: evidence_type
            type: enum
            required: true
            enum_values: [review_finding, build_test_failure, user_correction, memory_trend, none]
            on_missing: fail
          - name: source_reference
            type: string
            required: true
            validation: "Review Log heading, Builder/Tester result, user correction text reference, memory tool evidence, or explicit none-with-reason"
            on_missing: fail
          - name: summary
            type: string
            required: true
            validation: "Concrete evidence summary; routine task progress alone is invalid"
            on_missing: fail
      - name: review_findings_considered
        type: string[]
        required: true
        validation: "Review findings assessed for durable lessons, or a single explicit none-with-reason entry"
        on_missing: fail
      - name: build_test_failures_considered
        type: string[]
        required: true
        validation: "Build/test failures assessed for durable lessons, or a single explicit none-with-reason entry"
        on_missing: fail
      - name: user_corrections_considered
        type: string[]
        required: true
        validation: "User corrections assessed for durable lessons, or a single explicit none-with-reason entry"
        on_missing: fail
      - name: durable_lesson_decision
        type: enum
        required: true
        enum_values: [durable_saved, durable_updated, skipped_not_durable, backend_unavailable, policy_disallowed, refused_sensitive]
        validation: "durable_saved/durable_updated require backend persistence evidence; skip outcomes require a concrete no-save rationale"
        on_missing: fail
      - name: persistence_evidence
        type: string
        required: conditional
        condition: "durable_lesson_decision in [durable_saved, durable_updated]"
        validation: "Names the configured memory/reflexion backend or tool call evidence used to persist the lesson"
        on_missing: fail
      - name: no_save_rationale
        type: string
        required: conditional
        condition: "durable_lesson_decision in [skipped_not_durable, backend_unavailable, policy_disallowed, refused_sensitive]"
        validation: "Explains why no durable memory write occurred, including backend unavailable or policy-disallowed outcomes when applicable"
        on_missing: fail

  - name: manual_test_steps
    type: string[]
    required: conditional
    condition: "manual_verification_mode == required"
    validation: "At least 1 actionable step the user can follow to verify the change"
    on_fail: "Add actionable manual validation steps or state why manual validation is not applicable"

  - name: manual_verification_result
    type: object
    required: conditional
    condition: "manual_verification_mode == required"
    description: "Evidence for the exceptional manual acceptance gate; it does not require ritual user confirmation when an equivalent observation proves the result."
    validation: "trigger is one allowed reason, result is passed, and evidence names the observation, user report, external check, or manual run that passed."
    on_fail: "Perform the scoped manual verification, record passed evidence, or return blocked without claiming workflow completion."
    object_fields:
      - name: trigger
        type: enum
        required: true
        enum_values: [explicit_request, subjective_or_ui, external_effect, destructive_or_migration, automated_verification_inadequate]
      - name: result
        type: enum
        required: true
        enum_values: [passed]
      - name: evidence
        type: string
        required: true

  - name: subagent_evidence
    type: object
    required: conditional
    condition: "controller_intensity in [standard, strict] and development/code-work task changes project source, tests, docs, config, contracts, runtime integrations, or generated project artifacts"
    description: "Standard/strict completion evidence whose Build and Review responsibilities are recorded separately."
    validation: "Evidence matches build_execution_lane. Build records only selected-lane implementation/verification evidence: one bounded executor or Code Writer plus Builder/Tester. Independent Code Reviewer evidence remains required at completion for both lanes, but Review owns and emits it after Build. direct_fallback preserves the same phase ownership with an explicit policy reason."
    on_fail: "Record selected-lane Build evidence, then record Review-owned independent Code Reviewer evidence after Build. Do not require reviewer evidence to leave Build or invent Builder/Tester dispatch in bounded_executor mode."
    object_fields:
      - name: execution_mode
        type: enum
        required: true
        enum_values: [delegated, direct_fallback]
      - name: required_roles
        type: string[]
        required: true
        validation: "bounded_executor includes one executor and Code Reviewer; separated_workers includes Code Writer, Builder/Tester, and Code Reviewer. Reviewer compatibility is legacy-only when explicit."
      - name: build_execution_lane
        type: enum
        required: true
        enum_values: [bounded_executor, separated_workers]
      - name: bounded_executor_evidence
        type: object
        required: conditional
        condition: "build_execution_lane == bounded_executor"
        validation: "Contains executor dispatch/direct evidence, valid RED when TDD applies, changed files, focused verification, and regression evidence"
      - name: separated_worker_evidence
        type: object
        required: conditional
        condition: "build_execution_lane == separated_workers"
        validation: "Contains Code Writer and Builder/Tester dispatch/direct evidence with verification results"
      - name: delegated_dispatch_results
        type: object[]
        required: conditional
        condition: "execution_mode == delegated"
        validation: "Each required role has dispatch and result evidence in the phase that owns it; reviewer evidence is emitted during Review, not Build."
      - name: direct_fallback_reason
        type: enum
        required: conditional
        condition: "execution_mode == direct_fallback"
        enum_values: [delegation_opted_out, subagents_unavailable, policy_disallowed]
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "execution_mode == direct_fallback and direct_fallback_reason == policy_disallowed"
        validation: "Non-empty exact active blocking rule that confirms no applicable user, AGENTS, or skill exception permits delegation"
      - name: direct_fallback_role_evidence
        type: object[]
        required: conditional
        condition: "execution_mode == direct_fallback"
        validation: "Contains equivalent selected-lane Build evidence and separately labeled Review-owned Code Reviewer evidence."
      - name: per_slice_dispatch_evidence
        type: object[]
        required: conditional
        condition: "size in [medium, large, mega] and execution_mode == delegated and slices apply"
      - name: code_reviewer_evidence
        type: object
        required: true
        description: "Independent Code Reviewer dispatch/result or fresh direct-fallback review evidence created during Review after Build completes"
        validation: "Names Review as owner, identifies the reviewed scope, and references review_result evidence; it cannot be used to satisfy a Build exit gate."
        object_fields:
          - name: phase_owner
            type: enum
            required: true
            enum_values: [REVIEW]
          - name: reviewer_ref
            type: string
            required: true
          - name: result_ref
            type: string
            required: true
      - name: qa_evaluator_evidence
        type: object
        required: conditional
        condition: "qa_evaluation_mode == required"
        validation: "Contains QAEvaluator dispatch/result evidence in delegated mode, or QAEvaluator direct evidence with fallback reason in direct_fallback mode"
        object_fields:
          - name: qa_evaluator_dispatch
            type: string
            required: false
            description: "QAEvaluator subagent/tool/run id when delegated"
          - name: qa_evaluator_result
            type: string
            required: true
            description: "Final QA verdict/result evidence"
          - name: qa_evaluator_direct_evidence
            type: string
            required: false
            description: "Fresh QA evidence when direct_fallback"

  - name: task_state_reconciliation
    type: object
    required: conditional
    condition: "persisted task state exists at entry, continuation, compaction recovery, or handoff"
    description: "Freshness classification proving whether persisted state may be resumed"
    validation: "Compares task identity, newest user goal, repository root, recorded/current branch and HEAD when available, and last verified evidence; only active may resume"
    on_fail: "Load references/task-state-reconciliation.md, classify the state, repair or supersede it, and do not act on its next step until reconciled"
    object_fields:
      - name: task_identity
        type: string
        required: true
        on_missing: fail
      - name: repository_root
        type: string
        required: true
        on_missing: fail
      - name: recorded_repository_identity
        type: string
        required: true
        on_missing: fail
      - name: current_repository_identity
        type: string
        required: true
        on_missing: fail
      - name: latest_user_goal_ref
        type: string
        required: true
        on_missing: fail
      - name: classification
        type: enum
        required: true
        enum_values: [active, stale, superseded, completed]
        on_missing: fail
      - name: reason
        type: string
        required: true
        on_missing: fail
      - name: evidence
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: exact_next_action
        type: string
        required: true
        on_missing: fail

  - name: requirement_acceptance_map
    type: object
    required: conditional
    condition: "size in [medium, large, mega]"
    description: "Completion traceability from accepted requirements to verification evidence"
    validation: "Every accepted requirement_id has a binary acceptance criterion, verification method, manual scenario or explicit N/A, and status=passed or approved_exclusion; approved exclusions include approval and reason"
    on_fail: "Load references/requirement-acceptance-map.md, repair missing coverage, run missing verification, or obtain explicit exclusion approval before completion"
    object_fields:
      - name: intended_outcome
        type: string
        required: true
        on_missing: fail
      - name: assumptions_and_defaults
        type: string[]
        required: true
        on_missing: fail
      - name: open_material_questions
        type: string[]
        required: true
        on_missing: fail
      - name: non_goals
        type: string[]
        required: true
        on_missing: fail
      - name: entries
        type: object[]
        required: true
        min_items: 1
        on_missing: fail
        object_fields:
          - name: requirement_id
            type: string
            required: true
            on_missing: fail
          - name: source
            type: string
            required: true
            on_missing: fail
          - name: requirement
            type: string
            required: true
            on_missing: fail
          - name: acceptance_criterion
            type: string
            required: true
            on_missing: fail
          - name: verification_method
            type: string
            required: true
            on_missing: fail
          - name: evidence_ref
            type: string
            required: true
            on_missing: fail
          - name: manual_scenario_or_na
            type: string
            required: true
            on_missing: fail
          - name: status
            type: enum
            required: true
            enum_values: [passed, approved_exclusion]
            on_missing: fail
          - name: exclusion_reason
            type: string
            required: conditional
            condition: "status == approved_exclusion"
            on_missing: fail

  - name: build_repair_state
    type: object
    required: conditional
    condition: "an ordinary non-harness Build implementation or verification failure is retried within the same approved scope"
    description: "Bounded ordinary Build repair controller state; harness-specific loops keep their existing controller artifacts"
    validation: "Fixed bounds are max_attempts 3 and no_progress_limit 2. Each attempt records normalized failure signatures and progress evidence, plan_version is stable for same-scope retries, cumulative_attempt_count never resets across worker/context/session changes, and reaching either bound sets terminal_route to pivot or block rather than another retry."
    on_fail: "Stop the retry, reconstruct the repair state from Build evidence, and create a pivot_restart_decision or return blocked before any further implementation attempt."
    object_fields:
      - name: attempt
        type: int
        required: true
        validation: ">= 1 and <= 3"
      - name: max_attempts
        type: int
        required: true
        validation: "Exactly 3"
      - name: no_progress_count
        type: int
        required: true
        validation: ">= 0 and <= 2; reset only when new evidence proves measurable progress"
      - name: no_progress_limit
        type: int
        required: true
        validation: "Exactly 2"
      - name: failure_signatures
        type: string[]
        required: true
        min_items: 1
        validation: "Normalized signatures for the current and prior same-scope failures"
      - name: progress_evidence
        type: string[]
        required: true
        min_items: 1
        validation: "Concrete changed failure, passing check, reduced failing scope, or explicit no-progress evidence"
      - name: plan_version
        type: string
        required: true
        validation: "Stable approved-plan or no-plan task identity; changing it requires replan/reapproval before retry"
      - name: cumulative_attempt_count
        type: int
        required: true
        validation: ">= attempt and <= 3; never resets on redispatch, context reset, compaction, or continuation"
      - name: status
        type: enum
        required: true
        enum_values: [repairing, recovered, terminal_pivot, blocked]
      - name: terminal_route
        type: enum
        required: conditional
        condition: "status in [terminal_pivot, blocked]"
        enum_values: [debugging, replan, restart_with_reapproval, block_for_user, block_for_environment]
      - name: evidence_ref
        type: string
        required: true
        validation: "Pointer to validation output, task journal repair entry, or carried-forward packet evidence"

  - name: final_handoff
    type: object
    required: conditional
    condition: "size in [medium, large, mega]"
    description: "Document-owned reconstructable developer handoff defined by references/final-handoff.md; Review emits review_result but never this artifact"
    validation: "Includes changed behavior/areas, architecture decisions and rationale, rejected alternatives/tradeoffs, requirement evidence, automated verification, manual scenarios or explicit N/A, compatibility/regression surfaces, limitations/untested areas, rollback/recovery when relevant, and an evidence-bounded review claim"
    on_fail: "Load references/final-handoff.md and complete every required section before workflow completion"
    object_fields:
      - name: changed_behavior_and_areas
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: architecture_decisions_and_rationale
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: rejected_alternatives_and_tradeoffs
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: requirement_evidence
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: automated_verification
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: manual_test_scenarios
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: compatibility_and_regression_surfaces
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: known_limitations_and_untested_areas
        type: string[]
        required: true
        min_items: 1
        on_missing: fail
      - name: rollback_or_recovery
        type: string
        required: true
        on_missing: fail
      - name: review_claim
        type: string
        required: true
        validation: "Evidence-bounded to reviewed scope and available evidence; does not claim proof of correctness"
        on_missing: fail

  - name: task_journal
    type: file
    required: conditional
    condition: "workflow_state_mode == journal and agent_state_dir is configured and policy allows local state artifacts"
    validation: "Ignored orchestrator-owned state artifact exists at {agent_state_dir}/task.md, contains Status: DONE and Task state: completed, and was reconciled before any continuation"
    on_fail: "Create, reconcile, or update task journal when configured and policy-allowed, or record carried-forward state fallback"
    location: "{agent_state_dir}/task.md"

  - name: context_map
    type: file
    required: conditional
    condition: "size in [medium, large, mega] and workflow_state_mode == journal and agent_state_dir is configured and policy allows local state artifacts"
    validation: "Ignored orchestrator-owned state artifact exists at {agent_state_dir}/context-map.md"
    on_fail: "Create context map when configured and policy-allowed, or include context map in carried-forward plan/task packet"
    location: "{agent_state_dir}/context-map.md"

  - name: context_budget_note
    type: object
    required: conditional
    condition: "size in [medium, large, mega] or material exceeds faithful single-context review"
    description: "Record of exact, summarized, omitted, and split/delegated context"
    validation: "Must list exact/pinned material, summarized material, omitted/deferred material, and split/delegation plan or not_applicable reason"
    on_fail: "Load references/context-budget-and-pattern-retrieval.md and add Context Budget note to plan/task packet"
    object_fields:
      - name: exact_pinned
        type: string[]
        required: true
      - name: summarized
        type: string[]
        required: true
      - name: omitted_or_deferred
        type: string[]
        required: true
      - name: split_or_delegation_plan
        type: string
        required: true

  - name: pattern_retrieval_note
    type: object
    required: conditional
    condition: "editing framework skills, contracts, evals, runtime integrations, templates, or workflow patterns"
    description: "Local pattern retrieval record used before editing framework surfaces"
    validation: "Must name real searched pattern paths/queries, canonical pattern path used, counterexample/edge case path checked, or explicit no-pattern rationale; template placeholders do not satisfy this artifact"
    on_fail: "Search local repo for similar patterns and record the result before editing"
    object_fields:
      - name: similar_patterns_searched
        type: string[]
        required: true
      - name: canonical_pattern_used
        type: string
        required: true
      - name: counterexample_or_edge_case_checked
        type: string
        required: true
      - name: no_pattern_rationale
        type: string
        required: false
      - name: external_pattern_decisions
        type: string[]
        required: false
        description: "Optional library id + relative path, concrete design force, applicability, contraindications, and use/reject decision; never contains configured roots or source bodies"

  - name: context_handoff_packet
    type: object
    required: conditional
    condition: "no task journal/equivalent carried-forward state exists, or explicit non-standard handoff is requested"
    description: "Compression-safe continuation packet following references/context-handoff-templates.md"
    validation: "Pinned context is separated from summarized/pruned context and exact next action is present"
    on_fail: "When no task journal/equivalent state exists or explicit non-standard handoff is requested, create a handoff packet with Active Task, Pinned Requirements, Work State, Verification, Context Hygiene, and Exact Next Action"
    object_fields:
      - name: active_task
        type: string
        required: true
      - name: pinned_requirements
        type: string
        required: true
      - name: work_state
        type: string
        required: true
      - name: verification
        type: string
        required: true
      - name: context_hygiene
        type: string
        required: true
      - name: exact_next_action
        type: string
        required: true


  - name: artifact_contract
    type: object
    required: conditional
    condition: "task proceeds beyond discovery into plan, build, or documentable deliverable"
    description: "Artifact-first deliverable contract that makes the user-visible output concrete before implementation"
    validation: "Must include artifact type, required files/deliverables, output format/schema, acceptance criteria, verification command/method, expected success signal, owner/consumer, and non-goals/exclusions"
    on_fail: "Load references/artifact-first-output-contract.md and define the Artifact Contract before Plan or Build"
    object_fields:
      - name: artifact_type
        type: enum
        enum_values: [code, docs, report, dataset, chart, slide_deck, plan, eval, PR, config, other]
        required: true
      - name: required_files_or_deliverables
        type: string[]
        required: true
      - name: output_format_schema
        type: string
        required: true
      - name: acceptance_criteria
        type: string[]
        required: true
      - name: verification_command_or_method
        type: string
        required: true
      - name: expected_success_signal
        type: string
        required: true
      - name: owner_consumer
        type: string
        required: true
      - name: non_goals_exclusions
        type: string[]
        required: true

  - name: artifact_reference_ledger
    type: object[]
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "Typed producer/consumer ledger for artifacts passed between subagents during harness work."
    validation: "Each entry includes artifact_id, artifact_type, producer, consumer, location_ref, schema_or_contract, validation_status, and summary; ledger covers Done Contract, Harness Recipe, Harness Run State, Trace Ledger, Replay Packet, Pivot/Restart Decision, changed files, verification evidence, and plan deviation refs when applicable."
    on_fail: "Before Build, Review, completion, or handoff, create or repair the Artifact Reference Ledger in the plan/task journal; re-dispatch the producer when a required typed artifact reference is missing, stale, invalid, or lacks a consumer validation status."
    min_items: 1
    object_fields:
      - name: artifact_id
        type: string
        required: true
        validation: "Stable id unique within the task run"
        on_missing: fail
      - name: artifact_type
        type: enum
        required: true
        enum_values: [done_contract, harness_recipe, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision, changed_files, verification_evidence, plan_deviation, task_packet, context_map, test_result, review_result, qa_evaluation_result]
        validation: "Classifies the artifact without requiring prose parsing"
        on_missing: fail
      - name: producer
        type: string
        required: true
        validation: "Role, subagent, automation, or task packet that created or last updated the artifact"
        on_missing: fail
      - name: consumer
        type: string
        required: true
        validation: "Role, subagent, automation, or phase expected to consume and validate the artifact"
        on_missing: fail
      - name: location_ref
        type: string
        required: true
        validation: "Typed location/ref pointer: file path, task-journal section, dispatch id, command ref, or stable artifact ref"
        on_missing: fail
      - name: schema_or_contract
        type: string
        required: true
        validation: "Contract, schema, template, or required fields the consumer validates before use"
        on_missing: fail
      - name: validation_status
        type: enum
        required: true
        enum_values: [pending, valid, invalid, stale, not_applicable]
        validation: "Consumer-visible validation state; invalid or stale entries block phase advancement"
        on_missing: fail
      - name: summary
        type: string
        required: true
        validation: "Concise description of the artifact and its current state"
        on_missing: fail

  - name: done_contract
    type: object
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "Accepted pre-Build Done Contract for harness-capable work"
    validation: "Must include done_when, not_done_when, verification, owner_consumer, acceptance_criteria, debate_record with at least two perspectives, and accepted_by before Build starts"
    on_fail: "Block Build, load references/harness-controller.md, return to Plan, write the missing Done Contract, collect at least two debate perspectives using subagents when delegated mode is available, and record approval or scope-change re-approval"
    object_fields:
      - name: done_when
        type: string[]
        required: true
        validation: "Pass/fail outcomes that prove the task or slice is complete"
      - name: not_done_when
        type: string[]
        required: true
        validation: "Failure states that block completion"
      - name: verification
        type: string[]
        required: true
        validation: "Commands, inspections, reviews, or manual checks that prove done"
      - name: owner_consumer
        type: string
        required: true
        validation: "Names the owner and downstream consumer of the artifact or behavior"
      - name: acceptance_criteria
        type: string[]
        required: true
        validation: "Explicit binary criteria from the user request, approved plan, or slice manifest"
      - name: debate_record
        type: object[]
        required: true
        min_items: 2
        validation: "At least two perspectives; delegated mode uses subagent perspectives when available"
        object_fields:
          - name: perspective
            type: string
            required: true
          - name: concern_or_support
            type: string
            required: true
          - name: resolution
            type: string
            required: true
      - name: accepted_by
        type: string
        required: true
        validation: "User, orchestrator, or approved plan reference that accepted the Done Contract"

  - name: harness_recipe
    type: object
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "Pre-Build controller recipe selected from task/model/risk/context profile"
    validation: "Must classify task_profile, model_profile, risk_profile, and context_profile, then name selected_recipe, recipe_rationale, required_artifacts, and corrective_action"
    on_fail: "Block Build, load references/harness-controller.md, return to Plan, classify the task/model/risk/context profile, select a Harness Recipe, and record the corrective action for missing or stale recipe evidence"
    object_fields:
      - name: task_profile
        type: string
        required: true
        validation: "Captures task type, size, slice count, and TDD/debugging applicability"
      - name: model_profile
        type: string
        required: true
        validation: "Captures agent/model constraints, delegation mode, and tool limits"
      - name: risk_profile
        type: string
        required: true
        validation: "Captures risk tier, safety gates, review depth, and rollback needs"
      - name: context_profile
        type: string
        required: true
        validation: "Captures exact, summarized, omitted/deferred context and trace/replay or handoff needs"
      - name: selected_recipe
        type: string
        required: true
        validation: "Concise recipe label from references/harness-controller.md"
      - name: recipe_rationale
        type: string
        required: true
        validation: "Explains why task/model/risk/context profile selects this recipe"
      - name: required_artifacts
        type: string[]
        required: true
        validation: "Artifacts this recipe requires before or during Build"
      - name: corrective_action
        type: string
        required: true
        validation: "Explicit action when recipe evidence is missing or no longer matches the task"

  - name: harness_run_state
    type: object
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "First-class Harness Run State artifact for recovering active harness execution after compaction, failure, or handoff."
    validation: "Must record task_id, task_name, phase, slice, status, blockers, last_verification, next_action, and recovery_pointer; update it as Build, Review, and Document progress. When a pivot/restart is active, it also records pivot_restart_decision_ref and the exact next action after restart."
    on_fail: "Pause advancement, update the task journal or carried-forward state with a complete Harness Run State block, point recovery_pointer at the current task packet or ledger entry, then resume from next_action."
    object_fields:
      - name: task_id
        type: string
        required: true
        validation: "Stable task or run identifier from the task journal, plan, or dispatch packet"
        on_missing: fail
      - name: task_name
        type: string
        required: true
        validation: "Human-readable task name"
        on_missing: fail
      - name: phase
        type: enum
        required: true
        enum_values: [TRIAGE, DISCOVER, DECOMPOSE, PLAN, DESIGN, BUILD, REVIEW, DOCUMENT, COMPLETE]
        validation: "Current workflow phase"
        on_missing: fail
      - name: slice
        type: string
        required: true
        validation: "Current slice id/name, next pending slice, or N/A for unsliced work"
        on_missing: fail
      - name: status
        type: enum
        required: true
        enum_values: [not_started, in_progress, blocked, verifying, reviewing, restarting, documenting, complete]
        validation: "Current run status"
        on_missing: fail
      - name: blockers
        type: string[]
        required: true
        validation: "Current blockers, or an explicit none entry"
        on_missing: fail
      - name: last_verification
        type: object
        required: true
        validation: "Most recent verification command/check, result, and evidence"
        on_missing: fail
        object_fields:
          - name: command_or_check
            type: string
            required: true
            on_missing: fail
          - name: result
            type: enum
            required: true
            enum_values: [passed, failed, skipped, not_applicable, pending]
            on_missing: fail
          - name: evidence
            type: string
            required: true
            on_missing: fail
      - name: next_action
        type: string
        required: true
        validation: "Exact next action needed to continue safely"
        on_missing: fail
      - name: recovery_pointer
        type: string
        required: true
        validation: "Pointer to the task packet, trace entry, replay packet, file section, or artifact needed to resume"
        on_missing: fail
      - name: pivot_restart_decision_ref
        type: string
        required: false
        condition: "a pivot_restart_decision is active or was selected for the current recovery path"
        validation: "Reference to the Pivot/Restart Decision artifact governing the next action"

  - name: trace_ledger
    type: object[]
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "First-class Trace Ledger artifact for ordered harness execution evidence."
    validation: "Records timestamped/ordered agent events, decisions, verification commands/results, plan deviations, and artifact refs as execution progresses."
    on_fail: "Append missing trace entries before advancing: reconstruct from Agent Dispatch Log, Key Decisions, verification output, plan deviations, and Artifact Registry; mark any unrecoverable gap explicitly."
    min_items: 1
    object_fields:
      - name: sequence
        type: int
        required: true
        validation: "Monotonic event order within this task"
        on_missing: fail
      - name: timestamp
        type: string
        required: true
        validation: "Timestamp or ordered marker for the event"
        on_missing: fail
      - name: event_type
        type: enum
        required: true
        enum_values: [agent_event, decision, verification, plan_deviation, pivot_restart, artifact_ref, blocker, recovery]
        validation: "Classifies the trace entry"
        on_missing: fail
      - name: actor
        type: string
        required: true
        validation: "Role, subagent, automation, user, or orchestrator responsible for the event"
        on_missing: fail
      - name: summary
        type: string
        required: true
        validation: "Concise event, decision, command/result, deviation, blocker, or recovery summary"
        on_missing: fail
      - name: artifact_refs
        type: string[]
        required: true
        validation: "Related file paths, task journal headings, dispatch ids, command refs, or an explicit none entry"
        on_missing: fail

  - name: replay_packet
    type: object
    required: conditional
    condition: "size in [medium, large, mega] and harness_capable == true"
    description: "First-class Replay Packet artifact that lets the workflow resume after compaction, failure, or handoff."
    validation: "Captures pinned_context, artifact_refs, validation_state, exact_next_action, run_state_ref, trace_ledger_ref, recovery_pointer, and pivot_restart_decision_ref when active with enough detail to recover without replaying stale reasoning."
    on_fail: "Create or repair the Replay Packet before ending the turn or crossing a phase boundary; copy pinned context from the approved plan/task packet, cite artifact refs, summarize validation state, and name the exact_next_action."
    object_fields:
      - name: pinned_context
        type: string[]
        required: true
        validation: "Stable requirements, constraints, approved plan/slice ids, and non-goals needed to resume"
        on_missing: fail
      - name: artifact_refs
        type: string[]
        required: true
        validation: "Task journal, context map, plan, run state, trace ledger, validation evidence, or changed-file references"
        on_missing: fail
      - name: validation_state
        type: object
        required: true
        validation: "Current validation status and outstanding verification work"
        on_missing: fail
        object_fields:
          - name: completed_checks
            type: string[]
            required: true
            on_missing: fail
          - name: pending_checks
            type: string[]
            required: true
            on_missing: fail
          - name: last_result
            type: string
            required: true
            on_missing: fail
      - name: exact_next_action
        type: string
        required: true
        validation: "Single concrete action to take next after replay"
        on_missing: fail
      - name: run_state_ref
        type: string
        required: true
        validation: "Reference to the current Harness Run State artifact"
        on_missing: fail
      - name: trace_ledger_ref
        type: string
        required: true
        validation: "Reference to the current Trace Ledger artifact"
        on_missing: fail
      - name: recovery_pointer
        type: string
        required: true
        validation: "Where to resume in the plan, task packet, phase, or slice ledger"
        on_missing: fail
      - name: pivot_restart_decision_ref
        type: string
        required: false
        condition: "a pivot/restart decision controls the exact_next_action"
        validation: "Reference to the orchestrator-owned Pivot/Restart Decision artifact"

  - name: pivot_restart_decision
    type: object
    required: conditional
    condition: "Review, QA, Build, or CodeWriter evidence triggers STAGNATION, repeated DRIFT, repeated REGRESSION, rubric/domain action pivot, CodeWriter blocker routing, verification blocker, plan deviation, or scope change"
    description: "Orchestrator-owned decision packet for stagnant quality loops, CodeWriter unexpected blockers, and restart/pivot recovery."
    validation: "Must classify the trigger, cite evidence, name the affected slice or round, compare options, select a recovery action, state whether reapproval is required, name the next agent, and point recovery to an exact next action."
    on_fail: "Pause the review/QA/build loop, load references/harness-controller.md, create the Pivot/Restart Decision packet, append trace/replay/run-state updates, and obtain reapproval before continuing when scope, files, behavior, risk, or verification changes."
    object_fields:
      - name: trigger
        type: enum
        required: true
        enum_values: [STAGNATION, repeated_DRIFT, repeated_REGRESSION, pivot, code_writer_blocker, verification_blocker, plan_deviation, scope_change]
        validation: "Names the event that forced pivot/restart consideration"
        on_missing: fail
      - name: evidence
        type: object[]
        required: true
        min_items: 1
        validation: "At least one review score, QA score, CodeWriter blocker, verification failure, trace entry, or task-packet mismatch supports the trigger"
        on_missing: fail
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: affected_slice_or_round
        type: string
        required: true
        validation: "Current slice id/name, review round, QA round, or phase affected by the trigger"
        on_missing: fail
      - name: options_considered
        type: object[]
        required: true
        min_items: 2
        validation: "At least two recovery options are compared unless a single safe option is forced by policy or missing approval"
        on_missing: fail
        object_fields:
          - name: option
            type: string
            required: true
          - name: tradeoff
            type: string
            required: true
          - name: disposition
            type: enum
            required: true
            enum_values: [selected, rejected, deferred]
      - name: selected_action
        type: enum
        required: true
        enum_values: [reset_context, return_to_build, dispatch_debugging, dispatch_explorer, dispatch_architect, run_candidate_search, replan, restart_slice, restart_phase, block_for_user, accept_with_limitations]
        validation: "Concrete recovery action selected by the orchestrator; it must not imply starting round 11 after a terminal round 10"
        on_missing: fail
      - name: reapproval_required
        type: boolean
        required: true
        validation: "true when selected_action changes approved scope, files, behavior, risk, verification, or acceptance criteria; false only for local context reset or same-scope retry"
        on_missing: fail
      - name: next_agent
        type: string
        required: true
        validation: "Next role or agent to dispatch, such as Builder/Tester, CodeWriter, Explorer, Architect, Reviewer, QAEvaluator, assistant-debugging, candidate-search, user, or none"
        on_missing: fail
      - name: recovery_pointer
        type: string
        required: true
        validation: "Trace entry, task packet, run-state section, replay packet, plan section, or file path where recovery resumes"
        on_missing: fail
      - name: exact_next_action
        type: string
        required: true
        validation: "Single concrete action to take after the pivot/restart decision; replay_packet.exact_next_action must match it when replay is updated"
        on_missing: fail

  - name: decomposition_plan_review
    type: object
    required: conditional
    condition: "size in [medium, large, mega]"
    description: "Cheap-before-expensive review of slice/subagent decomposition before Plan/Build"
    validation: "Must state scope understanding, slice/subagent count sanity, step/cost budget, dependency order, output-plan match, fallback path, broad-split rejection proof, and proceed/revise/return decision"
    on_fail: "Load references/decomposition-plan-review.md and repair the decomposition review packet before entering Plan"
    object_fields:
      - name: scope_understanding
        type: string
        required: true
      - name: slice_subagent_count
        type: string
        required: true
      - name: step_cost_budget
        type: string
        required: true
      - name: dependency_order
        type: string
        required: true
      - name: output_plan_match
        type: string
        required: true
      - name: fallback_path
        type: string
        required: true
      - name: broad_split_rejection
        type: string
        required: true
        description: "Required proof that layer-only, module-only, folder-only, feature-only, setup-only, contract-only, and broad component-style splits were rejected unless they are verified deliverable artifact slices"
      - name: decision
        type: enum
        enum_values: [proceed, revise_decomposition, return_to_discover]
        required: true

  - name: slice_manifest
    type: object[]
    required: true
    condition: "size in [medium, large, mega]"
    validation: >
      Contains one or more smallest iterable slices in dependency order. Each
      slice has the strict slice schema, exact files, observable increment,
      acceptance criteria, verification command, expected success signal, and
      deviation rollback rule. slice_id values are unique branch/path-safe
      identifiers, and depends_on entries reference only declared slice_id values
      without self dependencies or circular dependencies.
      Layer-only, module-only, folder-only, feature-only, setup-only,
      contract-only, or broad component-style splits are invalid unless the work
      is a verified deliverable artifact slice.
    on_fail: "Return to DECOMPOSE/PLAN and produce a strict slice manifest; reject broad layer/module/folder/feature/component splits and setup-only or contract-only splits unless they are verified deliverable artifacts; include a single-slice rationale when only one slice is correct"
    min_items: 1
    object_fields:
      - name: slice_id
        type: string
        required: true
        description: "Stable descriptive outcome-oriented slice identifier that is branch/path-safe and reused for branches, worktrees, brief filenames, and depends_on references"
        validation: "Must be unique within slice_manifest; use only lowercase letters, digits, and hyphens; start and end with a letter or digit; no slashes, whitespace, path traversal, or branch separators. Ordinal-only or generic sequence labels such as s1, slice-2, or step-3 are invalid; manifest order and depends_on carry sequencing"
        examples: [notification-validation, email-delivery]
      - name: target_branch
        type: string
        required: conditional
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        validation: "Repository target ref for the umbrella task branch."
      - name: target_base_sha
        type: string
        required: conditional
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        validation: "Canonical 40- or 64-character lowercase immutable target commit SHA; ancestor of target_branch and task_branch."
      - name: task_branch
        type: string
        required: conditional
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        validation: "Uses feature/<task> and shares the immutable target_base_sha with every slice."
      - name: slice_branch
        type: string
        required: conditional
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        validation: "Uses slice/<task>/<slice_id>."
      - name: promotion_mode
        type: enum
        required: conditional
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        enum_values: [local, review_gated]
        validation: "All slices in a task share this promotion mode."
      - name: name
        type: string
        required: true
      - name: observable_increment
        type: string
        required: true
      - name: deliverable_type
        type: enum
        required: true
        enum_values: [behavior, artifact, contract, docs, eval, config, migration, refactor]
      - name: acceptance_criteria
        type: string[]
        required: true
        min_items: 1
      - name: files_to_create
        type: string[]
        required: true
      - name: files_to_modify
        type: string[]
        required: true
      - name: files_to_test
        type: string[]
        required: true
      - name: enabling_changes_included
        type: string[]
        required: true
      - name: depends_on
        type: string[]
        required: true
        description: "Declared prerequisite slice IDs that must be VERIFIED before this slice starts"
        validation: "Every dependency is the slice_id of another declared slice in this manifest; no self dependency or circular dependency is allowed; use an empty array when there are no dependencies"
      - name: verification_command
        type: string[]
        required: true
        min_items: 1
        validation: "Canonical argv vector: item 0 is the executable and each remaining item is one literal argument; no shell-form command string, redirection, pipe, or implicit shell parsing"
      - name: expected_success_signal
        type: string
        required: true
      - name: evidence_to_record
        type: string[]
        required: true
        min_items: 1
      - name: deviation_rollback_rule
        type: string
        required: true

  - name: single_slice_rationale
    type: string
    required: conditional
    condition: "size in [medium, large, mega] and slice_manifest has exactly one item"
    description: "Required when medium+ emits one slice; proves the one slice is the smallest iterable decomposition and not a broad fallback."
    validation: "single_slice_rationale must be present and non-blank, explaining why the task cannot be split into smaller independently verifiable slices without losing the observable increment"
    on_fail: "Return to DECOMPOSE/PLAN and either split the work into multiple strict slices or provide a non-blank single_slice_rationale"

  - name: slice_verification_summary
    type: object[]
    required: true
    condition: "size in [medium, large, mega]"
    validation: >
      Contains one entry per slice from the manifest, in order, with task
      packet id, RED status when TDD was active, implementation status,
      verification command/result, acceptance criteria checked, self-check
      result, and final status. REVIEW_PENDING and BLOCKED are active
      non-completion states; Every slice final status must be VERIFIED before
      WORKFLOW COMPLETE. Detailed review lifecycle states belong in
      slice_review_evidence.
    on_fail: "Run and record per-slice verification evidence until every slice final_status is VERIFIED"
    object_fields:
      - name: slice_id
        type: string
        required: true
      - name: slice_name
        type: string
        required: true
      - name: task_packet_id
        type: string
        required: true
      - name: red_status
        type: string
        required: true
        validation: "Use pass/fail when TDD was active, otherwise N/A"
      - name: implementation_status
        type: enum
        required: true
        enum_values: [done, blocked]
      - name: verification_result
        type: string
        required: true
        validation: "Command or inspection performed plus pass/fail result and success signal"
      - name: criteria_checked
        type: string
        required: true
        validation: "All slice acceptance criteria listed with pass/fail status"
      - name: self_check_result
        type: string
        required: true
        validation: "Local sanity check result against task packet, constraints, and deviation rule"
      - name: final_status
        type: enum
        required: true
        enum_values: [REVIEW_PENDING, BLOCKED, VERIFIED]

  - name: slice_review_evidence
    type: object[]
    required: conditional
    condition: "slice_promotion_mode == review_gated"
    validation: "Provider-neutral evidence binds a review request and gate outcome to the exact locally verified SHA pair. REVIEW_PENDING never satisfies VERIFIED."
    object_fields:
      - name: schema_version
        type: string
        required: true
      - name: slice_id
        type: string
        required: true
      - name: state
        type: enum
        required: true
        enum_values: [REVIEW_PENDING, REVIEW_APPROVED, REVIEW_REJECTED, REVIEW_STALE]
      - name: promotion_mode
        type: enum
        required: true
        enum_values: [review_gated]
        validation: "Review evidence is valid only for review_gated promotion."
      - name: target_branch
        type: string
        required: true
      - name: target_base_sha
        type: string
        required: true
        validation: "Canonical 40- or 64-character lowercase commit SHA, immutable for the task and an ancestor of both current target_branch and task_branch."
      - name: task_branch
        type: string
        required: true
      - name: slice_branch
        type: string
        required: true
      - name: review_base_ref
        type: string
        required: true
      - name: review_head_ref
        type: string
        required: true
      - name: verified_base_sha
        type: string
        required: true
      - name: verified_head_sha
        type: string
        required: true
      - name: verification_evidence_ref
        type: string
        required: true
        validation: "Nonblank, non-whitespace-only local verifier evidence reference."
      - name: review_request_ref
        type: string
        required: conditional
        condition: "state in [REVIEW_APPROVED, REVIEW_REJECTED, REVIEW_STALE]"
        validation: "Nonblank, non-whitespace-only opaque adapter reference when a review outcome has been recorded; absent from core REVIEW_PENDING evidence."
      - name: provider_gate_state
        type: enum
        required: true
        enum_values: [not_evaluated, passed, failed]
      - name: provider_gate_evidence_ref
        type: string
        required: conditional
        condition: "provider_gate_state in [passed, failed]"
        validation: "Required nonblank, non-whitespace-only provider-neutral gate evidence when provider_gate_state is passed or failed; not required while not_evaluated."

  - name: metrics_entry
    type: jsonl_line
    required: false
    condition: "local metrics are configured and policy allows persistent workflow metrics and optional capture is useful"
    validation: "Valid JSON with required keys: date, project, task, size, review_rounds, plan_deviations, build_failures"
    on_missing: skip
    on_fail: "Discard or repair an invalid optional metrics entry; missing metrics never blocks workflow completion"
    location: "{agent_metrics_path}/workflow-metrics.jsonl"

  - name: candidate_search_result
    type: object
    required: conditional
    condition: "search_mode == candidate_search"
    description: "BES-style candidate-search result used before committing to a plan or when an approved plan needs a candidate pivot"
    validation: "Contains goal_tree, candidate_archive, scoring_rubric, selected_candidate, selection_reason, search_exit_summary, and plan_deviation when the selected candidate changes an approved plan."
    on_fail: "Load references/candidate-search.md, reconstruct the archive from criteria/options considered, score candidates, and re-approve any post-approval plan deviation before Build continues"
    object_fields:
      - name: goal_tree
        type: string
        required: true
        validation: "Decomposes existing acceptance criteria or slice acceptance/verification criteria; does not invent unrelated success criteria"
      - name: candidate_archive
        type: object[]
        required: true
        validation: "At least two candidates unless a single feasible path is explicitly justified"
        object_fields:
          - name: id
            type: string
            required: true
          - name: summary
            type: string
            required: true
          - name: lineage
            type: string
            required: true
            validation: "Origin and operator such as seed, mutate, rewrite, combine, translocate, delete, or repair"
          - name: scores
            type: string
            required: true
            validation: "Objective fit, verifiability, feasibility, risk, and simplicity scores or rationale"
      - name: selected_candidate
        type: string
        required: true
        validation: "References one candidate id from candidate_archive"
      - name: scoring_rubric
        type: string
        required: true
        validation: "Names the pre-code rubric dimensions used to score candidates: objective fit, verifiability, feasibility, risk, and simplicity"
      - name: selection_reason
        type: string
        required: true
        validation: "Explains why this candidate best satisfies the pre-code rubric"
      - name: archive_location
        type: string
        required: true
        validation: "{agent_state_dir}/candidate-search.md when local state artifacts are configured and policy-allowed; otherwise inline in the plan/task packet"
      - name: search_exit_summary
        type: object
        required: true
        validation: "Records the candidate-search budget and why search stopped; prevents unbounded option loops and success claims after empty or exhausted search"
        object_fields:
          - name: max_candidates
            type: int
            required: true
            description: "Candidate budget chosen before search or the documented cap for this run"
          - name: candidates_considered
            type: int
            required: true
            description: "Number of candidates actually evaluated, including rejected candidates"
          - name: repair_iterations
            type: int
            required: false
            description: "Number of mutate/repair/pivot iterations used after initial candidates"
            default: 0
          - name: exit_reason
            type: enum
            required: true
            enum_values: [selected, single_path_justified, max_budget, blocked, plan_deviation_pending_approval]
            description: "Why candidate search stopped"
          - name: empty_result_handling
            type: string
            required: true
            description: "What happened if no viable candidate was found, or why this was not applicable"
      - name: plan_deviation
        type: string
        required: false
        condition: "candidate search occurred after plan approval or selected candidate changes approved scope/files/behavior/risk"
        validation: "Records deviation, impact, rollback/re-approval status, and user approval when required"

  - name: workflow_experiment_ledger
    type: object[]
    required: conditional
    condition: "explicit workflow experiment, loop-optimization experiment, or approved plan labels the work as an experiment"
    description: "Lightweight ledger for explicit workflow experiments only; not required for ordinary medium+ work."
    validation: "Each entry includes experiment_id, hypothesis, intervention, expected_signal, measurement_method, baseline_or_control, result_status, evidence, decision, and next_check. The ledger does not by itself require Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation."
    on_fail: "When the approved plan names an explicit workflow experiment, add the missing ledger entry before running the experiment; otherwise record N/A and do not add harness artifacts unless harness_capable == true."
    min_items: 1
    object_fields:
      - name: experiment_id
        type: string
        required: true
        validation: "Stable local id unique within the workflow task"
      - name: hypothesis
        type: string
        required: true
        validation: "Testable claim about workflow behavior, cost, speed, quality, or reliability"
      - name: intervention
        type: string
        required: true
        validation: "Specific workflow, contract, prompt, automation, or process change being tried"
      - name: expected_signal
        type: string
        required: true
        validation: "Observable signal expected to move if the hypothesis is useful"
      - name: measurement_method
        type: string
        required: true
        validation: "Command, metric, review criterion, or inspection that measures the signal"
      - name: baseline_or_control
        type: string
        required: true
        validation: "Previous behavior, control condition, or explicit no-baseline reason"
      - name: result_status
        type: enum
        required: true
        enum_values: [planned, running, measured, inconclusive, stopped]
      - name: evidence
        type: string[]
        required: true
        min_items: 1
        validation: "Plan ref, command result, review note, metric, or explicit pending-evidence marker for planned experiments"
      - name: decision
        type: enum
        required: true
        enum_values: [pending, continue, adjust, stop, inconclusive]
      - name: next_check
        type: string
        required: true
        validation: "Next measurement, review, or stop point"

  - name: loop_readiness_assessment
    type: object
    required: conditional
    condition: "before starting an explicit repeat or optimization loop outside the standard required workflow phase gates"
    description: "Pre-loop gate for repeat/optimization loops; not required for one-pass work or the normal required review loop."
    validation: "Records loop_type, loop_trigger, readiness_state, verifier, stop_condition, max_iterations, budget_limit, tool_access, state_tracking, retry_or_empty_result_handling, tool_error_handling, low_confidence_escalation, rollback_or_exit, harness_routing, and evidence before the loop starts. loop artifacts alone do not require Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation."
    on_fail: "Before running the repeat/optimization loop, add the readiness assessment or remove the loop from the plan. Set harness_routing=required only when harness_capable == true or independent QA criteria already apply."
    object_fields:
      - name: loop_type
        type: enum
        required: true
        enum_values: [repeat, optimization, experiment]
      - name: loop_trigger
        type: string
        required: true
        validation: "Why a repeated loop is needed instead of a single planned pass"
      - name: readiness_state
        type: enum
        required: true
        enum_values: [ready, blocked]
        validation: "Must be ready before the loop starts"
      - name: verifier
        type: string
        required: true
        validation: "Check, role, command, metric, or reviewer that judges each iteration"
      - name: stop_condition
        type: string
        required: true
        validation: "Concrete pass, budget, stagnation, or failure condition that ends the loop"
      - name: max_iterations
        type: int
        required: true
        validation: "Positive finite cap"
      - name: budget_limit
        type: string
        required: true
        validation: "Token, time, cost, run-count, or explicit local-effort cap"
      - name: tool_access
        type: string[]
        required: true
        validation: "Tools/commands/agents needed for the loop, or explicit none entry"
      - name: state_tracking
        type: string
        required: true
        validation: "Where iteration state, results, and decisions are recorded"
      - name: retry_or_empty_result_handling
        type: string
        required: true
        validation: "How the loop handles retries, empty verifier results, empty search/tool results, exhausted no-result paths, or no-result exit evidence before another iteration is attempted"
        on_missing: fail
      - name: tool_error_handling
        type: string
        required: true
        validation: "How tool errors route before another iteration, including retry limits, fallback role/action, blocker classification, or stop condition"
        on_missing: fail
      - name: low_confidence_escalation
        type: string
        required: true
        validation: "Escalation path when verifier confidence is low, evidence is inconclusive, or repeated iterations do not improve confidence"
        on_missing: fail
      - name: rollback_or_exit
        type: string
        required: true
        validation: "Action when stop_condition fails or the loop exhausts its cap"
      - name: harness_routing
        type: enum
        required: true
        enum_values: [not_required, required]
        validation: "not_required unless harness_capable == true or QA criteria already apply"
      - name: evidence
        type: string[]
        required: true
        min_items: 1
        validation: "Plan ref, task packet ref, or readiness check evidence"

  - name: plan_document
    type: string
    required: conditional
    condition: "plan_mode in [inline, approval_required]"
    validation: >
      inline: compact plan with goal, files, risks, and tests.
      approval_required medium: standard plan per plan-template.md.
      approval_required large/mega: full plan per plan-template.md including Security and Operability.
      plan_mode=none: artifact is absent.
    on_fail: "When plan_mode is inline or approval_required, write or update the proportional plan before proceeding; omit this artifact when plan_mode is none"

  - name: user_approval
    type: enum
    required: conditional
    condition: "manual_verification_mode == required and the selected manual verification trigger specifically needs user observation or confirmation"
    enum_values: [confirmed, confirmed_with_issues, not_required_small]
    validation: "Records user confirmation only when the scoped manual verification actually depends on the user's observation; plan approval is enforced separately and user confirmation is not ritual."
    on_fail: "Request the specific user observation needed for manual verification, or record equivalent non-user evidence when the trigger does not require user confirmation."

# Completeness check:
# Before printing --- WORKFLOW COMPLETE ---, verify:
# 1. All required artifacts for the task's completion_tier are present and controller_intensity matches the selected tier
# 2. test_results.failed == 0 when tests ran; validation_results contains at least one result=passed entry for completed implementation workflows. Skipped/not_applicable entries do not satisfy completion evidence; docs-only/no-op/discovery exceptions must record the reason.
# 3. When size is medium/large/mega or risk_tier is high/critical: spec_review_result.status == PASS and required_fixes are empty or resolved
# 4. When size is medium/large/mega or risk_tier is high/critical: review_result contains validated canonical result and delegation-path refs to assistant-review output artifacts
# 5. If qa_evaluation_mode=required: qa_evaluation_result contains validated canonical result and delegation-path refs after build/test and code-review evidence; QA evaluation does not replace review_result
# 6. For medium+ tasks, slice_verification_summary has one VERIFIED entry per slice
# 7. candidate_search_result exists when search_mode == candidate_search, includes search_exit_summary, and any plan_deviation is approved before Build
# 8. workflow_experiment_ledger exists only for explicit workflow experiments; loop_readiness_assessment exists only before explicit repeat/optimization loops and includes retry_or_empty_result_handling, tool_error_handling, and low_confidence_escalation
# 9. Loop artifacts alone do not require Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation unless harness_capable or QA criteria independently apply
# 10. For medium+ harness-capable work, harness_run_state, trace_ledger, replay_packet, pivot_restart_decision when triggered, and artifact_reference_ledger exist and are current before completion or handoff. controller_intensity=standard with harness_capable=false does not require these artifacts.
# 11. manual_verification_result exists only when manual_verification_mode=required; user_approval exists only when that scoped check depends on user observation. Metrics, reflexion, and memory never block completion.
# If any check fails, do NOT print --- WORKFLOW COMPLETE ---. State what is missing.
  - name: verified_skill_distillation
    type: object
    required: conditional
    condition: "workflow produced a repeatable process, recurring lesson, user-requested reusable procedure, or skill/constraint candidate"
    description: "Verifier-approved promotion packet for turning a successful workflow or review lesson into a reusable skill or constraint"
    validation: "Must include candidate workflow, inputs, process steps, output artifact, verification gate, learned constraints, scope/non-goals, evidence, verifier result, and promotion decision"
    on_fail: "Load references/verified-skill-distillation.md; create the packet; send it to an independent verifier before saving any skill or constraint"
    object_fields:
      - name: candidate_workflow
        type: string
        required: true
      - name: inputs
        type: string[]
        required: true
      - name: process_steps
        type: string[]
        required: true
      - name: output_artifact
        type: string
        required: true
      - name: verification_gate
        type: string
        required: true
      - name: learned_constraints
        type: string[]
        required: true
      - name: scope_and_non_goals
        type: string
        required: true
      - name: evidence_from_current_run
        type: string
        required: true
      - name: verifier_result
        type: enum
        enum_values: [approved, rejected, needs_revision]
        required: true
      - name: promotion_decision
        type: enum
        enum_values: [create_skill, update_skill, add_constraint, skip]
        required: true
