# Phase Gate Contracts
# Assertions that MUST be true before transitioning between phases.
# Think of these as type checks at function boundaries — the output of phase N
# must satisfy the input contract of phase N+1.
#
# Any agent executing this skill MUST evaluate `exit_assertions` for the current
# phase before transitioning. Exact phase markers are conditional on strict
# intensity, explicit project policy, or user request.
# If an exit assertion fails, the agent MUST resolve it before proceeding.
# `guidance_assertions` are non-blocking reminders unless `strict_only` policy
# or explicit project policy opts into stricter enforcement.
#
# Gate severity is tiered to avoid turning every useful reminder into a hard
# blocker. `exit_assertions` are blockers because missing them has caused real
# failures. `guidance_assertions` are recommended checks that should shape the
# work, but they do not by themselves block progress unless project policy opts
# into stricter enforcement.

schema_version: "4.0"
contract: phase-gates
skill: assistant-workflow

checkpoint_policy:
  exact_markers_required_when: "controller_intensity == strict, explicit project policy requires markers, or the user requests exact phase markers"
  otherwise: "Use concise natural progress updates while still following every applicable logical phase and gate."

gate_tiers:
  blocker: "Prevents phase transition; missing evidence would make the workflow unsafe or unverifiable."
  guidance: "Preferred discipline; record or follow when useful, but do not ask ritual questions or block low-risk progress solely for this item."
  strict_only: "Enforced only when controller_intensity == strict or project policy explicitly requests full harness enforcement."
# controller_intensity maps onto these gate_tiers: light keeps low-risk guidance
# compact, standard uses normal medium blockers/review without harness/QA
# defaults, and strict may enforce strict_only gates when independent criteria apply.

gates:

  # ─────────────────────────────────────────────
  # TRIAGE → DISCOVER
  # ─────────────────────────────────────────────
  - phase: TRIAGE
    checkpoint_start: "--- PHASE: TRIAGE ---"
    checkpoint_end: null  # Triage has no COMPLETE line; it flows into Discover
    exit_assertions:

      - id: T1
        check: "size is set to one of: small, medium, large, mega"
        on_fail: "Re-assess task against size criteria table in SKILL.md"

      - id: T2
        check: "phases list is populated and matches the size-to-phases mapping table"
        on_fail: "Correct phases list to match the selected size"

      - id: T4
        check: "task_type is set to one of: feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike"
        on_fail: "Load references/triage-rubric.md and classify the work by task category before continuing"

      - id: T5
        check: "risk_tier is set to one of: low, moderate, high, critical"
        on_fail: "Assess risk tier using impact, uncertainty, reversibility, security/data exposure, and behavior parity criteria"

      - id: T_CONTROLLER_INTENSITY
        check: "controller_intensity is set to one of: light, standard, strict; ordinary medium+ non-harness work uses standard; strict is selected only for high/critical risk, harness_capable == true, qa_evaluation_mode == required, or explicit trace/replay/harness/QA criteria"
        on_fail: "Set controller_intensity from existing completion_tiers/gate_tiers. Do not infer strict from size=medium+ or delegation alone; use standard when harness_capable=false and qa_evaluation_mode=not_required."

      - id: T_ADAPTIVE_COMPLETION_MODES
        check: "plan_mode is none, inline, or approval_required; workflow_state_mode is inline or journal; and manual_verification_mode is not_required, optional, or required"
        on_fail: "Infer and record plan_mode plus the two additive completion modes from the input contract; do not infer journal or manual-verification ceremony from size alone."

      - id: T_PLAN_MODE
        check: "plan_mode=none is used only for trivial localized reversible low-risk work with an obvious path and verification; inline is used only for bounded small no-approval work; approval_required is used for medium+, high/critical risk, destructive, public contract/data/security, material architecture/scope choices, repository policy, or explicit user approval requests"
        on_fail: "Promote plan_mode to inline or approval_required. Do not skip Plan when size, risk, uncertainty, policy, or user intent requires it."

      - id: T_ARCHITECTURE_DESIGN_MODE
        check: "architecture_design_mode is not_applicable, lightweight, required, or review_intensive and has concrete trigger evidence; not_applicable records why no boundary, lifecycle, public contract, resource target, extension seam, or viable design choice needs a pack; size alone is not a trigger"
        on_fail: "Load references/architecture-decision-pack.md, inspect the candidate scope scan, select the proportional architecture design mode, and record trigger reasons or a concrete not-applicable reason."

      - id: T6
        check: "required_gates includes common gates plus every applicable task-category gate pack"
        on_fail: "Load references/triage-rubric.md and add the required gate packs for the task type before continuing"

      - id: T7
        check: "build_execution_lane and required_agents/fallback roles are populated from risk and verification shape: inline_direct for light localized work; bounded_executor plus independent Code Reviewer for ordinary medium standard-risk work; separated_workers with Code Writer, Builder/Tester, and Code Reviewer only for high/critical risk, broad/noisy/environment-heavy verification, independent TDD evidence, or explicit separation"
        on_fail: "Select the smallest safe build_execution_lane and matching roles; do not require separated workers from size alone."

      - id: T_QA_EVALUATOR
        check: "When qa_evaluation_mode == required: required_agents includes QA Evaluator in addition to the selected Build lane roles and Code Reviewer or Reviewer compatibility. QA required positive triggers: explicit QA/acceptance evaluation request, accepted Done Contract, harness-capable acceptance scope, domain-scored scope, or scoped UI/visual/product/UX/docs/DX acceptance."
        condition: "qa_evaluation_mode == required"
        on_fail: "Add QA Evaluator as a Review-phase role, or record qa_evaluation_mode=not_required with a concrete reason when QA is not applicable. QA non-triggers: template labels/placeholders, generic acceptance criteria labels, optional/not_required reasons, delegation/source-changing work alone, and ordinary medium+ code-review-only/source-changing work."

      - id: T9
        check: "subagent_policy_state, subagent_execution_mode, and subagent_trigger_scope are initialized before any phase that may spawn subagents; conditional policy_blocking_source is also initialized when policy_disallowed. Required roles covered by a direct user, applicable AGENTS.md, or active skill instruction use delegation_triggered and dispatch without a separate permission question. policy_disallowed requires a non-empty exact active blocking rule that confirms no applicable trigger exception."
        on_fail: "If an applicable trigger exists and no delegation_opted_out, subagents_unavailable, or policy_disallowed evidence applies, infer subagent_trigger_scope and dispatch required roles. Otherwise preserve and complete the evidenced fallback state; do not overwrite explicit opt-out."

      - id: T10
        check: "candidate_scope_scan is populated from a quick read-only scan before finalizing Triage, with likely touched paths, symbols/search terms checked, adjacent surfaces, confidence, and unknowns"
        on_fail: "Search the locally available target files, likely modules, symbols, nearby tests, docs, contracts, config, generated mirrors, or runtime surfaces; record candidate_scope_scan before entering Discover or explicitly mark not applicable with reason for tiny prompt-only tasks."

    guidance_assertions:

      - id: T3
        severity: guidance
        check: "'>> Triaged as: {SIZE} — phases: {list}' message was printed to user when helpful for shared context"
        on_fail: "Print or summarize the triage result before continuing when the user needs visibility"

      - id: T8
        severity: guidance
        check: "'>> Triage metadata: type={TASK_TYPE} | risk={RISK_TIER} | intensity={controller_intensity} | gates={count} | agents={count}' message was printed to user"
        on_fail: "Print structured triage metadata when medium+ complexity or user visibility needs it"

  # ─────────────────────────────────────────────
  # DISCOVER → DECOMPOSE (medium+) / PLAN (small)
  # ─────────────────────────────────────────────
  - phase: DISCOVER
    checkpoint_start: "--- PHASE: DISCOVER ---"
    checkpoint_end: "--- PHASE: DISCOVER COMPLETE ---"
    exit_assertions:

      - id: D1
        check: "Requirements restated in 1-3 sentences"
        on_fail: "Write a requirements summary before proceeding"

      - id: D_REQUIREMENT_ACCEPTANCE_MAP
        check: "For medium+ work, small required/review_intensive architecture work, or progressive_route_clear_consumption_state=consumed with progressive_artifact_retention_state=retained, requirement_acceptance_map exists with stable requirement_id values, atomic binary criteria, verification methods, manual scenarios or explicit N/A, assumptions/defaults, non-goals, and no unresolved material questions"
        condition: "size in [medium, large, mega] or (progressive_artifact_retention_state != terminally_archived and progressive_route_clear_consumption_state != pending and (architecture_design_mode in [required, review_intensive] or progressive_route_clear_consumption_state == consumed))"
        on_fail: "Load references/requirement-acceptance-map.md, map every accepted requirement, resolve material questions, and do not decompose from an untraceable criteria list"

      - id: D1A
        check: "Discovery confirms or updates task_type, risk_tier, required_gates, required_agents, subagent_policy_state, and subagent_execution_mode based on code/context evidence"
        on_fail: "Re-triage with code/context evidence before proceeding"

      - id: D2
        check: "clarification_status is ready and every implementation-shaping field is explicit, automatically resolved by a recorded deterministic safe default, accepted from a displayed recommendation, or no longer unresolved"
        on_fail: "Apply and record any deterministic safe default immediately. Persist only topics with no safe default, ask admissible structured questions, and wait for explicit answers; `defaults` is accepted only as shorthand for the displayed recommendations."

      - id: D3
        check: "clarification_defaults_applied is true exactly when clarification_defaults contains automatically applied entries with topic, value, source, and rationale; unresolved clarification topics are empty before Discover completes"
        on_fail: "Repair clarification_defaults and its applied flag, record source/rationale for each safe default, and clear only resolved topics before continuing"

      - id: D3A
        check: "Every deterministic safe default is applied and recorded without asking or waiting for user confirmation"
        on_fail: "Apply the safe default immediately, record topic/value/source/rationale, set clarification_defaults_applied=true, and remove any ritual confirmation wait."

      - id: D4
        check: "If Discover prints a clarification wait for any task size: task journal exists before the wait when local state artifacts are configured/policy-allowed, or equivalent clarification state is included in the response before the wait"
        on_fail: "Create or update the orchestrator-owned {agent_state_dir}/task.md state artifact when a local state directory is configured and policy allows it; otherwise include Clarification status, defaults applied, and unresolved topics in the response before printing the clarification wait message or continuing"

      - id: D4A
        check: "Clarification has no numeric cap or quota; clear tasks may complete Discover with zero questions, while every admissible material question is grouped by topic and asked before planning"
        on_fail: "Do not ask ritual questions or suppress material ones. Record questions_asked=0 with high confidence when source/context is sufficient; otherwise group and ask every admissible unresolved decision."

      - id: D4B
        check: "Every clarification question is admissible: it affects correctness, scope, behavior, data, public contract, security, migration safety, or verification; cannot be resolved from code/context; lacks a safe default; and states risk if guessed"
        on_fail: "Remove non-admissible questions, do more discovery, or state a safe default instead of asking."

      - id: D_PROGRESSIVE_DISCOVERY_HOLD
        check: "When progressive_discovery_state in [mapping, resolving, route_clear, blocked], typed progressive state must remain in Discover and prohibits Decompose, Plan, Build, project/source mutation, external writes, branch creation, and credential-location recording. The only permitted local state update is the framework-owned journal/equivalent carried-state update required to record progressive state, including a route-clear handoff or its consumption; it never authorizes project/source mutation or an external write."
        condition: "uncertainty_shape == progressive and progressive_discovery_state in [mapping, resolving, route_clear, blocked]"
        on_fail: "Return to progressive Discover, preserve the typed decision and handoff state, use only the framework-owned journal/equivalent carried-state update needed to record it, and do not execute or prepare a mutating prerequisite outside a separate approved workflow with returned evidence."

      - id: D_PROGRESSIVE_REPEAT_READINESS
        check: "Before every second/subsequent progressive decision activation after any prior activation, atomically set progressive_sequence_readiness_state=active and progressive_artifact_retention_state=retained with loop_readiness_assessment using loop_type=progressive_decision_sequence with stable readiness_assessment_id and progressive_decision_map_ref; immutable finite max_iterations; cumulative_activation_count matching ordered unique append-only activated_decision_item_refs including the first activation; prior activated items may be resolved, superseded, or excluded while cumulative activated refs remain append-only; superseded/excluded refs are not classified as resolved; resolved_decision_item_refs linked exactly once to canonical decision_resolution; budget_limit; route-clear, cap, stagnation, or failure stop conditions; unchanged frontier/no-progress detection; retry_or_empty_result_handling; tool_error_handling; low_confidence_escalation; and existing journal/equivalent state tracking. While active, retain that record through pause, blocked state, compaction, continuation, route-clear preparation, third+ activation proposals, and durable route-clear consumption. Only then set closed. After progressive_sequence_readiness_state becomes closed, retained keeps the same record while the task remains active/resumable or compacts. Only terminally_archived permits omission after explicit final archival/termination evidence proves continuation and reference resolution are impossible; Task state: completed does not qualify, and terminally_archived cannot revert. Before another activation count must be below max_iterations; equality or inconsistency ends in blocked/escalation. Closed cannot reopen or reset the same decision map."
        condition: "(uncertainty_shape == progressive and a second/subsequent decision activation is proposed after any prior activation) or (progressive_artifact_retention_state != terminally_archived and progressive_sequence_readiness_state in [active, closed])"
        on_fail: "Keep the next item inactive and record or repair the retained loop_readiness_assessment without resetting identity, cap, or history. If the exhausted route persists progressive_discovery_state=blocked, set the proposed/current item status=blocked with blocker_kind=readiness_exhausted, blocker_reason, and unblock_condition, and include it in non-empty blocked_item_refs; otherwise escalate."

      - id: D_PROGRESSIVE_ROUTE_CLEAR
        check: "When progressive_discovery_state == route_clear, route clear proves no open/blocked items and no remaining deferred uncertainty except retired/excluded entries. A retired/excluded uncertainty must retain an exact canonical decision_resolution for a current predecessor now status=resolved, superseded, or excluded, so a legitimate all-excluded route remains concrete. route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs is ordered unique, resolves exactly once, and exactly covers every current decision_map deferred uncertainty with status retired/excluded; it is empty if and only if none exist. Empty, duplicate, dangling, or partially resolvable current map refs cannot reach route_clear, bounded planning, Decompose, Plan, or Build; wrong-status refs also fail closed. route_clear_handoff.decisions contains every current-map status=resolved decision exactly once through canonical decision_resolution.decision_item_ref values, while every current-map status=superseded or excluded decision appears exactly once in exclusions; decisions is non-empty when any current-map decision has status=resolved and empty only for a legitimate all-excluded route. Retained historical resolutions for current-map superseded or excluded items are lineage evidence only and do not appear in decisions. route_clear_handoff.next_route is bounded_discover and consumption_state=pending mirrors progressive_route_clear_consumption_state=pending while progressive_artifact_retention_state=retained, typed progressive route_clear persists, and the bounded-Discover Requirement Acceptance Map is prepared from its decisions, constraints, exclusions, retired_or_excluded_deferred_uncertainty_refs, and acceptance_seed. Requirement Acceptance Map is not required while progressive_route_clear_consumption_state=pending. The map source_route_clear_handoff_ref resolves to the source handoff and its consumed_by_requirement_acceptance_map_ref resolves back to the consuming map. Requirement Acceptance Map is required when progressive_route_clear_consumption_state=consumed and progressive_artifact_retention_state=retained. After consumed map transition, retired_or_excluded_deferred_uncertainty_traces binds every source retired/excluded uncertainty ref exactly once to a concrete non_goal or approved_exclusion target_ref; pending route-clear alone is insufficient. Record consumption_state=consumed and progressive_route_clear_consumption_state=consumed before the atomic typed-state transition to bounded/not_applicable; route_clear_handoff remains required while progressive_route_clear_consumption_state in [pending, consumed] and progressive_artifact_retention_state=retained, and both reciprocal refs remain resolvable during active/resumable continuation so the normal Requirement Acceptance Map and current gates still run."
        condition: "uncertainty_shape == progressive and progressive_discovery_state == route_clear"
        on_fail: "Return to progressive Discover, resolve or explicitly retire/exclude remaining state, repair the pending route_clear_handoff or matching Requirement Acceptance Map reference, and do not transition to bounded/not_applicable or enter Decompose, Plan, or Build before durable consumption."

      - id: D_CONTEXT_BUDGET
        check: "For medium+ tasks or large material: context_budget_note records exact/pinned, summarized, omitted/deferred, and split/delegation plan"
        condition: "size in [medium, large, mega] or material exceeds faithful single-context review"
        on_fail: "Load references/context-budget-and-pattern-retrieval.md and add the Context Budget note before planning/building"

      - id: D_ARCHITECTURE_DECISION_PACK
        check: "When architecture_design_mode is lightweight, required, or review_intensive: architecture_decision_pack is current for the repository revision or greenfield assumptions; separates facts from assumptions; has no unresolved blocking material questions; records boundary ownership/lifecycle, design-pressure checks for control/early exit, ownership/disposal, resource envelope, extension registration, and representative path, semantic Type Ledger with primitive exceptions/conversion points, interface evolution, falsifiable quality scenarios, selected design, verification, invalidation conditions, and handoff refs. When review_intensive, independent_challenge_evidence includes challenge, dissent/validation, resolution, and selected-design impact."
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        on_fail: "Load references/architecture-decision-pack.md, finish local evidence discovery and material question resolution, create or refresh the typed pack, then add its reference to context map/journal and the next Plan or Decompose handoff."

      - id: D5
        check: "When the candidate scope scan cannot resolve relevant files/boundaries directly or architecture_design_mode != not_applicable: a compact context map exists at {agent_state_dir}/context-map.md when local state artifacts are configured and policy-allowed, or context map content is included in the task/plan packet when state files are unavailable"
        condition: "candidate_scope_scan has unresolved relevant boundaries or architecture_design_mode != not_applicable"
        on_fail: "Perform local mapping or dispatch Code Mapper only when routing permits, then persist the compact map to {agent_state_dir}/context-map.md when allowed; otherwise carry it forward in the plan packet"

      - id: D7
        check: "constraints list is captured (may be empty, but must be explicitly set)"
        on_fail: "Initialize constraints as empty list and note 'no constraints identified'"

      - id: D_SUBAGENT_TRIGGER
        check: "Required roles covered by a direct user, applicable AGENTS.md, or active skill instruction use subagent_policy_state=delegation_triggered, inferred subagent_trigger_scope, and delegated dispatch without a separate permission question. Explicit opt-out selects direct_fallback with delegation_opted_out evidence. policy_disallowed requires policy_blocking_source."
        on_fail: "If an applicable trigger exists and no delegation_opted_out, subagents_unavailable, or policy_disallowed evidence applies, infer subagent_trigger_scope and dispatch required roles. Otherwise preserve and complete the evidenced fallback state; do not overwrite explicit opt-out."

      - id: D8
        check: "When a context map is required: it was produced by Code Mapper only when delegated mapping is selected, or produced directly with equivalent local evidence"
        condition: "candidate_scope_scan has unresolved relevant boundaries or architecture_design_mode != not_applicable"
        on_fail: "Produce a compact context map directly or with an explicitly selected delegated mapper; record the evidence and routing path without inventing an automatic role"

      - id: D8A
        check: "When a context map is required: it includes references_checked covering behaviorally relevant callers, consumers, tests, docs, contracts, config, generated mirrors, and runtime surfaces, or explicit not-applicable/deferred reasons"
        condition: "candidate_scope_scan has unresolved relevant boundaries or architecture_design_mode != not_applicable"
        on_fail: "Complete direct or delegated mapping with references_checked before leaving Discover. Do not leave relevant references implicit."

      - id: D_REUSE_SEARCH
        check: "For rule-like changes involving business rules, validation, calculations/conversions, mappings, schema/config semantics, permissions, or protocol details: reuse_search records bounded existing-capability searches before implementation, then candidates or no_candidate_reason, decision, and rationale. not_applicable records a concrete reason without search ceremony."
        condition: "task scope includes rule-like behavior"
        on_fail: "Search the accepted task area before implementation, record the reuse_search result in the context map and task packet, or record a concrete not_applicable reason. Do not substitute candidate_search for this bounded capability check."

      - id: D9
        check: "When an unresolved lifecycle, failure, coupling, or behavior question remains after mapping: execution paths were traced by Explorer only when delegated analysis is selected, or traced directly with equivalent evidence"
        condition: "unresolved lifecycle, failure, coupling, or behavior question remains after mapping"
        on_fail: "Trace the specific execution path directly or with explicitly selected delegation; record the evidence and stop once the current decision is resolved"

    guidance_assertions:

      - id: D6
        severity: guidance
        check: "For medium+ tasks: agent readiness score was assessed and printed when subagent routing is uncertain"
        condition: "size in [medium, large, mega] or architecture_design_mode in [required, review_intensive]"
        on_fail: "Run agent readiness check when delegation choice is material; otherwise record direct execution/fallback rationale"

  # ─────────────────────────────────────────────
  # DISCOVER → DECOMPOSE (medium+ only)
  # ─────────────────────────────────────────────
  - phase: DECOMPOSE
    checkpoint_start: "--- PHASE: DECOMPOSE ---"
    checkpoint_end: "--- PHASE: DECOMPOSE COMPLETE ---"
    condition: "size in [medium, large, mega]"
    exit_assertions:

      - id: DC1
        check: "Slice manifest exists with one or more smallest iterable slices; if there is exactly one slice, the manifest includes a single-slice rationale"
        on_fail: "Dispatch Architect to produce a strict slice manifest or add a single-slice rationale when one verified slice is the smallest correct decomposition"

      - id: DC2
        check: "Each slice has slice_id, name, observable_increment, deliverable_type, acceptance_criteria, files_to_create, files_to_modify, files_to_test, enabling_changes_included, depends_on, verification_command, expected_success_signal, evidence_to_record, and deviation_rollback_rule"
        on_fail: "Rewrite the Decompose output into the strict slice schema before entering Plan"

      - id: DC_SLICE_IDENTITY
        check: "Every slice_id names its observable increment or verified deliverable"
        on_fail: "Rename generic slice IDs to stable descriptive outcome or deliverable slugs and update every manifest dependency and packet reference before branch creation"

      - id: DC_SLICE_SEQUENCE_LABEL
        check: "No slice_id is an ordinal-only or generic sequence label"
        on_fail: "Replace ordinal-only slice IDs with descriptive slugs before branch creation and keep sequencing in manifest order and depends_on"

      - id: DC_SLICE_REVIEW_TOPOLOGY
        check: "When slice_manifest has more than one item or slice_promotion_mode == review_gated, every generated slice packet contains complete topology metadata: target_branch, target_base_sha, task_branch, slice_branch, and promotion_mode"
        condition: "slice_manifest has more than one item or slice_promotion_mode == review_gated"
        on_fail: "Load references/slice-review-topology.md and add complete topology metadata before Build."

      - id: DC3
        check: "Slices are ordered by dependency — independent slices first and dependent slices after every depends_on prerequisite"
        on_fail: "Reorder slices so prerequisites come before dependents"

      - id: DC4
        check: "No circular dependencies exist between slices"
        on_fail: "Merge circularly dependent work into the smallest single iterable slice that can be verified"

      - id: DC5
        check: "No slice is layer-only, module-only, folder-only, feature-only, setup-only, contract-only, or broad component-style unless it produces a verified deliverable artifact with deliverable_type, acceptance criteria, verification command, and expected success signal"
        on_fail: "Convert broad layer/module/folder/feature/component or setup-only work into a smallest observable deliverable slice, or merge it into the slice that uses it"

      - id: DC6
        check: "Slice decomposition was produced by Architect subagent when subagent_execution_mode=delegated, or produced directly in fallback mode with equivalent criteria and evidence"
        condition: "size in [medium, large, mega]"
        on_fail: "Produce slice decomposition using delegated execution or direct fallback; record subagent_policy_state, subagent_execution_mode, and which path was used"

      - id: DC7
        check: "Saved clarification state is ready, clarification_defaults_applied is explicit (true/false), and unresolved clarification topics are empty before proceeding"
        on_fail: "Return to Discover and persist clarification_status=ready, clarification_defaults_applied explicit true/false, and unresolved clarification topics empty before continuing"

      - id: DC8
        check: "For medium+ tasks: decomposition_plan_review exists and decision is proceed after checking broad_split_rejection proof, scope understanding, slice/subagent count sanity, step/cost budget, dependency order, output-plan match, and fallback path"
        condition: "size in [medium, large, mega]"
        on_fail: "Load references/decomposition-plan-review.md, add explicit broad_split_rejection proof that broad layer/module/folder/feature/setup/contract/component splits were rejected unless they are verified deliverable artifact slices, repair the slice/subagent plan, and do not enter Plan until the review decision is proceed"

  # ─────────────────────────────────────────────
  # DECOMPOSE → PLAN (or PLAN directly for small)
  # ─────────────────────────────────────────────
  - phase: PLAN
    checkpoint_start: "--- PHASE: PLAN ---"
    checkpoint_end: "--- PHASE: PLAN COMPLETE (approved) --- for approved medium+ plans; --- PHASE: PLAN COMPLETE --- for no-wait small plans"
    condition: "plan_mode != none"
    exit_assertions:

      - id: P_ARTIFACT_CONTRACT
        check: "Plan includes artifact_contract before task packets with artifact type, required files/deliverables, output format/schema, acceptance criteria, verification command/method, expected success signal, owner/consumer, and non-goals/exclusions"
        on_fail: "Load references/artifact-first-output-contract.md and add the Artifact Contract before planning implementation steps"

      - id: P_ARCHITECTURE_DECISION_PACK
        check: "When architecture_design_mode is lightweight, required, or review_intensive: Plan references the current Architecture Decision Pack, maps its semantic interface/type commitments and quality verification to affected task packets, preserves primitive exceptions and public compatibility strategy, and names the independent review scope; review_intensive carries independent_challenge_evidence."
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        on_fail: "Return to the Architecture Decision Pack, refresh it if the revision or requirements changed, then add its typed reference, contract commitments, verification, and reviewer scope to the plan/task packets."

      - id: P_DONE_CONTRACT
        check: "For medium+ harness-capable work: accepted Done Contract exists before Build with done_when, not_done_when, verification, owner/consumer, acceptance_criteria, and debate_record with at least two perspectives; delegated mode uses subagent perspectives when available"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Block Build, load references/harness-controller.md, return to Plan, write the Done Contract, collect at least two debate perspectives using subagents when subagent_execution_mode=delegated and available, and seek re-approval when scope or acceptance changes"

      - id: P_HARNESS_RECIPE
        check: "For medium+ harness-capable work: Harness Recipe is selected before Build from task/model/risk/context profile and records selected_recipe, recipe_rationale, required_artifacts, and corrective_action"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Block Build, load references/harness-controller.md, return to Plan, classify task_profile, model_profile, risk_profile, and context_profile, select the Harness Recipe, and record the missing-recipe corrective action"

      - id: P_HARNESS_RUNTIME_ARTIFACTS
        check: "For medium+ harness-capable work: plan/task packets name Harness Run State, Trace Ledger, and Replay Packet artifact refs before Build"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Return to Plan, add harness_run_state_ref, trace_ledger_ref, and replay_packet_ref to the task packet or plan, and record the corrective action for missing run-state/trace/replay evidence"

      - id: P_VERIFIED_DISTILLATION
        check: "When promoting a workflow or review lesson into durable skill/constraint/eval knowledge: verified_skill_distillation exists and verifier_result is approved before durable files are written"
        on_fail: "Load references/verified-skill-distillation.md and obtain verifier approval before skill/constraint/eval promotion"

      - id: P1
        check: "Plan contains ordered implementation steps or task packets, each with exact file paths to create, modify, and test; for medium+ tasks the plan consumes the approved slice manifest from Decompose without rediscovering boundaries"
        on_fail: "Add exact create/modify/test file paths to every implementation step or task packet, and carry the approved slice manifest forward for medium+ tasks"

      - id: P2
        check: "Each implementation step or task packet has behavior/acceptance criteria and associated test criteria describing what to verify"
        on_fail: "Add behavior/acceptance criteria and test criteria to steps or task packets missing them"

      - id: P4
        check: "When plan_mode=approval_required, the user explicitly approved the plan and slice manifest when applicable. When plan_mode=inline, the compact plan was recorded and no-wait eligibility was recorded. plan_mode=none does not enter this phase."
        on_fail: "Wait for approval when plan_mode=approval_required. For inline mode, record why the compact plan can proceed without waiting. If none was selected incorrectly, return to Triage and promote plan_mode."

      - id: P5
        check: "Plan tier matches plan_mode and task size: compact for inline, standard for approval-required medium, and full for approval-required large/mega"
        on_fail: "Upgrade or downgrade plan_mode and tier to match size, risk, uncertainty, and approval policy"

      - id: P6
        check: "For large/mega tasks: Security and Operability sections are populated"
        condition: "size in [large, mega]"
        on_fail: "Fill Security and Operability sections per plan-template.md"

      - id: P7
        check: "For large+ tasks: implementation blueprint was produced by Architect subagent when subagent_execution_mode=delegated, or produced directly in fallback mode with equivalent architectural analysis"
        condition: "size in [large, mega]"
        on_fail: "Produce implementation blueprint using delegated execution or direct fallback; record subagent_policy_state, subagent_execution_mode, and which path was used"

      - id: P8
        check: "If clarification state was persisted for this task: saved clarification state is ready, clarification_defaults_applied is explicit (true/false), and unresolved clarification topics are empty before proceeding"
        on_fail: "Return to Discover and persist clarification_status=ready, clarification_defaults_applied explicit true/false, and unresolved clarification topics empty before continuing"

      - id: P_PATTERN_RETRIEVAL
        check: "When editing framework skills, contracts, evals, runtime integrations, templates, or workflow patterns: pattern_retrieval_note records real local search queries or paths, canonical repository pattern used, and counterexample/edge case checked or no-pattern rationale. If a concrete design force remains and an external library is explicitly configured, load references/design-pattern-retrieval.md; otherwise not_configured continues without asking."
        condition: "task touches framework skills, contracts, evals, runtime integrations, templates, or workflow patterns"
        on_fail: "Search local repo for similar patterns and record Pattern Retrieval before implementation; placeholders such as [paths/queries] or N/A without rationale do not satisfy this gate"

      - id: P9
        check: "For medium+ tasks: implementation work is represented as executable task packets using plan-template.md and aligned one-to-one with approved Decompose slices"
        condition: "size in [medium, large, mega]"
        on_fail: "Rewrite vague implementation steps into executable task packets that consume slice_id and slice manifest fields directly"

      - id: P10
        check: "Each implementation step or task packet has a verification command and expected success signal"
        on_fail: "Add an exact verification command and expected success signal to each step or task packet"

      - id: P11
        check: "Each task packet includes a deviation/rollback rule, or small inline plan explicitly states how deviations are handled"
        on_fail: "Add deviation/rollback handling before seeking plan approval"

      - id: P_WORKFLOW_EXPERIMENT_LEDGER
        check: "When the approved work is an explicit workflow experiment: workflow_experiment_ledger records hypothesis, intervention, expected signal, measurement method, baseline/control, result status, evidence, decision, and next check before the experiment runs"
        condition: "explicit workflow experiment, loop-optimization experiment, or approved plan labels the work as an experiment"
        on_fail: "Add the workflow_experiment_ledger entry to the plan/task journal before running the experiment, or remove the experiment label. Do not add Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation unless harness_capable or QA criteria independently apply."

      - id: P_LOOP_READINESS
        check: "Before any explicit repeat or optimization loop outside standard required workflow phase gates starts: loop_readiness_assessment records loop type, trigger, readiness state, verifier, stop condition, finite max iterations, budget limit, tool access, state tracking, retry_or_empty_result_handling, tool_error_handling, low_confidence_escalation, rollback/exit action, harness routing, and evidence"
        condition: "task will start an explicit repeat or optimization loop"
        on_fail: "Add loop_readiness_assessment before the loop starts, including retry/empty-result handling, tool-error routing, and low-confidence escalation, or remove the loop from the plan. Keep harness_routing=not_required unless harness_capable == true or QA criteria independently apply."

      - id: CS1
        check: "When search_mode == candidate_search: goal tree decomposes the existing acceptance criteria and slice acceptance/verification criteria"
        condition: "search_mode == candidate_search"
        on_fail: "Load references/candidate-search.md and rewrite the goal tree from approved criteria instead of creating a second source of truth"

      - id: CS2
        check: "When search_mode == candidate_search: candidate archive exists at {agent_state_dir}/candidate-search.md when local state artifacts are configured and policy-allowed, or is carried inline in the plan/task packet"
        condition: "search_mode == candidate_search"
        on_fail: "Create the candidate archive in configured local state when allowed; otherwise embed the archive in the plan/task packet with redaction and retention notes"

      - id: CS3
        check: "When search_mode == candidate_search: candidates are scored with the pre-code rubric: objective fit, verifiability, feasibility, risk, and simplicity"
        condition: "search_mode == candidate_search"
        on_fail: "Score each candidate using references/candidate-search.md before selecting an approach"

      - id: CS4
        check: "Post-approval candidate pivots are recorded as plan deviations and re-approved when scope, files, behavior, or risk changes"
        condition: "search_mode == candidate_search"
        on_fail: "Print the plan deviation, update plan_deviation, and wait for user approval before Build continues"

      - id: CS5
        check: "When search_mode == candidate_search: candidate_search_result includes search_exit_summary with candidate budget, candidates considered, exit reason, and empty-result handling"
        condition: "search_mode == candidate_search"
        on_fail: "Add search_exit_summary before Plan completes so the search cannot be mistaken for an unbounded or silently exhausted loop"

    guidance_assertions:

      - id: P3
        severity: guidance
        check: "Risks section is populated — at minimum 'Low risk: single-file change' for small tasks"
        on_fail: "Add risks section when risk is non-obvious; small obvious changes may state low-risk inline"

  # ─────────────────────────────────────────────
  # DESIGN → BUILD (UI tasks only)
  # ─────────────────────────────────────────────
  - phase: DESIGN
    checkpoint_start: "--- PHASE: DESIGN ---"
    checkpoint_end: "--- PHASE: DESIGN COMPLETE (approved) ---"
    condition: "phases list includes DESIGN"
    exit_assertions:

      - id: DS1
        check: "Visual mockup was presented to user"
        on_fail: "Create and present mockup before proceeding"

      - id: DS2
        check: "User explicitly approved the design"
        on_fail: "Wait for design approval"

      - id: DS3
        check: "Design direction proposal was produced by Architect subagent when subagent_execution_mode=delegated, or produced directly in fallback mode before mockup creation"
        on_fail: "Produce design direction using delegated execution or direct fallback; record subagent_policy_state, subagent_execution_mode, and which path was used"

  # ─────────────────────────────────────────────
  # BUILD → REVIEW
  # ─────────────────────────────────────────────
  - phase: BUILD
    checkpoint_start: "--- PHASE: BUILD ---"
    checkpoint_end: "--- PHASE: BUILD COMPLETE ---"
    exit_assertions:

      - id: B1
        check: "Every plan step has a corresponding '>> Step N/total: DONE' message"
        on_fail: "Complete remaining plan steps before entering Review"

      - id: B_DONE_CONTRACT
        check: "For medium+ harness-capable work: Build started only after the approved plan recorded Done Contract and Harness Recipe evidence"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Stop Build, return to Plan, add or repair the Done Contract and Harness Recipe from references/harness-controller.md, then resume only after the corrective action is recorded"

      - id: B_HARNESS_RUN_STATE_TRACE_REPLAY
        check: "For medium+ harness-capable work: Harness Run State, Trace Ledger, and Replay Packet are updated as execution progresses with task id/name, phase, slice, status, blockers, last verification, next action, recovery pointer, ordered events, decisions, verification results, plan deviations, artifact refs, pinned context, validation state, and exact next action"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Pause Build, update the task journal or carried-forward state with missing Harness Run State, Trace Ledger, and Replay Packet evidence, append a corrective trace entry, and resume only from the recorded exact next action"

      - id: B_CODE_WRITER_BLOCKER_ROUTING
        check: "When Code Writer returns NEEDS_CONTEXT, BLOCKED, or DEVIATED because of an unexpected blocker: blocker_type and blocker_evidence are recorded, the orchestrator routes recovery to debugging, explorer, architect, candidate_search, replan, restart, user clarification, environment fix, or permission request, and Code Writer is not asked to improvise through legacy blockers blindly"
        on_fail: "Pause Build, classify the blocker, update Harness Run State/Trace Ledger/Replay Packet when harness-capable, create pivot_restart_decision when restart/pivot/replan is selected, and obtain reapproval before continuing if scope, files, behavior, risk, verification, or acceptance criteria change"

      - id: B_ORDINARY_REPAIR_BOUNDS
        check: "When ordinary non-harness Build retries an implementation or verification failure: build_repair_state records attempt, max_attempts=3, no_progress_count, no_progress_limit=2, normalized failure_signatures, progress_evidence, plan_version, cumulative_attempt_count, status, terminal_route when terminal, and evidence_ref. Two consecutive attempts with a matching failure_signature and no measurable progress are stagnation. Worker/context/session changes do not reset the cumulative count; attempt 3 or no-progress count 2 ends through pivot_restart_decision or blocked."
        condition: "an ordinary non-harness Build implementation or verification failure is retried within the same approved scope"
        on_fail: "Stop same-scope repair. Route an unknown-cause failure through assistant-debugging; otherwise reconstruct build_repair_state, then route to replan/restart through pivot_restart_decision or return blocked. Never start a fourth attempt or continue after two no-progress attempts."

      - id: B2
        check: "Build command succeeded (exit code 0 or equivalent success)"
        on_fail: "Fix build errors. Do not enter Review with a broken build."

      - id: B3
        check: "At least one relevant verification exists and passed: runnable tests for code changes, or documented validation_results for docs/no-op/discovery/non-runnable workflows"
        on_fail: "Add or run an appropriate verification and record a passing result before proceeding"

      - id: B3A
        check: "Unknown-cause bugfixes completed assistant-debugging or recorded a concrete debugging blocker before implementation; no random patching occurred before reproduction/root-cause evidence"
        condition: "task_type == bugfix and debugging_mode in [root_cause_unknown, completed, blocked]"
        on_fail: "Return to assistant-debugging: reproduce or record blocker, evaluate hypotheses, and identify root cause or mitigation target before patching."

      - id: B4
        check: "All tests pass (0 failures)"
        on_fail: "Fix failing tests before entering Review"

      - id: B5
        check: "No plan deviations occurred silently — all were flagged via '>> PLAN DEVIATION DETECTED'"
        on_fail: "If any code diverges from the plan, print the deviation message and get resolution"

      - id: B6
        check: "When workflow_state_mode is journal, the task journal is current; when inline, the carried-forward packet contains progress and evidence for completed steps"
        on_fail: "Update the selected state surface without creating a task journal solely because the task is medium+."

      - id: B_ARCHITECTURE_PACK_ALIGNMENT
        check: "When architecture_design_mode is lightweight, required, or review_intensive: Build preserves the current Architecture Decision Pack boundary ownership, semantic type commitments or primitive exceptions, public compatibility strategy, and quality verification; a changed decision uses the normal plan-deviation/reapproval path"
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        on_fail: "Stop the affected Build step, refresh the Architecture Decision Pack, record a plan deviation, and obtain reapproval before implementing a changed design."

      - id: B_ARCHITECTURE_TDD_OBLIGATION_COVERAGE
        check: "When tdd_mode is true and an Architecture Decision Pack applies, the selected Build owner returns architecture_obligation_coverage that represents each carried architecture_test_obligations obligation exactly once by stable obligation_id, with no unknown or duplicate coverage id and evidence/outcome for every entry."
        condition: "tdd_mode is true and architecture_design_mode in [lightweight, required, review_intensive]"
        on_fail: "Return to the selected Build owner with the typed Pack obligations, record missing RED/GREEN or explicit blocker evidence, and do not enter Review with partial, duplicate, or unknown coverage."

      - id: B12
        check: "For medium+ tasks: every slice's acceptance and verification criteria from DECOMPOSE phase are independently checked, passing, and recorded with command/result evidence in the task journal, validation_results, or equivalent carried-forward slice ledger"
        condition: "size in [medium, large, mega]"
        on_fail: "Run verification criteria for each slice, record command/result evidence in the configured task journal or equivalent carried-forward state, and fix failing criteria before proceeding to Review."

      - id: B_SUBAGENT_EVIDENCE
        check: "For source-changing standard/strict Build tasks: subagent_execution_mode is not not_applicable; build_execution_lane == bounded_executor records one executor's focused RED, GREEN, and verification evidence plus changed-file evidence; build_execution_lane == separated_workers records Code Writer and Builder/Tester implementation/verification evidence"
        condition: "controller_intensity in [standard, strict]"
        on_fail: "Update the selected-lane implementation and verification portion of the Agent Dispatch Log before leaving Build. Light work may instead record inline/direct validation."

      - id: B_SUBAGENT_SLICE_EVIDENCE
        check: "For medium+ delegated tasks with slices: per-slice evidence matches build_execution_lane before the slice is marked VERIFIED; Builder/Tester is required only when build_execution_lane == separated_workers"
        condition: "size in [medium, large, mega] and subagent_execution_mode == delegated"
        on_fail: "Repair evidence according to build_execution_lane: bounded_executor records executor RED/GREEN/verification; separated_workers records Code Writer and Builder/Tester dispatch/results."

      - id: B13
        check: "For medium+ tasks: each slice has a final status of VERIFIED, including self-check result, before the next slice started"
        condition: "size in [medium, large, mega]"
        on_fail: "This is a process violation — slices must be verified sequentially with evidence before advancing. Note it in the configured task journal or equivalent carried-forward state."

      - id: B_SLICE_REVIEW_PENDING
        check: "For review_gated slices, local verification emits REVIEW_PENDING evidence with exact reviewed SHAs, must not mutate the task branch, and must not mark the slice VERIFIED or unlock dependent work."
        condition: "slice_promotion_mode == review_gated"
        on_fail: "Keep the slice pending and record exact local evidence; wait for adapter evidence."

      - id: B_SLICE_REVIEW_PROMOTION
        check: "A review-gated slice becomes VERIFIED only after provider evidence shows a passed gate for the exact reviewed SHAs, the reviewed head has ancestry in task_branch, and fresh verification succeeds. REVIEW_PENDING, REVIEW_REJECTED, and REVIEW_STALE remain non-completion states."
        condition: "slice_promotion_mode == review_gated"
        on_fail: "Treat changed refs as stale, obtain fresh provider evidence and fresh verification, and do not complete the slice early."

    guidance_assertions:

      - id: B7
        severity: guidance
        check: "Tests were written alongside code, not in a batch after all implementation"
        on_fail: "If batching happened, note it as process debt and ensure regression evidence still proves the behavior"

      - id: B8
        severity: guidance
        check: "SOLID principles checklist was evaluated for each implementation step (SRP for small, SRP+OCP+DIP for medium, full SOLID for large/mega per references/prompts/solid-principles.md)"
        on_fail: "Load references/prompts/solid-principles.md when design risk is material; otherwise use code review to catch concrete violations"

      - id: B9
        severity: blocker
        check: "Implementation was performed by the selected bounded executor or separated Code Writer when subagent_execution_mode=delegated, or directly in fallback mode with the same plan/deviation/verification evidence"
        condition: "controller_intensity in [standard, strict]"
        on_fail: "Record Code Writer dispatch/result evidence or Code Writer direct fallback evidence before Review"

      - id: B10
        severity: blocker
        check: "When build_execution_lane == separated_workers, build/test/validation was performed by Builder/Tester subagent when delegated or directly in fallback mode with equivalent command/result evidence"
        condition: "controller_intensity in [standard, strict] and build_execution_lane == separated_workers"
        on_fail: "Record Builder/Tester dispatch/result evidence or Builder/Tester direct fallback evidence before Review; bounded_executor instead records focused verification in B_SUBAGENT_EVIDENCE"

      - id: B11
        severity: blocker
        check: "For medium+ delegated tasks, the selected Build lane owner was dispatched per slice; separated_workers additionally dispatches Builder/Tester"
        condition: "size in [medium, large, mega]"
        on_fail: "Prefer slice-level execution when it reduces risk; do not block direct sequential work with equivalent verification"

  # ─────────────────────────────────────────────
  # REVIEW → DOCUMENT
  # ─────────────────────────────────────────────
  - phase: REVIEW
    checkpoint_start: "--- PHASE: REVIEW ---"
    checkpoint_end: "--- PHASE: REVIEW COMPLETE ---"
    exit_assertions:

      - id: R1
        check: "Structured Spec Review completed by loading and following references/prompts/spec-review.md; latest Spec Review entry has Result: PASS and records missing acceptance criteria, extra scope, changed files mismatch, verification evidence mismatch, and required fixes"
        condition: "controller_intensity in [standard, strict]"
        on_fail: "Run Stage 1 Spec Review using references/prompts/spec-review.md, record the structured spec compliance result, fix any FAIL items, and re-run until Result: PASS before quality review."

      - id: R1A
        check: "Quality Review entries do not substitute for Spec Review; Stage 1 spec compliance result is present before Stage 2 quality review starts"
        condition: "controller_intensity in [standard, strict]"
        on_fail: "Run the distinct Spec Review first. Do not count assistant-review, Quality Review, or legacy Review entries as spec compliance."

      - id: R2
        check: "Quality Review completed by loading and following assistant-review SKILL.md and contracts; canonical assistant-review final_summary and review_delegation_path are validated at review_result refs"
        condition: "controller_intensity in [standard, strict]"
        on_fail: "Load and follow assistant-review SKILL.md and contracts. assistant-review owns Reviewer dispatch and return validation; record only validated canonical result refs in workflow."

      - id: R_LIGHT_FRESH_REVIEW
        check: "Light work has a fresh post-validation review result with PASS, reviewed scope, resolved findings, and evidence"
        condition: "controller_intensity == light"
        on_fail: "Run the compact fresh-review lane, fix findings, rerun relevant validation, and record PASS evidence."

      - id: R2A_CODE_REVIEWER_DISTINCT
        check: "After Build completes, Review owns and records independent Code Reviewer dispatch/result evidence, or fresh direct-fallback review evidence, in subagent_evidence plus validated canonical assistant-review result refs in review_result. Code Reviewer or Reviewer compatibility evidence is recorded separately from QA Evaluator evidence."
        condition: "controller_intensity in [standard, strict] or qa_evaluation_mode == required"
        on_fail: "Run the Review-owned assistant-review lane after Build, validate its canonical outputs, and populate review_result refs plus subagent_evidence.code_reviewer_evidence. Keep QA Evaluator entries separate."

      - id: R_QA_EVALUATION
        check: "When qa_evaluation_mode is required: assistant-review owns QAEvaluator dispatch and return validation after build/test and Code Reviewer evidence; workflow records validated canonical qa_evaluation_result and qa_evaluation_delegation_path refs"
        condition: "qa_evaluation_mode == required"
        on_fail: "Load and follow assistant-review QA contracts. assistant-review owns QAEvaluator dispatch and return validation; do not complete Review until workflow holds validated canonical QA result refs or assistant-review reports a canonical blocked result."

      - id: R_PIVOT_RESTART_DECISION
        check: "Review or QA STAGNATION, repeated DRIFT, repeated REGRESSION, or rubric/domain action pivot records an orchestrator-owned pivot_restart_decision before another fix, review, QA, or build dispatch; round 10 remains terminal and never creates round 11 behavior"
        on_fail: "Pause Review, create pivot_restart_decision with trigger, evidence, affected_slice_or_round, options_considered, selected_action, reapproval_required, next_agent, recovery_pointer, and exact_next_action. Update Harness Run State, Trace Ledger, Replay Packet, and Artifact Reference Ledger when harness-capable before continuing."

      - id: R3
        check: "Review emits review_result with canonical_result_ref, canonical_contract=assistant-review/contracts/output.yaml#final_summary, delegation_path_ref, delegation_contract=assistant-review/contracts/output.yaml#review_delegation_path, and validation_status=validated; developer handoff creation remains in Document"
        condition: "controller_intensity in [standard, strict] or risk_tier in [high, critical]"
        on_fail: "Complete assistant-review, validate its canonical result and delegation-path artifacts, record workflow refs, then continue to Document for developer handoff creation"

      - id: R_REQUIREMENT_COVERAGE
        check: "Every accepted requirement_id has passed evidence or an explicit approved exclusion with reason before Review completes"
        condition: "size in [medium, large, mega] or architecture_design_mode in [required, review_intensive]"
        on_fail: "Use references/requirement-acceptance-map.md to run missing verification, repair failed behavior, or obtain explicit approval for an exclusion; do not infer coverage from aggregate test success"

      - id: R_ARCHITECTURE_DECISION_PACK
        check: "When architecture_design_mode is lightweight, required, or review_intensive: assistant-review applies the Architecture Decision Pack Review Checklist and records concrete findings or no-concrete-risk checks for freshness, ownership/dependency boundaries, semantic types/primitive exceptions, interface evolution, quality-scenario verification, and scope propagation; review_intensive includes independent challenge evidence."
        condition: "architecture_design_mode in [lightweight, required, review_intensive]"
        on_fail: "Provide the current pack and changed scope to assistant-review, run the Architecture Decision Pack Review Checklist, fix concrete findings, and refresh validation before Document."

      - id: R3A
        check: "For bugfixes, review material includes reproduction/root-cause evidence or an explicit not_applicable/blocker rationale, and verifies that regression coverage follows from that evidence"
        condition: "task_type == bugfix"
        on_fail: "Add debugging evidence to the review material or downgrade confidence/status before final review."

      - id: R4
        check: "Required manual verification has passed with trigger and evidence; user confirmation exists only when that scoped check depends on the user's observation"
        condition: "manual_verification_mode == required"
        on_fail: "Run the scoped manual verification or wait for the specific user observation it requires; do not ask for ritual confirmation."

      - id: R5
        check: "For medium+ tasks: task journal, output contract, or equivalent carried-forward review state has Final Result entry"
        condition: "size in [medium, large, mega]"
        on_fail: "Write Final Result entry in the configured task journal or equivalent carried-forward review state"

    guidance_assertions:

      - id: R6
        severity: strict_only
        check: "For medium+ tasks: rubric scores present in Quality Review entries (Rubric: and Weighted: lines)"
        condition: "size in [medium, large, mega]"
        on_fail: "Re-run quality review with rubric_required=true per references/review-rubric.md and enforce the result before completion."

      - id: R7
        severity: strict_only
        check: "For medium+ tasks: final rubric score and evidence-backed residual risks are recorded; completion follows actual findings and applicable gates"
        condition: "size in [medium, large, mega]"
        on_fail: "Record the score and residual risk. A score below 4.0 records residual risk but does not by itself authorize fixes or another review round; continue only for an evidence-backed finding or allowed additional_round_reason."

  # ─────────────────────────────────────────────
  # DOCUMENT → COMPLETE
  # ─────────────────────────────────────────────
  - phase: DOCUMENT
    checkpoint_start: "--- PHASE: DOCUMENT ---"
    checkpoint_end: "--- PHASE: DOCUMENT COMPLETE ---"
    exit_assertions:

      - id: DOC1
        check: "Relevant documentation was updated OR explicitly noted as unnecessary with reason"
        condition: "size in [medium, large, mega]"
        on_fail: "Review what documentation needs updating (README, CHANGELOG, code comments)"

      - id: DOC_HARNESS_REPLAY_PACKET
        check: "For medium+ harness-capable work: final Harness Run State, Trace Ledger, and Replay Packet evidence is current before completion or handoff"
        condition: "size in [medium, large, mega] and harness_capable == true"
        on_fail: "Before Document completes, update Harness Run State to the current phase/status, append final trace entries for verification/review/document decisions, refresh Replay Packet validation_state and exact_next_action, and record any remaining blocker"

      - id: DOC_SKILL_DISTILLATION
        check: "If work produced a repeatable workflow, recurring lesson, user-requested reusable procedure, or skill/constraint candidate: verified_skill_distillation exists and verifier_result is approved before promotion, or promotion_decision is skip with rationale"
        on_fail: "Load references/verified-skill-distillation.md, create the distillation packet, and send it to an independent verifier before saving any reusable skill or constraint"

      - id: DOC3
        check: "'--- WORKFLOW COMPLETE ---' is only printed AFTER all DOCUMENT assertions pass"
        on_fail: "Do not print workflow complete until all document assertions pass"

      - id: DOC_FINAL_HANDOFF
        check: "For medium+ tasks final_handoff exists and every accepted requirement_id is linked to passed evidence or an approved exclusion"
        condition: "size in [medium, large, mega]"
        on_fail: "Load references/final-handoff.md and references/requirement-acceptance-map.md, complete the handoff and traceability evidence, then re-run Document gates"

      - id: DOC4
        check: "If no task journal/equivalent state exists, or explicit non-standard handoff is requested: context_handoff_packet preserves pinned context, summarizes compressible context, prunes stale/unsafe residue, and names the exact next action"
        on_fail: "Create or repair the context_handoff_packet using references/context-handoff-templates.md before ending the session"

    guidance_assertions:

      - id: DOC2
        severity: guidance
        check: "Optional metrics were appended when useful and configured, or omitted without affecting completion"
        on_fail: "Record metrics later if useful; missing metrics never blocks completion."

# ─────────────────────────────────────────────
# Cross-phase invariants
# These must hold true throughout the entire workflow, not just at gates.
# ─────────────────────────────────────────────
invariants:
  - id: INV_TASK_STATE_FRESHNESS
    check: "Persisted task state is treated as a claim and reconciled against the newest user request and current repository evidence before its next action is used; only classification=active may resume"
    scope: all_phases
    on_fail: "Load references/task-state-reconciliation.md, classify active/stale/superseded/completed, repair the state, and discard its unchecked next action"

  - id: INV1
    check: "Constraints list is never reduced — only grows. Removing a constraint requires explicit user instruction."
    scope: all_phases
    on_fail: "Print '>> CONSTRAINT REMOVED — review with user before proceeding' and restore the removed constraint"

  - id: INV2
    check: "No required phase is skipped; Plan runs exactly when plan_mode is inline or approval_required and is omitted only when plan_mode=none eligibility remains true"
    scope: all_phases
    on_fail: "Print '>> PHASE SKIPPED — run the missing phase before continuing', or return to Triage and correct plan_mode before proceeding"

  - id: INV3
    check: "When controller_intensity is strict, explicit project policy requires markers, or the user requests exact markers, every executed phase prints its start checkpoint before work and its end checkpoint after assertions pass"
    condition: "controller_intensity == strict or explicit project policy requires exact phase markers or user requested exact phase markers"
    scope: all_phases
    on_fail: "Re-print the missing required checkpoint marker and note the protocol repair in the configured task journal or equivalent carried-forward state. Light/standard work without a marker trigger uses concise natural progress updates instead."

  - id: INV4
    check: "If scope grows beyond initial triage during any phase, stop and re-triage"
    scope: all_phases
    on_fail: "Print '>> SCOPE CHANGE DETECTED' and re-run Triage with updated understanding"

  - id: INV_SUBAGENT_TRIGGER_STATE
    check: "When required roles are covered by a direct user, applicable AGENTS.md, or active skill instruction, subagent_policy_state=delegation_triggered and delegated dispatch proceeds without a separate permission question. direct_fallback only after delegation_opted_out, subagents_unavailable after a real spawn failure or supported configuration proof, or policy_disallowed with policy_blocking_source."
    scope: all_phases
    on_fail: "If an applicable trigger exists and no delegation_opted_out, subagents_unavailable, or policy_disallowed evidence applies, infer subagent_trigger_scope and dispatch required roles. Otherwise preserve and complete the evidenced fallback state; do not overwrite explicit opt-out."

  - id: INV_PIVOT_RESTART_REAPPROVAL
    check: "Any pivot_restart_decision that changes approved scope, files, behavior, risk, verification, or acceptance criteria has reapproval_required=true and records approval before Build or Review continues"
    scope: all_phases
    on_fail: "Pause the workflow, mark reapproval_required=true, update the plan/task journal, and wait for user approval before continuing the changed path"

  - id: INV_CONTROLLER_INTENSITY_STANDARD
    check: "controller_intensity == standard with harness_capable=false and qa_evaluation_mode=not_required does not require Done Contract, Harness Recipe, Trace Ledger, Replay Packet, Artifact Reference Ledger, or QA evaluation"
    scope: all_phases
    on_fail: "Remove accidental strict/harness/QA requirements, or re-triage with explicit independent criteria before promoting controller_intensity to strict."

  - id: INV_BUILD_REPAIR_BOUNDED
    check: "Ordinary same-scope Build repair never exceeds max_attempts=3 or no_progress_limit=2, and cumulative_attempt_count never resets across redispatch, context reset, compaction, or continuation"
    scope: all_phases
    on_fail: "Stop retrying and record terminal_pivot or blocked with a pivot_restart_decision/evidence reference before any continuation."

  - id: INV_ARCHITECTURE_PACK_FRESHNESS
    check: "When architecture_design_mode is not not_applicable, the Architecture Decision Pack remains tied to the current repository revision or stated greenfield basis. A changed HEAD, requirement, public contract, quality target, or contradictory source fact invalidates and refreshes the pack before Build or Review relies on it."
    condition: "architecture_design_mode in [lightweight, required, review_intensive]"
    scope: all_phases
    on_fail: "Return to Discover or Plan, refresh the Architecture Decision Pack with current source evidence and invalidation state, then reapprove if the selected design, scope, behavior, risk, or verification changed."

  - id: INV_SEMANTIC_TYPE_BOUNDARIES
    check: "When the Architecture Decision Pack introduces or changes a domain/public/lifecycle/unit/validation/ownership/extension concept, its Type Ledger uses a semantic type or records a concrete primitive exception with an owned conversion/validation boundary. Public or serialized changes retain compatibility/versioning/adapters and rollback evidence."
    condition: "architecture_design_mode in [lightweight, required, review_intensive]"
    scope: all_phases
    on_fail: "Repair the Type Ledger and affected interface/task packet before implementation; do not hide domain meaning in unexplained generic primitives or introduce wrapper-only types without an owned semantic boundary."

  - id: INV_PROGRESSIVE_DISCOVERY_BOUNDARY
    check: "Progressive mapping, resolving, route_clear, or blocked state remains in Discover and is a no-execution boundary: no Decompose, Plan, Build, project/source mutation, external writes, branch creation, or credential-location recording occurs. The only permitted local state update is the framework-owned journal/equivalent carried-state update required to record progressive state, including a route-clear handoff or its consumption; it never authorizes project/source mutation or an external write."
    condition: "uncertainty_shape == progressive and progressive_discovery_state in [mapping, resolving, route_clear, blocked]"
    scope: all_phases
    on_fail: "Return to progressive Discover, preserve the typed decision and handoff state, use only the framework-owned journal/equivalent carried-state update needed to record it, and run any mutating prerequisite as a separate approved workflow that returns evidence before this workflow can consume it."

  - id: INV_PROGRESSIVE_SINGLE_ACTIVE
    check: "Ensures that at most one decision item is active in every progressive state where decision items exist, including mapping; use decision-item statuses when no decision_frontier snapshot exists, and the recomputed decision_frontier enforces the same limit once it exists. Sequential resolutions may continue in the same session only after each recomputation."
    condition: "uncertainty_shape == progressive and progressive_discovery_state in [mapping, resolving, route_clear, blocked]"
    scope: all_phases
    on_fail: "Keep at most one decision-item status=active; use decision-item statuses during mapping and, when a decision_frontier snapshot exists, recompute it and preserve the unresolved and blocked refs. Do not require a decision_frontier during mapping."

  - id: INV_PROGRESSIVE_DEPENDENCY_ORDER
    check: "Every decision_item.dependencies collection is ordered unique and each ref resolves exactly once to another canonical decision_item.decision_id; no self dependency or circular dependency is allowed. A decision is eligible or active only after every dependency has status=resolved, so decision_frontier cannot select a dependent prematurely."
    condition: "uncertainty_shape == progressive and progressive_discovery_state in [mapping, resolving, route_clear, blocked]"
    scope: all_phases
    on_fail: "Keep the dependent pending or blocked, repair dangling/self/cyclic dependency refs, and recompute the frontier only after every predecessor is resolved."

  - id: INV_PROGRESSIVE_ACTIVATION_PROVENANCE
    check: "Every decision item that has ever been activated records a positive activation_ordinal atomically on first activation and retains that immutable ordinal across resolved, blocked, superseded, or excluded status and compaction; never-activated items omit it. Ordinals are unique across retained canonical decision-map history, including activation-marked items outside current-map refs. Before the second activation, ascending ordinals reconstruct exactly the ordered unique activated_decision_item_refs, preserving the first activation even when its current status no longer proves it was active."
    condition: "uncertainty_shape == progressive"
    scope: all_phases
    on_fail: "Do not activate another item. Restore the first activation ordinal and every later immutable ordinal on the canonical decision items, then reconstruct activated_decision_item_refs before the second proposal."

  - id: INV_PROGRESSIVE_REPEAT_READINESS
    check: "One active item and multiple sequential resolutions remain allowed, but every second/subsequent activation after any prior activation atomically sets progressive_sequence_readiness_state=active and progressive_artifact_retention_state=retained with a ready loop_readiness_assessment with loop_type=progressive_decision_sequence, stable readiness_assessment_id and progressive_decision_map_ref, immutable finite max_iterations, cumulative_activation_count matching ordered unique append-only activated_decision_item_refs reconstructed from ascending activation_ordinal values and including the first activation. Prior activated items may be resolved, superseded, or excluded while cumulative activated refs remain append-only; superseded/excluded refs are not classified as resolved; resolved_decision_item_refs link exactly once to canonical decision_resolution. While active, retain that record through pause, blocked state, compaction, continuation, route-clear preparation, third+ activation proposals, and durable route-clear consumption. Only then set closed. After progressive_sequence_readiness_state becomes closed, retained keeps the same record while the task remains active/resumable or compacts. Only terminally_archived permits omission after explicit final archival/termination evidence proves continuation and reference resolution are impossible; Task state: completed does not qualify, and terminally_archived cannot revert. Another activation atomically appends/increments only below the cap with budget_limit, route-clear, cap, stagnation, or failure stop conditions, unchanged frontier/no-progress detection, retry_or_empty_result_handling, tool_error_handling, low_confidence_escalation, and existing journal/equivalent state tracking; equality or inconsistency fails closed to blocked/escalation. Closed cannot reopen or reset the same decision map."
    condition: "(uncertainty_shape == progressive and a second/subsequent decision activation is proposed after any prior activation) or (progressive_artifact_retention_state != terminally_archived and progressive_sequence_readiness_state in [active, closed])"
    scope: all_phases
    on_fail: "Do not activate another item. Preserve the stable identity, immutable cap, and cumulative history while active through durable route-clear consumption and after closed while progressive_artifact_retention_state=retained. Permit omission only after the explicit final archival/termination transition to terminally_archived. Record bounded readiness evidence or route to blocked/escalation; never reset the cap or treat an unchanged frontier as progress."

  - id: INV_PROGRESSIVE_HUMAN_EVIDENCE
    check: "A human_required decision cannot self-resolve: its decision_resolution has actual user evidence at human_confirmation_ref before it is marked resolved."
    condition: "uncertainty_shape == progressive"
    scope: all_phases
    on_fail: "Keep the decision unresolved, request or record actual user evidence, and do not manufacture human confirmation."

  - id: INV_PROGRESSIVE_BLOCKED_RECOVERY
    check: "When progressive_discovery_state=blocked, at least one canonical decision_item has status=blocked and decision_frontier.blocked_item_refs is non-empty. Every decision_item status=blocked records blocker_kind, blocker_reason, and unblock_condition. Every blocked_item_refs entry resolves exactly once to a status=blocked item, and every status=blocked item is referenced so recovery knows why it stopped and what must change before retry."
    condition: "uncertainty_shape == progressive and (progressive_discovery_state == blocked or (progressive_discovery_state in [resolving, route_clear] and any decision_item has status=blocked))"
    scope: all_phases
    on_fail: "Keep or mark the current/proposed item blocked, record its typed reason and concrete unblock condition, repair non-empty blocked_item_refs, and do not retry or advance until the condition is evidenced. Use blocker_kind=readiness_exhausted when the sequence cap, stagnation, failure, or evidence route caused the blocked state."

  - id: INV_PROGRESSIVE_RECOMPUTATION
    check: "Before recomputing the frontier, each decision_resolution records downstream effects, newly precise items, superseded/invalidated items, and effect refs; when a mapping item becomes resolved, retain that canonical decision_resolution with evidence and effects before dependent eligibility; every unlocked deferred_uncertainty has converted_decision_item_ref resolving exactly once to an actionable canonical decision_item and appearing exactly once in the unlocking predecessor decision_resolution.newly_precise_item_refs; newly_precise_item_refs and superseded_item_refs meet their ordered-unique canonical field validations."
    condition: "uncertainty_shape == progressive and (progressive_discovery_state in [resolving, route_clear] or (progressive_discovery_state == mapping and any decision_item has status=resolved))"
    scope: all_phases
    on_fail: "Repair missing mapping-time or later resolutions, duplicate, dangling, or status-misclassified effects/refs, then recompute the frontier."

  - id: INV_PROGRESSIVE_ARTIFACT_RETENTION_STATE
    check: "When durable markers are pending or consumed, or active or closed, progressive_artifact_retention_state must be retained unless a valid terminally_archived transition has occurred; not_applicable or missing state fails closed and never releases an artifact. terminally_archived is valid only as one atomic transition with uncertainty_shape=bounded and progressive_discovery_state=not_applicable after progressive_terminal_archival is already present before the state is persisted or resumed. The tombstone carries explicit final archival/termination evidence proving continuation and reference resolution are impossible, binds exact current_task_identity and final_progressive_decision_map_ref, typed final archival/termination basis, and resolvable evidence_refs. It is invalid while route-clear consumption is pending or sequence readiness is active. Task state: completed, consumed route clearance, closed readiness, or compaction alone is insufficient evidence. terminally_archived is terminal for the same task and decision map and cannot revert to retained."
    condition: "progressive_route_clear_consumption_state in [pending, consumed] or progressive_sequence_readiness_state in [active, closed] or progressive_artifact_retention_state == terminally_archived"
    scope: all_phases
    on_fail: "Set or restore progressive_artifact_retention_state=retained and every required durable artifact before continuation. Reject terminally_archived unless a complete progressive_terminal_archival tombstone is already present and it atomically sets uncertainty_shape=bounded and progressive_discovery_state=not_applicable; never infer archival from completion, consumption, closure, compaction, or generic evidence alone, and never revert a valid terminal state."

  - id: INV_PROGRESSIVE_TERMINAL_ARCHIVAL
    check: "When progressive_artifact_retention_state=terminally_archived, progressive_terminal_archival is present and binds current_task_identity, final_progressive_decision_map_ref, typed final_archival_or_termination_basis, and one or more resolvable evidence_refs proving continuation and reference resolution are impossible. Every identity and evidence ref matches the current task and final map exactly; missing, dangling, or mismatched tombstone evidence fails closed and cannot release the retained chain."
    condition: "progressive_artifact_retention_state == terminally_archived"
    scope: all_phases
    on_fail: "Restore retained progressive artifacts and progressive_artifact_retention_state=retained until a complete typed terminal tombstone is recorded; never infer it from task completion, route consumption, readiness closure, or compaction."

  - id: INV_PROGRESSIVE_ROUTE_CLEAR
    check: "When progressive_route_clear_consumption_state=pending, route_clear requires progressive_artifact_retention_state=retained, no open/blocked items, and no remaining deferred uncertainty except retired/excluded entries. Each current-map retired/excluded deferred uncertainty must retain its exact canonical predecessor decision_resolution even when that predecessor is superseded or excluded. route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs is ordered unique, resolves exactly once, and exactly covers every current decision_map deferred uncertainty with status retired/excluded; it is empty if and only if none exist. Empty, duplicate, dangling, or partially resolvable current map refs cannot reach route_clear, bounded planning, Decompose, Plan, or Build; wrong-status refs also fail closed. route_clear_handoff.decisions contains every current-map status=resolved decision exactly once through canonical decision_resolution.decision_item_ref values, while every current-map status=superseded or excluded decision appears exactly once in exclusions; decisions is non-empty when any current-map decision has status=resolved and empty only for a legitimate all-excluded route. Retained historical resolutions for current-map superseded or excluded items are lineage evidence only and do not appear in decisions. route_clear_handoff.next_route is bounded_discover and consumption_state=pending mirrors the typed marker while the handoff prepares the Requirement Acceptance Map from its decisions, constraints, exclusions, retired_or_excluded_deferred_uncertainty_refs, and acceptance_seed. Requirement Acceptance Map is not required while progressive_route_clear_consumption_state=pending. Its source_route_clear_handoff_ref resolves to the source handoff and that handoff's consumed_by_requirement_acceptance_map_ref resolves back to the consuming map. Requirement Acceptance Map is required when progressive_route_clear_consumption_state=consumed and progressive_artifact_retention_state=retained, and retired_or_excluded_deferred_uncertainty_traces binds every source retired/excluded uncertainty ref exactly once to a concrete non_goal or approved_exclusion target_ref; pending route-clear alone is insufficient. Reciprocal map consumption records progressive_route_clear_consumption_state=consumed before the atomic typed-state transition to bounded/not_applicable; route_clear_handoff and both reciprocal refs remain required while progressive_artifact_retention_state=retained during active/resumable continuation."
    condition: "progressive_artifact_retention_state != terminally_archived and progressive_route_clear_consumption_state in [pending, consumed]"
    scope: all_phases
    on_fail: "Return to progressive Discover, repair unresolved/deferred refs or the handoff/map cross-reference, and do not enter bounded/not_applicable state or Decompose, Plan, or Build until durable consumption."

  - id: INV_PROGRESSIVE_RETAINED_REFERENCE_CHAIN
    check: "While progressive_artifact_retention_state=retained and either progressive_route_clear_consumption_state is pending or consumed, or progressive_sequence_readiness_state is active or closed, preserve the retained canonical reference chain: decision_map; every referenced decision_item and deferred_uncertainty; every canonical decision_resolution for a resolved item; and every exact retained predecessor decision_resolution required by a current-map retired/excluded deferred uncertainty. route_clear_handoff.decision_map_ref and loop_readiness_assessment references must resolve to those retained canonical artifacts throughout active/resumable continuation or compaction. decision_frontier remains transient after live progressive state ends. Only progressive_artifact_retention_state=terminally_archived permits omission after explicit final archival/termination evidence proves continuation and reference resolution are impossible. Task state: completed does not qualify; terminally_archived is invalid with pending route consumption or active readiness and cannot revert."
    condition: "progressive_artifact_retention_state != terminally_archived and (progressive_route_clear_consumption_state in [pending, consumed] or progressive_sequence_readiness_state in [active, closed])"
    scope: all_phases
    on_fail: "Restore the retained canonical reference chain before continuing, keep decision_frontier limited to live progressive state, and do not discard artifacts while durable markers permit resumption."
