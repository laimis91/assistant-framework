# Research Output Contract
# Defines what a completed research activity MUST produce.

schema_version: "3.0"
contract: output
skill: assistant-research

artifacts:
  - name: findings
    type: object[]
    required: true
    condition: always
    description: "Research findings with confidence scores and source attribution"
    min_items: 1
    validation: "At least one finding. Each must have a confidence level."
    object_fields:
      - name: finding
        type: string
        required: true
        description: "The factual claim or insight discovered"
      - name: confidence
        type: enum
        required: true
        enum_values: [high, medium, low]
        validation: >
          high: 3+ independent sources agree, or primary/official source found.
          medium: 2 sources agree, or 1 authoritative source.
          low: single source, or sources conflict.
      - name: sources
        type: string[]
        required: true
        min_items: 1
        description: "Source names or descriptions (URLs go in verified_urls)"
      - name: verified_urls
        type: string[]
        required: false
        description: "URLs that were verified as accessible"
        validation: "Every URL listed here was checked and returned a valid response"

  - name: candidate_mechanisms
    type: object[]
    required: conditional
    condition: "question asks why/how something happens, asks for causes, asks for improvement mechanisms, or requests candidate mechanisms"
    description: "Evidence-backed hypotheses for mechanisms that could explain a pattern or guide validation; not proven causes."
    min_items: 1
    validation: "Each candidate mechanism includes mechanism, claim_status, evidence, confidence, counterevidence_or_conflicts, gaps, and validation_method. Do not present candidate mechanisms as proven causes."
    on_fail: "Add missing mechanism fields or downgrade the claim to a gap. If validation was not executed, label the item as candidate or needs_validation instead of proven."
    object_fields:
      - name: mechanism
        type: string
        required: true
        description: "The hypothesized mechanism, causal path, or improvement lever"
      - name: claim_status
        type: enum
        required: true
        enum_values: [candidate, needs_validation, unsupported, rejected]
        validation: "Must not use proven as a candidate mechanism status"
      - name: evidence
        type: object[]
        required: true
        min_items: 1
        validation: "Source-backed support, inference-only support, or explicit unresolved evidence marker"
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
          - name: evidence_status
            type: enum
            required: true
            enum_values: [source_backed, inference_only, unresolved]
      - name: confidence
        type: enum
        required: true
        enum_values: [high, medium, low]
        validation: "Assigned from evidence strength and conflict level; low when evidence is single-source, inference-only, unresolved, or materially conflicting"
      - name: counterevidence_or_conflicts
        type: string[]
        required: true
        description: "Counterevidence, conflicts, or explicit none-found entry"
      - name: gaps
        type: string[]
        required: true
        description: "Missing data, untested assumptions, stale sources, or unresolved checks"
      - name: validation_method
        type: string
        required: true
        validation: "Concrete test, metric, comparison, experiment, or next source check that could confirm or reject the mechanism"

  - name: perspective_scan
    type: object[]
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "Five expert lenses used before synthesis"
    min_items: 5
    max_items: 5
    validation: "Includes practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, and historian_or_pattern_matcher lenses with confidence levels and source notes."
    on_fail: "Re-run the perspective scan using five-lens-briefing.md before synthesizing."
    object_fields:
      - name: lens
        type: enum
        required: true
        enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]
      - name: core_position
        type: string
        required: true
      - name: strongest_evidence_or_source_notes
        type: string
        required: true
      - name: likely_blind_spot
        type: string
        required: true
      - name: unique_insight
        type: string
        required: true
      - name: confidence
        type: enum
        required: true
        enum_values: [high, medium, low]

  - name: question_trace
    type: object[]
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "STORM-style per-lens question trace and evidence ledger before contradiction mapping"
    min_items: 5
    max_items: 5
    validation: "Includes at least one perspective-guided research question per required lens, a source-grounded answer or explicit gap, source notes or verified URLs, every material evidence-prompted follow-up question or an explicit none_needed decision, and evidence status."
    on_fail: "Build the question trace/evidence ledger before contradiction mapping or synthesis; do not synthesize directly from fixed lenses."
    object_fields:
      - name: lens
        type: enum
        required: true
        enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]
      - name: question
        type: string
        required: true
        description: "Lens-specific research question asked before synthesis"
      - name: answer
        type: string
        required: true
        description: "Source-grounded answer, inference-only answer, or explicit unresolved gap"
      - name: sources_or_verified_urls
        type: string[]
        required: true
        min_items: 1
        description: "Sources, verified URLs, or an explicit no-source/unresolved marker"
      - name: follow_ups
        type: object[]
        required: true
        description: "Every material follow-up prompted by this answer, contradiction, or gap, or one typed none_needed decision"
        validation: "Every material follow-up is retained exactly once with a question, answer_or_gap, sources_or_verified_urls, and evidence_status. An empty collection is invalid; use one none_needed decision only when no material follow-up exists, and none_needed cannot coexist with material follow-ups for the same trace."
        on_fail: "Record every material follow-up or add one typed none_needed decision before synthesis."
        min_items: 1
        object_fields:
          - name: decision
            type: enum
            required: true
            enum_values: [follow_up, none_needed]
          - name: question
            type: string
            required: conditional
            condition: "decision == follow_up"
          - name: answer_or_gap
            type: string
            required: true
          - name: sources_or_verified_urls
            type: string[]
            required: true
            min_items: 1
          - name: evidence_status
            type: enum
            required: true
            enum_values: [source_backed, inference_only, unresolved]
      - name: evidence_status
        type: enum
        required: true
        enum_values: [source_backed, inference_only, unresolved]


  - name: contradiction_map
    type: object
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "Where the five lenses agree, disagree, and leave gaps"
    validation: "Names direct conflicts, consensus, strongest/weakest evidence, biggest unresolved question, and missing angle."
    on_fail: "Map contradictions before writing the synthesis; do not present a single-perspective briefing."
    object_fields:
      - name: direct_conflicts
        type: string[]
        required: true
      - name: strongest_evidence
        type: string
        required: true
      - name: weakest_evidence
        type: string
        required: true
      - name: consensus
        type: string[]
        required: true
      - name: biggest_unresolved_question
        type: string
        required: true
      - name: missing_angle_or_gap
        type: string
        required: true

  - name: synthesis_briefing
    type: object
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "Decision-ready synthesis of the perspective scan and contradiction map"
    validation: "Includes executive summary, ranked findings, hidden connection, actionable implication, recommendation, and frontier question."
    on_fail: "Rewrite the synthesis using all five lenses and the contradiction map."
    object_fields:
      - name: executive_summary
        type: string
        required: true
      - name: ranked_key_findings
        type: string[]
        required: true
        min_items: 3
      - name: hidden_connection
        type: string
        required: true
      - name: actionable_implication
        type: string
        required: true
      - name: recommendation
        type: enum
        required: true
        enum_values: [do, wait, avoid, investigate_further]
        validation: "For finance/trading, legal, medical, safety-critical, or similarly high-impact decisions, default to investigate_further unless verified evidence, explicit user context, and peer review support a stronger recommendation."
      - name: high_stakes_caveat
        type: string
        required: conditional
        condition: "topic involves finance/trading, legal, medical, safety-critical, or similarly high-impact decisions"
        description: "Educational due-diligence/risk caveat and user-context limits for high-stakes recommendations"
      - name: frontier_question
        type: string
        required: true

  - name: peer_review
    type: object
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "Independent ResearchPeerReviewer critique of the root-owned briefing before final presentation"
    validation: "Includes execution mode and peer assignment binding. Truth table: DONE=accepted; DONE_WITH_CONCERNS=accepted_with_concerns or revise; NEEDS_CONTEXT/BLOCKED=blocked with open_questions and status detail, and cannot finalize. accepted and accepted_with_concerns require required_revisions=[]; revise requires one or more required_revisions plus complete orchestrator-owned closure. Usable statuses include critique/evidence; delegated mode records a distinct native peer reviewer identity and fallback mode records a fresh fallback pass without fabricated identity."
    on_fail: "Run the separate ResearchPeerReviewer step and revise or downgrade claims before finalizing."
    object_fields:
      - name: peer_review_execution_mode
        type: enum
        required: true
        enum_values: [delegated, sequential_fallback]
      - name: peer_review_assignment_id
        type: string
        required: true
        description: "Orchestrator-created assignment identity echoed across peer handoff, peer result, and process evidence"
      - name: peer_reviewer_identity
        type: string
        required: conditional
        condition: "peer_review_execution_mode == delegated"
        description: "Distinct native ResearchPeerReviewer dispatch identity"
      - name: peer_review_fallback_pass_id
        type: string
        required: conditional
        condition: "peer_review_execution_mode == sequential_fallback"
        description: "Separate fresh root peer-critique pass identity; never a fabricated native dispatch reference"
      - name: status
        type: enum
        required: true
        enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
      - name: verdict
        type: enum
        required: true
        enum_values: [accepted, accepted_with_concerns, revise, blocked]
        validation: "DONE => accepted; DONE_WITH_CONCERNS => accepted_with_concerns or revise; NEEDS_CONTEXT => verdict=blocked; BLOCKED => verdict=blocked. Contradictory BLOCKED plus accepted, accepted_with_concerns, or revise is invalid."
      - name: confidence_scores
        type: string[]
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: weakest_claim
        type: string
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: bias_or_lens_dominance
        type: string
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: missing_sixth_perspective
        type: string
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: falsification_test
        type: string
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: revised_recommendation_if_needed
        type: string
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
      - name: required_revisions
        type: string[]
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
        validation: "accepted and accepted_with_concerns require required_revisions=[]; revise requires one or more required_revisions."
      - name: revision_disposition_id
        type: string
        required: conditional
        condition: "verdict == revise"
        description: "Orchestrator-owned identity for the required revision closure."
      - name: revision_disposition
        type: object[]
        required: conditional
        condition: "verdict == revise"
        min_items: 1
        description: "Orchestrator-owned closure for every peer-required revision before presentation."
        validation: "Covers every required_revisions entry exactly once with outcome=applied or claim_downgraded, is identified by revision_disposition_id, and unresolved revision blocks presentation."
        object_fields:
          - {name: required_revision, type: string, required: true}
          - {name: outcome, type: enum, required: true, enum_values: [applied, claim_downgraded]}
          - {name: closure_evidence, type: string, required: true}
      - name: evidence
        type: object[]
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
        min_items: 1
        object_fields:
          - {name: source, type: string, required: true}
          - {name: detail, type: string, required: true}
          - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
      - {name: open_questions, type: "string[]", required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]", min_items: 1}
      - {name: status_detail, type: string, required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]"}
      - {name: blocker_type, type: enum, required: conditional, condition: "status == BLOCKED", enum_values: [missing_review_context, policy_blocked, tool_failure]}
      - {name: blocker_evidence, type: "string[]", required: conditional, condition: "status == BLOCKED", min_items: 1}

  - name: five_lens_process_evidence
    type: object
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "FiveLensProcessEvidence proving independent lens dispatch or the constrained fallback path"
    validation: "Records mode, exact LensKind coverage, frozen-packet proof, wave coverage, root synthesis ownership, peer-review identity, return validation, and any reduced-independence fallback basis."
    on_fail: "Do not claim an independent briefing; restore missing process evidence, rerun the complete lens stage through evidenced fallback, or block."
    object_fields:
      - name: lens_execution_mode
        type: enum
        required: true
        enum_values: [delegated, sequential_fallback]
      - name: peer_review_execution_mode
        type: enum
        required: true
        enum_values: [delegated, sequential_fallback]
      - name: subagent_policy_state
        type: enum
        required: true
        enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
      - name: frozen_packet_set
        type: object
        required: true
        description: "Immutable pre-dispatch record that proves all five assignment packets froze before any lens execution."
        validation: "packet_set_frozen_at precedes first_lens_execution_at; packet_set_digest binds the ordered manifest contents (packet_id, LensKind, content_digest); and every dispatch or root pass binds packet_id, packet_set_id, and matching packet content_digest to this set."
        object_fields:
          - {name: packet_set_id, type: string, required: true}
          - {name: packet_set_digest, type: string, required: true}
          - {name: packet_ids, type: "string[]", required: true, min_items: 5, max_items: 5}
          - {name: packet_manifest_order, type: "string[]", required: true, min_items: 5, max_items: 5}
          - name: packet_manifest
            type: object[]
            required: true
            min_items: 5
            max_items: 5
            validation: "Ordered five-entry manifest has one exact LensKind per packet_id and a content_digest over the canonical complete frozen packet."
            object_fields:
              - {name: packet_id, type: string, required: true}
              - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
              - {name: content_digest, type: string, required: true}
          - {name: packet_set_frozen_at, type: string, required: true}
          - {name: pre_dispatch_record_id, type: string, required: true}
          - {name: first_lens_execution_at, type: string, required: true}
          - {name: first_lens_execution_evidence_ref, type: string, required: true}
      - name: subagent_trigger_scope
        type: string[]
        required: conditional
        condition: "subagent_policy_state == delegation_triggered"
        min_items: 1
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "subagent_policy_state == policy_disallowed"
      - name: frozen_assignment_packet_ids
        type: string[]
        required: true
        min_items: 5
        max_items: 5
        validation: "Exactly five frozen packet identities, one for each required LensKind, equal to frozen_packet_set.packet_manifest_order and created before first lens execution."
      - name: search_resource_budget
        type: object
        required: true
        description: "SearchResourceBudget used by every frozen lens packet and the complete five-lens process."
        validation: "Carries numeric per-lens and overall query, source, and time ceilings; deep stops at saturation or its hard ceiling, and exhaustion records gaps with downgraded confidence."
        object_fields:
          - {name: per_lens_max_queries, type: int, required: true}
          - {name: per_lens_max_sources, type: int, required: true}
          - {name: per_lens_max_minutes, type: int, required: true}
          - {name: overall_max_queries, type: int, required: true}
          - {name: overall_max_sources, type: int, required: true}
          - {name: overall_max_minutes, type: int, required: true}
          - {name: stop_condition, type: enum, required: true, enum_values: [saturation_or_hard_ceiling]}
      - name: lens_dispatches
        type: object[]
        required: conditional
        condition: "lens_execution_mode == delegated"
        min_items: 5
        max_items: 5
        validation: "Exactly five unique native dispatch identities cover the required LensKind enum exactly once and each binds the matching packet content_digest from frozen_packet_set.packet_manifest."
        object_fields:
          - name: lens_kind
            type: enum
            required: true
            enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]
          - name: dispatch_identity
            type: string
            required: true
          - name: assignment_id
            type: string
            required: true
          - name: packet_id
            type: string
            required: true
          - name: packet_set_id
            type: string
            required: true
          - name: packet_content_digest
            type: string
            required: true
          - name: wave_id
            type: string
            required: true
          - name: return_validated
            type: boolean
            required: true
      - name: fallback_lens_passes
        type: object[]
        required: conditional
        condition: "lens_execution_mode == sequential_fallback"
        min_items: 5
        max_items: 5
        validation: "Exactly five root passes cover the required LensKind enum exactly once, bind matching packet content_digest from frozen_packet_set.packet_manifest, and contain no native dispatch_identity."
        object_fields:
          - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
          - {name: assignment_id, type: string, required: true}
          - {name: packet_id, type: string, required: true}
          - {name: packet_set_id, type: string, required: true}
          - {name: packet_content_digest, type: string, required: true}
          - {name: root_pass_id, type: string, required: true}
          - {name: return_validated, type: boolean, required: true}
      - name: wave_coverage
        type: object[]
        required: conditional
        condition: "lens_execution_mode == delegated"
        min_items: 1
        validation: "Waves are capacity-bounded and their LensKind coverage is exact, disjoint, and exhaustive."
        object_fields:
          - name: wave_id
            type: string
            required: true
          - name: capacity
            type: int
            required: true
          - name: lens_kinds
            type: string[]
            required: true
            min_items: 1
      - name: root_synthesis_ownership
        type: enum
        required: true
        enum_values: [orchestrator_only]
      - name: peer_reviewer_identity
        type: string
        required: conditional
        condition: "peer_review_execution_mode == delegated"
      - name: peer_review_assignment_id
        type: string
        required: true
      - name: peer_review_revision_disposition_id
        type: string
        required: conditional
        condition: "peer_review.verdict == revise"
        description: "Orchestrator-owned revision_disposition identity binding the revised peer artifact to this process evidence."
        validation: "Exactly equals peer_review.revision_disposition_id."
      - name: peer_review_fallback_pass_id
        type: string
        required: conditional
        condition: "peer_review_execution_mode == sequential_fallback"
      - name: lens_fallback_evidence
        type: object
        required: conditional
        condition: "lens_execution_mode == sequential_fallback"
        object_fields:
          - {name: basis, type: enum, required: true, enum_values: [explicit_opt_out, spawn_failure_or_unavailable, supported_configuration_proof, exact_policy_block]}
          - {name: detail, type: string, required: true}
          - {name: evidence_ref, type: string, required: true}
      - name: peer_review_fallback_evidence
        type: object
        required: conditional
        condition: "peer_review_execution_mode == sequential_fallback"
        object_fields:
          - {name: basis, type: enum, required: true, enum_values: [explicit_opt_out, spawn_failure_or_unavailable, supported_configuration_proof, exact_policy_block]}
          - {name: detail, type: string, required: true}
          - {name: evidence_ref, type: string, required: true}
      - name: reduced_independence
        type: boolean
        required: true
        validation: "reduced_independence is true whenever lens_execution_mode or peer_review_execution_mode is sequential_fallback; false only when both are delegated."


  - name: conflicts
    type: object[]
    required: true
    condition: always
    description: "Conflicting information found across sources"
    validation: "Empty list is valid — but the field must be present to confirm conflicts were checked"
    object_fields:
      - name: claim_a
        type: string
        required: true
      - name: source_a
        type: string
        required: true
      - name: claim_b
        type: string
        required: true
      - name: source_b
        type: string
        required: true
      - name: assessment
        type: string
        required: true
        description: "Which is more likely correct and why"

  - name: gaps
    type: string[]
    required: true
    condition: always
    description: "What could not be found or verified"
    validation: "Empty list is valid — but field must be present to confirm gaps were checked"

  - name: summary
    type: string
    required: true
    condition: always
    description: "1-3 sentence synthesis of key findings"
    validation: "Non-empty. Must answer the original question, not just list findings."

# Output format (must be followed for all tiers):
#
# RESEARCH: {question}
# Tier: {quick/standard/extensive/deep}
# Method: {source_research/five_lens_briefing}
#
# PERSPECTIVE SCAN (required when method=five_lens_briefing)
# - {lens}: {core_position} — confidence: {HIGH/MEDIUM/LOW}
#
# QUESTION TRACE / EVIDENCE LEDGER (required when method=five_lens_briefing)
# - {lens}: question, answer, sources/verified URLs, follow_ups[] (every material follow-up or typed none_needed decision), evidence status
#
# CONTRADICTION MAP (required when method=five_lens_briefing)
# - {direct conflicts, consensus, unresolved question, missing angle}
#
# SYNTHESIS / PEER REVIEW (required when method=five_lens_briefing)
# - {root-owned decision-ready synthesis and separate ResearchPeerReviewer critique}
#
# FIVE-LENS PROCESS EVIDENCE (required when method=five_lens_briefing)
# - {frozen packet-set ID/digest and ordering, exact five dispatches or root passes, assignment/packet bindings, return validation, peer assignment/identity or fallback, execution modes, reduced independence, and resource budget}
#
# FINDINGS
# 1. {source-backed factual claim or decision insight} — confidence: {HIGH/MEDIUM/LOW}
#    Sources: {source 1}, {source 2}
#    Verified URLs: {verified URL 1, verified URL 2 if any}
# 2. ...
#
# CANDIDATE MECHANISMS (required when the question asks why/how, causes, or improvement mechanisms)
# 1. {candidate mechanism} — confidence: {HIGH/MEDIUM/LOW} — status: {candidate/needs_validation/unsupported/rejected}
#    Evidence: {source-backed support, inference-only support, or unresolved marker}
#    Counterevidence/conflicts: {conflicts or none found}
#    Gaps: {missing evidence or uncertainty}
#    Validation method: {test, metric, comparison, experiment, or next source check}
#
# CONFLICTS
# - {source A} says X, {source B} says Y — {assessment}
#
# SOURCES / VERIFIED URLS
# - {verified URL or source note with relevance}
#
# GAPS
# - {what we couldn't find}
#
# Completeness check:
# 1. findings[] has at least 1 entry
# 2. Every finding has confidence level assigned
# 3. Every URL presented was verified (no unverified URLs)
# 4. conflicts[] is present (may be empty)
# 5. gaps[] is present (may be empty)
# 6. Low-confidence findings are explicitly flagged
# 7. For five_lens_briefing, perspective_scan, question_trace, contradiction_map, synthesis_briefing, peer_review, and five_lens_process_evidence are present
# 8. For five_lens_briefing, each required lens has a question, answer or explicit gap, source notes/verified URLs, follow_ups[] retaining every material follow-up or one typed none_needed decision, and evidence status before synthesis
# 9. For high-stakes topics, recommendation is framed as educational due diligence with caveats and defaults to investigate_further unless stronger action is justified by verified evidence and user context
# 10. candidate_mechanisms exists when why/how/cause/improvement mechanisms were requested, and every candidate has evidence, confidence, counterevidence_or_conflicts, gaps, validation_method, and non-proven claim_status
