# Applicability: current v5 structured consumers, persisted packets, handoffs,
# and the existing five-lens audit/eval fixture. Numeric tier/source-count rules
# below are compatibility-fixture rules, not ordinary claim-confidence policy.
# Human-only source research uses claim-specific evidence and concise output.
# Selected five-lens work still requires five sibling-blind lenses, root
# synthesis, separate peer review, material follow-ups, and honest limits.

# Research Input Contract
# Resolve these fields for a structured v5 consumer or audit/eval fixture;
# historical v4 records stay readable under their original labels.

schema_version: "5.0"
contract: input
skill: assistant-research

fields:
  - name: question
    type: string
    required: true
    description: "Question."
    validation: "Non-empty. Must be specific enough to search for — not 'tell me about stuff'."
    on_missing: ask
    ask_prompt: "What would you like me to research?"

  - name: tier
    type: enum
    required: true
    enum_values: [quick, standard, extensive, deep]
    description: "Tier."
    validation: "quick five_lens_briefing normalizes to standard; preserves five_lens_briefing with a tier normalization disclosure retained in five_lens_process_evidence.tier_resolution. Its post-normalization tiers are standard, extensive, deep; quick remains valid for source_research."
    on_missing: infer
    infer_from: >
      Simple factual question with likely single answer → quick.
      Technology comparison, multi-source needed → standard.
      Decision support, comprehensive coverage → extensive.
      Market mapping, novel domain, primary sources needed → deep.

  - name: tool
    type: enum
    required: true
    enum_values: [research, investigate]
    description: "Tool."
    on_missing: infer
    infer_from: >
      Broad exploration ('what options exist', 'compare') → research.
      Deep dive on specific entity ('how does X work', 'entity profile') → investigate.

  - name: research_method
    type: enum
    required: true
    enum_values: [source_research, five_lens_briefing]
    description: "Method."
    on_missing: infer
    infer_from: >
      Default factual research, comparisons, and deep understanding → source_research.
      Explicit five-lens request, or a consequential contested decision whose independent
      perspectives, contradiction mapping, and peer critique justify the cost → five_lens_briefing.
      Broad topic labels or high stakes alone do not select this method.

  - name: user_role_or_goal
    type: string
    required: false
    description: "Role."
    default: "unspecified"

  - name: output_purpose
    type: string
    required: false
    description: "Research use."
    default: "Answering the user research question"
    on_missing: infer
    infer_from: "Default to answer the user research question."

  - name: known_context
    type: string[]
    required: false
    description: "Context."
    default: []

  - name: search_resource_budget
    type: object
    required: conditional
    condition: "research_method == five_lens_briefing"
    description: "Budget."
    validation: "standard=3 queries, 4 sources, and 10 minutes per lens / 15 queries, 20 sources, and 50 minutes overall; extensive=5, 6, and 15 / 25, 30, and 75; deep=8, 10, and 25 / 40, 50, and 125. Deep stops at saturation or its hard ceiling. Exhaustion records gaps and LOW confidence."
    on_missing: infer
    infer_from: "Apply this validation mapping by tier; source_research remains proportional."
    object_fields:
      - {name: per_lens_max_queries, type: int, required: true}
      - {name: per_lens_max_sources, type: int, required: true}
      - {name: per_lens_max_minutes, type: int, required: true}
      - {name: overall_max_queries, type: int, required: true}
      - {name: overall_max_sources, type: int, required: true}
      - {name: overall_max_minutes, type: int, required: true}
      - {name: stop_condition, type: enum, required: true, enum_values: [saturation_or_hard_ceiling]}

  - name: subagent_policy_state
    type: enum
    required: true
    enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
    description: "Policy state."
    validation: "source_research=not_required; five_lens_briefing=delegation_triggered; unavailable isolation cannot certify current v5 completion. An explicit user opt-out records a method change to source_research and therefore resolves to not_required; delegation_opted_out is a historical v4 label only."
    on_missing: infer
    infer_from: "source_research => not_required; five_lens_briefing => delegation_triggered; an explicit method change may select ordinary source_research but never independent v5 fallback."

  - name: subagent_execution_mode
    type: enum
    required: true
    enum_values: [delegated, not_applicable]
    description: "Execution mode."
    validation: "source_research => not_applicable; current v5 five_lens_briefing requires delegated isolation, with unavailable isolation incomplete."
    on_missing: infer
    infer_from: "Current five_lens_briefing uses delegated isolation; no fallback certifies v5."

  - name: subagent_trigger_scope
    type: string[]
    required: conditional
    condition: "subagent_policy_state == delegation_triggered"
    min_items: 1
    description: "Delegation trigger."
    on_missing: fail

  - name: policy_blocking_source
    type: string
    required: conditional
    condition: "subagent_policy_state == policy_disallowed"
    description: "Active policy block."
    validation: "Names the active blocking rule and no-exception basis, not a generic preference."
    on_missing: fail

  - name: sequential_fallback_evidence
    type: object
    required: conditional
    condition: "historical Research v4 reader and the retained v4 record's lens_execution_mode or peer_review_execution_mode == sequential_fallback (a historical label outside the current subagent_execution_mode enum)"
    description: "Historical v4 fallback evidence; never an input to current v5 work."
    validation: "Historical v4 reader only: records explicit opt-out, actual spawn failure/unavailability, supported configuration proof, or exact policy block; never fabricates native dispatch references and never certifies current v5 completion."
    on_missing: fail
    object_fields:
      - {name: basis, type: enum, required: true, enum_values: [explicit_opt_out, spawn_failure_or_unavailable, supported_configuration_proof, exact_policy_block]}
      - {name: detail, type: string, required: true}
      - {name: evidence_ref, type: string, required: true}

# Validation behavior:
# 1. Resolve question, tier, tool, research_method, subagent_policy_state, and subagent_execution_mode before any search activity
# 2. Log: >> Research: {tier} | tool: {tool} | method: {research_method} | question: "{question (truncated to 80 chars)}"
# 3. Read the corresponding tool file (research.md, five-lens-briefing.md, or investigate.md) for detailed instructions

  - name: research_dispatch_authority
    type: object
    required: conditional
    condition: "current five_lens_briefing v5 completion or semantic validation"
    description: "Trusted producer version and retained native root/lens/peer actor, creation, fresh context, handoff digest and frozen source identity; not supplied by the research payload"
    validation: "Parsed by research-semantic-validator.cjs. producer_version is exactly 5.0 and matches the response producer_version. Five sibling-blind lens actors and the fresh peer are distinct from root/each other and from one another. Codex fork_turns=none. Historical v4 fallback labels cannot relabel into v5 authority."
    on_missing: fail
    object_fields:
      - {name: producer_version, type: enum, required: true, enum_values: ["5.0"], description: "Trusted current producer version; the response producer_version must equal it", on_missing: fail}
      - {name: root_actor_id, type: string, required: true, description: "Retained root Orchestrator actor identity; no lens or peer actor may reuse it", on_missing: fail}
      - {name: source_identity, type: string, required: true, description: "Frozen source identity every lens and peer dispatch binds", on_missing: fail}
      - name: lens_dispatches
        type: object[]
        required: true
        min_items: 5
        max_items: 5
        description: "One retained native dispatch per LensKind"
        validation: "Covers each LensKind exactly once; every actor_id is unique and differs from root_actor_id and peer_dispatch.actor_id."
        on_missing: fail
        object_fields:
          - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher], on_missing: fail}
          - {name: actor_id, type: string, required: true, validation: "Equals the matching lens_dispatches[].dispatch_identity in the response.", on_missing: fail}
          - {name: assignment_id, type: string, required: true, validation: "Equals the matching response lens assignment_id.", on_missing: fail}
          - {name: handoff_digest, type: string, required: true, validation: "Equals the matching response packet_content_digest.", on_missing: fail}
          - {name: source_identity, type: string, required: true, validation: "Equals the top-level source_identity.", on_missing: fail}
          - {name: native_invocation_id, type: string, required: true, on_missing: fail}
          - {name: creation_evidence_ref, type: string, required: true, description: "Evidence that the actor was newly created for this assignment", on_missing: fail}
          - {name: runtime_evidence_ref, type: string, required: true, on_missing: fail}
          - {name: runtime, type: string, required: true, description: "Actual runtime that created the actor, for example codex", on_missing: fail}
          - {name: fork_turns, type: enum, required: conditional, condition: "runtime == codex", enum_values: [none], validation: "Absent when runtime is not codex.", on_missing: fail}
          - {name: context_isolation, type: enum, required: true, enum_values: [fresh_self_contained], on_missing: fail}
      - name: peer_dispatch
        type: object
        required: true
        description: "Retained native dispatch of the newly created ResearchPeerReviewer"
        validation: "actor_id differs from root_actor_id and every lens actor_id; it equals the response peer_reviewer_identity, assignment_id equals peer_review_assignment_id, and handoff_digest equals peer_review_input_binding.peer_review_input_digest."
        on_missing: fail
        object_fields:
          - {name: actor_id, type: string, required: true, on_missing: fail}
          - {name: assignment_id, type: string, required: true, on_missing: fail}
          - {name: handoff_digest, type: string, required: true, on_missing: fail}
          - {name: source_identity, type: string, required: true, validation: "Equals the top-level source_identity.", on_missing: fail}
          - {name: native_invocation_id, type: string, required: true, on_missing: fail}
          - {name: creation_evidence_ref, type: string, required: true, on_missing: fail}
          - {name: runtime_evidence_ref, type: string, required: true, on_missing: fail}
          - {name: runtime, type: string, required: true, on_missing: fail}
          - {name: fork_turns, type: enum, required: conditional, condition: "runtime == codex", enum_values: [none], validation: "Absent when runtime is not codex.", on_missing: fail}
          - {name: context_isolation, type: enum, required: true, enum_values: [fresh_self_contained], on_missing: fail}
