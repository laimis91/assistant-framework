# Research Process Handoff Contracts
# Parameterized five-lens dispatch and independent peer review.

schema_version: "3.0"
contract: handoffs
skill: assistant-research

semantic_types:
  - name: LensKind
    kind: closed_enum
    values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]
    description: "One exact independent research perspective; never a free-form role label."
  - name: FrozenLensAssignmentPacket
    kind: request
    description: "Immutable, sibling-blind packet created for every LensKind before the first dispatch."
  - name: FrozenPacketSet
    kind: lifecycle_record
    description: "Immutable proof that all five lens packets existed before any lens execution."
  - name: SearchResourceBudget
    kind: value_object
    description: "Numeric per-lens and overall query, source, and time ceilings for one five-lens process."
  - name: LensResearchResult
    kind: result
    description: "Validated result owned by exactly one LensResearcher identity and assignment."
  - name: FiveLensProcessEvidence
    kind: lifecycle_record
    description: "Dispatch, wave, validation, fallback, synthesis-ownership, and peer-review evidence for one briefing."
  - name: PeerReviewVerdict
    kind: closed_enum
    values: [accepted, accepted_with_concerns, revise, blocked]
    description: "Independent review outcome for the root-owned initial synthesis."

dispatch_protocol:
  - name: common_research_protocol
    activation: "Required only when research_method == five_lens_briefing. source_research remains policy=not_required and execution=not_applicable; this skill instruction triggers five-lens delegation unless an evidenced exception applies."
    frozen_packet_rule: "all lens assignment packets are frozen before first dispatch. Every packet has the same scope baseline and exactly one LensKind; no packet includes sibling results, dispatch returns, contradiction mapping, or synthesis."
    synthesis_ownership: "After all five LensResearcher returns validate, the root Orchestrator alone builds the contradiction map and initial synthesis. LensResearcher never owns cross-lens synthesis."
    sequential_fallback_rule: "Sequential fallback is allowed only for explicit opt-out, real failed or unavailable dispatch mechanism, supported configuration proof, or exact policy block. It runs five frozen-packet root passes, records reduced independence, omits invented references, and performs peer critique as a separate fresh pass."
  - name: orchestrator_to_lens_researcher
    delegated_compliance: "Requires five distinct native dispatch or agent identities covering every LensKind exactly once. The same model may serve multiple independent lens assignments; missing lens, duplicate lens, or root-authored lens in delegated mode fails delegated compliance."
    wave_rule: "Capacity-bounded waves are allowed only when wave coverage is exact, disjoint, exhaustive, and each wave size is within proven adapter capacity. Later waves cannot consume earlier results."
    retry_rule: "one same-assignment schema-correction retry is allowed for one invalid lens return. After that retry, rerun the complete lens stage via evidenced fallback or block; never mix partial delegated and root-authored results while claiming independence."
  - name: orchestrator_to_research_peer_reviewer
    peer_review_rule: "A distinct ResearchPeerReviewer reviews the root initial synthesis after synthesis. Reviewer-only failure may retain validated delegated lenses and use a separately recorded reviewer fallback."

handoffs:
  - name: orchestrator_to_lens_researcher
    from: Orchestrator
    to: LensResearcher
    phase: SEARCH
    notes: "Parameterized once per required LensKind. The dispatch context is sibling-blind and frozen before every lens dispatch begins."
    context_fields:
      - name: process_id
        type: string
        required: true
        description: "Stable identity for this five-lens process."
      - name: assignment_id
        type: string
        required: true
        description: "Unique identity for this one LensResearcher assignment."
      - name: lens_kind
        type: enum
        required: true
        enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]
        description: "LensKind assigned to this independent worker."
      - name: frozen_packet_set
        type: object
        required: true
        description: "Immutable FrozenPacketSet shared by every lens assignment before dispatch."
        validation: "Contains exactly five packet IDs, an ordered packet manifest, and a digest over its ordered manifest contents recorded before any lens execution; packet_set_frozen_at precedes first_lens_execution_at recorded by process evidence."
        object_fields:
          - {name: packet_set_id, type: string, required: true}
          - {name: packet_set_digest, type: string, required: true}
          - {name: packet_ids, type: "string[]", required: true, min_items: 5, max_items: 5}
          - {name: packet_manifest_order, type: "string[]", required: true, min_items: 5, max_items: 5}
          - name: packet_manifest
            type: object[]
            required: true
            min_items: 5
            max_items: 5
            validation: "Ordered five-entry manifest has packet_id, exact LensKind, and content_digest over each canonical complete frozen packet."
            object_fields:
              - {name: packet_id, type: string, required: true}
              - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
              - {name: content_digest, type: string, required: true}
          - {name: packet_set_frozen_at, type: string, required: true}
          - {name: pre_dispatch_record_id, type: string, required: true}
      - name: frozen_assignment_packet
        type: object
        required: true
        description: "FrozenLensAssignmentPacket containing only common scope and this assigned LensKind."
        validation: "Immutable before first dispatch; excludes sibling results, prior waves, contradiction_map, synthesis_briefing, peer_review, and recommendation."
        object_fields:
          - {name: packet_id, type: string, required: true}
          - {name: packet_set_id, type: string, required: true}
          - {name: content_digest, type: string, required: true, description: "Digest of this canonical complete frozen packet; matches its packet_manifest entry."}
          - {name: question, type: string, required: true}
          - {name: tier, type: enum, required: true, enum_values: [standard, extensive, deep]}
          - {name: user_role_or_goal, type: string, required: true}
          - {name: output_purpose, type: string, required: true}
          - {name: known_context, type: "string[]", required: true}
          - {name: evidence_budget, type: string, required: true}
          - name: search_resource_budget
            type: object
            required: true
            description: "SearchResourceBudget copied unchanged from the root process."
            object_fields:
              - {name: per_lens_max_queries, type: int, required: true}
              - {name: per_lens_max_sources, type: int, required: true}
              - {name: per_lens_max_minutes, type: int, required: true}
              - {name: overall_max_queries, type: int, required: true}
              - {name: overall_max_sources, type: int, required: true}
              - {name: overall_max_minutes, type: int, required: true}
              - {name: stop_condition, type: enum, required: true, enum_values: [saturation_or_hard_ceiling]}
          - name: source_policy
            type: string
            required: true
            description: "Required source-selection and URL-verification policy for this assignment."
          - name: isolation_policy
            type: string
            required: true
            description: "Explicit sibling-blind and no-synthesis isolation policy."
          - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
          - {name: packet_frozen_at, type: string, required: true}
      - name: dispatch_wave
        type: object
        required: true
        description: "Wave record that schedules capacity without changing the frozen packet."
        object_fields:
          - {name: wave_id, type: string, required: true}
          - {name: ordinal, type: int, required: true}
          - {name: capacity, type: int, required: true}
          - {name: lens_kinds, type: "string[]", required: true, min_items: 1}
      - name: return_schema_ref
        type: string
        required: true
        description: "Pointer to this handoff return_fields for worker validation."
    return_fields:
      - {name: status, type: enum, required: true, enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]}
      - {name: process_id, type: string, required: true}
      - {name: assignment_id, type: string, required: true}
      - {name: packet_id, type: string, required: true}
      - {name: packet_set_id, type: string, required: true}
      - {name: packet_content_digest, type: string, required: true}
      - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
      - name: lens_result
        type: object
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
        description: "LensResearchResult limited to the assigned LensKind."
        validation: "Contains no contradiction map, synthesis, recommendation, or sibling result; sources are evidence status marked and verified URLs are never fabricated."
        object_fields:
          - {name: core_position, type: string, required: true}
          - {name: lens_question, type: string, required: true}
          - {name: answer_or_gap, type: string, required: true}
          - name: sources_or_verified_urls
            type: string[]
            required: true
            validation: "Empty only for inference_only or unresolved and the associated gaps field records why; source_backed requires source or verified URL evidence."
          - name: follow_ups
            type: object[]
            required: true
            min_items: 1
            validation: "Every material follow-up is retained, or exactly one none_needed decision is present."
            object_fields:
              - {name: decision, type: enum, required: true, enum_values: [follow_up, none_needed]}
              - {name: question, type: string, required: conditional, condition: "decision == follow_up"}
              - {name: answer_or_gap, type: string, required: true}
              - name: sources_or_verified_urls
                type: string[]
                required: true
                validation: "Empty only for inference_only or unresolved and answer_or_gap records the source-access gap; source_backed requires source or verified URL evidence."
              - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
          - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
          - {name: likely_blind_spot, type: string, required: true}
          - {name: unique_insight, type: string, required: true}
          - {name: confidence, type: enum, required: true, enum_values: [high, medium, low]}
          - {name: gaps, type: "string[]", required: true}
      - name: evidence
        type: object[]
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
        min_items: 1
        object_fields:
          - {name: source, type: string, required: true}
          - {name: detail, type: string, required: true}
          - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
      - {name: open_questions, type: "string[]", required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]", min_items: 1}
      - {name: status_detail, type: string, required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]", description: "Why the assignment cannot produce a usable LensResearchResult without inventing research."}
      - {name: blocker_type, type: enum, required: conditional, condition: "status == BLOCKED", enum_values: [invalid_assignment, policy_blocked, tool_failure]}
      - {name: blocker_evidence, type: "string[]", required: conditional, condition: "status == BLOCKED", min_items: 1}
    on_missing_field: "Re-dispatch the same LensResearcher assignment once with an explicit missing-field request. After that one schema-correction retry, rerun the complete lens stage through evidenced sequential fallback or block; do not accept a partial mixed result or invent fields."

  - name: orchestrator_to_research_peer_reviewer
    from: Orchestrator
    to: ResearchPeerReviewer
    phase: SYNTHESIZE
    notes: "Distinct post-synthesis review; this worker critiques but does not replace root synthesis ownership."
    context_fields:
      - {name: process_id, type: string, required: true}
      - {name: peer_review_assignment_id, type: string, required: true, description: "Orchestrator-created peer-review assignment identity that the worker must echo."}
      - {name: original_question, type: string, required: true}
      - {name: tier, type: enum, required: true, enum_values: [standard, extensive, deep]}
      - {name: user_role_or_goal, type: string, required: true}
      - {name: output_purpose, type: string, required: true}
      - name: validated_lens_results
        type: object[]
        required: true
        min_items: 5
        max_items: 5
        description: "Exactly five validated LensResearchResult records, one per LensKind."
        validation: "No missing, duplicate, or root-authored lens may be accepted as delegated evidence unless the separately recorded lens fallback mode applies."
        object_fields:
          - {name: lens_kind, type: enum, required: true, enum_values: [practitioner, academic_or_technical_expert, skeptic, economist_or_incentives_analyst, historian_or_pattern_matcher]}
          - {name: assignment_id, type: string, required: true}
          - {name: core_position, type: string, required: true}
          - {name: lens_question, type: string, required: true}
          - {name: answer_or_gap, type: string, required: true}
          - name: sources_or_verified_urls
            type: string[]
            required: true
            validation: "Empty only for inference_only or unresolved and the associated gaps field records why; source_backed requires source or verified URL evidence."
          - name: follow_ups
            type: object[]
            required: true
            min_items: 1
            object_fields:
              - {name: decision, type: enum, required: true, enum_values: [follow_up, none_needed]}
              - {name: question, type: string, required: conditional, condition: "decision == follow_up"}
              - {name: answer_or_gap, type: string, required: true}
              - name: sources_or_verified_urls
                type: string[]
                required: true
                validation: "Empty only for inference_only or unresolved and answer_or_gap records the source-access gap; source_backed requires source or verified URL evidence."
              - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
          - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
          - {name: likely_blind_spot, type: string, required: true}
          - {name: unique_insight, type: string, required: true}
          - {name: confidence, type: enum, required: true, enum_values: [high, medium, low]}
          - {name: gaps, type: "string[]", required: true}
      - name: findings
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - {name: finding, type: string, required: true}
          - {name: confidence, type: enum, required: true, enum_values: [high, medium, low]}
          - {name: sources, type: "string[]", required: true, min_items: 1}
          - {name: verified_urls, type: "string[]", required: false}
      - name: candidate_mechanisms
        type: object[]
        required: false
        default: []
        object_fields:
          - {name: mechanism, type: string, required: true}
          - {name: claim_status, type: enum, required: true, enum_values: [candidate, needs_validation, unsupported, rejected]}
          - {name: confidence, type: enum, required: true, enum_values: [high, medium, low]}
          - name: evidence
            type: object[]
            required: true
            min_items: 1
            object_fields:
              - {name: source, type: string, required: true}
              - {name: detail, type: string, required: true}
              - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
          - {name: counterevidence_or_conflicts, type: "string[]", required: true}
          - {name: gaps, type: "string[]", required: true}
          - {name: validation_method, type: string, required: true}
      - name: conflicts
        type: object[]
        required: true
        object_fields:
          - {name: claim_a, type: string, required: true}
          - {name: source_a, type: string, required: true}
          - {name: claim_b, type: string, required: true}
          - {name: source_b, type: string, required: true}
          - {name: assessment, type: string, required: true}
      - {name: gaps, type: "string[]", required: true}
      - name: contradiction_map
        type: object
        required: true
        description: "Root-only contradiction map after validated lens collection."
        object_fields:
          - {name: direct_conflicts, type: "string[]", required: true}
          - {name: strongest_evidence, type: string, required: true}
          - {name: weakest_evidence, type: string, required: true}
          - {name: consensus, type: "string[]", required: true}
          - {name: biggest_unresolved_question, type: string, required: true}
          - {name: missing_angle_or_gap, type: string, required: true}
      - name: initial_synthesis
        type: object
        required: true
        description: "Root-only initial synthesis before independent peer review."
        object_fields:
          - {name: executive_summary, type: string, required: true}
          - {name: ranked_key_findings, type: "string[]", required: true, min_items: 3}
          - {name: hidden_connection, type: string, required: true}
          - {name: actionable_implication, type: string, required: true}
          - {name: recommendation, type: enum, required: true, enum_values: [do, wait, avoid, investigate_further]}
          - {name: frontier_question, type: string, required: true}
      - name: verified_source_evidence
        type: object[]
        required: true
        description: "Decision-critical verified source evidence."
        object_fields:
          - {name: claim, type: string, required: true}
          - {name: source, type: string, required: true}
          - {name: verified_url, type: string, required: true}
          - {name: verification_detail, type: string, required: true}
      - name: verification_gaps
        type: string[]
        required: true
        description: "Unverified, inaccessible, stale, or unsupported decision-critical source claims; empty only when none exist."
        validation: "Non-empty whenever verified_source_evidence is empty; otherwise records verified-source limitations or is empty only when none exist."
      - name: high_stakes_context
        type: object
        required: true
        object_fields:
          - {name: applicable, type: boolean, required: true}
          - {name: caveat_or_not_applicable_reason, type: string, required: true}
      - {name: return_schema_ref, type: string, required: true}
    return_fields:
      - {name: status, type: enum, required: true, enum_values: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]}
      - {name: process_id, type: string, required: true}
      - {name: peer_review_assignment_id, type: string, required: true}
      - {name: verdict, type: enum, required: true, enum_values: [accepted, accepted_with_concerns, revise, blocked], validation: "Truth table: DONE => accepted; DONE_WITH_CONCERNS => accepted_with_concerns or revise; NEEDS_CONTEXT => verdict=blocked; BLOCKED => verdict=blocked. accepted and accepted_with_concerns require required_revisions=[]; revise requires one or more required_revisions. BLOCKED plus accepted, accepted_with_concerns, or revise is invalid."}
      - {name: confidence_scores, type: "string[]", required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: weakest_claim, type: string, required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: bias_or_lens_dominance, type: string, required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: missing_sixth_perspective, type: string, required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: falsification_test, type: string, required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: revised_recommendation_if_needed, type: string, required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]"}
      - {name: required_revisions, type: "string[]", required: conditional, condition: "status in [DONE, DONE_WITH_CONCERNS]", validation: "accepted and accepted_with_concerns require required_revisions=[]; revise requires one or more required_revisions."}
      - name: evidence
        type: object[]
        required: conditional
        condition: "status in [DONE, DONE_WITH_CONCERNS]"
        min_items: 1
        object_fields:
          - {name: source, type: string, required: true}
          - {name: detail, type: string, required: true}
          - {name: evidence_status, type: enum, required: true, enum_values: [source_backed, inference_only, unresolved]}
      - {name: open_questions, type: "string[]", required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]", min_items: 1}
      - {name: status_detail, type: string, required: conditional, condition: "status in [NEEDS_CONTEXT, BLOCKED]"}
      - {name: blocker_type, type: enum, required: conditional, condition: "status == BLOCKED", enum_values: [missing_review_context, policy_blocked, tool_failure]}
      - {name: blocker_evidence, type: "string[]", required: conditional, condition: "status == BLOCKED", min_items: 1}
    on_missing_field: "Request one peer correction with the exact missing field. If it remains invalid or unusable, retain valid lens evidence and run a separate fresh reviewer-only fallback with concrete evidence, or block; do not invent peer fields or let the worker self-attest orchestration metadata."

return_validation:
  - name: common_return_validation
    validation: "Record explicit opt-out, actual spawn failure/unavailability, supported configuration proof, or exact policy block; policy blocks include exact active rule/no exception; no fallback record contains invented native dispatch references."
  - name: orchestrator_to_lens_researcher
    validation: "For delegated lens mode validate assignment_id, packet_id, packet_set_id, packet_content_digest, LensKind, return schema, status, typed evidence, and source/URL claims against the matching frozen assignment/manifest entry; validate exactly five unique native identities. DONE and DONE_WITH_CONCERNS require a complete LensResearchResult and evidence. NEEDS_CONTEXT or BLOCKED require open_questions and typed status detail, while BLOCKED also requires blocker_type and blocker_evidence; do not invent research. For sequential fallback validate exactly five frozen root passes with root_pass_id, matching packet content_digest, and no dispatch_identity, plus concrete fallback evidence."
  - name: orchestrator_to_research_peer_reviewer
    validation: "Validate peer_review_assignment_id echoes the active dispatch and apply the status/verdict truth table: DONE=accepted; DONE_WITH_CONCERNS=accepted_with_concerns or revise; NEEDS_CONTEXT/BLOCKED=blocked and cannot finalize. accepted and accepted_with_concerns require required_revisions=[]; revise requires one or more required_revisions. Usable statuses require complete critique and calibrated evidence; failure statuses require open_questions and typed status detail, while BLOCKED also requires blocker_type and blocker_evidence. When verdict=revise, the orchestrator—not the worker—records revision_disposition covering every required revision exactly once as applied or claim_downgraded, assigns revision_disposition_id, and records an exactly equal peer_review_revision_disposition_id; unresolved revision blocks presentation. Workers do not self-report execution or fallback orchestration metadata or native peer identity; the orchestrator alone records those fields in final peer_review/process evidence. Empty verified_source_evidence requires non-empty verification_gaps and must downgrade or block unsupported claims. For reviewer-only fallback retain valid delegated lens evidence, validate the orchestrator-owned peer_review_fallback_pass_id and separate concrete fallback evidence, and never erase lens dispatch evidence."
