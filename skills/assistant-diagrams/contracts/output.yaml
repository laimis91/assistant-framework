# contract header
schema_version: "3.0"
contract: output
skill: assistant-diagrams

artifacts:
  - name: diagram_code
    type: string
    required: true
    description: "Valid Mermaid or PlantUML diagram syntax"
    validation: "Diagram syntax must be valid — parseable by the target renderer"
    on_fail: "Re-run skill to produce the missing artifact"

  - name: diagram_type
    type: enum
    required: true
    description: "The type of diagram that was generated (echoed from input)"
    enum_values: [architecture, sequence, er, flow, component, class, state]
    on_fail: "Re-run skill to produce the missing artifact"

  - name: description
    type: string
    required: true
    description: "What the diagram shows — a brief explanation of its contents"
    validation: "Non-empty, concise description of the diagram's purpose and scope"
    on_fail: "Re-run skill to produce the missing artifact"

  - name: evidence_sources
    type: object[]
    required: true
    min_items: 1
    description: "Inspected code, configuration, tests, or user-provided evidence used to draw the diagram"
    validation: "Each source identifies what elements or relationships it supports; user-provided evidence is allowed and must be labeled as such."
    on_fail: "Inspect or request source evidence before finalizing the diagram."
    object_fields:
      - name: source_ref
        type: string
        required: true
      - name: supported_elements_or_relationships
        type: string[]
        required: true
        min_items: 1

  - name: element_trace
    type: object[]
    required: true
    min_items: 1
    description: "Trace for every rendered node and edge"
    validation: "Every diagram node and edge appears exactly once with source_refs; when the diagram supports existing-system feature preparation, each element also carries exact feature_preparation_evidence_refs bindings. An intentionally omitted or untraceable element belongs in coverage_gaps, never as an unexplained diagram element."
    on_fail: "Remove untraceable elements or add their source trace and coverage disclosure."
    object_fields:
      - name: element_id
        type: string
        required: true
      - name: element_kind
        type: enum
        required: true
        enum_values: [node, edge]
      - name: source_refs
        type: string[]
        required: true
        min_items: 1
      - name: feature_preparation_evidence_refs
        type: object[]
        required: conditional
        condition: "diagram supports existing-system feature preparation"
        description: "Exact feature-preparation evidence-row bindings for this rendered node or edge"
        validation: "Every binding equals an exact current input evidence_ref and item_id pair that supports this element; source_refs retain the underlying code, configuration, test, or user-provided evidence."
        min_items: 1
        on_missing: fail
        object_fields:
          - name: evidence_ref
            type: string
            required: true
            validation: "Equals an exact current input feature_preparation_evidence_refs evidence_ref"
            on_missing: fail
          - name: item_id
            type: string
            required: true
            validation: "Equals the exact input item_id under the paired evidence_ref"
            on_missing: fail

  - name: coverage_gaps
    type: string[]
    required: true
    description: "Known uninspected, inaccessible, proposed, or intentionally omitted behavior that limits diagram completeness"
    validation: "Use an empty list only when all scoped elements and relationships are traceable."
    on_fail: "Record the coverage limitation instead of implying a complete diagram."

  - name: feature_preparation_evidence_refs
    type: object[]
    required: conditional
    condition: "diagram supports existing-system feature preparation"
    description: "Exact canonical feature-preparation evidence-row bindings echoed from input to validate preservation/gap scope"
    validation: "Equals the exact current input evidence_ref and item_id bindings used by the diagram; coverage_gaps must name any unavailable row."
    min_items: 1
    on_fail: "Return to the feature-preparation evidence matrix before presenting the diagram as complete."
    object_fields:
      - name: evidence_ref
        type: string
        required: true
        validation: "Equals an exact current input feature_preparation_evidence_refs evidence_ref"
        on_missing: fail
      - name: item_id
        type: string
        required: true
        validation: "Equals the exact input item_id under the paired evidence_ref"
        on_missing: fail
