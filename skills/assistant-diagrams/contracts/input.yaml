# contract header
schema_version: "3.0"
contract: input
skill: assistant-diagrams

fields:
  - name: diagram_type
    type: enum
    required: true
    description: "What kind of diagram to generate"
    validation: "Must be a supported diagram type"
    on_missing: ask
    enum_values: [architecture, sequence, er, flow, component, class, state]

  - name: scope
    type: string
    required: true
    description: "What to diagram — a feature, module, data model, etc."
    validation: "Non-empty string identifying the diagram target"
    on_missing: ask

  - name: source_files
    type: string[]
    required: false
    description: "Files to analyze for the diagram"
    validation: "Each entry must be a valid file path"
    on_missing: infer

  - name: format
    type: enum
    required: false
    description: "Output format for the diagram"
    validation: "Defaults to mermaid when not specified"
    on_missing: infer
    enum_values: [mermaid, plantuml]

  - name: feature_preparation_evidence_refs
    type: object[]
    required: conditional
    condition: "diagram supports existing-system feature preparation"
    description: "Exact canonical workflow evidence-row bindings constraining a diagram of existing behavior, new routes, or proposed gaps"
    validation: "Every represented existing-system behavior or proposed gap resolves to an exact evidence_ref and item_id pair; broad artifact-only, mismatched, stale, or unresolved refs are invalid. User-provided evidence remains valid when no repository evidence exists."
    min_items: 1
    on_missing: fail
    object_fields:
      - name: evidence_ref
        type: string
        required: true
        description: "Canonical feature-preparation evidence artifact reference"
        validation: "Resolves to the current canonical feature-preparation evidence artifact"
        on_missing: fail
      - name: item_id
        type: string
        required: true
        description: "Exact evidence-row identifier under evidence_ref"
        validation: "Resolves under the paired evidence_ref to the admissible canonical evidence row represented by the diagram"
        on_missing: fail
