# Review Phase Gate Contracts
# The review loop has 4 steps per round plus entry and exit conditions.
# These gates enforce correct sequencing within each round and across the loop.

schema_version: "7.2"
contract: phase-gates
skill: assistant-review

gates:

  # ─────────────────────────────────────────────
  # ENTRY — before the loop starts
  # ─────────────────────────────────────────────
  # Review phases are loop steps within a single workflow REVIEW phase.
  # The workflow's REVIEW checkpoint wraps them, so per-step checkpoints are null.
  - phase: ENTRY
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: E1
        check: "review_scope is resolved to one of: files, changes, task, pr, content"
        on_fail: "Determine scope from git state and task journal, or ask user"

      - id: E2
        check: "review_material_snapshot.material is non-empty and review_snapshot_id plus snapshot_identity are frozen — there is actual immutable material to review"
        on_fail: "Inform user 'nothing to review' and exit without entering the loop; otherwise capture immutable snapshot identity before planning a batch"

      - id: E3
        check: "scope_size is determined (trivial, small, medium, large)"
        on_fail: "Count files and lines changed to determine scope_size"

      - id: E4
        check: "mode is resolved (review-fix or audit)"
        on_fail: "Ask exactly: 'Should I only report findings, or also implement and verify fixes?' Stop before Reviewer dispatch or source mutation until the user answers. Do not use authorship, branch/PR ownership, platform, or connector as modification authorization."

      - id: E_CHANGE_IMPACT
        check: "Every behavior review records compact applicability evidence. When impact is shared or materially unresolved, or an expanded artifact is explicitly carried, discovery requires identity/capture/expected refs; assessment is required only for pre-build or completion. The batch scope/coverage obligations include an independent locality, captured-consumer, material-transition, and canonical-mapping challenge. Evidenced local work retains ordinary review obligations without a common-checker gate."
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        on_fail: "Keep the audit/fix result incomplete, load references/change-impact.md, and repair or report the missing evidence before dispatch."

      - id: E5
        check: "change_kind, semantic_contract_review_required, behavioral_contract_review_required, agentic_loop_safety_review_required, and conditional architecture_decision_pack_review_required with canonical architecture_design_mode are resolved before review starts"
        on_fail: "Infer change_kind from touched paths/material; set semantic_contract_review_required=true for skill/workflow/framework changes, behavioral_contract_review_required=true for behavior-bearing code changes, agentic_loop_safety_review_required=true for autonomous/repeated loop changes, and architecture_decision_pack_review_required=true only when a carried Pack or relevant architecture decision record applies; require its top-level canonical architecture_design_mode."

      - id: E5A
        check: "When architecture_decision_pack_review_required is true, the compact Pack projection has at least one boundary, exactly one design-pressure conclusion for each of the five canonical concerns, and a ref resolving against the current authoritative Pack to recover selected design, rationale, and viable alternatives/dispositions"
        condition: "architecture_decision_pack_review_required is true"
        on_fail: "Block review and request a repaired Pack projection with non-empty boundaries plus control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, and representative_path conclusions and a current authoritative selected-decision ref; never invent missing evidence."

      - id: E6
        check: "subagent_policy_state, subagent_execution_mode, subagent_trigger_scope, conditional policy_blocking_source, qa_evaluation_mode, feature_preparation_scope, and any approved_feature_preparation_qa_acceptance_obligation are resolved before any Reviewer subagent dispatch"
        on_fail: "If an applicable trigger exists and no delegation_opted_out, subagents_unavailable, or policy_disallowed evidence applies, infer subagent_trigger_scope and dispatch required Reviewer roles without a separate permission question. Otherwise preserve and complete the evidenced direct fallback state; do not overwrite explicit opt-out."

      - id: E7
        check: "If qa_evaluation_mode is required: Done Contract with debate_record when available, acceptance_criteria, verification_evidence, domain_context/rubric_refs when applicable, qa_filter_policy, feature_preparation_scope, and any approved_feature_preparation_qa_acceptance_obligation with execution_prerequisite and exactly one source evidence path are resolved before QAEvaluator dispatch"
        condition: "qa_evaluation_mode == required"
        on_fail: "Load references/qa-evaluation-loop.md, gather acceptance material and verification evidence, select domain rubric scope only when acceptance criteria, Done Contract, domain_context, or rubric_refs require it, or mark QA blocked with open_questions before dispatching QAEvaluator."

      - id: E8
        check: "Standalone Spec Review uses user request/scope. On FAIL, mode=review-fix validates FIX_STEP entry_assertions before repair or mutation dispatch, then repairs an authorized in-scope mismatch and repeats to spec_review_pass_ref; mode=audit exits repair/Build/source-mutation dispatch, retains the mismatch as a pre-batch aggregate finding, continues the frozen read-only multi-pass batch, and dispatches every planned read-only Reviewer pass through the response barrier."
        condition: "review_preparation_mode == standalone"
        on_fail: "In mode=review-fix, validate FIX_STEP entry_assertions before repair or mutation dispatch, then repair only an authorized in-scope mismatch and repeat to PASS. In mode=audit, record the mismatch, freeze the read-only batch, dispatch every required pass, wait for the response barrier, and never mutate source."

      - id: E9
        check: "Workflow-composed review consumes carried spec_review_pass_ref and carried current build/test evidence before Reviewer dispatch"
        condition: "review_preparation_mode == workflow_composed"
        on_fail: "Block dispatch and request the carried Spec Review PASS and current build/test evidence refs from the composing workflow."

      - id: E10
        check: "A persisted 6.0, 7.0, or 7.1 review packet carries its matching invalidation/migration record and cannot contribute CLEAN or ISSUES_FIXED until a fresh 7.2 batch is rebuilt. Complete historic closure tuples, including existing 7.1-or-later provenance, remain unchanged; partial v6/7.0 tuples are normalized before closure dispatch."
        condition: "a persisted review packet is supplied"
        on_fail: "Invalidate the persisted result/delegation/snapshot/Pack/QA/plan/coverage refs, preserve raw history and complete closure tuples, normalize only missing v6/7.0 closure identity fields before dispatch, and rebuild from a fresh 7.2 snapshot."

  # ─────────────────────────────────────────────
  # REVIEW step — per round
  # ─────────────────────────────────────────────
  - phase: REVIEW_STEP
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: RS1
        check: "For every delegated scope: fresh Reviewer subagents were dispatched for every planned independent narrow pass (not reusing prior context)"
        condition: "subagent_execution_mode == delegated"
        on_fail: "Plan a batch with at least two independent narrow passes, then dispatch a new Reviewer subagent for every expected pass with the frozen snapshot and closure-verification list"

      - id: RS_BATCH_PLAN
        check: "Every review round has one frozen-snapshot review_batch with canonical distinct discovery perspectives for scope_size, matching discovery_pass_count and expected_passes, unique pass identifiers, non-empty assigned scope/coverage obligations, sibling-blind dispatch, and an orchestrator-owned pass_attempt_ledger"
        on_fail: "Freeze the snapshot, derive expected_passes from canonical_discovery_perspectives rather than count alone, then withhold sibling findings. A single broad model pass is not sufficient coverage."

      - id: RS1A
        check: "For medium+ scope in direct fallback mode: the same bounded fresh_reviewer_context bundle was created only when the review pass began, review context was isolated, and fresh-context evidence is recorded"
        condition: "scope_size in [medium, large] and subagent_execution_mode == direct_fallback"
        on_fail: "Resolve the reviewer_context load set, create the same bounded bundle used by delegated review, clear stale assumptions, record direct-fallback evidence, and do not claim a Reviewer subagent was dispatched"

      - id: RS1B
        check: "For trivial/small direct-fallback scope: two purpose-specific isolated direct-fallback pass records carry distinct assignments, coverage obligations, evidence, and the same all-response barrier"
        condition: "scope_size in [trivial, small] and subagent_execution_mode == direct_fallback"
        on_fail: "Do not collapse to one self-review. Create two isolated direct-fallback records and aggregate only after both terminal responses."

      - id: RS2
        check: "Reviewer or direct-fallback review received fresh_reviewer_context with selected dispatch_context_ref, bounded worker_return_schema_selector: Worker loads named handoff return_fields recursively from active skill root, proves worker_return_schema equals the referenced schema, or fails closed before response, review_preparation_mode, sanitized pre_batch_criteria_ref proving latest Spec Review PASS or retained audit FAIL without finding detail, required build_test_verification_ref, per-pass assignment/obligations, quality_principles_required, round, closure ledger only when applicable, finding_filter_policy, reuse_search_instruction requiring a fresh independent capability search, review-principles, review-rubric when required, only triggered checklist sections, and for risk_selected_specialist security the Code Reviewer assistant-security checklist/perspective while the Reviewer return schema remains authoritative"
        on_fail: "Resolve reviewer_context only at pass start, rebuild the bounded bundle from dispatch_context_bundles, exclude untriggered checklist sections, and use pass_repair_guard for one allowed transient/schema repair before terminal incomplete coverage."

      - id: RS2A
        check: "build_test_verification_ref contains current real passed build/test evidence whenever source fix/build is in scope; not_applicable is one of audit_only, read_only, or no_build_scope only when no source fix/build is in scope and is invalid after any source fix"
        on_fail: "Block Reviewer dispatch. Run current build/tests when fix/build is in scope or after a source fix; otherwise record exactly one allowed explicit not_applicable reason."

      - id: RS2B
        check: "The declared reviewer_context boundary closure is strictly below 5653 words and excludes orchestrator_to_reviewer.return_fields"
        on_fail: "Trim or defer worker context, re-run contract-index validation, and do not begin the review pass until the bounded dispatch bundle is below 5653 words."

      - id: RS3
        check: "Only after the Reviewer or direct-fallback result exists: reviewer_return_validation is resolved and the canonical return fields, including findings[], summary, evidence, applicable checks, verdict, and rubric scores when required, are validated before EVALUATE"
        on_fail: "Resolve reviewer_return_validation after the result, then use pass_repair_guard for at most one transient/schema repair; otherwise record failed/timed_out terminal evidence and continue incomplete aggregation."

      - id: RS_BATCH_BARRIER
        check: "Before aggregation, fixes, or EVALUATE: planned/dispatched batches may have empty or pending zero-attempt ledger records and collecting batches may be partial; at the terminal barrier all expected passes reach terminal accounting. Response-backed terminal states completed, needs_context, and blocked require exactly one active_terminal response for the active dispatch attempt; timed_out, failed, and invalidated may have zero active responses only with typed failure evidence. Stale/duplicate attempts are audited but cannot complete coverage. Every response matches its active review_attempt_id dispatch, every response matches assigned five-dimensional closure (pass/item/concern/perspective/obligation) and frozen identity, and recomputed scope-manifest/content identity still matches; early aggregation is forbidden and otherwise coverage is incomplete."
        on_fail: "Do not aggregate, fix, exit, or report a clean result from a partial or mutated batch. Use pass_repair_guard for at most one transient/schema repair; failed, timed_out, invalidated, or omitted assignment/obligation is an explicit coverage gap."

      - id: RS_BATCH_AGGREGATION
        check: "Only after the response barrier: validate every pass, prove exact multiset closure over every manifest-derived pass/item/applicable-concern/perspective/coverage_obligation tuple completed only by inspected_no_risk or finding, require finding coverage links and exact source_finding_ids closure or source_coverage_gap_ids, and require closure_results exact aggregate_finding_id equality for every pending fix. Build the complete aggregated union including pre_batch_findings, record typed provenance/dispositions/rationale, and recompute rubric and exit from that union. Conservatively merge only same locus, invariant, and failure mechanism. A genuinely clean complete batch may have an empty aggregation ledger."
        on_fail: "Do not use an early pass verdict or rubric as the batch result. Preserve every validated finding or record its evidence-backed aggregation disposition."

      - id: RS4
        check: "previously_fixed items receive closure verification; incomplete or regressed fixes remain reportable with their original aggregate_finding_id"
        on_fail: "Do not suppress the finding. Record closure status and report evidence-backed incomplete or regressed behavior before proceeding to EVALUATE."

      - id: RS5
        check: "For medium+ scope: perspective-local rubric_scores are present in reviewer returns with all 5 dimensions scored, while the post-barrier aggregated union rubric and aggregated finding count alone drive batch exit and score tracking"
        condition: "scope_size in [medium, large]"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair with rubric_required=true; after exhaustion record terminal incomplete coverage. In direct fallback mode, score the fresh context, then recompute aggregate rubric after the barrier."

      - id: RS6
        check: "Reviewer or direct-fallback review applied the clean-code principle lens from references/review-principles.md: SOLID, KISS, DRY, YAGNI, and readability"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair with quality_principles_required=true; after exhaustion record terminal incomplete coverage. In direct fallback mode, complete principle_checks against fresh context."

      - id: RS6A
        check: "For medium+ scope: Reviewer or direct-fallback review completed the Design Coherence Pass from references/review-principles.md and returned principle_checks.design_coherence with either an evidence-backed responsibility/boundary risk or 'no concrete risk found'"
        condition: "scope_size in [medium, large]"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair requiring Design Coherence; after exhaustion record terminal incomplete coverage. In direct fallback, complete the fresh pass; do not manufacture a heuristic finding."

      - id: RS_REUSE_SEARCH
        check: "Reviewer or direct-fallback return includes reuse_search from a fresh independent capability search, not merely carried Mapper/task-packet evidence. When applicability=applicable, it records bounded searches, candidates or no_candidate_reason, decision, and decision_rationale; an applicable review cannot return clean without this evidence."
        on_fail: "Use pass_repair_guard for one valid transient/schema repair with fresh bounded reuse search; after exhaustion record terminal incomplete coverage. For not_applicable, record applicability_reason."

      - id: RS7
        check: "When semantic_contract_review_required is true: Reviewer or direct-fallback review applied the Semantic Contract Review Checklist and returned semantic_contract_checks"
        condition: "semantic_contract_review_required is true"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair requesting semantic_contract_checks; after exhaustion record terminal incomplete coverage. In direct fallback, complete checks before clean."

      - id: RS8
        check: "When behavioral_contract_review_required is true: Reviewer or direct-fallback review applied the Behavioral Contract Review Checklist and returned behavioral_contract_checks"
        condition: "behavioral_contract_review_required is true"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair requesting behavioral_contract_checks; after exhaustion record terminal incomplete coverage. In direct fallback, complete checks before clean."

      - id: RS9
        check: "When agentic_loop_safety_review_required is true: Reviewer or direct-fallback review applied the Agentic Loop Safety Checklist and returned agentic_loop_safety_checks"
        condition: "agentic_loop_safety_review_required is true"
        on_fail: "Use pass_repair_guard for one valid transient/schema repair requesting agentic_loop_safety_checks; after exhaustion record terminal incomplete coverage. In direct fallback, complete checks before clean."

      - id: RS10
        check: "When architecture_decision_pack_review_required is true: Reviewer or direct-fallback review applied the Architecture Decision Pack Review Checklist and returned architecture_decision_pack_checks; architecture_decision_pack.mode equals canonical architecture_design_mode and review_intensive includes independent challenge evidence"
        condition: "architecture_decision_pack_review_required is true"
        on_fail: "Review the Pack's source/revision freshness, material questions and invalidators, boundaries/lifecycle, control/early-exit and ownership/disposal decisions, resource envelope, extension-registration and representative-path checks, semantic type and primitive-exception ledger, falsifiable quality scenarios, compatibility/extension seam, and verification/rollback before declaring clean."

      - id: RS_RULE_DISTILLATION
        check: "When blocker/must-fix findings or recurring contract/checklist/eval gaps exist: review_finding_rule_distillation classifies them as one_off_fix, permanent_rule_candidate, or no_action with evidence and promotion decision"
        on_fail: "Load references/review-finding-permanent-rule.md and classify applicable findings before final review output"

  # ─────────────────────────────────────────────
  # EVALUATE step — per round
  # ─────────────────────────────────────────────
  - phase: EVALUATE_STEP
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: EV1
        check: "Exit decision is one of: EXIT_CLEAN, EXIT_ISSUES_FIXED, EXIT_MAX_ROUNDS, EXIT_INCOMPLETE_COVERAGE, ESCALATE_PIVOT_RESTART, CONTINUE"
        on_fail: "Re-evaluate after complete-batch aggregation. EXIT_CLEAN = complete final-snapshot coverage, no must-fix/should-fix, and no fixes this session. EXIT_ISSUES_FIXED = complete final-snapshot coverage, fixes occurred, and no must-fix/should-fix remain. EXIT_INCOMPLETE_COVERAGE = current missing, invalid, blocked, timed-out, failed, or invalidated expected pass and maps to HAS_REMAINING_ITEMS. EXIT_MAX_ROUNDS = round 10 with remaining must-fix or should-fix findings. ESCALATE_PIVOT_RESTART = STAGNATION, repeated DRIFT, repeated REGRESSION, or rubric action PIVOT. Rubric score calibrates residual risk but does not create a finding."

      - id: EV2
        check: "EXIT_CLEAN or EXIT_ISSUES_FIXED only if the current final snapshot recomputed scope-manifest/content identity still matches, the complete aggregated union has exact manifest-derived tuple closure and zero must-fix and zero should-fix findings remain; prior incomplete or invalidated batches require terminal accounting in history but do not permanently block a later complete replacement batch; needs_context, blocked, timed_out, failed, or invalidated current expected pass forces coverage_complete=false and HAS_REMAINING_ITEMS, never CLEAN or ISSUES_FIXED; any below-threshold aggregate rubric score is recorded as residual risk with the evidence-bounded claim"
        on_fail: "Address or explicitly defer evidence-backed findings and record coverage gaps. Do not manufacture a finding or another round solely to raise a score."

      - id: EV3
        check: "EXIT_MAX_ROUNDS only if: round == 10"
        on_fail: "Rounds remain — must CONTINUE to FIX step"

      - id: EV4
        check: "In audit mode: after exactly one started batch reaches terminal accounting, EXIT complete or incomplete with no fix loop or replacement batch; incomplete maps to HAS_REMAINING_ITEMS."
        condition: "mode == audit"
        on_fail: "Audit mode does not fix or loop — wait for terminal accounting, present findings, and exit."

      - id: EV5
        check: "For medium+ scope: rubric threshold action calibrates focus and residual risk — PASS supports a findings-based exit, REFINE targets existing findings only, and PIVOT escalates through pivot_restart_decision"
        condition: "scope_size in [medium, large] and rubric_scores is present"
        on_fail: "Apply the rubric to existing evidence. Score below threshold alone is insufficient to create work or authorize an additional review round."

      - id: EV6
        check: "PIVOT action triggers orchestrator-owned pivot_restart_decision — do not silently continue after PIVOT"
        condition: "rubric_scores.action == PIVOT"
        on_fail: "Create pivot_restart_signal and require the orchestrator to record pivot_restart_decision with trigger, evidence, affected_slice_or_round, options_considered, selected_action, reapproval_required, next_agent, recovery_pointer, and exact_next_action before another fix/review dispatch."

      - id: EV7
        check: "STAGNATION, repeated DRIFT, or repeated REGRESSION triggers ESCALATE_PIVOT_RESTART and records pivot_restart_signal before another fix/review dispatch"
        condition: "scope_size in [medium, large] and round >= 2"
        on_fail: "Pause the loop, build pivot_restart_signal from score_history, and require orchestrator-owned pivot_restart_decision. Do not advance to another review round until the decision names the exact next action and an allowed evidence-backed additional_round_reason exists."

      - id: EV8
        check: "Audit mode exits after exactly one started batch reaches terminal accounting complete or incomplete, without fixes, a replacement, or a second batch; incomplete is HAS_REMAINING_ITEMS and the first response never ends the batch"
        condition: "mode == audit"
        on_fail: "Wait for every expected pass result, aggregate once, then stop after round 1 and present the evidence-backed audit findings."

      - id: EV9
        check: "The normal review-fix path is round 1 complete review batch, fixes and validation when needed, then one fresh round 2 re-review batch on a new snapshot"
        condition: "mode == review-fix"
        on_fail: "After round 1 fixes, invalidate the old batch, validate, freeze a new snapshot, and perform one fresh complete round 2 re-review batch; do not schedule more rounds by default."

      - id: EV10
        check: "Round 3+ has a recorded additional_round_reason backed by new evidence from changed_files, unresolved_finding, validation_failure, regression_or_drift, or changed_hypothesis. Score below threshold alone is insufficient."
        condition: "round >= 3"
        on_fail: "Do not start or continue the additional round. Exit with the available evidence and residual risk, or record one allowed reason with a concrete evidence pointer created after the prior review began."

  # ─────────────────────────────────────────────
  # FIX step — per round (review-fix mode only)
  # ─────────────────────────────────────────────
  - phase: FIX_STEP
    condition: "mode == review-fix"
    checkpoint_start: null
    checkpoint_end: null
    entry_assertions:

      - id: F_CHANGE_IMPACT_PREBUILD
        check: "Before any source/test mutation or mutation dispatch, a review-fix with triggered shared, unresolved, or expanded impact runs or revalidates the common checker against referenced capture, independent expected context, and assessment for a current valid pre_build result resolving validator refs for bounded planned obligations, consumer union, and material transitions."
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        on_fail: "Do not edit source, write a regression test, or dispatch a fixer; repair the pre-build assessment or return the review-fix as blocked/remaining."
    exit_assertions:

      - id: F1
        check: "ALL must-fix items were addressed (not just some)"
        on_fail: "Fix remaining must-fix items before proceeding"

      - id: F2
        check: "ALL should-fix items were addressed (fixed or explicitly deferred with reason)"
        on_fail: "Fix or defer remaining should-fix items — add deferred items to remaining_items with reason_unresolved populated"

      - id: F3
        check: "Each newly fixed item was added to previously_fixed with its original aggregate_finding_id, source_finding_ids, source_provenance, description, round number, and pending_verification closure status; only legacy pre-ID records may receive deterministic normalized IDs."
        on_fail: "Update previously_fixed closure ledger before proceeding to VALIDATE"

      - id: F_CHANGE_IMPACT
        check: "When a review-fix mutates a triggered impact scope, refresh the bounded capture/expected/assessment before the next batch; prior locality or snapshot evidence is stale."
        condition: "(impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried) and source changed"
        on_fail: "Do not reuse the prior impact projection; recapture and revalidate before re-review."

  # ─────────────────────────────────────────────
  # VALIDATE step — per round (review-fix mode only)
  # ─────────────────────────────────────────────
  - phase: VALIDATE_STEP
    condition: "mode == review-fix"
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: V1
        check: "Build was run and passed (exit code 0)"
        on_fail: "Fix build errors before incrementing round"

      - id: V2
        check: "Tests were run and all pass (0 failures)"
        on_fail: "Fix failing tests before incrementing round"

      - id: V3
        check: "For C# projects: cognitive complexity analysis was run on changed files"
        condition: "project is C# and complexity tool is available"
        on_fail: "Run complexity analysis and flag methods exceeding threshold"

      - id: V4
        check: "After any source fix, the current batch is invalidated and build_test_verification_ref is refreshed with current real passed build/test evidence before every pass in the next frozen-snapshot batch; not_applicable is absent"
        on_fail: "Run current build/tests, record the passed evidence ref, freeze a new snapshot/batch, and block the next review round until the fresh evidence is available."

  # ─────────────────────────────────────────────
  # QA EVALUATION step — after code review/build evidence
  # ─────────────────────────────────────────────
  - phase: QA_EVALUATION_STEP
    condition: "qa_evaluation_mode == required"
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: QA1
        check: "QA evaluation starts only after build/test verification evidence and Code Reviewer or Reviewer compatibility result are available. That result must be a fresh complete final batch. Immediately rehash the source snapshot before QA; if it changed, validate, invalidate the prior batch, and complete a fresh review batch before QA resumes. The only bypass is exact equality of review_snapshot_id and all final snapshot identity fields. A carried approved_feature_preparation_qa_acceptance_obligation also requires its execution_prerequisite before QAEvaluator checks requested_scope."
        on_fail: "Return to validation or code review. Do not dispatch or resume QAEvaluator until current code-review/build evidence and exact rehash equality exist; on source mutation invalidate and rebuild the review batch. Block if prerequisite or evidence is missing rather than dropping the obligation."

      - id: QA2
        check: "QAEvaluator received bounded worker_return_schema_selector: Worker loads named handoff return_fields recursively from active skill root, proves worker_return_schema equals the referenced schema, or fails closed before response, done_contract with debate_record when present, acceptance_criteria, verification_evidence, domain_context/rubric_refs when applicable, round, previously_failed_acceptance_items, qa_filter_policy, and any approved_feature_preparation_qa_acceptance_obligation"
        on_fail: "Re-dispatch QAEvaluator with the full QA handoff context, or complete direct-fallback QA context before continuing."

      - id: QA3
        check: "QAEvaluator returned status, round, canonical acceptance_findings, qa_scorecard, selected_domain_rubrics/domain_quality_scores when scoped domain rubrics were selected, final_verdict, result, evidence, score_entry, and approved_feature_preparation_qa_acceptance_obligation_result when carried; that result exactly echoes requested_scope, execution_prerequisite, feature_preparation_scope, and the conditional source ref or basis."
        on_fail: "In delegated mode, re-dispatch QAEvaluator requesting the missing fields. In direct fallback mode, complete the missing QA evidence before deciding acceptance. Require selected_domain_rubrics/domain_quality_scores only when domain rubrics are scoped."

      - id: QA4
        check: "QAEvaluator findings stay in the QA lane and do not replace code-reviewer findings"
        on_fail: "Move generic code/security/architecture/test-coverage findings back to Code Reviewer unless they directly block an acceptance criterion or Done Contract item."

      - id: QA5
        check: "QA loop exit decision is accepted, accepted_with_concerns, rejected, or blocked; when a carried approved_feature_preparation_qa_acceptance_obligation exists, every successful pair accepted/CLEAN, accepted/ISSUES_FIXED, accepted_with_concerns/CLEAN, or accepted_with_concerns/ISSUES_FIXED requires requested_scope_status=fulfilled, execution_prerequisite_status=met, exact carried binding, and evidence. Otherwise return rejected/HAS_REMAINING_ITEMS or blocked/BLOCKED. round 10 is terminal and never starts round 11"
        on_fail: "Apply references/qa-evaluation-loop.md terminal behavior. If round < 10 and rejected, return failed acceptance items to Build; if round == 10, record remaining failed acceptance items in qa_evaluation_result."

      - id: QA6
        check: "Domain rubrics from references/domain-rubrics.md are loaded and applied only when scoped by acceptance criteria, Done Contract, domain_context, or explicit rubric_refs"
        condition: "qa_evaluation_mode == required"
        on_fail: "Remove unscoped rubric scoring, or re-dispatch QAEvaluator with the explicit domain_context/rubric_refs and require selected_domain_rubrics plus domain_quality_scores."

      - id: QA7
        check: "QA STAGNATION, repeated DRIFT, repeated REGRESSION, or scoped domain action pivot triggers pivot_restart_signal and orchestrator-owned pivot_restart_decision before another QA/build dispatch"
        condition: "qa_evaluation_mode == required"
        on_fail: "Pause QA, create pivot_restart_signal from score_entry, score_progression, or domain_quality_scores action=pivot, and require pivot_restart_decision with exact_next_action. Round 10 remains terminal and never starts round 11."

  # ─────────────────────────────────────────────
  # EXIT — after loop completes
  # ─────────────────────────────────────────────
  - phase: EXIT
    checkpoint_start: null
    checkpoint_end: null
    exit_assertions:

      - id: X1
        check: "Final summary is fully populated per output contract"
        on_fail: "Complete the final summary before presenting to user"

      - id: X2
        check: "If task journal exists: Review Log entry was appended with Final Result"
        condition: "task_journal_path is not null"
        on_fail: "Append Review Log entry to task journal"

      - id: X3
        check: "For medium+ scope: rubric_summary is populated in output with final scores and score progression"
        condition: "scope_size in [medium, large]"
        on_fail: "Populate rubric_summary with final scores from the post-barrier aggregated union and aggregate score progression"

      - id: X4
        check: "If qa_evaluation_mode is required: qa_evaluation_result is populated with final_verdict, result, acceptance_findings, qa_scorecard, score_progression, and evidence"
        condition: "qa_evaluation_mode == required"
        on_fail: "Run or complete the QA evaluation loop before presenting final review results."

      - id: X5
        check: "A no-material-finding final result has complete coverage, uses the evidence-bounded claim 'No material findings within the reviewed scope and available evidence', and does not present CLEAN as proof of correctness"
        on_fail: "Keep the compatible machine enum, replace the user-facing certainty claim with the required evidence-bounded wording, and state residual risk."

      - id: X_CHANGE_IMPACT
        check: "When change-impact accounting is triggered, a current review projection maps the same artifact identity to the original canonical scope_manifest, coverage_ledger, current snapshot, and concern bindings. Common completion validation, final_summary coverage_complete, and CLEAN/ISSUES_FIXED remain independently required; a read-only audit reports gaps rather than manufacturing a clean claim."
        condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
        on_fail: "Retain HAS_REMAINING_ITEMS/BLOCKED or audit gaps, refresh the canonical review batch, and rebuild the projection."

# ─────────────────────────────────────────────
# Loop invariants
# ─────────────────────────────────────────────
invariants:
  - id: INV_CHANGE_IMPACT
    check: "Impact projection preserves the supplied artifact identity and uses canonical review authority only; it never creates a parallel ledger or permits a clean result without current terminal coverage."
    condition: "impact_scope in [shared, unresolved] or an expanded change-impact artifact is explicitly carried"
    scope: all_rounds
    on_fail: "Use the existing manifest/ledger/final summary and report the unresolved gap."
  - id: INV0
    check: "Only ONE summary is presented to the user — no intermediate results are shown during the loop"
    scope: all_rounds
    on_fail: "Do not print findings or summaries until the loop exits. Buffer all output for the final summary."

  - id: INV1
    check: "previously_fixed ledger only grows — items are never removed; closure verification may update status and does not suppress incomplete or regressed findings"
    scope: all_rounds
    on_fail: "Restore any removed items to previously_fixed. This list is append-only."

  - id: INV2
    check: "Finding filter policy requires file/line evidence, concrete impact, and the smallest useful fix; speculative concerns are non-blocking Observations; round 10 is terminal"
    scope: all_rounds
    on_fail: "Rebuild finding_filter_policy from the evidence-backed rule and hard max-10 cap before dispatching review."

  - id: INV3
    check: "The agent never pauses between rounds to ask the user — the loop is autonomous"
    scope: all_rounds
    on_fail: "This is the core violation of this skill. Continue the loop without waiting."

  - id: INV4
    check: "Finding-count changes are explained by fixed items, regressions, drift, or newly discovered evidence"
    scope: all_rounds
    on_fail: "Investigate the increased count and classify each new item. Never suppress a new evidence-backed finding to preserve a monotonic count; record regressions or newly discovered risks in the final summary."

  - id: INV_BATCH
    check: "Each round counts started review batches, not individual perspective passes, including incomplete or invalidated batches. round 10 remains terminal after its started batch reaches a terminal outcome; no batch may claim clean before all expected responses are terminal and coverage is complete."
    scope: all_rounds
    on_fail: "Finish the current response barrier or record incomplete coverage as HAS_REMAINING_ITEMS. Do not increment the round for sibling passes or start round 11."

  - id: INV5
    check: "For medium+ scope: rubric score increases correlate with finding count decreases (no drift)"
    scope: all_rounds
    condition: "scope_size in [medium, large] and round >= 2"
    on_fail: >
      Drift detected: score increased without corresponding quality improvement.
      Per references/score-tracking.md: reset evaluator context once by dispatching a fresh Reviewer
      with stricter prompt; repeated DRIFT triggers pivot_restart_signal and orchestrator-owned
      pivot_restart_decision before another dispatch.

  - id: INV6
    check: "For medium+ scope: score does not stagnate (unchanged for 2+ rounds with findings present)"
    scope: all_rounds
    condition: "scope_size in [medium, large] and round >= 3"
    on_fail: >
      Stagnation detected: score unchanged for 2+ rounds while findings remain.
      Return pivot_restart_signal and require orchestrator-owned pivot_restart_decision before
      another fix/review dispatch.


  - id: INV7
    check: "For skill/workflow/framework changes, semantic contract review is not skipped or treated as a style-only review"
    scope: all_rounds
    condition: "semantic_contract_review_required is true"
    on_fail: "Run the Semantic Contract Review Checklist before declaring the review clean; report missing inherited artifacts, weak evals, method-signature drift, high-stakes guard gaps, or mirror drift as findings."


  - id: INV8
    check: "For behavior-bearing code changes, behavioral contract review is not skipped or treated as style-only review"
    scope: all_rounds
    condition: "behavioral_contract_review_required is true"
    on_fail: "Run the Behavioral Contract Review Checklist before declaring the review clean; report invariant bypasses, public-contract drift, weak inherited tests, protocol semantic gaps, missing high-impact guards, or runtime surface drift as findings."


  - id: INV9
    check: "For agent/workflow/tool loop changes, loop safety review is not skipped or treated as style-only review"
    scope: all_rounds
    condition: "agentic_loop_safety_review_required is true"
    on_fail: "Run the Agentic Loop Safety Checklist before declaring the review clean; report missing bounds, stop conditions, retry caps, empty-result handling, tool-error routing, stagnation detection, cost/token guards, or low-confidence escalation as findings."

  - id: INV10
    check: "Every round 3+ dispatch carries one allowed additional_round_reason and new evidence; score below threshold alone never authorizes another round"
    scope: all_rounds
    condition: "round >= 3"
    on_fail: "Stop before dispatch and either record allowed new evidence from changed files, an unresolved finding, validation failure, regression/drift, or a changed hypothesis, or exit with residual risk."

  - id: INV11
    check: "An applicable Architecture Decision Pack is reviewed as a fresh, falsifiable decision record rather than generic architecture advice or a permanent global memory"
    scope: all_rounds
    condition: "architecture_decision_pack_review_required is true"
    on_fail: "Report stale facts, erased semantic types, undocumented primitive exceptions, unmeasured quality claims, compatibility gaps, or missing verification as evidence-backed findings or explicit unknowns."

  - id: INV_QA1
    check: "QA evaluation never replaces Code Reviewer or Reviewer compatibility review"
    scope: all_rounds
    condition: "qa_evaluation_mode == required"
    on_fail: "Run code review first and record QAEvaluator only as the independent acceptance lane."

  - id: INV_QA2
    check: "QA evaluation round is always between 1 and 10, and round 10 is terminal"
    scope: all_rounds
    condition: "qa_evaluation_mode == required"
    on_fail: "Clamp QA execution to the 10-round cap and return the final verdict with remaining failed acceptance items instead of starting round 11."

  - id: INV_QA3
    check: "QAEvaluator does not invent domain rubrics, subjective standards, or domain-quality penalties when no acceptance criteria, Done Contract, domain_context, or rubric_refs scope them"
    scope: all_rounds
    condition: "qa_evaluation_mode == required"
    on_fail: "Discard unscoped domain rubric output and rerun QA with references/domain-rubrics.md conditional selection rules."

  - id: INV_QA4
    check: "QA findings require acceptance criteria, Done Contract, verification evidence, scoped domain-context support, and debate_record when Done Contract exists"
    scope: all_rounds
    condition: "qa_evaluation_mode == required"
    on_fail: "Move unsupported QA concerns to non-blocking observations or request missing context with NEEDS_CONTEXT/BLOCKED."
