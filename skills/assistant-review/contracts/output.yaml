# Review Output Contract
# Defines what a completed review MUST produce before presenting results to the user.

schema_version: "7.0"
contract: output
skill: assistant-review

artifacts:
  - name: review_delegation_path
    type: object
    required: conditional
    condition: "scope_size in [medium, large] or subagent_execution_mode in [delegated, direct_fallback]"
    description: "How Reviewer responsibility was executed"
    validation: "States subagent policy state, execution mode, trigger scope, and whether review used a fresh Reviewer subagent or fresh direct-fallback context"
    on_fail: "Record delegated review or direct fallback before presenting results; do not imply Reviewer subagents were used when delegation was not triggered or they were unavailable"
    object_fields:
      - name: subagent_policy_state
        type: enum
        required: true
        enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
      - name: subagent_execution_mode
        type: enum
        required: true
        enum_values: [delegated, direct_fallback, not_applicable]
      - name: subagent_trigger_scope
        type: string[]
        required: true
        validation: "Non-empty when delegation is relevant; records direct-user, applicable-AGENTS.md, or active-skill provenance and covered review roles, rounds, or files."
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "subagent_policy_state == policy_disallowed"
        validation: "Exact active blocking rule that confirms no applicable direct-user, AGENTS.md, or active-skill trigger exception."
      - name: fresh_context_evidence
        type: string
        required: true
        validation: "Names the fresh Reviewer dispatch, or the direct-fallback context reset used to reduce stale review risk"

  - name: qa_evaluation_delegation_path
    type: object
    required: conditional
    condition: "qa_evaluation_mode == required"
    description: "How QAEvaluator responsibility was executed"
    validation: "States subagent policy state, execution mode, trigger scope, and whether QA used a fresh QAEvaluator subagent or fresh direct-fallback context"
    on_fail: "Record delegated QA evaluation or direct fallback before presenting results; do not imply QAEvaluator subagents were used when delegation was not triggered or they were unavailable"
    object_fields:
      - name: subagent_policy_state
        type: enum
        required: true
        enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
      - name: subagent_execution_mode
        type: enum
        required: true
        enum_values: [delegated, direct_fallback, not_applicable]
      - name: subagent_trigger_scope
        type: string[]
        required: true
        validation: "Non-empty when delegation is relevant; records direct-user, applicable-AGENTS.md, or active-skill provenance and covered QA roles, rounds, or files."
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "subagent_policy_state == policy_disallowed"
        validation: "Exact active blocking rule that confirms no applicable direct-user, AGENTS.md, or active-skill trigger exception."
      - name: fresh_context_evidence
        type: string
        required: true
        validation: "Names the fresh QAEvaluator dispatch, or the direct-fallback context reset used to reduce stale QA risk"

  - name: pivot_restart_decision
    type: object
    required: conditional
    condition: "review or QA loop observes STAGNATION, repeated DRIFT, repeated REGRESSION, rubric action PIVOT, or scoped domain action pivot"
    description: "Orchestrator-owned decision packet created before another review/fix/QA/build dispatch after stagnant or pivot-triggered quality loops."
    validation: "Must include trigger, evidence, affected_slice_or_round, options_considered, selected_action, reapproval_required, next_agent, recovery_pointer, and exact_next_action. Reapproval is required when scope, files, behavior, risk, verification, or acceptance criteria change."
    on_fail: "Pause the loop and create the pivot_restart_decision before continuing; do not silently continue after stagnation or pivot."
    object_fields:
      - name: trigger
        type: enum
        required: true
        enum_values: [STAGNATION, repeated_DRIFT, repeated_REGRESSION, pivot]
      - name: evidence
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: affected_slice_or_round
        type: string
        required: true
      - name: options_considered
        type: object[]
        required: true
        min_items: 2
        object_fields:
          - name: option
            type: string
            required: true
          - name: tradeoff
            type: string
            required: true
          - name: disposition
            type: enum
            required: true
            enum_values: [selected, rejected, deferred]
      - name: selected_action
        type: enum
        required: true
        enum_values: [reset_context, return_to_build, dispatch_debugging, dispatch_explorer, dispatch_architect, run_candidate_search, replan, restart_slice, restart_phase, block_for_user, accept_with_limitations]
      - name: reapproval_required
        type: boolean
        required: true
      - name: next_agent
        type: string
        required: true
      - name: recovery_pointer
        type: string
        required: true
      - name: exact_next_action
        type: string
        required: true

  - name: review_finding_rule_distillation
    type: object[]
    required: conditional
    condition: "review has blocker or must-fix findings, or a finding exposes recurring process, contract, checklist, or eval gaps"
    description: "Classification of review findings into one-off fixes versus permanent rule candidates"
    validation: "Each applicable finding must include evidence, failure pattern, classification, target, proposed rule or no-action rationale, verification/eval update, scope/exclusions, and promotion decision"
    on_fail: "Load references/review-finding-permanent-rule.md and classify blocker/must-fix findings before final review output"
    object_fields:
      - name: finding
        type: string
        required: true
      - name: evidence
        type: string
        required: true
      - name: failure_pattern
        type: string
        required: true
      - name: classification
        type: enum
        enum_values: [one_off_fix, permanent_rule_candidate, no_action]
        required: true
      - name: rule_target
        type: enum
        enum_values: [checklist, input_contract, output_contract, phase_gate, handoff, eval, template, skill_reference, none]
        required: true
      - name: proposed_rule
        type: string
        required: true
      - name: verification_eval_update
        type: string
        required: true
      - name: scope_and_exclusions
        type: string
        required: true
      - name: promotion_decision
        type: enum
        enum_values: [promote, defer, reject]
        required: true

  - name: final_summary
    type: object
    required: true
    condition: always
    description: "The single summary presented to the user after the loop completes"
    validation: "Must include rounds (1-10), current final snapshot, started batch summaries, obligation-level coverage ledger, aggregation ledger, aggregated findings, aggregate result, the evidence-bounded no-finding claim only when coverage is complete, additional-round evidence when rounds >= 2, fixed_items, remaining_items or coverage gaps when applicable, and nits before presenting review results. The current final batch snapshot_identity exactly equals final_snapshot_identity and its review_snapshot_id exactly equals final_review_snapshot_id. Recompute the result and rubric from the complete aggregated union after the response barrier, never from an early pass result. Historical batches remain accountable but only the current final snapshot requires complete replacement coverage for CLEAN or ISSUES_FIXED."
    object_fields:
      - name: reviewed_scope
        type: string[]
        required: true
        min_items: 1
        description: "Files, diffs, task packets, slices, or content boundaries actually inspected across the completed review"
      - name: rounds
        type: int
        required: true
        validation: ">= 1 and <= 10"
      - name: final_review_snapshot_id
        type: string
        required: true
        description: "Current final snapshot whose complete replacement coverage governs the final result"
        validation: "Exactly equals current review_snapshot_id from the current complete final review batch."
      - name: final_snapshot_identity
        type: object
        required: true
        validation: "Equals the current complete final batch review_material_snapshot.snapshot_identity; final_review_snapshot_id exactly equals current review_snapshot_id."
        object_fields:
          - name: basis
            type: enum
            required: true
            enum_values: [git_revision, diff_digest, content_digest, task_or_pr_revision]
          - name: value
            type: string
            required: true
          - name: captured_at
            type: string
            required: true
          - name: scope_manifest_digest
            type: string
            required: true
            description: "Digest of the ordered scope_manifest and its content digests"
      - name: coverage_complete
        type: boolean
        required: true
        description: "True only when the current final snapshot has exact closure over every manifest-derived pass/item/applicable-concern/perspective/coverage_obligation tuple, every required tuple is inspected_no_risk or finding, and every expected pass is completed; historical incomplete or invalidated batches remain in history but do not permanently block a later complete final snapshot."
      - name: coverage_ledger
        type: object[]
        required: true
        min_items: 1
        description: "Obligation-level coverage ledger across every started batch; the current final snapshot needs exact closure over manifest-derived pass/item/concern/perspective/coverage_obligation tuples while prior entries retain terminal accounting."
        validation: "For the current final snapshot, the coverage records are the unique exact multiset of required_coverage_tuples, with one terminal record for each assigned coverage_obligation; only inspected_no_risk or finding completes it. blocked, not_applicable, needs_context, timed_out, failed, or invalidated forces coverage_complete=false and HAS_REMAINING_ITEMS."
        object_fields:
          - name: batch_id
            type: string
            required: true
          - name: review_snapshot_id
            type: string
            required: true
          - name: review_pass_id
            type: string
            required: true
          - name: perspective
            type: string
            required: true
          - name: coverage_obligation
            type: string
            required: true
          - name: assigned_scope
            type: string[]
            required: true
          - name: scope_item_id
            type: string
            required: true
          - name: applicable_concern
            type: string
            required: true
          - name: terminal_state
            type: enum
            required: true
            enum_values: [completed, needs_context, blocked, timed_out, failed, invalidated]
          - name: coverage_status
            type: enum
            required: true
            enum_values: [complete, incomplete, invalidated]
          - name: coverage_gap_id
            type: string
            required: conditional
            condition: "coverage_status in [incomplete, invalidated]"
            validation: "Stable unique identity for this exact current tuple gap. Absent when coverage_status=complete. Every current gap id appears exactly once across aggregation_ledger disposition=coverage_gap source_coverage_gap_ids, and no foreign or historical gap id substitutes for it."
          - name: evidence
            type: string
            required: true
      - name: batch_summaries
        type: object[]
        required: true
        min_items: 1
        description: "Summary of every started frozen-snapshot batch, including incomplete and invalidated batches."
        object_fields:
          - name: started_batch_ordinal
            type: int
            required: true
            validation: "Unique contiguous 1..rounds in started order; batch_summaries length equals rounds, including incomplete and invalidated batches, and 11 is invalid."
          - name: batch_id
            type: string
            required: true
          - name: review_snapshot_id
            type: string
            required: true
          - name: snapshot_identity
            type: object
            required: true
            validation: "Exact frozen identity for this batch; the current final batch exactly equals final_summary.final_snapshot_identity and its review_snapshot_id exactly equals final_summary.final_review_snapshot_id."
            object_fields:
              - name: basis
                type: enum
                required: true
                enum_values: [git_revision, diff_digest, content_digest, task_or_pr_revision]
              - name: value
                type: string
                required: true
              - name: captured_at
                type: string
                required: true
              - name: scope_manifest_digest
                type: string
                required: true
                description: "Digest of the ordered scope_manifest and its content digests"
          - name: batch_status
            type: enum
            required: true
            enum_values: [complete, incomplete, invalidated]
          - name: expected_response_count
            type: int
            required: true
            validation: "2 to 6"
          - name: terminal_response_count
            type: int
            required: true
          - name: aggregate_rubric_recomputed
            type: boolean
            required: true
      - name: aggregation_ledger
        type: object[]
        required: true
        description: "Post-barrier disposition for every pass finding and coverage gap; empty for a genuinely clean complete batch."
        object_fields:
          - name: source_provenance
            type: object[]
            required: true
            min_items: 1
            object_fields:
              - name: source_kind
                type: enum
                required: true
                enum_values: [spec_review, review_pass]
              - name: source_id
                type: string
                required: true
          - name: source_pass_ids
            type: string[]
            required: false
            description: "Compatibility projection of review_pass source_provenance only; Spec Review provenance uses source_provenance."
          - name: source_finding_ids
            type: string[]
            required: conditional
            condition: "disposition in [retained, merged]"
            min_items: 1
            validation: "Exact multiset closure for namespaced finding-backed dispositions; a merge preserves every source finding id."
          - name: source_coverage_gap_ids
            type: string[]
            required: conditional
            condition: "disposition == coverage_gap"
            min_items: 1
            validation: "Exact unique coverage_ledger.coverage_gap_id values for current timed-out, invalid, omitted, or otherwise incomplete tuples. Across coverage_gap dispositions this is an exact multiset closure over every current incomplete or invalidated tuple: no omissions, duplicates, foreign ids, or historical substitutions."
          - name: aggregate_finding_id
            type: string
            required: false
            validation: "References the aggregate finding identity used for closure, never a bare source finding id."
          - name: disposition
            type: enum
            required: true
            enum_values: [retained, merged, observation, rejected_invalid, coverage_gap]
          - name: rationale
            type: string
            required: true
            validation: "Every schema-valid source finding is retained or merged to an aggregate_finding_id; observation/rejected_invalid is only for non-findings. Invalid returns create coverage gaps and incomplete coverage. Merge only when locus, invariant, and failure mechanism are the same; similar wording alone does not merge. A merged confidence_pct is the minimum confidence among its retained source findings."
      - name: aggregated_findings
        type: object[]
        required: true
        description: "Stable aggregate union of validated pass findings after the response barrier."
        object_fields:
          - name: aggregate_finding_id
            type: string
            required: true
            validation: "Unique aggregate finding identity; closure_results reference this value."
          - name: finding_id
            type: string
            required: true
            description: "Compatibility representative source finding identifier retained through the aggregate projection."
            validation: "Namespaced source finding identifier, never used as the closure key."
          - name: source_pass_ids
            type: string[]
            required: false
            description: "Compatibility projection of review_pass source_provenance only."
          - name: source_finding_ids
            type: string[]
            required: true
            min_items: 1
            validation: "Aggregate provenance: retain every namespaced source finding id, including all merged sources and regressed closure findings; aggregate_finding_id is the closure key."
          - name: source_provenance
            type: object[]
            required: true
            min_items: 1
            object_fields:
              - name: source_kind
                type: enum
                required: true
                enum_values: [spec_review, review_pass]
              - name: source_id
                type: string
                required: true
          - name: locus
            type: string
            required: true
          - name: file
            type: string
            required: true
          - name: line
            type: int
            required: false
          - name: invariant
            type: string
            required: true
          - name: failure_mechanism
            type: string
            required: true
          - name: severity
            type: enum
            required: true
            enum_values: [must-fix, should-fix, nit]
            validation: "For a conservative merge, use the strongest source severity: must-fix > should-fix > nit."
          - name: description
            type: string
            required: true
          - name: evidence
            type: string
            required: true
          - name: smallest_useful_fix
            type: string
            required: true
          - name: confidence_pct
            type: int
            required: true
            validation: "For one source preserve its evidence-calibrated confidence; for a conservative merge use the minimum source confidence."
      - name: result
        type: enum
        required: true
        enum_values: [CLEAN, ISSUES_FIXED, HAS_REMAINING_ITEMS]
        description: "Machine-compatible workflow state. CLEAN does not prove correctness beyond the reviewed scope and evidence."
        validation: "HAS_REMAINING_ITEMS is required when current final coverage is incomplete, coverage_gaps is non-empty, remaining_items contains a material item, or aggregated must-fix/should-fix findings remain. CLEAN/ISSUES_FIXED require current complete coverage, empty coverage_gaps, no remaining material findings, and no remaining material aggregate findings; use ISSUES_FIXED only when fixed_items records a finding fixed during this session, otherwise CLEAN."
      - name: evidence_bounded_claim
        type: string
        required: conditional
        condition: "result in [CLEAN, ISSUES_FIXED] and coverage_complete is true"
        description: "Calibrated user-facing claim when no must-fix or should-fix finding remains"
        validation: "Exactly: No material findings within the reviewed scope and available evidence"
        on_fail: "Replace absolute correctness or clean claims with the required evidence-bounded wording while preserving the machine enum."
      - name: additional_round_reasons
        type: object[]
        required: conditional
        condition: "rounds >= 2"
        description: "Historical evidence for every review round after round 1"
        validation: "Contains one entry for every round from 2 through rounds; round 2 records changed-files/fix evidence retrospectively, and score below threshold alone is not an allowed entry."
        on_fail: "Record changed-files/fix evidence for round 2 and one allowed new-evidence reason for every round 3+."
        object_fields:
          - name: round
            type: int
            required: true
            validation: ">= 2 and <= 10"
          - name: reason
            type: enum
            required: true
            enum_values: [changed_files, unresolved_finding, validation_failure, regression_or_drift, changed_hypothesis]
            validation: "Round 2 is changed_files only and cites the source fix plus refreshed build/test evidence. The other reasons are available only for round 3 or later."
          - name: evidence_ref
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: fixed_items
        type: object[]
        required: true
        description: "All items fixed across all rounds, grouped by severity"
        object_fields:
          - name: severity
            type: enum
            required: true
            enum_values: [must-fix, should-fix, nit]
          - name: file
            type: string
            required: true
          - name: description
            type: string
            required: true
          - name: fixed_in_round
            type: int
            required: true
            validation: ">= 1 and <= 10"
      - name: remaining_items
        type: object[]
        required: false
        condition: "result == HAS_REMAINING_ITEMS"
        description: "Items that could not be resolved within max rounds"
        object_fields:
          - name: severity
            type: enum
            required: true
            enum_values: [must-fix, should-fix]
          - name: file
            type: string
            required: true
          - name: description
            type: string
            required: true
          - name: reason_unresolved
            type: string
            required: true
      - name: coverage_gaps
        type: string[]
        required: conditional
        condition: "coverage_complete is false"
        description: "Missing, invalid, blocked, timed-out, or invalidated pass coverage that prevents a clean result"
      - name: nits
        type: object[]
        required: true
        description: "Low-priority observations noted but not fixed"
        object_fields:
          - name: file
            type: string
            required: true
          - name: description
            type: string
            required: true

  - name: qa_evaluation_result
    type: object
    required: conditional
    condition: "qa_evaluation_mode == required"
    description: "Independent QA evaluation final result after build/test and code-review evidence"
    validation: "Must include rounds (1-10), final_verdict, result, canonical acceptance_findings, qa_scorecard, selected_domain_rubrics/domain_quality_scores when scoped domain rubrics were used, score_progression, pivot_restart_signal when triggered, evidence, obligation result when carried, and open_questions when blocked; every successful pair accepted|accepted_with_concerns with CLEAN|ISSUES_FIXED is invalid until the carried obligation is fulfilled."
    on_fail: "Run the QA evaluation loop from references/qa-evaluation-loop.md or record why QA is blocked before presenting final review results"
    object_fields:
      - name: rounds
        type: int
        required: true
        validation: ">= 1 and <= 10"
      - name: final_verdict
        type: enum
        required: true
        enum_values: [accepted, accepted_with_concerns, rejected, blocked]
      - name: result
        type: enum
        required: true
        enum_values: [CLEAN, ISSUES_FIXED, HAS_REMAINING_ITEMS, BLOCKED]
      - name: acceptance_findings
        type: object[]
        required: true
        description: "Remaining or resolved acceptance findings from the final QA round"
        object_fields:
          - name: severity
            type: enum
            required: true
            enum_values: [blocker, concern, observation]
          - name: criterion
            type: string
            required: true
          - name: evidence
            type: string
            required: true
          - name: impact
            type: string
            required: true
          - name: recommendation
            type: string
            required: false
          - name: disposition
            type: enum
            required: true
            enum_values: [resolved, remaining, not_applicable]
            validation: "not_applicable is allowed only for an unscoped criterion."
      - name: approved_feature_preparation_qa_acceptance_obligation_result
        type: object
        required: conditional
        condition: "approved_feature_preparation_qa_acceptance_obligation is carried from workflow"
        validation: "Echoes the carried requested_scope, execution_prerequisite, feature_preparation_scope, and exactly one conditional source binding unchanged; every successful pair accepted|accepted_with_concerns with CLEAN|ISSUES_FIXED requires requested_scope_status=fulfilled, execution_prerequisite_status=met, and requested-scope/prerequisite evidence. Otherwise final_verdict/result is rejected/HAS_REMAINING_ITEMS or blocked/BLOCKED."
        object_fields:
          - name: requested_scope_status
            type: enum
            required: true
            enum_values: [fulfilled, blocked, failed]
          - name: requested_scope_evidence
            type: string
            required: true
          - name: execution_prerequisite_status
            type: enum
            required: true
            enum_values: [met, missing, blocked]
          - name: execution_prerequisite_evidence
            type: string
            required: true
          - name: requested_scope
            type: string
            required: true
            validation: "Equals approved_feature_preparation_qa_acceptance_obligation.requested_scope."
          - name: execution_prerequisite
            type: string
            required: true
            validation: "Equals approved_feature_preparation_qa_acceptance_obligation.execution_prerequisite."
          - name: feature_preparation_scope
            type: enum
            required: true
            enum_values: [not_applicable, existing_system]
            validation: "Equals carried feature_preparation_scope."
          - name: source_feature_preparation_evidence_ref
            type: string
            required: conditional
            condition: "feature_preparation_scope == existing_system"
            validation: "Equals carried source_feature_preparation_evidence_ref."
          - name: source_preparation_basis
            type: enum
            required: conditional
            condition: "feature_preparation_scope == not_applicable"
            enum_values: [not_applicable]
            validation: "Equals carried source_preparation_basis."
      - name: qa_scorecard
        type: object
        required: true
        description: "Compact QA scorecard; domain_quality is backed by selected_domain_rubrics/domain_quality_scores only when scoped domain rubrics were used"
        object_fields:
          - name: acceptance_coverage
            type: float
            required: true
            validation: "1.0 to 5.0 in 0.5 increments"
          - name: evidence_strength
            type: float
            required: true
            validation: "1.0 to 5.0 in 0.5 increments"
          - name: domain_quality
            type: float
            required: true
            validation: "1.0 to 5.0 in 0.5 increments; use 5.0 when no scoped domain quality surface applies and state not_applicable in rationale"
          - name: final_readiness
            type: float
            required: true
            validation: "1.0 to 5.0 in 0.5 increments"
          - name: weighted_score
            type: float
            required: true
            validation: "weighted_score = round_half_up((acceptance_coverage * 0.30) + (evidence_strength * 0.25) + (domain_quality * 0.20) + (final_readiness * 0.25), 2 decimal places)"
          - name: rationale
            type: object
            required: true
            object_fields:
              - name: acceptance_coverage
                type: string
                required: true
              - name: evidence_strength
                type: string
                required: true
              - name: domain_quality
                type: string
                required: true
              - name: final_readiness
                type: string
                required: true
      - name: selected_domain_rubrics
        type: string[]
        required: false
        condition: "domain_context or rubric_refs is present, or acceptance criteria / Done Contract require subjective/product/UX/docs/DX/UI/domain craft evaluation"
        description: "Rubric families selected from references/domain-rubrics.md for this QA round"
        validation: "Every selected family is one of [ui_visual_design, ux_product_acceptance, documentation_quality, developer_experience, domain_specific_craft] and is tied to acceptance criteria, Done Contract, domain_context, or explicit rubric_refs. Empty or omitted when no scoped domain rubric applies."
      - name: domain_quality_scores
        type: object[]
        required: false
        condition: "selected_domain_rubrics is non-empty"
        description: "Per-family domain rubric scores from references/domain-rubrics.md"
        validation: "Each score cites scoped evidence and uses pass/refine/pivot or accepted/rejected guidance; unscoped dimensions are not_applicable, not invented."
        object_fields:
          - name: rubric_ref
            type: string
            required: true
            description: "Selected rubric family, such as ui_visual_design, ux_product_acceptance, documentation_quality, developer_experience, or domain_specific_craft"
          - name: dimension
            type: string
            required: true
            description: "Selected dimension within the rubric family"
          - name: score
            type: float
            required: true
            validation: "1.0 to 5.0 in 0.5 increments. For action=not_applicable, use 5.0 and state the unscoped rationale in evidence."
          - name: action
            type: enum
            required: true
            enum_values: [accepted, accepted_with_concerns, refine, rejected, pivot, not_applicable]
          - name: evidence
            type: string
            required: true
            validation: "Cites acceptance criteria, Done Contract, domain_context, rubric_refs, verification artifacts, screenshots, docs, or concrete files"
      - name: score_progression
        type: object[]
        required: true
        description: "Canonical QA score projection across rounds"
        object_fields:
          - name: round
            type: int
            required: true
            validation: ">= 1 and <= 10"
          - name: weighted_score
            type: float
            required: true
          - name: failed_acceptance_count
            type: int
            required: true
          - name: delta
            type: string
            required: true
            validation: "Round 1 is exactly initial. Later rounds are the exact signed two-decimal weighted_score change from the immediately preceding round, for example +0.50, +0.00, or -0.50."
          - name: drift_status
            type: enum
            required: true
            enum_values: [GENUINE, SUSPICIOUS, DRIFT, REGRESSION, STAGNATION, NEUTRAL, NOT_APPLICABLE]
            validation: "Derived from the immediately preceding score and failed_acceptance_count movement. REGRESSION is a negative delta. A positive delta is GENUINE when failed count falls, SUSPICIOUS when that improvement exceeds 1.00, and DRIFT otherwise. STAGNATION requires a two-transition zero-delta plateau with the same positive failed count; otherwise use NEUTRAL. Repeated DRIFT/REGRESSION means consecutive terminal transitions only."
      - name: pivot_restart_signal
        type: object
        required: false
        condition: "final score_progression entry drift_status == STAGNATION, repeated QA DRIFT/REGRESSION is detected, or any scoped domain_quality_scores action == pivot"
        description: "Signal that the QA loop needs orchestrator-owned pivot/restart handling before another QA/build dispatch."
        validation: "Preserves the terminal QAEvaluator signal unchanged; affected_round exactly equals qa_evaluation_result.rounds, the current final QA round."
        object_fields:
          - name: trigger
            type: enum
            required: true
            enum_values: [STAGNATION, repeated_DRIFT, repeated_REGRESSION, pivot]
          - name: evidence
            type: object[]
            required: true
            min_items: 1
            object_fields:
              - name: source
                type: string
                required: true
              - name: detail
                type: string
                required: true
          - name: affected_round
            type: int
            required: true
            validation: ">= 1 and <= 10; exactly equals current return round."
          - name: recommended_recovery_focus
            type: string
            required: true
            description: "Acceptance gap, evidence gap, domain pivot evidence, or stale QA context the orchestrator should consider"
      - name: evidence
        type: object[]
        required: true
        min_items: 1
        object_fields:
          - name: source
            type: string
            required: true
          - name: detail
            type: string
            required: true
      - name: open_questions
        type: string[]
        required: false
        condition: "final_verdict == blocked or result == BLOCKED"
        description: "Questions or blocker details the orchestrator must resolve"

  - name: rubric_summary
    type: object
    required: false
    condition: "scope_size in [medium, large]"
    description: "Final rubric scores from the post-barrier aggregated union of the current final snapshot, plus aggregate progression across all rounds"
    object_fields:
      - name: final_scores
        type: object
        required: true
        description: "Aggregate rubric scores recomputed after the response barrier from the current final snapshot union"
        object_fields:
          - name: correctness
            type: float
            required: true
          - name: code_quality
            type: float
            required: true
          - name: architecture
            type: float
            required: true
          - name: security
            type: float
            required: true
          - name: test_coverage
            type: float
            required: true
          - name: weighted_score
            type: float
            required: true
          - name: action
            type: enum
            required: true
            enum_values: [PASS, REFINE, PIVOT]
      - name: score_progression
        type: object[]
        required: true
        description: "Weighted aggregate score and aggregated union finding count per round — used for drift detection and capped at the 10-round review limit"
        validation: "v7 score tracking uses aggregated_finding_count. Persisted v6 packets are invalidated and rebuilt before score tracking; legacy finding_count is retained only as historical evidence."
        object_fields:
          - name: round
            type: int
            required: true
            validation: ">= 1 and <= 10"
          - name: weighted_score
            type: float
            required: true
          - name: aggregated_finding_count
            type: int
            required: true
            description: "Aggregated union findings (must-fix + should-fix) this round"
          - name: drift_status
            type: enum
            required: true
            enum_values: [GENUINE, SUSPICIOUS, DRIFT, REGRESSION, STAGNATION, NEUTRAL]
            description: "Whether score change correlates with finding count change"

  - name: agentic_loop_safety_review
    type: object
    required: conditional
    condition: "agentic_loop_safety_review_required is true"
    description: "Review of runaway-loop and repeated-tool-call safety risks"
    validation: "Must state whether bounded execution, stop condition, retry/empty handling, tool-error handling, progress/stagnation detection, cost/token guardrails, and low-confidence escalation were checked"
    object_fields:
      - name: bounded_execution
        type: string
        required: true
      - name: stop_condition
        type: string
        required: true
      - name: retry_and_empty_result_handling
        type: string
        required: true
      - name: tool_error_handling
        type: string
        required: true
      - name: progress_and_stagnation_detection
        type: string
        required: true
      - name: cost_token_guardrails
        type: string
        required: true
      - name: low_confidence_escalation
        type: string
        required: true
      - name: loop_safety_findings_summary
        type: string
        required: true

  - name: behavioral_contract_review
    type: object
    required: conditional
    condition: "behavioral_contract_review_required is true"
    description: "Review of behavioral compatibility risks for code changes"
    validation: "Must state whether existing invariants, interface alignment, inherited test coverage, protocol/algorithm fidelity, high-impact guards, and runtime surfaces were checked"
    object_fields:
      - name: existing_behavior_and_invariants
        type: string
        required: true
      - name: interface_implementation_alignment
        type: string
        required: true
      - name: test_inheritance_coverage
        type: string
        required: true
      - name: protocol_algorithm_fidelity
        type: string
        required: true
      - name: high_impact_operation_guards
        type: string
        required: true
      - name: runtime_surface_sync
        type: string
        required: true
      - name: behavioral_findings_summary
        type: string
        required: true

  - name: semantic_contract_review
    type: object
    required: conditional
    condition: "semantic_contract_review_required is true"
    description: "Review of semantic contract risks for skill/workflow/framework changes"
    validation: "Must state whether inherited contracts, template-contract alignment, eval inheritance, external-method signature fidelity, high-stakes guards, and mirror surfaces were checked"
    object_fields:
      - name: inherited_contract_obligations
        type: string
        required: true
      - name: template_contract_alignment
        type: string
        required: true
      - name: eval_inheritance_coverage
        type: string
        required: true
      - name: external_method_signature_fidelity
        type: string
        required: true
      - name: high_stakes_recommendation_guard
        type: string
        required: true
      - name: mirror_surface_sync
        type: string
        required: true
      - name: semantic_findings_summary
        type: string
        required: true

  - name: architecture_decision_pack_review
    type: object
    required: conditional
    condition: "architecture_decision_pack_review_required is true"
    description: "Evidence-backed review of a fresh Architecture Decision Pack"
    validation: "Checks freshness, material questions, boundaries, design-pressure checks, semantic types/primitive exceptions, quality scenarios, compatibility/extension seam, and handoff/verification. architecture_decision_pack.mode must equal canonical architecture_design_mode; review_intensive requires independent_challenge_evidence. Missing workload/budget/measurement/failure evidence cannot be reported as a confirmed quality benefit."
    object_fields:
      - name: freshness_and_facts
        type: string
        required: true
      - name: material_questions_and_invalidators
        type: string
        required: true
      - name: independent_challenge_evidence
        type: string
        required: conditional
        condition: "architecture_design_mode == review_intensive"
      - name: ownership_dependency_and_lifecycle_boundary
        type: string
        required: true
      - name: design_pressure_checks
        type: string
        required: true
      - name: semantic_type_and_primitive_exception_ledger
        type: string
        required: true
      - name: quality_scenario_falsifiability
        type: string
        required: true
      - name: compatibility_and_extension_seam
        type: string
        required: true
      - name: verification_handoff_and_rollback
        type: string
        required: true
      - name: architecture_pack_findings_summary
        type: string
        required: true

  - name: bugfix_evidence_review
    type: object
    required: conditional
    condition: "review material represents a bugfix or workflow task_type == bugfix"
    description: "Review of reproduction/root-cause evidence and regression linkage for bugfixes"
    validation: "Must state whether assistant-debugging evidence or an explicit not-applicable/blocker rationale was reviewed, and whether regression coverage traces to the isolated failure mechanism"
    object_fields:
      - name: debugging_evidence_present
        type: boolean
        required: true
      - name: reproduction_or_blocker
        type: string
        required: true
      - name: root_cause_or_mitigation
        type: string
        required: true
      - name: regression_linkage
        type: enum
        required: true
        enum_values: [confirmed, missing, not_applicable, blocked]
      - name: residual_debugging_risks
        type: string[]
        required: true

  - name: build_verification
    type: object
    required: true
    condition: "mode == review-fix"
    description: "Build and test results after all fixes applied"
    validation: "Must show passed build/test verification or an explicit not_applicable build_result before review completion"
    object_fields:
      - name: build_result
        type: enum
        required: true
        enum_values: [passed, failed, not_applicable]
      - name: test_summary
        type: object
        required: true
        condition: "build_result != not_applicable"
        object_fields:
          - name: passed
            type: int
            required: true
          - name: failed
            type: int
            required: true
            validation: "Must be 0 at review completion"
          - name: skipped
            type: int
            required: true

  - name: task_journal_entry
    type: string
    required: true
    condition: "task_journal_path is not null"
    description: "Review Log entry appended to the task journal with Final Result"
    validation: "Entry follows the task-journal-template.md Review Log format"

  - name: audit_report
    type: object
    required: true
    condition: "mode == audit"
    description: "Full findings report when running in audit mode (no fixes)"
    validation: "Must include all aggregate audit findings, current-final-snapshot coverage_complete, started batch summaries, and an overall summary after the response barrier before audit results are presented."
    object_fields:
      - name: coverage_complete
        type: boolean
        required: true
        description: "Current audit snapshot exact manifest-derived tuple closure result"
      - name: batch_summaries
        type: object[]
        required: true
        min_items: 1
        description: "Terminal summaries for the completed read-only batch"
      - name: coverage_ledger_ref
        type: string
        required: true
        description: "Pointer to final_summary obligation-level coverage ledger"
      - name: findings
        type: object[]
        required: true
        description: "All findings grouped by severity"
        object_fields:
          - name: severity
            type: enum
            required: true
            enum_values: [must-fix, should-fix, nit]
          - name: file
            type: string
            required: true
          - name: line
            type: int
            required: false
          - name: description
            type: string
            required: true
          - name: aggregate_finding_id
            type: string
            required: true
            description: "Stable identifier from final_summary.aggregated_findings"
          - name: finding_id
            type: string
            required: true
            description: "Compatibility representative namespaced source finding identifier retained from final_summary.aggregated_findings; it is not the closure key."
          - name: source_finding_ids
            type: string[]
            required: true
            min_items: 1
            description: "Lossless source-finding provenance; a merged audit finding preserves every source finding ID."
          - name: source_pass_ids
            type: string[]
            required: false
            description: "Compatibility projection of review_pass provenance only."
          - name: source_provenance
            type: object[]
            required: true
            min_items: 1
            description: "Truthful aggregate provenance for review-pass and retained Spec Review findings."
            object_fields:
              - name: source_kind
                type: enum
                required: true
                enum_values: [spec_review, review_pass]
              - name: source_id
                type: string
                required: true
          - name: confidence_pct
            type: int
            required: true
            validation: "Matches the evidence-calibrated final_summary aggregate confidence, using the minimum source confidence for a merge."
          - name: locus
            type: string
            required: true
          - name: invariant
            type: string
            required: true
          - name: failure_mechanism
            type: string
            required: true
          - name: evidence
            type: string
            required: true
          - name: smallest_useful_fix
            type: string
            required: true
      - name: summary
        type: string
        required: true
        description: "Overall assessment paragraph"

# Completeness check:
# Before presenting results to user:
# 1. final_summary is fully populated
# 2. If mode=review-fix: build_verification shows passed and 0 test failures
# 3. If task journal exists: Review Log has been updated with entry + Final Result
# 4. If mode=audit: audit_report contains all findings, no fixes were applied
# 5. If semantic_contract_review_required=true: semantic_contract_review is populated and semantic findings are included in final_summary/audit_report
# 6. If behavioral_contract_review_required=true: behavioral_contract_review is populated and behavioral findings are included in final_summary/audit_report
# 7. If agentic_loop_safety_review_required=true: agentic_loop_safety_review is populated and loop-safety findings are included in final_summary/audit_report
# 8. If architecture_decision_pack_review_required=true: architecture_decision_pack_review is populated and Pack findings are included in final_summary/audit_report
# 8. If qa_evaluation_mode=required: qa_evaluation_delegation_path and qa_evaluation_result are populated after build/test and code-review evidence; QA result does not replace final_summary or code-review artifacts
# 9. If scoped domain rubrics were used: qa_evaluation_result includes selected_domain_rubrics and domain_quality_scores; if not scoped, no invented domain rubric output is required or accepted
# 10. If review or QA triggered STAGNATION, repeated DRIFT, repeated REGRESSION, or pivot action: pivot_restart_decision is populated before any additional review/fix/QA/build dispatch
