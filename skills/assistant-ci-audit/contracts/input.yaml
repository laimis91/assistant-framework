schema_version: "1.0"
contract: input
skill: assistant-ci-audit

fields:
  - name: audit_goal
    type: string
    required: true
    description: "Protection or maintenance question to answer"
    on_missing: ask
    ask_prompt: "Which CI/test protection or maintenance question should this audit answer?"
    validation: "Names a suite/checking-system investigation, not repair authority"
  - name: audit_scope
    type: object
    required: true
    description: "AuditScope pins source identity and the bounded inspection surface"
    on_missing: infer
    infer_from: "Use supplied repository, current revision/dirty state and relevant paths; disclose unavailable identity"
    validation: "Keep safe repository_ref and revision distinct; repository_ref may be an opaque reference, literal unknown, or explicit redacted display with honest limits in available evidence/report baseline. Unknown/redacted equality proves no equivalence; never infer historical repository identity from current source. Keep relevant identity free of secrets; bound included families and exclusions before investigation. content_ref identifies an immutable bounded snapshot/digest of all relevant staged, unstaged, untracked and generated bytes, or literal unknown. HEAD/status or equal unknown values do not establish equivalence/freshness; unavailable identity does not block harmless inspect_only work"
    object_fields:
      - {name: repository_ref, type: string, required: true}
      - {name: revision_ref, type: string, required: true}
      - {name: dirty_state, type: enum, required: true, enum_values: [clean, dirty, unknown]}
      - {name: content_ref, type: string, required: true}
      - {name: included_paths, type: "string[]", required: true}
      - {name: excluded_paths, type: "string[]", required: true}
  - name: execution_policy
    type: enum
    required: true
    enum_values: [inspect_only, local_diagnostics]
    default: inspect_only
    on_missing: infer
    infer_from: "Default inspect_only; a request to audit or supplied commands alone does not authorize execution"
    validation: "local_diagnostics requires source-bound local execution authority and finite diagnostic limits; otherwise inspect only"
  - name: constraints
    type: object
    required: true
    description: "AuditConstraints defines permitted actions, protected inputs and finite resources"
    on_missing: infer
    infer_from: "Preserve task/project restrictions; absent execution authority means inspect_only with no diagnostics"
    validation: "No repair or dispatch authority; execution requires explicit authority_limits and finite resource_allowance (actions, runs/time/cost as relevant), with earlier stop on no new evidence"
    object_fields:
      - {name: authorized_actions, type: "string[]", required: true}
      - {name: protected_paths, type: "string[]", required: true}
      - {name: authority_limits, type: string, required: true}
      - {name: resource_allowance, type: string, required: true}
  - name: available_evidence
    type: object[]
    required: false
    default: []
    on_missing: skip
    description: "Existing source, reports or actual run evidence; empty is valid"
    validation: "Retain source identity, freshness and limits; historical evidence does not become a current run"
    object_fields:
      - {name: evidence_ref, type: string, required: true}
      - {name: supported_scope, type: string, required: true}
      - {name: limits, type: string, required: true}
