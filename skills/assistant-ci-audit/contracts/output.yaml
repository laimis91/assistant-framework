schema_version: "1.0"
contract: output
skill: assistant-ci-audit

# Named semantic records use existing object/object_fields wire transport.
# CAPTURE/REPORT validate identity, authority and evidence semantics; this is not
# a new runtime type system, workflow envelope or test selection protocol.
artifacts:
  - name: audit_summary
    type: object
    required: true
    description: "AuditSummary: the bounded answer, baseline and exclusions"
    validation: "complete answers every material scoped question with current adequate evidence; partial retains gaps; blocked identifies the preventing dependency. Complete is not universal CI correctness. The safe repository_ref/revision_ref/dirty_state/content_ref identity identifies the inspected source; retain baseline prose. content_ref is an immutable bounded relevant-content snapshot/digest including relevant staged/unstaged/untracked/generated bytes, or literal unknown. Safe opaque repository refs are valid; unavailable historical refs stay literal unknown, and redacted/unknown refs require honest baseline limitations. Equal opaque/redacted/unknown refs alone never prove equivalence or freshness; HEAD/status alone are insufficient."
    on_fail: "Downgrade to partial/blocked and name the missing observation."
    object_fields:
      - {name: status, type: enum, required: true, enum_values: [complete, partial, blocked]}
      - {name: answer, type: string, required: true}
      - {name: baseline, type: string, required: true}
      - {name: repository_ref, type: string, required: true}
      - {name: revision_ref, type: string, required: true}
      - {name: dirty_state, type: enum, required: true, enum_values: [clean, dirty, unknown]}
      - {name: content_ref, type: string, required: true}
      - {name: exclusions, type: "string[]", required: true}
  - name: question_coverage
    type: object[]
    required: true
    description: "AuditQuestion: stable IDs link each scoped question to an answer or gap"
    validation: "Every material question appears once; partial/unresolved needs a missing_observation and next_step."
    object_fields:
      - {name: id, type: string, required: true}
      - {name: question, type: string, required: true}
      - {name: status, type: enum, required: true, enum_values: [answered, partial, unresolved]}
      - {name: evidence_refs, type: "string[]", required: true}
      - {name: missing_observation, type: string, required: conditional, condition: "status != answered"}
      - {name: next_step, type: string, required: conditional, condition: "status != answered"}
  - name: audit_trace
    type: object[]
    required: true
    description: "AuditTraceEntry: bounded relevant discovery, fixture, execution, report and final-gate paths"
    validation: "Distinguish observed edges, bounded inspected absence and unavailable evidence; include relevant dynamic/non-import and duplicate/omitted paths. No exhaustive-absence claim from a search."
    object_fields:
      - {name: path, type: string, required: true}
      - {name: role_or_edge, type: string, required: true}
      - {name: observation, type: enum, required: true, enum_values: [observed, inspected_absence, unavailable]}
      - {name: evidence_refs, type: "string[]", required: true}
      - {name: limits, type: string, required: true}
  - name: executed_checks
    type: object[]
    required: true
    description: "AuditRun: actual command observations only; no planned command slots"
    validation: "Empty is valid. Every run has nonempty argv/cwd displays retaining literal nonsensitive parts and known argument boundaries, its actual safe repository_ref/revision_ref/dirty_state/content_ref identity, host/toolchain, exit/child/report observations and limits. Started but incomplete runs disclose unknown outcomes, never success; no run record for an unexecuted plan. Run identities may legitimately differ from the inspected summary for historical, probe or candidate runs; never copy the summary identity over them. Safe opaque repository refs are valid; missing historical repository identity stays literal unknown, and unknown/redacted refs require honest run limits. Never infer a run repository from summary/current source; equal opaque/redacted/unknown refs alone prove no equivalence/freshness. Sensitive argv/cwd parts use explicit display placeholders; limits identify redacted positions and lost replay/identity assurance. Placeholders are observed-command displays, never executable commands, and cannot turn unexecuted/unknown commands into observed runs. Existing evidence_refs may resolve already authorized access-controlled captures; require no new secret retention, storage, digests or wrapper."
    on_fail: "Remove unexecuted records and report the exact gap; never invent invocation or completion."
    object_fields:
      - {name: id, type: string, required: true}
      - {name: repository_ref, type: string, required: true}
      - {name: revision_ref, type: string, required: true}
      - {name: dirty_state, type: enum, required: true, enum_values: [clean, dirty, unknown]}
      - {name: content_ref, type: string, required: true}
      - {name: argv, type: "string[]", required: true, min_items: 1, description: "Literal nonsensitive arguments; sensitive parts use explicit display placeholders retaining known argument boundaries; never execute the display"}
      - {name: cwd, type: string, required: true, description: "Literal nonsensitive working directory or explicit sensitive-part display placeholder; qualify lost replay assurance in limits"}
      - {name: host_toolchain, type: string, required: true}
      - {name: exit_observation, type: string, required: true}
      - {name: child_observation, type: string, required: true}
      - {name: report_observation, type: string, required: true}
      - {name: evidence_refs, type: "string[]", required: true}
      - {name: limits, type: string, required: true}
  - name: findings
    type: object[]
    required: true
    description: "AuditFinding: evidence-calibrated protection and maintenance findings; empty is valid"
    validation: "reproduced_defect resolves actual reproduction; supported_cost resolves actual measurements; hypotheses/gaps do not imply execution. kind=hypothesis can describe an unexecuted maintenance effect/disposition while maintenance.evidence_state=source_confirmed preserves established source facts. Maintenance recommendations retain unique important protection or a source-backed invalid/obsolete-expectation rationale, never count-based deletion."
    on_fail: "Correct the unsupported kind or maintenance evidence_state, preserve established source facts, and request the smallest missing observation."
    object_fields:
      - {name: id, type: string, required: true}
      - {name: kind, type: enum, required: true, enum_values: [reproduced_defect, supported_cost, hypothesis, evidence_gap]}
      - {name: scope_owner, type: string, required: true}
      - {name: expected_behavior, type: string, required: true}
      - {name: observed_behavior, type: string, required: true}
      - {name: evidence_refs, type: "string[]", required: true}
      - {name: consequence, type: string, required: true}
      - {name: competing_explanation, type: string, required: true, description: "An evidence-grounded alternative or explicit none found"}
      - {name: recommendation, type: string, required: true, description: "Correction or next check only; grants no action authority"}
      - {name: limits, type: string, required: true}
      - name: maintenance
        type: object
        required: conditional
        condition: "finding recommends a test/family maintenance disposition"
        description: "Protection argument for keep, consolidate, rewrite or remove; not a per-test ledger"
        validation: "Consolidation/removal maps duplicate assertions to adequate retained protection. Invalid/obsolete expectations cite accepted-behavior sources; source_confirmed requires finding.evidence_refs establishing the inspected assertion, accepted behavior and retained protection or obsolete rationale. Unknown protection remains unresolved and an explicit gap; hypothesis describes an unexecuted effect/disposition without downgrading established source facts. Source inspection alone proves neither reproduced_defect nor supported_cost. Removing an accepted requirement needs separate authorization."
        object_fields:
          - {name: evidence_state, type: enum, required: true, enum_values: [source_confirmed, unresolved]}
          - {name: test_family, type: string, required: true}
          - {name: important_claim, type: string, required: true}
          - {name: plausible_defect, type: string, required: true}
          - {name: remaining_unique_protection, type: string, required: true}
          - {name: disposition, type: enum, required: true, enum_values: [keep, consolidate, rewrite, remove]}
          - {name: retained_protection_or_obsolete_rationale, type: string, required: true}
  - name: probe_results
    type: object[]
    required: conditional
    condition: "an authorized isolated fault probe was actually attempted"
    description: "AuditProbe: control, detection and disposal of an attempted probe"
    validation: "Only disposable input or an authorized controlled seam; record baseline/control, expected/observed detection, cleanup, original pre/post hash evidence and run refs. No working-input mutation; incomplete cleanup or changed originals is an explicit blocker, not a successful probe."
    on_fail: "Stop diagnostics, preserve evidence, report the isolation/cleanup failure and return the safest next action."
    object_fields:
      - {name: id, type: string, required: true}
      - {name: authority_ref, type: string, required: true}
      - {name: isolated_input, type: string, required: true}
      - {name: baseline_control, type: string, required: true}
      - {name: expected_detection, type: string, required: true}
      - {name: observed_detection, type: string, required: true}
      - {name: run_refs, type: "string[]", required: true}
      - {name: cleanup, type: string, required: true}
      - {name: original_hash_evidence, type: string, required: true}
      - {name: limits, type: string, required: true}
  - name: performance_comparisons
    type: object[]
    required: conditional
    condition: "a comparative cost conclusion is assessed"
    description: "AuditComparison: actual measured paired work and its comparability, including rejected comparisons"
    validation: "supported_cost needs actual measurements; savings requires comparable conditions and equivalent completed accepted obligations/protection, not identical counts. Failed/incomplete work, missing metrics or fewer obligations means incomparable with no savings claim. Include preparation, instrumentation, cache, variability and unmeasured work."
    on_fail: "Mark incomparable, withdraw savings and disclose the missing measurements or protection."
    object_fields:
      - {name: id, type: string, required: true}
      - {name: status, type: enum, required: true, enum_values: [comparable, incomparable]}
      - {name: baseline_run_refs, type: "string[]", required: true}
      - {name: candidate_run_refs, type: "string[]", required: true}
      - {name: completed_obligations_and_protection, type: string, required: true}
      - {name: changed_or_redundant_checks, type: string, required: true}
      - {name: conditions, type: string, required: true}
      - {name: measurements, type: string, required: true}
      - {name: units_and_variability, type: string, required: true}
      - {name: unmeasured_work, type: string, required: true}
      - {name: conclusion, type: string, required: true}
  - name: evidence_gaps
    type: string[]
    required: true
    validation: "All material missing observations, permission/runtime limits and unanswered questions remain explicit; empty only with adequate scoped evidence."
  - name: next_action
    type: string
    required: true
    validation: "Scoped recommendation or hand back to the owning user/workflow/verification/debugging/review boundary; no automatic repair or dispatch."
