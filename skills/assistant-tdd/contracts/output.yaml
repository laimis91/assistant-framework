# TDD Output Contract
# Defines the canonical TDD cycle log used by delegated handoffs and completion.

schema_version: "3.0"
contract: output
skill: assistant-tdd

artifacts:
  - name: cycle_log
    type: object[]
    required: true
    condition: always
    description: "Actual phase evidence for each started Red-Green-Refactor cycle; may remain partial between delegated owners"
    min_items: 1
    validation: "One entry per started behavior cycle; every input behavior has an entry before TDD completion. During delegated workflow handoffs, a current in-progress entry may omit not-yet-started GREEN or REFACTOR phases, and a started phase may have zero command_results while awaiting its verification owner; preserve this partial entry without treating it as complete. TDD completion requires actual current command_results for RED and GREEN and executed REFACTOR or validated reuse_green, at least one invocation per executed phase; validated reuse_green references original GREEN instead of another REFACTOR run, and all intended pass guards. Each invocation retains literal argv/cwd and its observed result. For workflow-authorizing RED, exactly one current failed invocation binds the current test_file/test_name, a check_id in selected_check_ids intersect tdd_choice.applicable_check_ids, exact CheckSpec argv/cwd, and the matching meaningful_failure oracle before production edits. Other invocations remain honest and do not authorize edits. Standalone/no-decision TDD and non-authorizing invocations may omit check_id; never reconstruct or invent an ID, command, or cwd. Older cycle logs without invocation identity may remain historical evidence but cannot establish current selected-check closure."
    object_fields:
      - name: schema_version
        type: enum
        required: conditional
        condition: "the entry is created or updated under this v3 contract"
        enum_values: ["3.0"]
        description: "Cycle entry version read by the workflow task-packet admission helper; reuse_green is valid only for 3.0."
        on_missing: infer
        infer_from: "Absent schema_version means a historical v2 entry; never infer 3.0 for an entry this contract did not create or update."
        validation: "New or updated entries record 3.0. An entry without schema_version is a historical v2 entry: it stays readable, its command_results need no invocation_ref, its REFACTOR disposition is executed, and it can never support reuse_green or current selected-check closure."
      - name: reuse_identity_mode
        type: enum
        required: false
        enum_values: [digest, detailed]
        description: "reuse_green proof: digest (default) compares green.reuse_digest; detailed is a persisted-packet opt-in adding relevant_input_identity and an assessment."
        on_missing: infer
        infer_from: "Absent means digest."
        validation: "Only 3.0 entries record it."
      - name: behavior
        type: string
        required: true
        description: "The behavior description from the input"
      - name: plan_step
        type: int
        required: false
      - name: red
        type: object
        required: true
        description: "RED phase: writer-authored failing test independently executed in separated_workers"
        object_fields:
          - name: test_name
            type: string
            required: true
          - name: test_file
            type: string
            required: true
          - name: failure_reason
            type: string
            required: true
            validation: "Must describe why this test's observed failure matches the current selected CheckSpec meaningful_failure oracle when it authorizes workflow production edits; syntax, setup, and unrelated failures never qualify."
          - name: debugging_trace
            type: string
            required: conditional
            condition: "when the behavior is a bugfix"
            description: "How the RED test traces to assistant-debugging reproduction/root-cause evidence"
            validation: "Must cite original failure path or reproduction evidence for bugfix RED tests"
          - name: command_results
            type: object[]
            required: true
            min_items: 1
            description: "Actual RED phase invocations, represented separately for each test target or relevant check."
            validation: "Record each command actually run in this RED phase with its literal argv, explicit cwd, observed result, and freshness. A current selected CheckSpec ID is required when this invocation is claimed as evidence for that check; omit it for standalone TDD without a verification decision. For workflow-authorizing RED, exactly one current failed invocation carries the matching meaningful_failure oracle and binds its selected/applicable ID, exact argv/cwd, and test_file/test_name; other invocations remain honest."
            object_fields:
              - name: invocation_ref
                type: string
                required: conditional
                condition: "the enclosing cycle_log entry has schema_version 3.0 and this row is referenced by a phase-level invocation_ref or green_invocation_refs"
                description: "Stable identity of this actual invocation; reuse never creates a command row."
                on_missing: fail
                validation: "Unique within the cycle entry and assigned only to a command that actually ran; never invent or copy one for a run that did not happen. Unreferenced rows and historical v2 rows may omit it and remain valid history."
              - name: target
                type: string
                required: true
                description: "Test target, regression, or binding suite invoked in this phase."
                validation: "For the unique authorizing RED invocation, identifies the same test_file and test_name as the enclosing red artifact."
              - name: test_file
                type: string
                required: conditional
                condition: "this is the workflow-authorizing RED invocation in a current TDD cycle with verification_decision"
                description: "Test file targeted by this RED invocation."
              - name: test_name
                type: string
                required: conditional
                condition: "this is the workflow-authorizing RED invocation in a current TDD cycle with verification_decision"
                description: "Specific test targeted by this RED invocation."
              - name: argv
                type: string[]
                required: true
                min_items: 1
                description: "Literal executable and arguments used for this invocation."
              - name: cwd
                type: string
                required: true
                description: "Explicit working directory used for this invocation."
              - name: result
                type: enum
                required: true
                enum_values: [passed, failed, partial, unavailable]
                description: "Observed outcome of this invocation."
              - name: freshness
                type: enum
                required: true
                enum_values: [current, stale, unknown]
                description: "Whether this invocation result is current for this cycle."
              - name: check_id
                type: string
                required: conditional
                condition: "this command result is claimed as evidence for a selected CheckSpec in the available unchanged verification_decision or is the workflow-authorizing RED invocation"
                description: "Current selected CheckSpec identity; omit when there is no decision or this invocation is not evidence for a selected CheckSpec."
                validation: "For the unique workflow-authorizing RED invocation, resolves exactly once to a CheckSpec in selected_check_ids intersect tdd_choice.applicable_check_ids; argv/cwd exactly equal its command.argv/command.cwd, and the enclosing test_file/test_name plus failure_reason match that check's target and meaningful_failure. Other invocations may omit the ID; when supplied, it resolves once to a selected CheckSpec with exact argv/cwd. standalone/no-decision TDD may omit IDs; never invent one."
          - name: verified_failing
            type: boolean
            required: true
            validation: "Must be true only when the test was run and confirmed to fail for the right reason, with at least one current command_results entry for test_file and test_name whose freshness is current and result is failed. Standalone/no-decision TDD may retain multiple matching current failed invocations; one or more substantiate RED, and every actual invocation remains in history. When authorizing workflow production edits, the command_results rule requires exactly one authorizing invocation; that invocation must carry the exact applicable selected check_id, argv, cwd, test target, and matching meaningful_failure oracle; missing/wrong identity or oracle is not valid RED, and other invocations remain honest and do not authorize edits. This does not add an ID requirement to standalone/no-decision TDD or unrelated invocations."
      - name: green
        type: object
        required: conditional
        condition: "the current cycle has started GREEN after authorizing RED and production edits"
        description: "GREEN phase: actual production file and any current verification invocations; an empty command_results list is an in-progress handoff, not passing evidence"
        object_fields:
          - name: production_file
            type: string
            required: true
          - name: invocation_ref
            type: string
            required: conditional
            condition: "schema_version == 3.0 and at least one GREEN command_results invocation is recorded"
            description: "Phase-level reference to the actual GREEN invocation of the authorizing RED target."
            on_missing: fail
            validation: "Equals the invocation_ref of exactly one GREEN command_results row for the RED test target, passed when all_tests_pass is true. Never invent one; without it reuse_green is unavailable."
          - name: reuse_digest
            type: string
            required: conditional
            condition: "schema_version == 3.0 and refactor.verification_disposition == reuse_green"
            description: "Lowercase `sha256:` then 64 lowercase hex: SHA-256 of bytewise-sorted sha256sum lines (hash, relative path) of scoped tracked and untracked non-ignored files GREEN checks read (git ls-files -co --exclude-standard); callers recompute identically."
            on_missing: fail
            validation: "No sentinel (unknown, n/a, none); never invented. reuse_green needs no post-GREEN edit and an equal independently resolved current digest; a missing or different one, or a failed GREEN, blocks reuse."
          - name: relevant_input_identity
            type: object
            required: conditional
            condition: "schema_version == 3.0 and reuse_identity_mode == detailed and refactor.verification_disposition == reuse_green"
            description: "Detailed opt-in identity captured at the GREEN run."
            on_missing: fail
            validation: "Exactly the seven listed categories, each with the category_fields shape; configuration covers CheckSpec argv/cwd and environment excludes secrets. Reuse requires every category current and equal to the canonical assessment's GREEN and current identities. Unknown, stale or unchecked mutable inputs block reuse_green; choose executed and run the affected checks."
            category_fields:
              - name: identity
                type: string
                required: true
                on_missing: fail
                validation: "Observed digest or revision; never invented."
              - name: freshness
                type: enum
                required: true
                enum_values: [current, stale, unknown]
                on_missing: fail
                validation: "Only current supports reuse_green."
            object_fields:
              - name: source
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: tests
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: configuration
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: dependencies
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: toolchain
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: environment
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
              - name: external_inputs
                type: object
                required: true
                on_missing: fail
                fields_from: category_fields
          - name: command_results
            type: object[]
            required: true
            min_items: 0
            description: "Actual GREEN phase invocations, represented separately for each target, regression, or binding suite."
            validation: "Record only commands actually run in this GREEN phase with literal argv, explicit cwd, observed result, and freshness; an empty list means verification has not run yet and must not be interpreted as a pass. TDD completion requires at least one actual current invocation and every due guard passing. A current selected CheckSpec ID is required when this invocation is claimed as evidence for that check; omit it for standalone TDD without a verification decision."
            object_fields:
              - name: invocation_ref
                type: string
                required: conditional
                condition: "the enclosing cycle_log entry has schema_version 3.0 and this row is referenced by a phase-level invocation_ref or green_invocation_refs"
                description: "Stable identity of this actual invocation; reuse never creates a command row."
                on_missing: fail
                validation: "Unique within the cycle entry and assigned only to a command that actually ran; never invent or copy one for a run that did not happen. Unreferenced rows and historical v2 rows may omit it and remain valid history."
              - name: target
                type: string
                required: true
                description: "Test target, regression, or binding suite invoked in this phase."
              - name: argv
                type: string[]
                required: true
                min_items: 1
                description: "Literal executable and arguments used for this invocation."
              - name: cwd
                type: string
                required: true
                description: "Explicit working directory used for this invocation."
              - name: result
                type: enum
                required: true
                enum_values: [passed, failed, partial, unavailable]
                description: "Observed outcome of this invocation."
              - name: freshness
                type: enum
                required: true
                enum_values: [current, stale, unknown]
                description: "Whether this invocation result is current for this cycle."
              - name: check_id
                type: string
                required: conditional
                condition: "this command result is claimed as evidence for a selected CheckSpec in the available unchanged verification_decision"
                description: "Current selected CheckSpec identity; omit when there is no decision or this invocation is not evidence for a selected CheckSpec."
                validation: "Resolves exactly once to a selected CheckSpec in the unchanged verification_decision; argv and cwd exactly equal CheckSpec.command.argv and CheckSpec.command.cwd. Omit when no decision is available or this invocation is not evidence for a selected CheckSpec; never invent an ID."
          - name: test_passes
            type: boolean
            required: conditional
            condition: "at least one GREEN command_results invocation is recorded"
            validation: "Must be true only when a current command_results entry for the RED test target has freshness=current and result=passed; omit until a GREEN invocation is recorded."
          - name: all_tests_pass
            type: boolean
            required: conditional
            condition: "at least one GREEN command_results invocation is recorded"
            validation: "Must be true only when the current RED test target, every due selected TDD check, each relevant due selected automated regression check, and each applicable due/executable binding suite have command_results with freshness=current and result=passed. For selected checks require exact check_id/argv/cwd; missing or mismatched identity, stale, failed, partial, or unavailable result blocks true. Include the target even in standalone TDD; no unselected suite is implied. Omit until a GREEN invocation is recorded."
      - name: refactor
        type: object
        required: conditional
        condition: "current GREEN all_tests_pass is true and the owning CodeWriter has assessed REFACTOR"
        description: "REFACTOR assessment with actual executed verification or explicit validated GREEN reuse; no invented invocation or test count"
        object_fields:
          - name: verification_disposition
            type: enum
            required: conditional
            condition: "schema_version == 3.0"
            enum_values: [executed, reuse_green]
            description: "executed appends actual runs; reuse_green adds zero invocations/results/test counts"
            on_missing: infer
            infer_from: "Absent disposition means executed, including for historical v2 entries."
            validation: "Infer executed when absent, including for historical v2 entries. reuse_green requires schema_version 3.0, a passing GREEN with green.reuse_digest, changes_made exactly none needed, an empty REFACTOR command_results list, and invocation_ref equal to green.invocation_ref; detailed reuse_identity_mode also requires green.relevant_input_identity and a sufficient canonical reuse assessment. Any actual refactor edit requires executed with the affected checks run."
          - name: invocation_ref
            type: string
            required: conditional
            condition: "schema_version == 3.0 and (verification_disposition == reuse_green or at least one REFACTOR command_results invocation is recorded)"
            description: "Phase-level reference to the invocation that supports REFACTOR."
            on_missing: fail
            validation: "For reuse_green, equals green.invocation_ref and appears in green_invocation_refs when present; it identifies the original GREEN run, not a new one. For executed, equals the invocation_ref of the actual REFACTOR command_results row for the RED test target and differs from green.invocation_ref."
          - name: green_invocation_refs
            type: string[]
            required: conditional
            condition: "verification_disposition == reuse_green and reuse_identity_mode == detailed"
            min_items: 1
            description: "Retained original passing GREEN invocations; optional in digest mode"
            on_missing: fail
            validation: "When present in either mode, includes green.invocation_ref and resolves exactly to the original passed GREEN runs of the target and every due regression and binding check. Missing or unresolved references block reuse_green; run the affected checks."
          - name: reuse_assessment_ref
            type: string
            required: conditional
            condition: "verification_disposition == reuse_green and reuse_identity_mode == detailed"
            description: "Detailed mode only: canonical verification assessment independently resolves original runs, full unchanged CheckSpec decision/argv/cwd/oracle, relevant source/tests/config/dependencies/toolchain/nonsecret environment and external freshness, no post-GREEN edits and no binding fresh-run mandate"
            on_missing: fail
            validation: "Resolves to a sufficient assessment for this packet whose GREEN and current input identities equal green.relevant_input_identity and which lists no post-GREEN changes and no fresh-run obligations. Missing or insufficient assessment blocks reuse_green; choose executed and run the affected checks."
          - name: changes_made
            type: string
            required: true
            description: "What was refactored, or 'none needed'"
            validation: "reuse_green requires exactly none needed; any described edit requires executed disposition."
          - name: command_results
            type: object[]
            required: true
            min_items: 0
            description: "Actual REFACTOR phase invocations, represented separately for each target, regression, or binding suite."
            validation: "Record only commands actually run in this REFACTOR phase with literal argv, explicit cwd, observed result, and freshness; an empty list means verification has not run yet for executed disposition; reuse_green requires an empty list and validated references to original passing GREEN, never a new pass. Executed completion requires at least one actual current invocation and every due guard passing. reuse_green requires changes_made=none needed and all due evidence current with no binding fresh-run conflict. A current selected CheckSpec ID is required when this invocation is claimed as evidence for that check; omit it for standalone TDD without a verification decision."
            object_fields:
              - name: invocation_ref
                type: string
                required: conditional
                condition: "the enclosing cycle_log entry has schema_version 3.0 and this row is referenced by a phase-level invocation_ref or green_invocation_refs"
                description: "Stable identity of this actual invocation; reuse never creates a command row."
                on_missing: fail
                validation: "Unique within the cycle entry and assigned only to a command that actually ran; never invent or copy one for a run that did not happen. Unreferenced rows and historical v2 rows may omit it and remain valid history."
              - name: target
                type: string
                required: true
                description: "Test target, regression, or binding suite invoked in this phase."
              - name: argv
                type: string[]
                required: true
                min_items: 1
                description: "Literal executable and arguments used for this invocation."
              - name: cwd
                type: string
                required: true
                description: "Explicit working directory used for this invocation."
              - name: result
                type: enum
                required: true
                enum_values: [passed, failed, partial, unavailable]
                description: "Observed outcome of this invocation."
              - name: freshness
                type: enum
                required: true
                enum_values: [current, stale, unknown]
                description: "Whether this invocation result is current for this cycle."
              - name: check_id
                type: string
                required: conditional
                condition: "this command result is claimed as evidence for a selected CheckSpec in the available unchanged verification_decision"
                description: "Current selected CheckSpec identity; omit when there is no decision or this invocation is not evidence for a selected CheckSpec."
                validation: "Resolves exactly once to a selected CheckSpec in the unchanged verification_decision; argv and cwd exactly equal CheckSpec.command.argv and CheckSpec.command.cwd. Omit when no decision is available or this invocation is not evidence for a selected CheckSpec; never invent an ID."
          - name: all_tests_pass
            type: boolean
            required: conditional
            condition: "at least one REFACTOR command_results invocation is recorded or verification_disposition == reuse_green"
            validation: "For executed disposition: true only when the current RED test target, every due selected TDD check, each relevant due selected automated regression check, and each applicable due/executable binding suite have REFACTOR command_results with freshness=current and result=passed; omit while executed REFACTOR has no recorded invocation. For selected checks require exact check_id/argv/cwd; missing or mismatched identity, stale, failed, partial, or unavailable result blocks true. Include the target even in standalone TDD; no unselected suite is implied. For reuse_green: REFACTOR command_results stays empty, and true only when changes_made is none needed, green_invocation_refs, when present (required in detailed mode), resolve to the original passed GREEN runs of the target and every due guard, and the current digest equals reuse_digest; reuse records no new pass or test count."

  - name: coverage_summary
    type: object
    required: true
    condition: always
    description: "Summary of what is now tested"
    validation: "Must report new_tests (which may be zero when an existing assertion is extended), total_tests_run, and all_passing=true for the selected TDD checks and binding suites at completion"
    object_fields:
      - name: new_tests
        type: int
        required: true
        validation: ">= 0; zero is valid when this cycle extends an existing assertion and still records meaningful RED evidence"
      - name: total_tests_run
        type: int
        required: true
        validation: "> 0 at completion; count actual selected TDD and binding-suite test executions; reuse_green references add zero"
      - name: all_passing
        type: boolean
        required: true
        validation: "Must be true at TDD completion"

  - name: architecture_obligation_coverage
    type: object[]
    required: conditional
    condition: "architecture_test_obligations is non-empty"
    description: "Evidence that each carried Architecture Decision Pack obligation was tested or explicitly remains blocked/unknown"
    min_items: 1
    validation: "Each input architecture_test_obligations obligation is represented exactly once by obligation_id; no coverage entry has an unknown or duplicate id. Each entry cites the Pack reference, obligation, test or verification evidence, and outcome. Quality claims cannot be marked proven without workload, budget/explicit unknown, measurement method, and failure condition. Design-pressure claims require evidence for control/early exit, ownership/disposal, bounded resources, extension registration, or a representative path when applicable."
    on_fail: "Add a focused RED/GREEN test or record the explicit measurement/blocker gap before TDD completion"
    object_fields:
      - name: obligation_id
        type: string
        required: true
        validation: "Matches exactly one input architecture_test_obligations.obligation_id"
      - name: architecture_decision_pack_ref
        type: string
        required: true
      - name: obligation_kind
        type: enum
        required: true
        enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
      - name: evidence
        type: string
        required: true
      - name: outcome
        type: enum
        required: true
        enum_values: [covered, blocked, explicit_unknown]

  - name: ownership_stage_projection
    type: object
    required: false
    description: "Optional non-executing instruction projection of the permitted active separated TDD sequence, only when explicitly requested"
    validation: "This projection never substitutes for cycle_log, authorizing RED, or completion evidence; it describes permitted order and ownership, not actual dispatches or command history. Omission does not weaken any required cycle or completion artifact."
    object_fields:
      - name: stage_order
        type: string[]
        required: true
        min_items: 6
        description: "Ordered permitted stages: test_authoring, pre_production_red, production, GREEN, refactor, REFACTOR"
        on_missing: fail
        validation: "Return NEEDS_CONTEXT for the requested projection; do not fabricate execution evidence"
      - name: owner_order
        type: string[]
        required: true
        min_items: 6
        description: "Owners aligned with stage_order: the SAME selected writer alternates with the independent builder-tester"
        on_missing: fail
        validation: "Return NEEDS_CONTEXT for the requested projection; do not fabricate execution evidence"
      - name: completes_build
        type: boolean
        required: true
        description: "False: a stage-only result never completes Build or permits Review"
        on_missing: fail
        validation: "Return NEEDS_CONTEXT for the requested projection; do not infer Build completion"
      - name: production_requires_red
        type: boolean
        required: true
        description: "True: active production requires current matching meaningful RED"
        on_missing: fail
        validation: "Return NEEDS_CONTEXT for the requested projection; do not infer RED authorization"
      - name: refactor_requires_green
        type: boolean
        required: true
        description: "True: refactor requires current passing GREEN"
        on_missing: fail
        validation: "Return NEEDS_CONTEXT for the requested projection; do not infer GREEN authorization"

  - name: task_journal_entry
    type: string
    required: true
    condition: "task journal exists"
    description: "Progress section updated with RED/GREEN/REFACTOR entries per step"
    validation: "Each completed behavior shows RED, GREEN, REFACTOR sub-entries"

# Completeness check:
# 1. Every input behavior has a corresponding cycle_log entry
# 2. Every active cycle has a current failed RED invocation for the intended reason, a current passing GREEN result for that test, and either current passing executed REFACTOR results for every due selected check and applicable regression/binding suite or a validated v3 reuse_green that references the original passing GREEN runs with zero new invocations
# 3. No production code exists without a preceding failing test
# 4. coverage_summary.all_passing is true for selected TDD checks and binding suites, not an unselected full suite
# 5. If architecture_test_obligations are carried, every unique obligation_id has exactly one architecture_obligation_coverage entry with evidence or an explicit blocker/unknown; no coverage id is unknown or duplicated
