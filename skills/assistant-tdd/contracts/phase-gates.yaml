# TDD Phase Gate Contracts
# The Red-Green-Refactor cycle has strict gates at each transition.
# These are the core enforcement mechanism — violating a gate means TDD was not followed.

schema_version: "2.0"
contract: phase-gates
skill: assistant-tdd

gates:

  # ─────────────────────────────────────────────
  # RED → GREEN transition
  # ─────────────────────────────────────────────
  - phase: RED
    checkpoint_start: "--- PHASE: RED ---"
    checkpoint_end: "--- PHASE: RED COMPLETE ---"
    exit_assertions:

      - id: RED1
        check: "One behavior-focused test assertion was added or extended for this active TDD cycle"
        on_fail: "Add or extend one assertion for the selected behavior; do not require a new test file or unrelated tests."

      - id: RED2
        check: "The test was executed and it FAILED"
        on_fail: "Run the test. If it passes, the behavior already exists or the test is wrong — investigate."

      - id: RED3
        check: "The test failed for the RIGHT reason (not syntax error, missing import, or wrong setup)"
        on_fail: "Fix the test infrastructure issue. The failure must demonstrate the missing behavior."

      - id: RED4
        check: "No production code was written during the RED phase"
        on_fail: "Preserve all existing code, stop implementation, and report the ordering violation; do not delete or conceal prior work."

      - id: RED5
        check: "When architecture_test_obligations are present, each has a unique stable obligation_id and the RED behavior names the carried semantic type, primitive boundary, public compatibility, or quality scenario it can falsify"
        condition: "architecture_test_obligations is non-empty"
        on_fail: "Add a focused testable obligation or record the architecture claim as blocked/explicit_unknown; do not replace it with a wrapper-only test."

  # ─────────────────────────────────────────────
  # GREEN → REFACTOR transition
  # ─────────────────────────────────────────────
  - phase: GREEN
    checkpoint_start: "--- PHASE: GREEN ---"
    checkpoint_end: "--- PHASE: GREEN COMPLETE ---"
    exit_assertions:

      - id: GREEN1
        check: "The previously failing test now PASSES"
        on_fail: "The implementation is incomplete. Continue writing the simplest code to make it pass."

      - id: GREEN2
        check: "The selected target, relevant regression checks, and binding project suites pass"
        on_fail: "The implementation broke a selected or binding check. Repair the regression without weakening its oracle."

      - id: GREEN3
        check: "Only the SIMPLEST code was written — no extra features, no 'while I'm here' additions"
        on_fail: "Remove code that goes beyond making the failing test pass. Additional behavior needs its own RED phase."

  # ─────────────────────────────────────────────
  # REFACTOR → next RED (or exit)
  # ─────────────────────────────────────────────
  - phase: REFACTOR
    checkpoint_start: "--- PHASE: REFACTOR ---"
    checkpoint_end: "--- PHASE: REFACTOR COMPLETE ---"
    exit_assertions:

      - id: REF1
        check: "The selected target, relevant regression checks, and binding project suites still pass after refactoring"
        on_fail: "The refactoring broke a selected or binding check. Repair the regression or keep the refactor out."

      - id: REF2
        check: "No new behavior was added during refactoring"
        on_fail: "New behavior belongs in a new RED phase. Remove it from this refactoring step."

      - id: REF3
        check: "Duplication introduced in GREEN was addressed (or explicitly noted as acceptable)"
        on_fail: "Review for duplication from the GREEN step and extract/simplify"

# ─────────────────────────────────────────────
# TDD invariants
# ─────────────────────────────────────────────
invariants:
  - id: INV1
    check: "For every active TDD behavior, production changes follow a valid, right-reason RED result"
    scope: all_cycles
    on_fail: "Preserve existing code and report the ordering violation; never delete work to manufacture TDD evidence."

  - id: INV2
    check: "The selected target runs at each phase transition (RED: right-reason failure, GREEN and REFACTOR: pass); relevant regressions and binding suites run when selected or required"
    scope: all_cycles
    on_fail: "Run the selected target and any due regression or binding checks; record skipped or unavailable checks as gaps."

  - id: INV3
    check: "Each cycle follows RED → GREEN → REFACTOR order — no skipping, no reordering"
    scope: all_cycles
    on_fail: "Return to the correct phase. The sequence is not negotiable."

  - id: INV4
    check: "If a test passes unexpectedly in RED, the cycle stops for investigation — not silently continued"
    scope: all_cycles
    on_fail: "Investigate: does the behavior already exist? Is the test wrong? Resolve before continuing."

  - id: INV5
    check: "Architecture Decision Pack obligations are not claimed covered unless test evidence proves semantic validation/conversion/compatibility or a quality scenario's workload, budget, measurement, and failure condition; architecture_obligation_coverage binds every input obligation exactly once by obligation_id with no unknown or duplicate coverage id"
    scope: all_cycles
    condition: "architecture_test_obligations is non-empty"
    on_fail: "Record the missing evidence as blocked or explicit_unknown and return it to the workflow Pack/review handoff."
