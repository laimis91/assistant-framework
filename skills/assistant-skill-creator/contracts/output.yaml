# Assistant Skill Creator Output Contract
# Operation-specific artifacts are required only for their applicable operation.

schema_version: "3.0"
contract: output
skill: assistant-skill-creator

artifacts:
  - name: operation_summary
    type: string
    required: true
    description: "Outcome and status for the selected operation, including evidence and unresolved limits"
    validation: "Create/update summarize authored files and validation; assess/refresh summarize findings without claiming authoring or unavailable evidence"
    on_fail: "Return the selected operation, its actual result, evidence, and unresolved gaps"

  - name: skill_md
    type: file
    required: conditional
    condition: "operation in [create, update] and authoring is complete"
    description: "Target SKILL.md with required name and description and preserved or explicitly changed supported metadata"
    path: "skills/{skill_name}/SKILL.md"
    validation: "Use a valid name and a 1–1024-character description; optional compatibility is 1–500 characters. Preserve supported metadata, policy, and current canonical requires unless explicitly changed. Emit non-empty validated hard dependencies in order as a plain block sequence with two-space dash kebab-case items, omit requires when empty, preserve omitted update dependencies, and preserve supported policy and metadata. Reject inline, empty, or quoted `requires` forms. Reject legacy top-level `effort` and `triggers` keys. Keep body under 500 lines."
    on_fail: "Fix metadata or preserve the existing target fields and dependency behavior before reporting completion"

  - name: input_contract
    type: file
    required: conditional
    condition: "operation in [create, update] and authoring is complete and (a named consumer needs typed inputs or the user explicitly requests an input schema)"
    description: "Target input contract containing only outcome-relevant fields"
    path: "skills/{skill_name}/contracts/input.yaml"
    validation: "Include headers, explicit enums, conditional requiredness, and recovery for required fields; do not add fields to meet a count"
    on_fail: "Correct the contract structure and remove fields without an outcome-changing purpose"

  - name: output_contract
    type: file
    required: conditional
    condition: "operation in [create, update] and authoring is complete and (a named consumer needs typed outputs or the user explicitly requests an output schema)"
    description: "Target output contract containing only required outcome artifacts"
    path: "skills/{skill_name}/contracts/output.yaml"
    validation: "Include headers and actionable on_fail recovery for every required artifact; do not add artifacts to meet a count"
    on_fail: "Correct requiredness and recovery, then remove artifacts not needed for the stated outcome"

  - name: phase_gates_contract
    type: file
    required: conditional
    condition: "operation in [create, update] and authoring is complete and (a real transition consumer needs structured gates or the user explicitly requests a gate schema)"
    description: "Target phase gates for a multi-step Process or Analysis skill"
    path: "skills/{skill_name}/contracts/phase-gates.yaml"
    validation: "Use binary assertions, explicit conditions, and actionable recovery"
    on_fail: "Add or correct only phase gates needed to protect the target workflow"

  - name: handoffs_contract
    type: file
    required: conditional
    condition: "operation in [create, update] and authoring is complete and (a delegated consumer needs structured context and returns or the user explicitly requests a handoff schema)"
    description: "Target Process handoffs with matching typed producer and consumer fields"
    path: "skills/{skill_name}/contracts/handoffs.yaml"
    validation: "Producer return fields satisfy the actual delegated consumer context fields; categories alone do not require handoffs"
    on_fail: "Align the handoff fields or remove unsupported delegation"

  - name: validation_summary
    type: string
    required: conditional
    condition: "operation in [create, update]"
    description: "Validation result for all applicable contract design rules and policy constraints"
    validation: "Report applicable pass/fail outcomes, actual checks, and limits. Validate the rules applicable to the changed boundary, without adding artifacts to satisfy a category. When a creator behavior fixture is evaluated, load the behavioral_evaluation set for its independent artifact/trace evidence; this does not replace canonical verification. For existing skills, inspect the existing description and activation evals first, derive structured activation examples from the existing description and activation evals when adequate, and ask only for remaining material gaps."
    on_fail: "Fix applicable failures, rerun the affected checks, and report unresolved limits"

  - name: policy_safety_summary
    type: string
    required: conditional
    condition: "operation in [create, update]"
    description: "Relevant memory, metrics, automation, subagent, state-path, external-tool, host, and sensitive-example constraints"
    validation: "State applicable assumptions and fallbacks; do not invent host support or silently change target invocation policy"
    on_fail: "Add the applicable safe fallback or report the limitation before authoring completion"

  - name: distillation_verification
    type: object
    required: conditional
    condition: "creating or updating a skill from a completed workflow, review lesson, reusable procedure, or user-requested skill save"
    description: "Verifier-approved distillation packet required before writing target skill files"
    validation: "verifier_result must be approved and the full packet must be present before writing"
    on_fail: "Load references/verified-skill-distillation.md and request verifier approval or return a revision checklist"
    object_fields:
      - name: candidate_workflow
        type: string
        required: true
      - name: inputs
        type: string[]
        required: true
      - name: process_steps
        type: string[]
        required: true
      - name: output_artifact
        type: string
        required: true
      - name: verification_gate
        type: string
        required: true
      - name: learned_constraints
        type: string[]
        required: true
      - name: scope_and_non_goals
        type: string
        required: true
      - name: evidence
        type: string
        required: true
      - name: verifier_result
        type: enum
        enum_values: [approved, rejected, needs_revision]
        required: true
      - name: promotion_decision
        type: enum
        enum_values: [create_skill, update_skill, add_constraint, skip]
        required: true

  - name: upstream_guidance_assessment
    type: object
    required: conditional
    condition: "operation == refresh_guidance or (operation in [create, update] and (((authoring is new or materially changed) and a relevant registered assessment has expired) or a relevant source/runtime change is known))"
    description: "Read-only source freshness report when authoring freshness is due or refresh is requested"
    validation: "Preserve the checker-reported status and prior source identity; never infer currentness, adoption, or a source change from dates or retrieval."
    on_fail: "Return the actual report or an explicit unavailable result with prior identity and limits"
    object_fields:
      - name: schema_version
        type: enum
        enum_values: ["1.0"]
        required: false
      - name: checked_at
        type: string
        required: true
      - name: assessment_window_days
        type: int
        required: true
      - name: limits
        type: object
        required: true
      - name: registry_mutated
        type: boolean
        required: true
      - name: results
        type: object[]
        required: true
        object_fields:
          - name: source_id
            type: string
            required: true
          - name: status
            type: enum
            enum_values: [current, review_required, stale, unavailable]
            required: true
          - name: retrieval_state
            type: enum
            enum_values: [complete, partial, unavailable, not_configured]
            required: true
          - name: last_assessed
            type: object
            required: true
          - name: reason
            type: string
            required: true
          - name: candidate_sha256
            type: string
            required: false
          - name: candidate_bytes
            type: int
            required: false
          - name: affected_refs
            type: string[]
            required: false
          - name: difference
            type: object
            required: false

  - name: verification_decision
    type: object
    required: conditional
    condition: "canonical assistant-verification selection is actionable or a verification_decision is carried"
    description: "Canonical selection result carried unchanged when this operation requires check selection"
    validation: "Use assistant-verification/contracts/output.yaml#verification_decision unchanged, including its CheckSpecs, literal argv/cwd, source-bound obligations, and TddChoice; do not select twice or replace its shape"
    on_fail: "Preserve the canonical producer result or report why the selected evidence is blocked"

  - name: evidence_assessment
    type: object
    required: true
    description: "Canonical evidence adequacy result for the selected operation"
    validation: "Use assistant-verification/contracts/output.yaml#evidence_assessment unchanged, including required checks, actual evidence, limits, and claim status"
    on_fail: "Carry the canonical assessment unchanged and leave unsupported claims open"
