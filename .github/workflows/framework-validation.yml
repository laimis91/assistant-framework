name: Framework validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  framework-contracts:
    name: Framework contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/evals/package-lock.json

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install evaluation dependencies
        working-directory: tools/evals
        run: npm ci --ignore-scripts

      - name: Verify runner prerequisites
        run: |
          command -v bash
          command -v git
          command -v jq
          command -v node
          command -v npm
          command -v rg
          command -v rsync
          command -v ruby
          ruby -rjson -ryaml -rbigdecimal -e 'abort "Ruby JSON, Psych/YAML, or BigDecimal unavailable" unless defined?(JSON) && defined?(Psych) && defined?(YAML) && YAML.respond_to?(:load_file) && defined?(BigDecimal)'

      - name: Check response fixture entrypoints
        run: |
          python3 tests/p0-p4/lib/response-fixture-entrypoint-probe.py skill-eval-contracts.sh
          python3 tests/p0-p4/lib/response-fixture-entrypoint-probe.py progressive-discovery-contracts.sh

      - name: Run aggregate framework contracts
        run: ./tests/test-p0-p4-contracts.sh

      - name: Run skill-activation tool tests
        run: ./tests/test-skill-activation-tools.sh

      - name: Validate skills
        run: tools/skills/validate-skills.sh
