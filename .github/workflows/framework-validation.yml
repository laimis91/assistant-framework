name: Framework validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  framework-contracts:
    name: Framework contracts and installs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/evals/package-lock.json

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install evaluation dependencies
        working-directory: tools/evals
        run: npm ci --ignore-scripts

      - name: Verify runner prerequisites
        run: |
          command -v bash
          command -v git
          command -v jq
          command -v node
          command -v npm
          command -v rg
          command -v rsync

      - name: Run aggregate framework contracts
        env:
          P0P4_EXCLUDED_SUITES: skill-eval-contracts.sh progressive-discovery-contracts.sh workflow-architecture-completion-contracts.sh codex-behavioral-eval-contracts.sh
        run: ./tests/test-p0-p4-contracts.sh

      - name: Validate skills
        run: tools/skills/validate-skills.sh

      - name: Verify Unix installer dry-runs
        run: |
          ./install.sh --agent codex --dry-run
          ./install.sh --agent claude --dry-run
          ./install.sh --agent gemini --dry-run

  contract-shards:
    name: Contract shard (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - skill-eval-contracts.sh
          - progressive-discovery-contracts.sh
          - workflow-architecture-completion-contracts.sh
          - codex-behavioral-eval-contracts.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/evals/package-lock.json

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install evaluation dependencies
        working-directory: tools/evals
        run: npm ci --ignore-scripts

      - name: Run long contract shard
        run: bash "tests/p0-p4/${{ matrix.suite }}"
