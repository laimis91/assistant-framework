[project]
name = "csvtidy"
version = "0.7.2"
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.9"]

[project.optional-dependencies]
test = ["pytest>=8", "psycopg[binary]>=3.2", "testcontainers[postgres]>=4.8"]

[project.scripts]
csvtidy = "csvtidy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Docker daemon"]
