# Workflow Input Contract
# All agents (Claude, Codex, Gemini) MUST resolve these fields before entering Triage.
# Fields are extracted from the user's request. If a required field cannot be inferred,
# follow the on_missing action.

schema_version: "11.0"
contract: input
skill: assistant-workflow

fields:
  - name: task_description
    type: string
    required: true
    description: "Outcome."
    validation: "Non-empty concrete action or outcome."
    on_missing: ask
    ask_prompt: "What would you like me to build, fix, or change?"

  - name: task_type
    type: enum
    required: true
    enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
    description: "Type."
    validation: "Must be one of the enum values"
    on_missing: infer
    infer_from: "fix/bug/broken -> bugfix; rewrite/port -> rewrite; migrate/migration -> migration; refactor/clean/reorganize -> refactor; config/setting/env -> config; infra/deploy/lifecycle/install -> infra; security/auth/PII/payment/input validation -> security; docs/readme/document/changelog -> docs; spike/explore/investigate -> spike; else feature. Select the corresponding Task Category Gate Pack."

  - name: execution_intent
    type: enum
    required: false
    enum_values: [prepare_only, implement_only, end_to_end]
    description: "Intent."
    validation: "prepare_only ends at readiness without Build/changed-files; implement_only consumes approved evidence; end_to_end is phased."
    default: end_to_end
    on_missing: infer
    infer_from: "Preparation only -> prepare_only. When a request combines preparation/planning with an affirmative implementation request, use end_to_end unless the user explicitly prohibits implementation. implement_only needs approved packet."

  - name: risk_tier
    type: enum
    required: false
    enum_values: [low, moderate, high, critical]
    description: "Triage risk tier."
    validation: "Must be one of the enum values when present"
    default: null
    on_missing: skip
    infer_from: "Use references/triage-rubric.md during Triage. Escalate for public contracts, data, auth, PII, payments, irreversible changes, weak tests, or behavior-preserving legacy work."

  - name: required_gates
    type: string[]
    required: false
    description: "Triage-selected gates."
    validation: "For execution_intent == prepare_only, required_gates is exactly [feature-preparation evidence] and excludes execution common and task-category gates. Otherwise each entry is a short gate label from references/triage-rubric.md or a clearly justified project-specific gate."
    default: []
    on_missing: skip

  - name: required_agents
    type: string[]
    required: false
    description: "Routing-required roles."
    validation: "Entries are known workflow roles, installed skills, or a justified project role. For execution_intent=prepare_only, required_agents contains only concrete Discover/preparation roles and excludes QA Evaluator, Build, Review, Code Writer, Builder/Tester, and Code Reviewer roles; retain an explicit QA request only in feature_preparation_result.future_qa_acceptance_obligation. For execution_intent != prepare_only, bounded_executor requires one edit/test executor plus independent Code Reviewer responsibility; separated_workers requires Code Writer, Builder/Tester, and independent Code Reviewer responsibilities. Code Mapper, Explorer, and Architect need concrete mapping, lifecycle, or Pack uncertainty; Reviewer may satisfy only compatibility routing. Light low-risk work may keep required_agents empty with validation and fresh review."
    default: []
    on_missing: skip

  - name: subagent_policy_state
    type: enum
    required: false
    enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
    description: "Delegation trigger/fallback status."
    validation: "Must describe the current trigger, opt-out, availability, or exact policy-block state before any subagent dispatch occurs"
    default: not_required
    on_missing: infer
    infer_from: "Use not_required when no role is required. When required_agents is non-empty, use delegation_triggered when a direct user request or applicable AGENTS.md or active skill instruction covers the roles; infer scope without asking. Use delegation_opted_out when the user explicitly declines; use subagents_unavailable only after a real spawn failure or supported configuration proof; use policy_disallowed only when an exact active rule blocks spawning with no applicable trigger exception."

  - name: subagent_execution_mode
    type: enum
    required: false
    enum_values: [delegated, direct_fallback, not_applicable]
    description: "Role execution mode."
    validation: "delegated requires subagent_policy_state=delegation_triggered; direct_fallback requires delegation_opted_out, subagents_unavailable, or policy_disallowed and equivalent evidence; policy_disallowed direct_fallback also requires policy_blocking_source; not_applicable is invalid for Build except controller_intensity=light inline/direct work with no subagent role requirement"
    default: not_applicable
    on_missing: infer
    infer_from: "For controller_intensity=light small low-risk localized source changes, use not_applicable with subagent_policy_state=not_required, direct implementation, relevant automated validation/tests, and fresh self-review evidence. For standard/strict work, if required_agents is empty and no project source/test/docs/config artifact will change, use not_applicable. If standard/strict work changes project source, tests, docs, config, contracts, runtime integrations, or generated project artifacts, not_applicable is invalid for Build; use delegated only when subagent_policy_state=delegation_triggered from a direct user, applicable AGENTS.md, or active skill instruction. Use direct_fallback only for delegation_opted_out, subagents_unavailable after a real spawn failure or supported configuration proof, or policy_disallowed with policy_blocking_source; record equivalent role evidence."

  - name: subagent_trigger_scope
    type: string[]
    required: false
    description: "Delegation trigger provenance."
    validation: "Non-empty when delegation is relevant; records provenance and covered roles/phases/actions, inferred without asking. Empty only when subagent_policy_state=not_required."
    default: []
    on_missing: infer

  - name: policy_blocking_source
    type: string
    required: conditional
    condition: "subagent_policy_state == policy_disallowed"
    description: "Policy preventing delegation."
    validation: "Non-empty; names the blocking rule and confirms why no applicable exception permits delegation. A conditional rule that defers spawning unless the user or applicable AGENTS/skill asks does not make policy_disallowed when the active skill requires subagents."
    on_missing: fail

  - name: scope_hint
    type: enum
    required: false
    enum_values: [small, medium, large, mega]
    description: "Size."
    default: null
    on_missing: skip

  - name: target_files
    type: string[]
    required: false
    description: "Files."
    validation: "Valid relative paths"
    default: []
    on_missing: skip

  - name: constraints
    type: string[]
    required: false
    description: "Constraints."
    validation: "Plain-language constraints only accumulate unless the user explicitly changes them"
    default: []
    on_missing: skip

  - name: tdd_mode
    type: boolean
    required: false
    description: "Defaults true for behavior changes, bugfixes with enough reproduction/root-cause evidence to write a RED test, and interface-affecting refactors."
    default: false
    on_missing: infer
    infer_from: "User says 'TDD', 'tests first', 'red green refactor' -> true; task_type in [feature, bugfix] with behavior change and enough evidence to write a RED test -> true; interface-affecting refactor -> true; unknown-cause bugfix -> run assistant-debugging first, then infer true once failure mechanism is understood; non-behavior docs/config/spike/prototype/generated-code/layout-only work -> false with recorded reason"
    validation: "False is allowed only with an explicit not-feasible or non-behavior exception reason. Unknown-cause bugfixes preserve debugging first, then RED once root cause/failure mechanism is understood."

  - name: debugging_mode
    type: enum
    required: false
    enum_values: [not_applicable, root_cause_unknown, root_cause_known, completed, blocked]
    description: "Bugfix debugging state."
    default: not_applicable
    on_missing: infer
    infer_from: "task_type == bugfix and cause is not already evidenced -> root_cause_unknown; task_type == bugfix with clear reproduction/root-cause evidence -> root_cause_known; non-bugfix -> not_applicable"
    validation: "Unknown-cause bugfixes must not proceed to implementation until debugging_mode is completed or blocked with evidence"

  - name: acceptance_criteria
    type: string[]
    required: false
    description: "Atomic acceptance criteria."
    validation: "Each criterion is atomic, binary (pass/fail), and testable (8-12 words)"
    default: []
    on_missing: skip
    notes: "Do not create criteria independently when requirement_acceptance_map exists. Vague requests are clarified or safely defaulted, then mapped through references/requirement-acceptance-map.md."

  - name: requirement_acceptance_map
    type: object
    required: conditional
    condition: "size in [medium, large, mega] or (progressive_artifact_retention_state != terminally_archived and progressive_route_clear_consumption_state != pending and (architecture_design_mode in [required, review_intensive] or progressive_route_clear_consumption_state == consumed))"
    description: "Accepted requirement traceability."
    validation: "Every accepted requirement has one stable requirement_id, atomic acceptance criterion, verification method, manual scenario or explicit N/A, and a status; exclusions require explicit approval and reason. entries is empty only for a consumed legitimate all-excluded route with route_clear_handoff.decisions=[] and acceptance_seed=[], no accepted requirement, and every source excluded or retired item traced exactly once to a concrete non_goals or approved-exclusion target; never fabricate an acceptance entry. Every consumed route_clear_handoff retired_or_excluded_deferred_uncertainty_refs entry is traced exactly once as a non-goal or approved exclusion."
    on_missing: fail
    object_fields:
      - name: intended_outcome
        type: string
        required: true
        description: "One concise accepted outcome"
        on_missing: fail
      - name: assumptions_and_defaults
        type: string[]
        required: true
        description: "Explicit inferred choices; may be empty"
        on_missing: fail
      - name: open_material_questions
        type: string[]
        required: true
        description: "Empty before Plan unless unresolved questions block progress"
        on_missing: fail
      - name: non_goals
        type: string[]
        required: true
        description: "Explicit exclusions; may be empty"
        on_missing: fail
      - name: source_route_clear_handoff_ref
        type: string
        required: conditional
        condition: "progressive_route_clear_consumption_state == consumed and progressive_artifact_retention_state != terminally_archived"
        description: "Durable source reference to the consumed progressive route-clear handoff"
        validation: "Resolves to the source route_clear_handoff, whose consumed_by_requirement_acceptance_map_ref resolves to this consuming Requirement Acceptance Map; together they validate the reciprocal back-reference rather than equal values. The handoff decisions and constraints are traced into applicable accepted map state; exclusions appear in non_goals or entries with status=approved_exclusion; every retired_or_excluded_deferred_uncertainty_refs entry is bound exactly once by retired_or_excluded_deferred_uncertainty_traces to a concrete non_goals element or entries element with status=approved_exclusion; and each acceptance_seed becomes an entries[].acceptance_criterion with binary acceptance."
        on_missing: fail
      - name: retired_or_excluded_deferred_uncertainty_traces
        type: object[]
        required: conditional
        condition: "progressive_route_clear_consumption_state == consumed and progressive_artifact_retention_state != terminally_archived"
        min_items: 0
        validation: "Binds every source route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs ref exactly once to a concrete consuming target. Empty only when the source collection is empty; no unknown, duplicate, or wrong-disposition source ref is allowed."
        object_fields:
          - name: source_retired_or_excluded_deferred_uncertainty_ref
            type: string
            required: true
            validation: "Resolves exactly once to one source route_clear_handoff.retired_or_excluded_deferred_uncertainty_refs entry"
          - name: target_disposition
            type: enum
            required: true
            enum_values: [non_goal, approved_exclusion]
          - name: target_ref
            type: string
            required: true
            validation: "Resolves to the concrete non_goals element for non_goal or entries element with status=approved_exclusion for approved_exclusion"
      - name: entries
        type: object[]
        required: true
        min_items: 0
        validation: "Non-empty when any accepted requirement, source route_clear_handoff decision, or acceptance_seed exists. Empty only for the exact all-excluded route whose source decisions and acceptance_seed are empty and whose excluded or retired lineage is traced exactly once to concrete non_goals or approved-exclusion targets."
        on_missing: fail
        object_fields:
          - name: requirement_id
            type: string
            required: true
            description: "Stable identifier unique within the task"
            on_missing: fail
          - name: source
            type: string
            required: true
            description: "User request, accepted default, policy, or local contract source"
            on_missing: fail
          - name: requirement
            type: string
            required: true
            description: "Atomic accepted requirement"
            on_missing: fail
          - name: acceptance_criterion
            type: string
            required: true
            description: "Binary pass/fail criterion proving the requirement"
            on_missing: fail
          - name: verification_method
            type: string
            required: true
            description: "Test, command, inspection, review, or manual verification method"
            on_missing: fail
          - name: evidence_ref
            type: string
            required: true
            description: "Pending marker or stable verification evidence reference"
            on_missing: fail
          - name: manual_scenario_or_na
            type: string
            required: true
            description: "Developer test scenario or explicit N/A with reason"
            on_missing: fail
          - name: status
            type: enum
            required: true
            enum_values: [pending, passed, failed, approved_exclusion]
            description: "Current traceability status"
            on_missing: fail
          - name: exclusion_reason
            type: string
            required: conditional
            condition: "status == approved_exclusion"
            description: "User-approved reason the requirement is excluded"
            on_missing: fail

  - name: harness_capable
    type: boolean
    required: false
    description: "Whether task uses harness; ordinary medium+ workflow tasks default to false, including source-changing workflow tasks."
    validation: "Default false. True only for explicitly requested harness work; long-running or trace/replay-ready multi-slice; high-risk harness; domain-scored work or UI/visual/product/UX/docs/DX-facing work; or accepted Done Contract/Harness Recipe. In prepare_only QA/acceptance alone never makes it true; require independent evidence. Do not infer true from size=medium+, delegation alone, or ordinary source-changing work."
    default: false
    on_missing: infer
    infer_from: "Listed harness evidence -> true; otherwise false, never size, delegation, ordinary source changes, or prepare_only QA alone."

  - name: build_execution_lane
    type: enum
    required: false
    enum_values: [inline_direct, bounded_executor, separated_workers]
    description: "Build lane."
    default: bounded_executor
    on_missing: infer
    infer_from: "For execution_intent == prepare_only, use inline_direct; otherwise light local -> inline_direct, ordinary medium -> bounded_executor, separated_workers only for high/critical, broad/noisy, environment-heavy, independent TDD, or explicit separation."
    validation: "For execution_intent == prepare_only, inline_direct records no Build lane. Size alone never requires separated_workers; bounded_executor records RED, focused GREEN/regression, and independent Code Reviewer evidence."

  - name: plan_mode
    type: enum
    required: false
    enum_values: [none, inline, approval_required]
    description: "requires explicit plan approval before implementation work; prepare_only readiness never waits for implementation approval."
    validation: "prepare_only at any size uses none unless explicit readiness plan; approval_required then covers only it. For execution_intent != prepare_only, approval_required applies to medium+/risk/policy/scope/explicit; none trivial-safe, inline bounded-small."
    default: none
    on_missing: infer
    infer_from: "prepare_only -> none; approval_required only for explicit readiness. For execution_intent != prepare_only, approval_required applies to medium+/triggers; inline bounded-small."

  - name: controller_intensity
    type: enum
    required: false
    enum_values: [light, standard, strict]
    description: "Controller intensity."
    validation: "light small/low-risk; standard ordinary medium+ with harness_capable == false and qa_evaluation_mode == not_required; strict only high/critical, harness_capable == true, qa_evaluation_mode == required, explicit harness/QA acceptance work, or trace/replay; never generic acceptance."
    default: standard
    on_missing: infer
    infer_from: "light small/low-risk; standard ordinary medium+ with harness_capable == false and qa_evaluation_mode == not_required. For execution_intent != prepare_only, strict only high/critical, harness_capable == true, qa_evaluation_mode == required, explicit harness/QA acceptance work, or trace/replay. Do not infer strict from size=medium+ or delegation alone, or generic acceptance. In prepare_only, risk/project criteria may still select strict preparation; QA request alone never promotes strict and remains future_qa_acceptance_obligation."

  - name: workflow_state_mode
    type: enum
    required: false
    enum_values: [inline, journal]
    description: "State storage mode."
    validation: "For uncertainty_shape == progressive, journal only when local state artifacts are configured and policy allows them; unavailable/policy-disallowed progressive state uses equivalent carried-state fallback inline, including prepare_only. Ordinary inline requires uncertainty_shape == bounded absent clarification wait, delegated workflow roles during execution, cross-session/compaction continuation, explicit persisted state, controller_intensity == strict, harness_capable == true, or execution_intent != prepare_only and qa_evaluation_mode == required; those require journal. Size alone never requires journal."
    default: inline
    on_missing: infer
    infer_from: "For uncertainty_shape == progressive, journal only when local state artifacts are configured and policy allows them; unavailable/policy-disallowed progressive state uses equivalent carried-state fallback inline, including prepare_only. Otherwise inline requires uncertainty_shape == bounded absent clarification wait, delegated workflow roles during execution, cross-session/compaction continuation, explicit persisted state, controller_intensity == strict, harness_capable == true, or execution_intent != prepare_only and qa_evaluation_mode == required; those require journal. Size alone never requires journal."

  - name: manual_verification_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "Manual verification."
    validation: "required only for explicit manual, subjective/UI, unprovable external, destructive/migration, or inadequate automation; never size/intensity/ritual."
    default: not_required
    on_missing: infer
    infer_from: "required for explicit manual, subjective/UI, unprovable external, destructive or migration-related, or inadequate automation; optional when helpful; else not_required."

  - name: qa_evaluation_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "QA mode."
    validation: "prepare_only -> not_required plus feature_preparation_result.future_qa_acceptance_obligation. Use required when the user explicitly requests QA/acceptance evaluation or harness_capable == true and acceptance evaluation is in scope. QA required positive triggers: explicit QA/acceptance evaluation request, accepted Done Contract, harness-capable acceptance scope, domain-scored scope, or scoped UI/visual/product/UX/docs/DX acceptance. QA non-triggers: template labels/placeholders, generic acceptance criteria labels, optional/not_required reasons, delegation/source-changing work alone, and ordinary medium+ code-review-only/source-changing work. Use not_required for ordinary medium+ code-review-only/source-changing work."
    default: not_required
    on_missing: infer
    infer_from: "prepare_only -> not_required plus feature_preparation_result.future_qa_acceptance_obligation; otherwise validation triggers -> required, helpful -> optional, else not_required."

  - name: search_mode
    type: enum
    required: false
    enum_values: [none, lightweight, candidate_search]
    description: "Candidate-search mode."
    validation: "Must be one of: none, lightweight, candidate_search. candidate_search triggers only for explicit alternatives, open-ended architecture/design, optimization, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots."
    default: none
    on_missing: infer
    infer_from: "Use candidate_search for explicit alternatives, open-ended architecture/design, optimization-heavy work, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots; use lightweight for ordinary tasks with 1-3 obvious options; otherwise none."

  - name: architecture_design_mode
    type: enum
    required: false
    enum_values: [not_applicable, lightweight, required, review_intensive]
    description: "Architecture mode."
    validation: "not_applicable needs concrete one-path reason and is invalid for extension seam/material extensibility. lightweight records bounded decision. required covers new/cross-boundary/public/persistent/material-quality-extensibility/extension-seam/viable-design work; review_intensive adds challenge. Size never triggers it."
    default: not_applicable
    on_missing: infer
    infer_from: "required for new/cross-boundary/public/persistent/material quality-extensibility/extension-seam/viable-design work; lightweight bounded decision; review_intensive high-risk/conflict; else not_applicable with reason."

  - name: architecture_design_trigger_reasons
    type: string[]
    required: true
    min_items: 1
    description: "Architecture trigger rationale."
    validation: "Non-empty. Observed trigger/rationale: cross-boundary contract, data lifecycle, resource/quality target, extension seam, material extensibility, viable alternative, or conflicting driver; when architecture_design_mode=not_applicable, record the concrete evidenced local-path reason."
    on_missing: infer
    infer_from: "Derive from the request and candidate scope scan; record only triggers supported by local or user evidence. Concrete reason required even when architecture_design_mode=not_applicable."

  - name: candidate_search_goal
    type: string
    required: false
    description: "Candidate-search objective."
    validation: "Derived from acceptance criteria and slice acceptance/verification criteria; must not create a second source of truth."
    default: null
    on_missing: skip

  - name: candidate_search_constraints
    type: string[]
    required: false
    description: "Candidate constraints/non-goals."
    validation: "Each entry must come from user constraints, approved plan boundaries, policy constraints, or discovered project constraints."
    default: []
    on_missing: skip

  - name: uncertainty_shape
    type: enum
    required: false
    enum_values: [bounded, progressive]
    description: "Outcome uncertainty shape."
    validation: "bounded is the default. Use progressive only when a not-yet-precise outcome-shaping unknown is unlocked by a predecessor; fully specified tasks remain bounded, and size alone is not a trigger."
    default: bounded
    on_missing: infer
    infer_from: "Use bounded unless an outcome-shaping unknown cannot yet be stated precisely and a predecessor decision will unlock it."

  - name: progressive_discovery_state
    type: enum
    required: false
    enum_values: [not_applicable, mapping, resolving, route_clear, blocked]
    description: "Current typed state for progressive Discover decision work"
    validation: "not_applicable requires uncertainty_shape=bounded. mapping, resolving, route_clear, and blocked require uncertainty_shape=progressive."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable for bounded uncertainty. For progressive uncertainty, use mapping until a decision map exists, resolving while the frontier has work, route_clear when the route can return to bounded Discover, or blocked when the next required decision cannot proceed."

  - name: progressive_route_clear_consumption_state
    type: enum
    required: false
    enum_values: [not_applicable, pending, consumed]
    description: "Durable state for Requirement Acceptance Map consumption of a progressive route-clear handoff"
    validation: "not_applicable applies to ordinary bounded work with no route_clear_handoff. pending mirrors route_clear_handoff.consumption_state=pending while progressive route_clear prepares the map. consumed requires reciprocal map consumption and remains consumed after the bounded/not_applicable transition. While progressive_artifact_retention_state=retained, the consumed marker keeps requirement_acceptance_map and its reciprocal refs required; terminally_archived may release those progressive artifacts without rewriting consumed history."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable for ordinary bounded/no-handoff work. Use pending when route_clear_handoff.consumption_state=pending. Use consumed only after requirement_acceptance_map.source_route_clear_handoff_ref and route_clear_handoff.consumed_by_requirement_acceptance_map_ref form reciprocal map consumption; retain consumed as historical lifecycle state after the atomic bounded/not_applicable transition and terminal archival."

  - name: progressive_sequence_readiness_state
    type: enum
    required: false
    enum_values: [not_applicable, active, closed]
    description: "External lifecycle applicability for one progressive decision-map sequence readiness record"
    validation: "not_applicable applies before a second progressive activation and to ordinary bounded or generic loops. Set active atomically with loop_readiness_assessment before the second activation; while active, retain the same readiness_assessment_id, progressive_decision_map_ref, immutable cap, and cumulative activation/resolution history through pause, blocked state, compaction, continuation, route-clear preparation, third+ activation proposals, and durable route-clear consumption. Only then set closed. After progressive_sequence_readiness_state becomes closed, progressive_artifact_retention_state=retained keeps the same record while the task remains active/resumable or compacts; only terminally_archived after explicit final archival/termination permits omission. Closed is terminal for the same decision map and cannot reopen or reset its record."
    default: not_applicable
    on_missing: infer
    infer_from: "Use not_applicable unless a progressive decision sequence has reached its second activation. Set active atomically with the existing readiness assessment before that activation and retain it through durable route-clear consumption. Then set closed; after it becomes closed, retain the same record while progressive_artifact_retention_state=retained. terminally_archived permits omission only after explicit final archival/termination makes continuation impossible. Never reopen or reset closed for the same decision map."

  - name: progressive_artifact_retention_state
    type: enum
    required: false
    enum_values: [not_applicable, retained, terminally_archived]
    description: "Typed lifecycle for durable progressive artifacts carried after live progressive Discover ends"
    validation: "not_applicable applies when no durable progressive artifact chain exists. retained is required while durable markers are pending/consumed or active/closed and continuation or reference resolution remains possible, and keeps every durable reference resolvable during active/resumable work. terminally_archived requires explicit final archival/termination evidence that continuation and reference resolution are impossible; progressive_terminal_archival must be present before terminally_archived state is persisted or resumed, with exact current_task_identity and final_progressive_decision_map_ref plus a typed basis and resolvable evidence_refs; dangling or unresolved evidence_refs fail closed. It requires one atomic transition with uncertainty_shape=bounded and progressive_discovery_state=not_applicable. Task state: completed does not qualify by itself. terminally_archived is invalid while route-clear consumption is pending or sequence readiness is active, is terminal, and cannot revert to retained for the same task and decision map."
    default: not_applicable
    on_missing: infer
    infer_from: "Use retained whenever either durable progressive marker requires resumable artifacts and no final archival evidence applies. Use terminally_archived only as one atomic transition with uncertainty_shape=bounded and progressive_discovery_state=not_applicable when progressive_terminal_archival is already present and its task identity, final map identity, typed basis, and every evidence_ref resolve exactly. Never infer terminally_archived from Task state: completed or generic archival evidence."

  - name: clarification_status
    type: enum
    required: true
    enum_values: [ready, needs_clarification]
    description: "Whether Discover is clear to continue or is waiting on explicit clarification about implementation-shaping fields"
    validation: "ready requires zero unresolved clarification topics and every implementation-shaping field is explicit or defaulted. needs_clarification requires at least one unresolved clarification topic."
    on_missing: infer
    infer_from: "If any implementation-shaping field that affects files, behavior, interfaces, data shape, rollout, or verification is still unresolved, set to needs_clarification and add a deterministic topic label. Set to ready only when each such field is explicit or has an explicit default."

  - name: clarification_confidence
    type: enum
    required: false
    enum_values: [low, medium, high]
    description: "Confidence that prompt plus discovered code/context is sufficient to plan safely"
    validation: "high means no blocking implementation-shaping ambiguity remains. low requires needs_clarification unless the task is explicitly read-only."
    default: medium
    on_missing: skip

  - name: clarification_questions_asked
    type: int
    required: false
    description: "Number of clarification questions asked during Discover"
    validation: "Must be zero or greater. May be zero for any task size when prompt plus code/context are sufficiently clear."
    default: 0
    on_missing: skip

  - name: clarification_admissibility
    type: enum
    required: false
    enum_values: [satisfied, needs_clarification, not_applicable]
    description: "Whether any asked clarification questions pass the admissibility test"
    validation: "satisfied means every asked question affects correctness/scope/behavior/security/verification, cannot be discovered from code/context, lacks a safe default, and states risk if guessed."
    default: not_applicable
    on_missing: skip

  - name: unresolved_clarification_topics
    type: string[]
    required: true
    description: "Deterministic short labels for unanswered topics that block planning"
    validation: "List every unresolved implementation-shaping field with one deterministic short label. Empty when clarification_status=ready. Non-empty when clarification_status=needs_clarification."
    default: []
    on_missing: skip
    examples:
      - "target subsystem"
      - "default behavior"
      - "migration strategy"

  - name: clarification_defaults_applied
    type: boolean
    required: true
    description: "Whether Discover automatically applied at least one deterministic safe default and recorded its source and rationale without asking"
    validation: "Must be true when clarification_defaults contains one or more automatically applied safe defaults and false when it is empty. Safe-default application never waits for a user reply. An explicit `defaults` reply remains compatibility shorthand for accepting displayed recommendations on questions that had no deterministic safe default; it is recorded as a user answer, not an automatically applied safe default."
    default: false
    on_missing: skip
    notes: "Do not set true merely because a user replied `defaults`; tie it to clarification_defaults evidence."

  - name: clarification_defaults
    type: object[]
    required: true
    description: "Deterministic safe defaults applied automatically during Discover"
    validation: "Each entry records one implementation-shaping topic, chosen value, discoverable source, and concrete rationale. Empty only when no safe default was applied."
    default: []
    on_missing: skip
    object_fields:
      - name: topic
        type: string
        required: true
      - name: value
        type: string
        required: true
      - name: source
        type: string
        required: true
        description: "User instruction, repository evidence, active policy, or stable local convention supporting the default"
      - name: rationale
        type: string
        required: true
        description: "Why this value is safe, reversible, and does not materially change scope"

  - name: feature_preparation_scope
    type: enum
    required: false
    enum_values: [not_applicable, existing_system]
    description: "Whether the task prepares a feature against behavior already implemented in the repository"
    validation: "existing_system is required for prepare_only or end_to_end feature/spike work that can affect an existing user-visible route, scope, selection, highlight, focus, side effect, or compatibility behavior. For implement_only, carry existing_system when the approved packet was prepared against such behavior."
    default: not_applicable
    on_missing: infer
    infer_from: "Use existing_system when technical preparation concerns an existing repository behavior or route. Otherwise use not_applicable."

  - name: approved_feature_preparation_evidence_ref
    type: string
    required: conditional
    condition: "execution_intent == implement_only and feature_preparation_scope == existing_system"
    description: "Approved canonical evidence reference consumed by implementation-only work against existing behavior"
    validation: "Must resolve to the stable identity of a complete feature_preparation_evidence artifact whose current revision and scope cover the implementation packet; carry that identity unchanged, do not reconstruct missing evidence or downgrade it to a Product question."
    on_missing: fail

# Validation behavior:
# 1. Resolve all required fields before entering Triage. Exact phase markers are conditional on strict intensity, explicit project policy, or user request.
# 2. If on_missing=ask: group and present every material, non-discoverable question, then wait for the answers
# 3. If on_missing=infer: state the inference ("I'm treating this as a feature task")
# 4. If on_missing=skip: proceed with default value
# 5. Clarification has no numeric cap or quota. Ask every admissible material question, grouped by topic; never ask a ritual question because of task size.
# 6. Apply deterministic safe defaults immediately, record source/rationale, and set clarification_defaults_applied=true. If clarification_status=needs_clarification, carry only topics with no safe default into Discover and stop for explicit answers; `defaults` remains an acceptance shorthand for displayed recommendations.
# 7. Log resolved input as: >> Input: {task_type} | scope: {scope_hint or "auto"} | constraints: {count}
