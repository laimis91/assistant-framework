# Workflow Input Contract
# All agents (Claude, Codex, Gemini) MUST resolve these fields before entering Triage.
# Fields are extracted from the user's request. If a required field cannot be inferred,
# follow the on_missing action.

schema_version: "3.0"
contract: input
skill: assistant-workflow

fields:
  - name: task_description
    type: string
    required: true
    description: "What to build, fix, refactor, or investigate"
    validation: "Non-empty string. Must describe a concrete action or desired outcome."
    on_missing: ask
    ask_prompt: "What would you like me to build, fix, or change?"

  - name: task_type
    type: enum
    required: true
    enum_values: [feature, bugfix, refactor, migration, rewrite, config, infra, security, docs, spike]
    description: "Category of work — drives which task-category gate packs and prompt packs load"
    validation: "Must be one of the enum values"
    on_missing: infer
    infer_from: "task_description keywords: 'fix/bug/broken' -> bugfix, 'rewrite/port' -> rewrite, 'migrate/migration' -> migration, 'refactor/clean/reorganize' -> refactor, 'config/setting/env' -> config, 'infra/deploy/lifecycle/install' -> infra, 'security/auth/PII/payment/input validation' -> security, 'docs/readme/document/changelog' -> docs, 'spike/explore/investigate' -> spike, else -> feature"

  - name: risk_tier
    type: enum
    required: false
    enum_values: [low, moderate, high, critical]
    description: "Triage risk tier inferred during Triage from impact, uncertainty, reversibility, and affected boundaries"
    validation: "Must be one of the enum values when present"
    default: null
    on_missing: skip
    infer_from: "Use references/triage-rubric.md during Triage. Escalate for public contracts, data, auth, PII, payments, irreversible changes, weak tests, or behavior-preserving legacy work."

  - name: required_gates
    type: string[]
    required: false
    description: "Gate names selected during Triage from the common gates and task-category gate packs"
    validation: "Each entry is a short gate label from references/triage-rubric.md or a clearly justified project-specific gate"
    default: []
    on_missing: skip

  - name: required_agents
    type: string[]
    required: false
    description: "Agent or skill roles required by size, task type, and risk tier"
    validation: "Entries must be known workflow roles or installed skills, or state a clear project-specific role. For standard/strict source changes, bounded_executor requires one edit/test executor plus independent Code Reviewer responsibility; separated_workers requires Code Writer, Builder/Tester, and independent Code Reviewer responsibilities. Separated role names remain Code Writer, Builder/Tester, and Code Reviewer. Reviewer may satisfy only compatibility routing for existing/legacy handoffs. Light small low-risk work may keep required_agents empty and execute inline/direct when it records relevant validation and a fresh review."
    default: []
    on_missing: skip

  - name: subagent_policy_state
    type: enum
    required: false
    enum_values: [not_required, authorization_required, delegation_authorized, authorization_denied, subagents_unavailable, policy_disallowed]
    description: "Whether subagent spawning is allowed for this task under the active adapter and user/tool policy"
    validation: "Must describe the current authorization or availability state before any subagent dispatch occurs"
    default: not_required
    on_missing: infer
    infer_from: "Use not_required for controller_intensity=light inline/direct work. When required_agents is non-empty and no explicit delegation approval or denial exists, use authorization_required for standard/strict development work that needs workflow subagent roles unless the prompt already authorizes them. Plan approval is not delegation approval. Use delegation_authorized only after explicit approval, authorization_denied when declined, subagents_unavailable only after a real spawn failure, and policy_disallowed only when an exact active rule blocks spawning with no applicable user, AGENTS, or skill exception."

  - name: subagent_execution_mode
    type: enum
    required: false
    enum_values: [delegated, direct_fallback, not_applicable]
    description: "How role responsibilities will be executed for this task"
    validation: "delegated requires subagent_policy_state=delegation_authorized; direct_fallback requires authorization_denied, subagents_unavailable, or policy_disallowed and equivalent evidence; policy_disallowed direct_fallback also requires policy_blocking_source; not_applicable is invalid for Build except controller_intensity=light inline/direct work with no subagent role requirement"
    default: not_applicable
    on_missing: infer
    infer_from: "For controller_intensity=light small low-risk localized source changes, use not_applicable with subagent_policy_state=not_required, direct implementation, relevant automated validation/tests, and fresh self-review evidence. For standard/strict work, if required_agents is empty and no project source/test/docs/config artifact will change, use not_applicable. If standard/strict work changes project source, tests, docs, config, contracts, runtime integrations, or generated project artifacts, not_applicable is invalid for Build; use delegated only when subagent_policy_state is delegation_authorized after explicit user authorization or when the current user prompt explicitly asked for agents/subagents. If authorization_required has not been resolved, ask and wait before continuing phases that require subagents; do not select direct_fallback unless the user denies authorization, subagents are unavailable after a real spawn failure, or policy disallows spawning. If authorization is denied, subagents are unavailable after a real spawn failure, or policy disallows spawning, use direct_fallback and record direct fallback evidence."

  - name: subagent_authorization_scope
    type: string[]
    required: false
    description: "Roles, phases, or actions covered by explicit user authorization for subagent spawning"
    validation: "Empty when no authorization was needed or granted. Non-empty when subagent_policy_state=delegation_authorized."
    default: []
    on_missing: skip

  - name: policy_blocking_source
    type: string
    required: conditional
    condition: "subagent_policy_state == policy_disallowed"
    description: "Exact active rule that blocks spawning after confirming no applicable user, AGENTS, or skill exception"
    validation: "Non-empty; names the blocking rule and confirms why no applicable exception permits delegation. A conditional rule that defers spawning unless the user or applicable AGENTS/skill asks does not make policy_disallowed when the active skill requires subagents."
    on_missing: fail

  - name: scope_hint
    type: enum
    required: false
    enum_values: [small, medium, large, mega]
    description: "User-provided size estimate. Triage may override."
    default: null
    on_missing: skip

  - name: target_files
    type: string[]
    required: false
    description: "Specific files the user wants changed"
    validation: "Each entry must be a valid relative file path"
    default: []
    on_missing: skip

  - name: constraints
    type: string[]
    required: false
    description: "Boundaries the agent must not cross"
    validation: "Each entry is a plain-language constraint. Constraints only accumulate — never remove without explicit user instruction."
    default: []
    on_missing: skip
    examples:
      - "Don't touch ProjectA"
      - "Stay on .NET 8"
      - "No new NuGet packages"
      - "Backend only, no UI"

  - name: tdd_mode
    type: boolean
    required: false
    description: "Whether workflow enforces tests-first Red-Green-Refactor via assistant-tdd. Defaults true for behavior changes, bugfixes with enough reproduction/root-cause evidence to write a RED test, and interface-affecting refactors unless a not-feasible exception is recorded."
    default: false
    on_missing: infer
    infer_from: "User says 'TDD', 'tests first', 'red green refactor' -> true; task_type in [feature, bugfix] with behavior change and enough evidence to write a RED test -> true; interface-affecting refactor -> true; unknown-cause bugfix -> run assistant-debugging first, then infer true once failure mechanism is understood; non-behavior docs/config/spike/prototype/generated-code/layout-only work -> false with recorded reason"
    validation: "False is allowed only with an explicit not-feasible or non-behavior exception reason. Unknown-cause bugfixes preserve debugging first, then RED once root cause/failure mechanism is understood."

  - name: debugging_mode
    type: enum
    required: false
    enum_values: [not_applicable, root_cause_unknown, root_cause_known, completed, blocked]
    description: "Whether assistant-debugging must run before bugfix implementation/TDD"
    default: not_applicable
    on_missing: infer
    infer_from: "task_type == bugfix and cause is not already evidenced -> root_cause_unknown; task_type == bugfix with clear reproduction/root-cause evidence -> root_cause_known; non-bugfix -> not_applicable"
    validation: "Unknown-cause bugfixes must not proceed to implementation until debugging_mode is completed or blocked with evidence"

  - name: acceptance_criteria
    type: string[]
    required: false
    description: "Compatibility list of atomic success criteria derived from requirement_acceptance_map when present"
    validation: "Each criterion is atomic, binary (pass/fail), and testable (8-12 words)"
    default: []
    on_missing: skip
    notes: "Do not create criteria independently when requirement_acceptance_map exists. Vague requests are clarified or safely defaulted, then mapped through references/requirement-acceptance-map.md."

  - name: requirement_acceptance_map
    type: object
    required: conditional
    condition: "size in [medium, large, mega]"
    description: "Stable requirement-to-evidence traceability created after material clarification and consumed by slices, review, and completion"
    validation: "Every accepted requirement has one stable requirement_id, atomic acceptance criterion, verification method, manual scenario or explicit N/A, and a status; exclusions require explicit approval and reason"
    on_missing: fail
    object_fields:
      - name: intended_outcome
        type: string
        required: true
        description: "One concise accepted outcome"
        on_missing: fail
      - name: assumptions_and_defaults
        type: string[]
        required: true
        description: "Explicit inferred choices; may be empty"
        on_missing: fail
      - name: open_material_questions
        type: string[]
        required: true
        description: "Empty before Plan unless unresolved questions block progress"
        on_missing: fail
      - name: non_goals
        type: string[]
        required: true
        description: "Explicit exclusions; may be empty"
        on_missing: fail
      - name: entries
        type: object[]
        required: true
        min_items: 1
        on_missing: fail
        object_fields:
          - name: requirement_id
            type: string
            required: true
            description: "Stable identifier unique within the task"
            on_missing: fail
          - name: source
            type: string
            required: true
            description: "User request, accepted default, policy, or local contract source"
            on_missing: fail
          - name: requirement
            type: string
            required: true
            description: "Atomic accepted requirement"
            on_missing: fail
          - name: acceptance_criterion
            type: string
            required: true
            description: "Binary pass/fail criterion proving the requirement"
            on_missing: fail
          - name: verification_method
            type: string
            required: true
            description: "Test, command, inspection, review, or manual verification method"
            on_missing: fail
          - name: evidence_ref
            type: string
            required: true
            description: "Pending marker or stable verification evidence reference"
            on_missing: fail
          - name: manual_scenario_or_na
            type: string
            required: true
            description: "Developer test scenario or explicit N/A with reason"
            on_missing: fail
          - name: status
            type: enum
            required: true
            enum_values: [pending, passed, failed, approved_exclusion]
            description: "Current traceability status"
            on_missing: fail
          - name: exclusion_reason
            type: string
            required: conditional
            condition: "status == approved_exclusion"
            description: "User-approved reason the requirement is excluded"
            on_missing: fail

  - name: harness_capable
    type: boolean
    required: false
    description: "Whether the task is scoped into the harness controller; ordinary medium+ workflow tasks default to false."
    validation: "False by default. True only for explicitly requested harness work, long-running work, trace/replay-ready multi-slice work, high-risk harness work, domain-scored work, UI/visual/product/UX/docs/DX-facing work, or accepted Done Contract/Harness Recipe presence."
    default: false
    on_missing: infer
    infer_from: >
      Default false. Set true only when the user or approved plan explicitly requests harness work,
      the work is long-running, trace/replay-ready multi-slice work, high-risk harness work,
      domain-scored, UI/visual/product/UX/docs/DX-facing, or already has an accepted Done Contract
      or Harness Recipe. Do not infer true from size=medium+, delegation alone, or ordinary
      source-changing workflow tasks.

  - name: build_execution_lane
    type: enum
    required: false
    enum_values: [inline_direct, bounded_executor, separated_workers]
    description: "Ownership shape for the Build edit/test loop"
    default: bounded_executor
    on_missing: infer
    infer_from: "light localized work -> inline_direct; ordinary medium standard-risk work -> bounded_executor; high/critical risk, broad or noisy verification, environment-heavy validation, independent TDD evidence, or explicit separation -> separated_workers"
    validation: "Size alone does not require separated_workers. bounded_executor still records valid RED before production code, focused GREEN/regression verification, and independent Code Reviewer evidence."

  - name: plan_mode
    type: enum
    required: false
    enum_values: [none, inline, approval_required]
    description: "Whether this task skips a separate Plan phase, records a compact no-wait plan, or waits for explicit plan approval"
    validation: "none is allowed only for trivial, localized, reversible, low-risk work with one obvious implementation path, known files, known verification, no material ambiguity, and no public contract/data/security/destructive effect. inline is limited to bounded small work with no approval trigger. approval_required is mandatory for medium+, high/critical risk, destructive work, public contract/data/security changes, material architecture or scope choices, repository policy, or an explicit user request."
    default: none
    on_missing: infer
    infer_from: "Use approval_required for medium+ or any approval trigger. Use inline for small work that benefits from multiple recorded steps but has no approval trigger. Use none only when the next safe edit and verification are obvious after Discover."

  - name: controller_intensity
    type: enum
    required: false
    enum_values: [light, standard, strict]
    description: "Completion/gate intensity selected during Triage; maps onto existing completion_tiers and gate_tiers."
    validation: "light uses small/low-risk guidance, standard uses ordinary medium+ completion/review without harness/QA defaults, and strict uses strict gates or harness/QA artifacts only when their existing conditions apply."
    default: standard
    on_missing: infer
    infer_from: >
      Use light for small low-risk localized work. Use standard for ordinary medium+
      source-changing work, including delegated work, when harness_capable == false
      and qa_evaluation_mode == not_required. Use strict only for high/critical risk,
      harness_capable == true, qa_evaluation_mode == required,
      explicit harness/QA acceptance work, or trace/replay-ready work. Do not infer
      strict from size=medium+ or delegation alone.

  - name: workflow_state_mode
    type: enum
    required: false
    enum_values: [inline, journal]
    description: "Whether workflow state stays in the current response/plan packet or is persisted in the durable task journal."
    validation: "inline is valid for light work and standard work that does not need persistence. journal is required when clarification wait, delegation, cross-session continuation, explicit state persistence, strict control, harness artifacts, or required QA needs durable state. Size alone does not require journal mode."
    default: inline
    on_missing: infer
    infer_from: >
      Use journal when the task enters clarification wait, uses delegated workflow roles,
      is expected to cross sessions or compaction boundaries, explicitly requests persisted
      workflow state, uses controller_intensity == strict, harness_capable == true, or
      qa_evaluation_mode == required. Otherwise use inline, including small low-risk work and
      ordinary standard work whose approved plan and evidence fit safely in the active packet.

  - name: manual_verification_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "Whether completion needs a manual acceptance check after automated Build and Review evidence."
    validation: "required only for an explicit user request, subjective or UI acceptance, external effects that cannot be proven locally, destructive or migration work, or inadequate automated verification. Task size, controller intensity, and user confirmation rituals alone do not make manual verification required."
    default: not_required
    on_missing: infer
    infer_from: >
      Use required only when the user explicitly asks to test or confirm the result manually,
      acceptance is subjective or UI-facing, the change has external effects that local checks
      cannot prove, the work is destructive or migration-related, or automated verification is
      inadequate. Use optional when helpful manual checks exist but automated verification is
      sufficient. Otherwise use not_required.

  - name: learning_capture_mode
    type: enum
    required: false
    enum_values: [auto, not_required, required]
    description: "Whether Document must run the Learning Controller and consider durable reflexion/memory capture; journal mode also records the canonical Learning evidence signals ledger."
    validation: "normal work MUST use auto. required means the user or approved plan explicitly requested learning capture. auto requires the Learning Controller only when concrete lesson-bearing evidence exists in review findings, build/test failures, user corrections, or memory trend signals. not_required is valid only with a policy_disallowed: or explicit_exclusion: reason."
    default: auto
    on_missing: infer
    infer_from: >
      Use required when the user or approved plan explicitly requests reflection, learning, or
      durable memory capture. Use auto for normal work so concrete review findings, build/test
      failures, user corrections, or memory trend signals activate the Learning Controller.
      Use not_required only when policy disallows learning capture or the task is explicitly excluded,
      and prefix the concrete rationale with policy_disallowed: or explicit_exclusion:.

  - name: qa_evaluation_mode
    type: enum
    required: false
    enum_values: [not_required, optional, required]
    description: "Whether Review phase should run the independent QA Evaluator acceptance loop after build/test and code-review evidence"
    validation: "QA required positive triggers: explicit QA/acceptance evaluation request, accepted Done Contract, harness-capable acceptance scope, domain-scored scope, or scoped UI/visual/product/UX/docs/DX acceptance. QA non-triggers: template labels/placeholders, generic acceptance criteria labels, optional/not_required reasons, delegation/source-changing work alone, and ordinary medium+ code-review-only/source-changing work."
    default: not_required
    on_missing: infer
    infer_from: >
      Use required only for QA required positive triggers: explicit QA/acceptance evaluation request,
      accepted Done Contract, harness-capable acceptance scope, domain-scored scope, or scoped
      UI/visual/product/UX/docs/DX acceptance.
      Use required when the user explicitly requests QA/acceptance evaluation, the task has an
      accepted Done Contract, harness_capable == true and acceptance evaluation is in scope, the task
      is domain-scored, or scoped UI/visual/product/UX/docs/DX acceptance applies.
      QA non-triggers: template labels/placeholders, generic acceptance criteria labels,
      optional/not_required reasons, delegation/source-changing work alone, and ordinary medium+
      code-review-only/source-changing work.
      Use optional when acceptance material exists but QA is not required.
      Use not_required for ordinary medium+ code-review-only/source-changing work with no separate
      acceptance evidence need.

  - name: search_mode
    type: enum
    required: false
    enum_values: [none, lightweight, candidate_search]
    description: "Whether planning should evaluate one obvious path, a lightweight options list, or a BES-style candidate search before committing to an approach. Allowed values: none, lightweight, candidate_search"
    validation: "Must be one of: none, lightweight, candidate_search. candidate_search triggers only for explicit alternatives, open-ended architecture/design, optimization, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots."
    default: none
    on_missing: infer
    infer_from: "Use candidate_search for explicit alternatives, open-ended architecture/design, optimization-heavy work, high uncertainty, repeated failed attempts, unclear/flaky bugs, or reviewer-requested pivots; use lightweight for ordinary tasks with 1-3 obvious options; otherwise none."

  - name: candidate_search_goal
    type: string
    required: false
    description: "Single objective used to decompose the goal tree when search_mode=candidate_search"
    validation: "Derived from acceptance criteria and slice acceptance/verification criteria; must not create a second source of truth."
    default: null
    on_missing: skip

  - name: candidate_search_constraints
    type: string[]
    required: false
    description: "Constraints and non-goals that every candidate must satisfy"
    validation: "Each entry must come from user constraints, approved plan boundaries, policy constraints, or discovered project constraints."
    default: []
    on_missing: skip

  - name: clarification_status
    type: enum
    required: true
    enum_values: [ready, needs_clarification]
    description: "Whether Discover is clear to continue or is waiting on explicit clarification about implementation-shaping fields"
    validation: "ready requires zero unresolved clarification topics and every implementation-shaping field is explicit or defaulted. needs_clarification requires at least one unresolved clarification topic."
    on_missing: infer
    infer_from: "If any implementation-shaping field that affects files, behavior, interfaces, data shape, rollout, or verification is still unresolved, set to needs_clarification and add a deterministic topic label. Set to ready only when each such field is explicit or has an explicit default."

  - name: clarification_confidence
    type: enum
    required: false
    enum_values: [low, medium, high]
    description: "Confidence that prompt plus discovered code/context is sufficient to plan safely"
    validation: "high means no blocking implementation-shaping ambiguity remains. low requires needs_clarification unless the task is explicitly read-only."
    default: medium
    on_missing: skip

  - name: clarification_questions_asked
    type: int
    required: false
    description: "Number of clarification questions asked during Discover"
    validation: "Must be zero or greater. May be zero for any task size when prompt plus code/context are sufficiently clear."
    default: 0
    on_missing: skip

  - name: clarification_question_cap
    type: int
    required: false
    description: "Maximum allowed clarification questions for the current size/risk, never a quota"
    validation: "Must be zero or greater. The cap limits questions; it never requires questions."
    default: 0
    on_missing: skip

  - name: clarification_admissibility
    type: enum
    required: false
    enum_values: [satisfied, needs_clarification, not_applicable]
    description: "Whether any asked clarification questions pass the admissibility test"
    validation: "satisfied means every asked question affects correctness/scope/behavior/security/verification, cannot be discovered from code/context, lacks a safe default, and states risk if guessed."
    default: not_applicable
    on_missing: skip

  - name: unresolved_clarification_topics
    type: string[]
    required: true
    description: "Deterministic short labels for unanswered topics that block planning"
    validation: "List every unresolved implementation-shaping field with one deterministic short label. Empty when clarification_status=ready. Non-empty when clarification_status=needs_clarification."
    default: []
    on_missing: skip
    examples:
      - "target subsystem"
      - "default behavior"
      - "migration strategy"

  - name: clarification_defaults_applied
    type: boolean
    required: true
    description: "Whether Discover automatically applied at least one deterministic safe default and recorded its source and rationale without asking"
    validation: "Must be true when clarification_defaults contains one or more automatically applied safe defaults and false when it is empty. Safe-default application never waits for a user reply. An explicit `defaults` reply remains compatibility shorthand for accepting displayed recommendations on questions that had no deterministic safe default; it is recorded as a user answer, not an automatically applied safe default."
    default: false
    on_missing: skip
    notes: "Do not set true merely because a user replied `defaults`; tie it to clarification_defaults evidence."

  - name: clarification_defaults
    type: object[]
    required: true
    description: "Deterministic safe defaults applied automatically during Discover"
    validation: "Each entry records one implementation-shaping topic, chosen value, discoverable source, and concrete rationale. Empty only when no safe default was applied."
    default: []
    on_missing: skip
    object_fields:
      - name: topic
        type: string
        required: true
      - name: value
        type: string
        required: true
      - name: source
        type: string
        required: true
        description: "User instruction, repository evidence, active policy, or stable local convention supporting the default"
      - name: rationale
        type: string
        required: true
        description: "Why this value is safe, reversible, and does not materially change scope"

# Validation behavior:
# 1. Resolve all required fields before entering Triage. Exact phase markers are conditional on strict intensity, explicit project policy, or user request.
# 2. If on_missing=ask: present ONE focused question, wait for answer
# 3. If on_missing=infer: state the inference ("I'm treating this as a feature task")
# 4. If on_missing=skip: proceed with default value
# 5. Clarification question caps are maximums, not quotas. Never ask a ritual question just because a task is medium+.
# 6. Apply deterministic safe defaults immediately, record source/rationale, and set clarification_defaults_applied=true. If clarification_status=needs_clarification, carry only topics with no safe default into Discover and stop for explicit answers; `defaults` remains an acceptance shorthand for displayed recommendations.
# 7. Log resolved input as: >> Input: {task_type} | scope: {scope_hint or "auto"} | constraints: {count}
