# TDD Output Contract
# Defines what a completed TDD session MUST produce.

schema_version: "1.0"
contract: output
skill: assistant-tdd

artifacts:
  - name: cycle_log
    type: object[]
    required: true
    condition: always
    description: "Record of every Red-Green-Refactor cycle executed"
    min_items: 1
    validation: "One entry per behavior. Every behavior from input must have a corresponding cycle."
    object_fields:
      - name: behavior
        type: string
        required: true
        description: "The behavior description from the input"
      - name: plan_step
        type: int
        required: false
      - name: red
        type: object
        required: true
        description: "RED phase: write failing test"
        object_fields:
          - name: test_name
            type: string
            required: true
          - name: test_file
            type: string
            required: true
          - name: failure_reason
            type: string
            required: true
            validation: "Must describe WHY the test failed (not syntax error or missing import)"
          - name: debugging_trace
            type: string
            required: conditional
            condition: "when the behavior is a bugfix"
            description: "How the RED test traces to assistant-debugging reproduction/root-cause evidence"
            validation: "Must cite original failure path or reproduction evidence for bugfix RED tests"
          - name: verified_failing
            type: boolean
            required: true
            validation: "Must be true — test was run and confirmed to fail for the right reason"
      - name: green
        type: object
        required: true
        description: "GREEN phase: make test pass with simplest code"
        object_fields:
          - name: production_file
            type: string
            required: true
          - name: test_passes
            type: boolean
            required: true
            validation: "Must be true — the previously failing test now passes"
          - name: all_tests_pass
            type: boolean
            required: true
            validation: "Must be true — no other tests broke"
      - name: refactor
        type: object
        required: true
        description: "REFACTOR phase: clean up without changing behavior"
        object_fields:
          - name: changes_made
            type: string
            required: true
            description: "What was refactored, or 'none needed'"
          - name: all_tests_pass
            type: boolean
            required: true
            validation: "Must be true — refactoring did not break any tests"

  - name: coverage_summary
    type: object
    required: true
    condition: always
    description: "Summary of what is now tested"
    validation: "Must report new_tests, total_tests_run, and all_passing=true at TDD completion"
    object_fields:
      - name: new_tests
        type: int
        required: true
        validation: ">= 1"
      - name: total_tests_run
        type: int
        required: true
      - name: all_passing
        type: boolean
        required: true
        validation: "Must be true at TDD completion"

  - name: architecture_obligation_coverage
    type: object[]
    required: conditional
    condition: "architecture_test_obligations is non-empty"
    description: "Evidence that each carried Architecture Decision Pack obligation was tested or explicitly remains blocked/unknown"
    validation: "Each entry cites the Pack reference, obligation, test or verification evidence, and outcome. Quality claims cannot be marked proven without workload, budget/explicit unknown, measurement method, and failure condition. Design-pressure claims require evidence for control/early exit, ownership/disposal, bounded resources, extension registration, or a representative path when applicable."
    on_fail: "Add a focused RED/GREEN test or record the explicit measurement/blocker gap before TDD completion"
    object_fields:
      - name: architecture_decision_pack_ref
        type: string
        required: true
      - name: obligation_kind
        type: enum
        required: true
        enum_values: [semantic_type_validation, primitive_boundary_conversion, public_contract_compatibility, quality_scenario, control_or_early_exit, ownership_or_disposal, resource_envelope, extension_registration, representative_path]
      - name: evidence
        type: string
        required: true
      - name: outcome
        type: enum
        required: true
        enum_values: [covered, blocked, explicit_unknown]

  - name: task_journal_entry
    type: string
    required: true
    condition: "task journal exists"
    description: "Progress section updated with RED/GREEN/REFACTOR entries per step"
    validation: "Each completed behavior shows RED, GREEN, REFACTOR sub-entries"

# Completeness check:
# 1. Every input behavior has a corresponding cycle_log entry
# 2. Every cycle has verified_failing=true (RED), test_passes=true (GREEN), all_tests_pass=true (REFACTOR)
# 3. No production code exists without a preceding failing test
# 4. coverage_summary.all_passing is true
# 5. If architecture_test_obligations are carried, every obligation has architecture_obligation_coverage evidence or an explicit blocker/unknown
