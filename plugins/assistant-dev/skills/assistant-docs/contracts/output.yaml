# contract header
schema_version: "3.0"
contract: output
skill: assistant-docs

artifacts:
  - name: files_updated
    type: object[]
    required: conditional
    condition: "(feature_preparation_scope == not_applicable or (feature_preparation_scope == existing_system and feature_preparation_evidence_status == current)) and (architecture_design_mode == not_applicable or architecture_decision_pack_status == current)"
    description: "List of files created or modified with documentation"
    min_items: 1
    on_fail: "Re-run skill to produce the missing artifact"
    object_fields:
      - name: path
        type: string
        required: true
        description: "File path that was created or modified"
      - name: change_type
        type: enum
        required: true
        enum_values: [created, modified]
        description: "Whether the file was newly created or modified"
      - name: description
        type: string
        required: true
        description: "What documentation was added or changed"

  - name: evidence_sources
    type: object[]
    required: true
    description: "Source files, tests, configs, existing docs, git history, or user-provided material used as documentation truth"
    min_items: 1
    validation: "Every concrete doc claim should trace to at least one evidence source or be listed in review_items"
    on_fail: "Inspect source material and record evidence before finalizing docs"
    object_fields:
      - name: source
        type: string
        required: true
      - name: claims_supported
        type: string
        required: true

  - name: doc_coverage
    type: string
    required: true
    description: "Summary of what is documented and what gaps remain"
    validation: "Non-empty string covering both documented and undocumented areas"
    on_fail: "Re-run skill to produce the missing artifact"

  - name: review_items
    type: string[]
    required: true
    description: "Inferred, stale, conflicting, or audience-sensitive claims requiring user or maintainer review; empty only when none remain"
    validation: "Must list every unverified or sensitive claim instead of silently presenting it as fact"
    on_fail: "Move unsupported claims to review_items or remove them from docs"

  - name: safety_notes
    type: string[]
    required: true
    description: "Redactions, sensitive/internal details omitted, or ['none'] when no safety-sensitive content was encountered"
    validation: "Must not include the sensitive value itself"
    on_fail: "Redact sensitive content and summarize the omission without exposing values"

  - name: feature_preparation_evidence_trace
    type: object
    required: conditional
    condition: "feature_preparation_scope == existing_system"
    description: "Discriminated validation or recovery trace for any document carrying existing-system feature preparation"
    validation: "feature_preparation_evidence_status=current requires outcome=validated with non-empty evidence_refs; incomplete requires outcome=blocked_incomplete_evidence, recovery_action=request_complete_evidence, and non-empty review_trace. An incomplete trace never permits files_updated or propagation of the unsupported claim."
    on_fail: "Stop writing the feature-preparation claim and request a complete canonical evidence artifact."
    object_fields:
      - name: outcome
        type: enum
        required: true
        enum_values: [validated, blocked_incomplete_evidence]
        on_missing: fail
      - name: evidence_refs
        type: string[]
        required: conditional
        condition: "outcome == validated"
        min_items: 1
        on_missing: fail
      - name: recovery_action
        type: enum
        required: conditional
        condition: "outcome == blocked_incomplete_evidence"
        enum_values: [request_complete_evidence]
        on_missing: fail
      - name: review_trace
        type: string[]
        required: true
        min_items: 1
        on_missing: fail

  - name: architecture_decision_pack_trace
    type: object
    required: conditional
    condition: "architecture_design_mode in [lightweight, required, review_intensive]"
    description: "Discriminated documentation/recovery trace for a current, missing, stale, or out-of-scope Architecture Decision Pack"
    validation: "architecture_decision_pack_status=current with feature_preparation_scope=not_applicable or feature_preparation_evidence_status=current requires outcome=documented; current with existing-system incomplete evidence requires blocked_incomplete_pack; missing requires blocked_missing_pack; stale requires blocked_stale_pack; out_of_scope requires outcome=out_of_scope. outcome=documented requires source_pack_ref, documented_decision_refs, and evidence_refs from a current Pack. Blocked or out-of-scope outcomes require recovery_action and non-empty review_trace without invented refs; stale_pack_ref appears only when a stale ref is actually available."
    on_fail: "Never reconstruct, infer, or invent a missing, stale, or feature-preparation-incomplete Architecture Decision Pack. Stop documentation of that decision and request a current or complete Pack, or mark the decision out of scope."
    object_fields:
      - name: outcome
        type: enum
        required: true
        enum_values: [documented, blocked_missing_pack, blocked_stale_pack, blocked_incomplete_pack, out_of_scope]
        on_missing: fail
      - name: source_pack_ref
        type: string
        required: conditional
        condition: "outcome == documented"
        on_missing: fail
      - name: stale_pack_ref
        type: string
        required: false
        condition: "outcome == blocked_stale_pack and a stale Pack ref is actually available"
        on_missing: skip
      - name: documented_decision_refs
        type: string[]
        required: conditional
        condition: "outcome == documented"
        min_items: 1
        on_missing: fail
      - name: evidence_refs
        type: string[]
        required: conditional
        condition: "outcome == documented"
        min_items: 1
        on_missing: fail
      - name: feature_preparation_evidence_refs
        type: string[]
        required: conditional
        condition: "outcome == documented and feature_preparation_scope == existing_system"
        description: "Admissible canonical evidence refs carried with documented existing-system feature decisions"
        validation: "Every carried Product question resolves to these complete feature-preparation evidence rows; omit only when feature preparation is not applicable."
        min_items: 1
        on_missing: fail
      - name: recovery_action
        type: enum
        required: conditional
        condition: "outcome in [blocked_missing_pack, blocked_stale_pack, blocked_incomplete_pack, out_of_scope]"
        enum_values: [request_current_pack, request_complete_pack, mark_decision_out_of_scope]
        validation: "blocked_missing_pack or blocked_stale_pack requires request_current_pack; blocked_incomplete_pack requires request_complete_pack; out_of_scope requires mark_decision_out_of_scope."
        on_missing: fail
      - name: review_trace
        type: string[]
        required: true
        min_items: 1
        description: "Review items, stale-claim handling, or ['none'] when all documented Pack claims are current and supported"
        on_missing: fail
