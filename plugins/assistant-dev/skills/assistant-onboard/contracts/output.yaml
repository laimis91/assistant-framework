# contract header
schema_version: "2.0"
contract: output
skill: assistant-onboard

artifacts:
  - name: project_size
    type: enum
    required: true
    enum_values: [small, medium, large]
    description: "surface-scan-derived observed project size"
    validation: "Matches the evidence-based surface-scan classification; no silent default."
    on_fail: "Classify the inspected project as small, medium, or large before returning orientation."

  - name: project_summary
    type: string
    required: true
    description: "What the project does, its tech stack, architecture overview, approximate size, and primary build/test/run commands"
    validation: "Non-empty, covers purpose, stack, structure, size estimate, and commands when discoverable"
    on_fail: "Re-run onboarding surface scan and summarize purpose, stack, structure, size estimate, and discoverable commands"

  - name: key_files
    type: object[]
    required: true
    description: "Important files in the project with their purpose"
    validation: "Each entry must include path (string) and purpose (string)"
    on_fail: "Inspect project structure and add key files with path and purpose"

  - name: conventions
    type: object[]
    required: true
    description: "Coding patterns and conventions observed in the project"
    validation: "Each entry must include pattern (string) and example (string)"
    on_fail: "Sample representative files and add conventions with concrete examples"

  - name: risky_areas
    type: object[]
    required: true
    description: "Surfaces that need extra care in future work and why"
    validation: "Each entry includes path_or_surface and risk_reason"
    on_fail: "Identify risky surfaces or explicitly include an empty list with no risks found after inspection"

  - name: likely_change_points
    type: object[]
    required: true
    description: "Files or directories future features/fixes will likely touch"
    validation: "Each entry includes path_or_directory and when_to_use"
    on_fail: "Map likely future change points or explicitly include an empty list when none are identifiable"

  - name: semantic_type_candidates
    type: object[]
    required: conditional
    condition: "project_size in [medium, large]"
    description: "Evidence-backed domain/public/lifecycle/unit type candidates and explicit primitive-boundary exceptions discovered during architecture mapping"
    validation: "Each entry identifies a concept, current representation, boundary, evidence, and recommendation. For medium or large projects, explicit [] is valid only after inspection finds no meaningful candidate; no silent default. Small projects may omit this field. This is orientation evidence, not an instruction to redesign every primitive."
    on_missing: fail
    on_fail: "Inspect public/domain/lifecycle boundaries and record concrete candidates or an empty list after inspection"
    object_fields:
      - name: concept
        type: string
        required: true
      - name: current_representation
        type: string
        required: true
      - name: boundary
        type: enum
        required: true
        enum_values: [domain_or_public_semantic_type, local_temporary, wire_or_storage, foreign_or_framework, no_domain_semantics]
      - name: evidence
        type: string
        required: true
      - name: recommendation
        type: string
        required: true

  - name: design_pressure_candidates
    type: object[]
    required: conditional
    condition: "project_size in [medium, large]"
    description: "Evidence-backed control, ownership, resource, extension, or representative-path observations that can inform a later Architecture Decision Pack"
    validation: "Each entry identifies the concern, source evidence, and recommendation. For medium or large projects, explicit [] is valid only after inspection finds no relevant design pressure; no silent default. Small projects may omit this field. This is orientation evidence, not a request to invent an abstraction."
    on_missing: fail
    on_fail: "Inspect relevant boundary and lifecycle paths, record concrete design-pressure candidates, or return an inspected empty list"
    object_fields:
      - name: concern
        type: enum
        required: true
        enum_values: [control_and_early_exit, ownership_and_disposal, resource_envelope, extension_registration, representative_path]
      - name: evidence
        type: string
        required: true
      - name: recommendation
        type: string
        required: true

  - name: artifacts
    type: string[]
    required: true
    description: "Orientation files created/updated, or ['none'] if no files changed"
    validation: "Must accurately reflect filesystem writes"
    on_fail: "Set artifacts to written paths or ['none'] when no orientation artifact was created"

  - name: artifact_updated
    type: boolean
    required: true
    description: "Whether a project-local orientation artifact was created or updated"
    validation: "Must accurately reflect whether artifacts[] includes a file write"
    on_fail: "Set artifact_updated true only when artifacts[] names written files; otherwise set false"

  - name: questions
    type: string[]
    required: true
    description: "Open questions for the user about the project"
    validation: "Specific questions about unclear areas — not generic prompts"
    on_fail: "Replace generic questions with specific project gaps or use an empty list when no questions remain"
