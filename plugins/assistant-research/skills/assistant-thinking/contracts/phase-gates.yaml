schema_version: "2.0"
contract: phase-gates
skill: assistant-thinking

gates:
  - phase: TOOL_SELECTION
    checkpoint_start: "--- PHASE: TOOL_SELECTION ---"
    checkpoint_end: "--- PHASE: TOOL_SELECTION COMPLETE ---"
    exit_assertions:
      - id: TS1
        check: "Correct thinking tool is identified for the problem type"
        on_fail: "Re-evaluate the problem and match to the most appropriate tool"
      - id: TS2
        check: "Tool file is loaded (e.g., clarify.md, perspectives.md)"
        on_fail: "Read the corresponding tool file before proceeding with analysis"

  - phase: ANALYSIS
    checkpoint_start: "--- PHASE: ANALYSIS ---"
    checkpoint_end: "--- PHASE: ANALYSIS COMPLETE ---"
    exit_assertions:
      - id: A1
        check: "Tool-specific methodology was followed (not ad-hoc thinking)"
        on_fail: "Re-run the analysis following the loaded tool's structured methodology"
      - id: A2
        check: "Analysis depth matches the stakes level (low/medium/high)"
        on_fail: "Deepen the analysis for high-stakes problems or simplify for low-stakes"
      - id: A3
        check: "For perspectives and high-stakes stress_test: subagent_policy_state, subagent_execution_mode, subagent_trigger_scope, and conditional policy_blocking_source are resolved before any subagent spawn. A direct user, applicable AGENTS.md, or active skill instruction triggers delegation_triggered and dispatch without a separate permission question. Sequential fallback is recorded only for explicit opt-out, real unavailability or supported configuration proof, or policy-disallowed with an exact active blocking rule and no applicable trigger exception."
        on_fail: "If an applicable trigger exists and no delegation_opted_out, subagents_unavailable, or policy_disallowed evidence applies, infer subagent_trigger_scope and dispatch required roles. Otherwise preserve and complete the evidenced sequential fallback state; do not overwrite explicit opt-out."
      - id: A4
        check: "When architecture_design_mode is not_applicable no Architecture Decision Pack is manufactured; otherwise the analysis checks the supplied Pack's freshness, material questions, design-pressure checks, semantic type/primitive-exception boundaries, and quality-scenario evidence."
        on_fail: "Use the carried Pack as the decision record, ask or record every material unknown, check control/early exit, ownership/disposal, resource envelope, extension registration, and representative path as applicable, and require workload/budget/measurement/failure evidence before accepting a memory, performance, or extensibility claim."

  - phase: SYNTHESIS
    checkpoint_start: "--- PHASE: SYNTHESIS ---"
    checkpoint_end: "--- PHASE: SYNTHESIS COMPLETE ---"
    exit_assertions:
      - id: S1
        check: "At least 1 actionable insight has been extracted"
        on_fail: "Review the analysis output and identify concrete, actionable findings"
      - id: S2
        check: "A clear recommendation is formed and grounded in the insights"
        on_fail: "Synthesize insights into a specific recommendation with rationale"
      - id: S3
        check: "Confidence level is assessed and reflects actual analysis depth"
        on_fail: "Set confidence to low/medium/high based on evidence strength, not default to high"

invariants:
  - id: INV1
    check: "Analysis follows the loaded tool's methodology, not free-form reasoning"
    scope: all_phases
    on_fail: "Return to the tool file and re-apply its structured approach"
  - id: INV2
    check: "Dissenting views are considered, not suppressed"
    scope: all_phases
    on_fail: "Identify and articulate the strongest counter-argument to the recommendation"
  - id: INV3
    check: "The analysis never claims subagents were used unless subagent_execution_mode=delegated"
    scope: all_phases
    on_fail: "Correct the synthesis to distinguish delegated execution from sequential fallback"
  - id: INV4
    check: "Thinking output never replaces a workflow Architecture Decision Pack with generic advice or a permanent architect/memory role"
    scope: all_phases
    on_fail: "Return a compact Pack update with freshness and falsifiable implications, or mark architecture_design_mode=not_applicable"
