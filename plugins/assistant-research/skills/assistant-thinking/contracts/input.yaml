schema_version: "2.0"
contract: input
skill: assistant-thinking

fields:
  - name: problem
    type: string
    required: true
    description: "The problem, question, or decision to think through"
    validation: "Non-empty string describing something that needs structured analysis"
    on_missing: ask

  - name: tool
    type: enum
    required: true
    description: "Which thinking tool to use for the analysis"
    enum_values: [clarify, perspectives, stress_test, deep_think, hypothesize, creative]
    on_missing: infer

  - name: stakes
    type: enum
    required: false
    description: "Determines depth of analysis — higher stakes get deeper treatment"
    enum_values: [low, medium, high]
    on_missing: infer

  - name: subagent_policy_state
    type: enum
    required: false
    enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
    description: "Whether applicable instructions trigger independent perspective/stress-test subagents or require evidenced fallback"
    validation: "Must be resolved before spawning subagents for perspectives or high-stakes stress tests"
    default: not_required
    on_missing: infer
    infer_from: "Use delegation_triggered when a direct user request or applicable AGENTS.md or active skill instruction covers the required roles; infer scope without asking. Use delegation_opted_out when the user explicitly declines; use subagents_unavailable only after a real spawn failure or supported configuration proof; use policy_disallowed only when an exact active blocking rule confirms no applicable trigger exception; use not_required when the selected thinking tool does not need subagents."

  - name: subagent_execution_mode
    type: enum
    required: false
    enum_values: [delegated, sequential_fallback, not_applicable]
    description: "Whether independent roles are executed by subagents, sequentially in the main session, or not needed"
    validation: "delegated requires subagent_policy_state=delegation_triggered; sequential_fallback requires delegation_opted_out, subagents_unavailable after a real spawn failure or supported configuration proof, or policy_disallowed with policy_blocking_source"
    default: not_applicable
    on_missing: infer
    infer_from: "Use delegated only with subagent_policy_state=delegation_triggered for perspectives or high-stakes stress-test subagents. Use sequential_fallback only for delegation_opted_out, subagents_unavailable after a real spawn failure or supported configuration proof, or policy_disallowed with policy_blocking_source. Use not_applicable for tools that do not use independent subagents."

  - name: subagent_trigger_scope
    type: string[]
    required: false
    description: "Direct-user, applicable-AGENTS.md, or active-skill provenance plus covered perspective roles or stress-test angles"
    validation: "Non-empty when delegation is relevant and inferred without asking; empty only when subagent_policy_state=not_required."
    default: []
    on_missing: infer

  - name: policy_blocking_source
    type: string
    required: conditional
    condition: "subagent_policy_state == policy_disallowed"
    description: "Exact active rule that blocks spawning after confirming no applicable user, AGENTS, or skill exception"
    validation: "Non-empty; a conditional rule that defers spawning unless the user or applicable AGENTS/skill asks does not make policy_disallowed when the active tool requires subagents."
    on_missing: fail

  - name: existing_position
    type: string
    required: false
    description: "Current thinking or position to challenge, validate, or build on"
    validation: "Describes a stance, hypothesis, or preliminary conclusion"
    on_missing: skip

  - name: architecture_design_mode
    type: enum
    required: false
    enum_values: [not_applicable, lightweight, required, review_intensive]
    description: "Workflow Architecture Decision Pack mode when the reasoning is challenging an architecture decision"
    default: not_applicable
    on_missing: infer
    infer_from: "Use the carried workflow mode when an Architecture Decision Pack is present; otherwise not_applicable. Do not create a Pack or architecture ceremony for an ordinary local decision."

  - name: architecture_decision_pack_ref
    type: string
    required: conditional
    condition: "architecture_design_mode != not_applicable"
    description: "Fresh workflow Architecture Decision Pack reference or durable decision record being challenged"
    validation: "Non-empty and traceable to its source revision/context; if stale, identify refresh rather than reasoning from an assumed current design"
    on_missing: ask
