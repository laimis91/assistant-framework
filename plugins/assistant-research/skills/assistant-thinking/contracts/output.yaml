schema_version: "3.0"
contract: output
skill: assistant-thinking

artifacts:
  - name: tool_used
    type: enum
    required: true
    description: "Which thinking tool was applied"
    enum_values: [clarify, perspectives, stress_test, deep_think, hypothesize, creative]
    on_fail: "Re-run TOOL_SELECTION phase to identify the correct tool"

  - name: key_insights
    type: string[]
    required: true
    description: "Actionable insights discovered through the analysis"
    validation: "At least 1 insight, each is a concrete and actionable finding"
    min_items: 1
    on_fail: "Re-run SYNTHESIS phase to extract actionable insights"

  - name: recommendation
    type: string
    required: true
    description: "What to do based on the analysis"
    validation: "A clear, actionable recommendation grounded in the insights"
    on_fail: "Re-run SYNTHESIS phase to produce a recommendation"

  - name: confidence
    type: enum
    required: true
    description: "How confident the analysis is in its recommendation"
    enum_values: [high, medium, low]
    on_fail: "Re-run SYNTHESIS phase to assess confidence level"

  - name: dissenting_view
    type: string
    required: false
    description: "The strongest counter-argument to the recommendation"
    validation: "A genuine challenge, not a strawman"
    on_fail: "Re-run ANALYSIS phase to identify the strongest counter-argument"

  - name: gaps_or_assumptions
    type: string[]
    required: true
    description: "Known gaps, assumptions, or evidence limits that affect confidence"
    validation: "Use an empty list only when confidence is high and no material gaps remain"
    on_fail: "List the uncertainty limits or explicitly justify why no material gaps remain"

  - name: evidence_or_observations
    type: string[]
    required: true
    description: "Facts, observations, test results, or user-provided constraints the reasoning used"
    validation: "At least one entry unless the task is purely hypothetical"
    on_fail: "Add the facts, observations, tests, or constraints used; for hypothetical tasks state that no external evidence was available"

  - name: delegation_path
    type: object
    required: conditional
    condition: "tool_used in [perspectives, stress_test]"
    description: "How independent roles or attack angles were executed"
    validation: "States subagent_policy_state, subagent_execution_mode, trigger scope when relevant, conditional policy_blocking_source, and whether roles/angles were delegated or run sequentially in fallback"
    on_fail: "Record delegated execution or sequential fallback before presenting synthesis; do not imply subagents were used when delegation was not triggered or they were unavailable"
    object_fields:
      - name: subagent_policy_state
        type: enum
        required: true
        enum_values: [not_required, delegation_triggered, delegation_opted_out, subagents_unavailable, policy_disallowed]
      - name: subagent_execution_mode
        type: enum
        required: true
        enum_values: [delegated, sequential_fallback, not_applicable]
      - name: subagent_trigger_scope
        type: string[]
        required: true
        validation: "Non-empty when delegation is relevant; records direct-user, applicable-AGENTS.md, or active-skill provenance and covered roles or attack angles."
      - name: policy_blocking_source
        type: string
        required: conditional
        condition: "subagent_policy_state == policy_disallowed"
        validation: "Non-empty exact active blocking rule that confirms no applicable user, AGENTS, or skill exception permits delegation"
      - name: execution_note
        type: string
        required: true
        validation: "Names whether roles/angles were delegated or run sequentially, with the reason"

  - name: decision_artifacts
    type: object
    required: conditional
    condition: "tool_used in [perspectives, stress_test, deep_think] and the output is a decision"
    description: "Options, criteria, and validation step for decision-oriented reasoning"
    validation: "Includes options considered, decision criteria, selected option, and next validation step. For architecture decisions, distinguish facts from assumptions and do not claim memory, performance, or extensibility benefit without a workload/budget, measurement method, and failure condition or an explicit unknown."
    on_fail: "Re-run decision synthesis and include options considered, criteria, selected option, and validation or rollback step"

  - name: architecture_pack_update
    type: object
    required: conditional
    condition: "architecture_design_mode != not_applicable"
    description: "Compact challenge result that the workflow can merge into the Architecture Decision Pack without duplicating global memory"
    validation: "Records Pack freshness, decision-impacting questions, design-pressure and type-boundary findings, and quality-scenario verification implications; does not claim an unmeasured quality benefit."
    on_fail: "Refresh or amend the Architecture Decision Pack before accepting the recommendation"
    object_fields:
      - name: architecture_decision_pack_ref
        type: string
        required: true
      - name: freshness_status
        type: enum
        required: true
        enum_values: [fresh, refresh_required]
      - name: material_questions_or_invalidators
        type: string[]
        required: true
        description: "Questions, changed facts, or requirements that would invalidate the current decision; empty only when none are found"
      - name: design_pressure_findings
        type: string[]
        required: true
        description: "Control/early-exit, ownership/disposal, resource-envelope, extension-registration, or representative-path implications"
      - name: semantic_type_findings
        type: string[]
        required: true
        description: "Named semantic type, primitive exception, validation boundary, or public-contract evolution implications"
      - name: quality_scenario_findings
        type: string[]
        required: true
        description: "Workload/budget/measurement/failure-condition implications, or explicit unknowns that block a quality claim"
      - name: recommended_pack_change
        type: string
        required: true
      - name: independent_challenge_evidence
        type: object
        required: conditional
        condition: "architecture_design_mode == review_intensive"
        description: "Independent challenge or validation that changes, confirms, or bounds the selected Pack design"
        validation: "All fields are required so review-intensive challenge evidence is traceable and cannot be reduced to a conclusion."
        on_fail: "Return to the independent challenge and record every required field before merging the Pack update."
        object_fields:
          - name: challenge_ref
            type: string
            required: true
          - name: dissent_or_validation
            type: string
            required: true
          - name: resolution
            type: string
            required: true
          - name: selected_design_impact
            type: string
            required: true

  - name: debug_artifacts
    type: object
    required: conditional
    condition: "tool_used == hypothesize"
    description: "Hypotheses, tests, disconfirming evidence, and conclusion for debugging uncertainty"
    validation: "Includes at least three hypotheses unless fewer are plausible, tests performed or proposed, and what would disprove the current conclusion"
    on_fail: "Re-run hypothesis analysis and include hypotheses, tests, disconfirming evidence, and conclusion"
