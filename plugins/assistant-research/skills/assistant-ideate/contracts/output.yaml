schema_version: "2.0"
contract: output
skill: assistant-ideate

artifacts:
  - name: ideation_mode
    type: enum
    required: true
    description: "Depth selected for this response"
    validation: "Matches the input request and mode inference rule"
    enum_values: [light, deep]
    on_fail: "Re-evaluate the request and label the response light or deep before continuing"

  - name: problem_statement
    type: string
    required: true
    description: "Concise statement of the goal and material constraints"
    validation: "Between 1 and 3 sentences that frame the core problem"
    on_fail: "Re-run UNDERSTAND to state the goal and material constraints"

  - name: ideas
    type: object[]
    required: true
    description: "Distinct options generated before ranking"
    validation: "Light mode contains 3-5 options; deep mode contains 8-15 ideas"
    on_fail: "Generate enough distinct options for the selected mode before ranking"
    min_items: 3
    object_fields:
      - name: name
        type: string
        required: true
        description: "Short memorable name for the idea"

      - name: description
        type: string
        required: true
        description: "One-line description of the idea"

      - name: rationale
        type: string
        required: true
        description: "Why the idea is worth considering"

  - name: quick_ranking
    type: object[]
    required: conditional
    condition: "when ideation_mode is light"
    description: "Fast ordered comparison for a small option set"
    validation: "Contains 3-5 ranked options with a reason, trade-off, and first step; no full scoring matrix is required"
    on_fail: "Rank the light-mode options and add the missing reason, trade-off, or first step"
    min_items: 3
    object_fields:
      - name: rank
        type: int
        required: true
        description: "Position in the quick ranking"

      - name: name
        type: string
        required: true
        description: "Idea name matching an entry from ideas"

      - name: reason
        type: string
        required: true
        description: "Why this option ranks here"

      - name: tradeoff
        type: string
        required: true
        description: "Most important downside or cost"

      - name: first_step
        type: string
        required: true
        description: "Smallest useful next action"

  - name: ranked_ideas
    type: object[]
    required: conditional
    condition: "when ideation_mode is deep"
    description: "All deep-mode ideas scored and ranked during CONVERGE"
    validation: "Every deep-mode idea is scored on impact, feasibility, alignment, novelty, and risk"
    on_fail: "Re-run deep CONVERGE to score and rank all ideas"
    min_items: 8
    object_fields:
      - name: rank
        type: int
        required: true
        description: "Position in the ranking"

      - name: name
        type: string
        required: true
        description: "Idea name matching an entry from ideas"

      - name: impact
        type: int
        required: true
        description: "Expected benefit from 1 to 5"
        validation: "Integer between 1 and 5 inclusive"

      - name: feasibility
        type: int
        required: true
        description: "Feasibility with current resources from 1 to 5"
        validation: "Integer between 1 and 5 inclusive"

      - name: alignment
        type: int
        required: true
        description: "Fit with goals and constraints from 1 to 5"
        validation: "Integer between 1 and 5 inclusive"

      - name: novelty
        type: int
        required: true
        description: "Meaningful novelty from 1 to 5"
        validation: "Integer between 1 and 5 inclusive"

      - name: risk
        type: int
        required: true
        description: "Downside risk from 1 to 5"
        validation: "Integer between 1 and 5 inclusive"

      - name: weighted_score
        type: int
        required: true
        description: "Calculated as impact*3 + feasibility*2 + alignment*2 + novelty*1 - risk*1"

  - name: refined_candidates
    type: object[]
    required: conditional
    condition: "when ideation_mode is deep"
    description: "Top deep-mode candidates refined for a user decision"
    validation: "Between 3 and 5 candidates include a pitch, mechanics, needs, risks, and first step"
    on_fail: "Re-run deep REFINE to complete at least three candidates"
    min_items: 3
    object_fields:
      - name: name
        type: string
        required: true
        description: "Idea name matching a top-ranked idea"

      - name: elevator_pitch
        type: string
        required: true
        description: "Two-sentence pitch explaining the idea"

      - name: how_it_works
        type: string[]
        required: true
        description: "Three to five steps describing the approach"

      - name: technical_needs
        type: string[]
        required: true
        description: "What must be built or acquired"

      - name: risks
        type: object[]
        required: true
        description: "Identified risks with mitigations"
        object_fields:
          - name: description
            type: string
            required: true
            description: "What could go wrong"

          - name: mitigation
            type: string
            required: true
            description: "How to reduce or handle the risk"

      - name: first_step
        type: string
        required: true
        description: "Smallest validation step"

  - name: recommended_next_step
    type: string
    required: conditional
    condition: "when ideation_mode is light"
    description: "Best immediate action after the quick ranking"
    validation: "Specific and usable without forcing another decision round"
    on_fail: "Add one concrete next step based on the quick ranking"

  - name: decision_point
    type: object
    required: conditional
    condition: "when ideation_mode is deep or the user explicitly asks for a choice packet"
    description: "Choice artifact that frames the decision without selecting for the user"
    validation: "Names the decision and does not imply that the user already chose"
    on_fail: "Re-run deep DECIDE to present a clear user choice prompt"
    object_fields:
      - name: prompt
        type: string
        required: true
        description: "Question the user should answer"

      - name: context
        type: string
        required: true
        description: "Short explanation of the trade-off"

      - name: status
        type: enum
        required: true
        description: "Current state of the decision"
        enum_values: [awaiting_user_choice, needs_more_ideation, blocked_by_constraints]

  - name: decision_options
    type: object[]
    required: conditional
    condition: "when ideation_mode is deep or the user explicitly asks for a choice packet"
    description: "Choices offered during DECIDE"
    validation: "Covers selection, combination, rejection, and more ideation"
    on_fail: "Provide selected, combined, rejected, and more_ideas options"
    min_items: 4
    object_fields:
      - name: option_type
        type: enum
        required: true
        description: "Kind of decision the user can make"
        enum_values: [selected, combined, rejected, more_ideas]

      - name: label
        type: string
        required: true
        description: "Short user-facing choice label"

      - name: description
        type: string
        required: true
        description: "What happens after this choice"

      - name: next_action
        type: string
        required: true
        description: "Immediate action after selection"

  - name: user_decision
    type: enum
    required: conditional
    condition: "when the user has provided an explicit choice after DECIDE or in the current prompt"
    description: "What the user explicitly chose"
    validation: "Captured only from an explicit user choice"
    enum_values: [selected, combined, rejected, more_ideas]
    on_fail: "Omit user_decision until the user chooses; then capture the explicit choice"
