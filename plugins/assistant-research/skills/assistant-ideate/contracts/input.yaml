schema_version: "2.0"
contract: input
skill: assistant-ideate

fields:
  - name: seed
    type: string
    required: true
    description: "The idea, question, or problem to brainstorm around"
    validation: "Non-empty string describing something to ideate on"
    on_missing: ask
    ask_prompt: "What problem or opportunity should I generate options for?"

  - name: ideation_mode
    type: enum
    required: false
    description: "Depth of ideation appropriate to the request"
    validation: "Light is used for quick improvement or what-else scans; deep is used for explicit brainstorming or broad exploration"
    on_missing: infer
    infer_from: "Use deep when the user explicitly asks to brainstorm, explore broadly, or generate many/comprehensive alternatives; otherwise use light"
    enum_values: [light, deep]

  - name: goal
    type: string
    required: false
    description: "What success looks like for this ideation"
    validation: "Describes a desired outcome or success criterion"
    on_missing: infer
    infer_from: "Infer the desired outcome from the seed and current context"

  - name: constraints
    type: string[]
    required: false
    description: "Budget, timeline, tech stack, or other limitations"
    validation: "Each item is a concrete constraint (not a vague wish)"
    on_missing: skip

  - name: prior_attempts
    type: string[]
    required: false
    description: "What has been tried before — avoid re-proposing these"
    validation: "Each item describes a previously attempted approach"
    on_missing: skip
