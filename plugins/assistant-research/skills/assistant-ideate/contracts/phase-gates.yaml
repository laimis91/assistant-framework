schema_version: "2.0"
contract: phase-gates
skill: assistant-ideate

gates:
  - phase: UNDERSTAND
    checkpoint_start: "--- PHASE: UNDERSTAND ---"
    checkpoint_end: "--- PHASE: UNDERSTAND COMPLETE ---"
    exit_assertions:
      - id: U1
        check: "The problem statement is written as 1-3 sentences"
        on_fail: "Restate the goal and material constraints in 1-3 sentences"
      - id: U2
        check: "Material constraints are identified or explicitly noted as none"
        on_fail: "Infer safe defaults or ask only for a missing constraint that changes the option set"

  - phase: DIVERGE
    checkpoint_start: "--- PHASE: DIVERGE ---"
    checkpoint_end: "--- PHASE: DIVERGE COMPLETE ---"
    exit_assertions:
      - id: D_LIGHT_COUNT
        check: "Between 3 and 5 distinct options have been generated"
        condition: "when ideation_mode is light"
        on_fail: "Add or consolidate options until the light-mode set contains 3-5 distinct choices"
      - id: D_DEEP_COUNT
        check: "Between 8 and 15 distinct ideas have been generated"
        condition: "when ideation_mode is deep"
        on_fail: "Add or consolidate ideas until the deep-mode set contains 8-15 distinct choices"
      - id: D_DEEP_WILD
        check: "At least 1 wild or unconventional idea is included"
        condition: "when ideation_mode is deep"
        on_fail: "Apply constraint removal or inversion to add a wild idea"
      - id: D_FIELDS
        check: "Every idea satisfies the ideas artifact contract"
        on_fail: "Complete the missing ideas artifact fields before ranking"

  - phase: CONVERGE
    checkpoint_start: "--- PHASE: CONVERGE ---"
    checkpoint_end: "--- PHASE: CONVERGE COMPLETE ---"
    exit_assertions:
      - id: C_LIGHT_RANK
        check: "The quick_ranking artifact satisfies its output contract"
        condition: "when ideation_mode is light"
        on_fail: "Complete the quick_ranking artifact without adding a full scoring matrix"
      - id: C_DEEP_SCORE
        check: "The ranked_ideas artifact satisfies its output contract"
        condition: "when ideation_mode is deep"
        on_fail: "Complete the ranked_ideas artifact before refinement"
      - id: C_DEEP_WEIGHT
        check: "A weighted score is calculated for every deep-mode idea"
        condition: "when ideation_mode is deep"
        on_fail: "Calculate weighted_score = impact*3 + feasibility*2 + alignment*2 + novelty*1 - risk*1"
      - id: C_DEEP_TOP
        check: "At least the top 3 deep-mode ideas advance to REFINE"
        condition: "when ideation_mode is deep"
        on_fail: "Advance at least the top 3 scoring ideas"

  - phase: REFINE
    condition: "when ideation_mode is deep"
    checkpoint_start: "--- PHASE: REFINE ---"
    checkpoint_end: "--- PHASE: REFINE COMPLETE ---"
    exit_assertions:
      - id: R1
        check: "Every selected candidate has an elevator pitch"
        on_fail: "Write the missing elevator pitches"
      - id: R2
        check: "Every selected candidate satisfies the refined_candidates artifact contract"
        on_fail: "Complete the missing refined_candidates artifact fields"

  - phase: DECIDE
    checkpoint_start: "--- PHASE: DECIDE ---"
    checkpoint_end: "--- PHASE: DECIDE COMPLETE ---"
    exit_assertions:
      - id: DE_LIGHT_NEXT
        check: "A concrete recommended_next_step is present"
        condition: "when ideation_mode is light"
        on_fail: "Add the best immediate action from the quick ranking"
      - id: DE_DEEP_OPTIONS
        check: "The decision_point and decision_options artifacts satisfy their output contracts"
        condition: "when ideation_mode is deep or the user explicitly requests a choice packet"
        on_fail: "Complete the decision_point and decision_options artifacts"
      - id: DE_USER
        check: "User decision is captured only when an explicit follow-up choice exists"
        condition: "when the user has already replied with a choice or the current prompt includes an explicit selection"
        on_fail: "Capture the explicit choice, or omit user_decision until the user chooses"

invariants:
  - id: INV1
    check: "No ideas are criticized during DIVERGE"
    scope: all_phases
    on_fail: "Remove evaluative language and defer ranking to CONVERGE"
  - id: INV2
    check: "At least 3 options are presented"
    scope: all_phases
    on_fail: "Generate additional options before presenting results"
  - id: INV3
    check: "Input constraints are respected throughout the active mode"
    scope: all_phases
    on_fail: "Remove or flag options that violate stated constraints"
  - id: INV4
    check: "user_decision is never fabricated before the user chooses"
    scope: all_phases
    on_fail: "Remove the fabricated user_decision and present the appropriate next step or choice packet"
